name: EnthusiaStaff
version: '${version}'
main: net.enthusia.staff.paper.EnthusiaStaffPaperPlugin
api-version: '1.21'
author: P2wn
description: Enthusia Network staff and moderation runtime for Paper
load: POSTWORLD
softdepend:
  - RoseChat
  - voicechat
  - ViaVersion
  - floodgate
  - Geyser-Spigot
  - CombatLogX
  - PolarLoader
  - ProtocolLib
  - DiscordSRV
  - LuckPerms
  - EnthusiaCurrency
  - EnthusiaMarket
  - EnthusiaCommend
  - EnthusiaTeleport
  - PlayTimePlugin
  - InventoryRollbackPlus
  - EnthusiaServerAutoClicker
commands:
  estaff:
    description: EnthusiaStaff status, verification, and recovery commands
    usage: /estaff <status|verify|reload>
    permission: enthusiastaff.status
  punish:
    description: Open or execute the central punishment workflow
    usage: /punish <player> [reason-id] or /punish resume <player>
    permission: enthusiastaff.punish
  ban:
    description: Open a ban-filtered central punishment workflow
    usage: /ban <player> [reason-id]
    permission: enthusiastaff.punish
  mute:
    description: Open a mute-filtered central punishment workflow
    usage: /mute <player> [reason-id]
    permission: enthusiastaff.punish
  warn:
    description: Open a warning-filtered central punishment workflow
    usage: /warn <player> [reason-id]
    permission: enthusiastaff.punish
  kick:
    description: Open a kick-filtered central punishment workflow
    usage: /kick <player> [reason-id]
    permission: enthusiastaff.punish
  ipban:
    description: Open a network-ban-filtered central punishment workflow
    usage: /ipban <player> [reason-id]
    permission: enthusiastaff.punish.ip
  removepunishment:
    description: Change, revoke, or overturn a punishment while retaining audit history
    usage: /removepunishment <player|case> <action> [expiration] <reason> [CONFIRM]
    permission: enthusiastaff.remove
  unban:
    description: End the latest active ban through the central sanction-change workflow
    usage: /unban <player|case> <reason> [CONFIRM]
    permission: enthusiastaff.remove
  unmute:
    description: End the latest active mute through the central sanction-change workflow
    usage: /unmute <player|case> <reason> [CONFIRM]
    permission: enthusiastaff.remove
  removewarning:
    description: Revoke the latest warning while retaining history
    usage: /removewarning <player|case> <reason> [CONFIRM]
    permission: enthusiastaff.remove
  unwarn:
    description: Alias for removing the latest warning
    usage: /unwarn <player|case> <reason> [CONFIRM]
    permission: enthusiastaff.remove
  report:
    description: Submit a private player report with recent context
    usage: /report <player|uuid> <reason-id> <description>
  reports:
    description: Open staff report management
    usage: /reports
    permission: enthusiastaff.reports.manage
  freeze:
    description: Durably restrict a player for staff investigation
    usage: /freeze <player> <reason>
    permission: enthusiastaff.freeze
  unfreeze:
    description: Release a durable staff freeze
    usage: /unfreeze <player> <reason> CONFIRM
    permission: enthusiastaff.freeze
  staff:
    description: Enter or exit durable staff mode
    usage: /staff
    permission: enthusiastaff.staffmode
  vanish:
    description: Toggle durable rank-aware vanish or spectator tab presentation
    usage: /vanish | /vanish tab <show|hide>
    permission: enthusiastaff.vanish
  staffchat:
    description: Toggle the configured RoseChat staff channel
    usage: /staffchat
    permission: enthusiastaff.staffchat
  client:
    description: Inspect or save a point-in-time client evidence snapshot
    usage: /client <player|uuid> [save CONFIRM]
    permission: enthusiastaff.client
  invsee:
    description: Inspect and safely edit a live or offline player inventory
    usage: /invsee <player|uuid>
    permission: enthusiastaff.inventory.view
  endersee:
    description: Inspect and safely edit a live or offline Ender chest
    usage: /endersee <player|uuid>
    permission: enthusiastaff.inventory.view
  inspect:
    description: Inspect a player and run case-linked asset actions
    usage: /inspect <player>
    permission: enthusiastaff.inspect
  case:
    description: Manage case-linked recovery actions
    usage: /case restoreitems <case-id>
    permission: enthusiastaff.case.restoreitems
permissions:
  enthusiastaff.status:
    default: false
  enthusiastaff.verify:
    default: false
  enthusiastaff.reload:
    default: false
  enthusiastaff.diagnostics:
    default: false
  enthusiastaff.punishment.read:
    default: false
  enthusiastaff.case.read:
    default: false
  enthusiastaff.punish:
    default: false
  enthusiastaff.punish.configured:
    default: false
  enthusiastaff.punishment.requests.review:
    default: false
  enthusiastaff.punish.ip:
    default: false
  enthusiastaff.punish.custom-duration:
    default: false
  enthusiastaff.punish.custom-combination:
    default: false
  enthusiastaff.remove:
    default: false
  enthusiastaff.remove.lower:
    default: false
  enthusiastaff.remove.raise:
    default: false
  enthusiastaff.remove.custom-duration:
    default: false
  enthusiastaff.remove.end:
    default: false
  enthusiastaff.remove.revoke:
    default: false
  enthusiastaff.remove.request-overturn:
    default: false
  enthusiastaff.remove.full-overturn:
    default: false
  enthusiastaff.remove.approve-overturn:
    default: false
  enthusiastaff.reports.manage:
    default: false
  enthusiastaff.alerts:
    default: false
  enthusiastaff.freeze:
    default: false
  enthusiastaff.freeze.chat:
    default: false
  enthusiastaff.staffmode:
    default: false
  enthusiastaff.vanish:
    default: false
  enthusiastaff.staffchat:
    default: false
  enthusiastaff.client:
    default: false
  enthusiastaff.inventory.view:
    default: false
  enthusiastaff.inventory.edit:
    default: false
  enthusiastaff.inspect:
    default: false
  enthusiastaff.confiscate.economy:
    default: false
  enthusiastaff.confiscate.items:
    default: false
  enthusiastaff.case.restoreitems:
    default: false
  enthusiastaff.market.restrict:
    default: false
  enthusiastaff.reputation.restrict:
    default: false
  enthusiastaff.owner.recovery:
    default: false
  enthusiastaff.rank.helper:
    default: false
    children:
      enthusiastaff.status: true
      enthusiastaff.verify: true
      enthusiastaff.punishment.read: true
      enthusiastaff.case.read: true
      enthusiastaff.punish: true
      enthusiastaff.punish.configured: true
      enthusiastaff.reports.manage: true
      enthusiastaff.alerts: true
      enthusiastaff.freeze: true
      enthusiastaff.freeze.chat: true
      enthusiastaff.staffmode: true
      enthusiastaff.vanish: true
      enthusiastaff.staffchat: true
      enthusiastaff.inventory.view: true
      enthusiastaff.inspect: true
  enthusiastaff.rank.developer:
    default: false
    children:
      enthusiastaff.status: true
      enthusiastaff.verify: true
      enthusiastaff.reload: true
      enthusiastaff.diagnostics: true
      enthusiastaff.punishment.read: true
      enthusiastaff.case.read: true
      enthusiastaff.reports.manage: true
      enthusiastaff.alerts: true
      enthusiastaff.freeze: true
      enthusiastaff.freeze.chat: true
      enthusiastaff.staffmode: true
      enthusiastaff.vanish: true
      enthusiastaff.staffchat: true
      enthusiastaff.client: true
      enthusiastaff.inventory.view: true
      enthusiastaff.inventory.edit: true
      enthusiastaff.inspect: true
  enthusiastaff.rank.mod:
    default: false
    children:
      enthusiastaff.rank.helper: true
      enthusiastaff.punishment.requests.review: true
      enthusiastaff.punish.ip: true
      enthusiastaff.remove: true
      enthusiastaff.remove.lower: true
      enthusiastaff.remove.end: true
      enthusiastaff.remove.revoke: true
      enthusiastaff.remove.request-overturn: true
      enthusiastaff.inventory.edit: true
      enthusiastaff.confiscate.economy: true
      enthusiastaff.confiscate.items: true
  enthusiastaff.rank.admin:
    default: false
    children:
      enthusiastaff.rank.mod: true
      enthusiastaff.reload: true
      enthusiastaff.diagnostics: true
      enthusiastaff.punish.custom-duration: true
      enthusiastaff.remove.raise: true
      enthusiastaff.remove.custom-duration: true
      enthusiastaff.remove.full-overturn: true
      enthusiastaff.remove.approve-overturn: true
      enthusiastaff.market.restrict: true
      enthusiastaff.reputation.restrict: true
  enthusiastaff.rank.founder:
    default: false
