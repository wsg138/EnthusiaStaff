name: EnthusiaStaff
version: '${version}'
main: net.enthusia.staff.paper.EnthusiaStaffPaperPlugin
api-version: '1.21'
author: P2wn
description: Enthusia Network staff and moderation runtime for Paper
load: POSTWORLD
softdepend:
  - voicechat
  - ViaVersion
  - floodgate
  - Geyser-Spigot
  - CombatLogX
  - PolarLoader
  - ProtocolLib
  - DiscordSRV
  - InteractiveChat
  - InteractiveChatDiscordSrvAddon
  - LuckPerms
  - EnthusiaCurrency
  - EnthusiaMarket
  - EnthusiaCommend
  - EnthusiaTeleport
  - EnthusiaPlaytime
  - InventoryRollbackPlus
  - EnthusiaServerAutoClicker
commands:
  estaff:
    description: EnthusiaStaff status, non-destructive verification, reload, and exact sanction lifecycle commands
    usage: /estaff <status|verify [full]|reload|sanction>
  history:
    description: View database-paginated punishment and moderation history
    usage: /history <player|uuid> [page]
    permission: enthusiastaff.history.view
  punish:
    description: Open the punishment GUI or change one exact sanction by ID
    usage: /punish [player] or /punish remove|end|reduce|change <sanction-id> ...
  unpunish:
    description: Revoke one exact punishment by sanction ID while preserving audit history
    usage: /unpunish <sanction-id> <written reason>
    permission: enthusiastaff.remove
  ban:
    description: Open a ban-filtered central punishment workflow
    usage: /ban <player> [reason-id]
  mute:
    description: Open a mute-filtered central punishment workflow
    usage: /mute <player> [reason-id]
  warn:
    description: Open a warning-filtered central punishment workflow
    usage: /warn <player> [reason-id]
  kick:
    description: Open a kick-filtered central punishment workflow
    usage: /kick <player> [reason-id]
  staffapi:
    description: Console-only API for automated systems (anticheat) to issue punishments. Hardcoded console check; no permission node.
    usage: /staffapi punish <player> <ban|kick|mute|warn> [reason...] [--checks=<detail>]
  ipban:
    description: Open a network-ban-filtered central punishment workflow
    usage: /ipban <player> [reason-id]
  removepunishment:
    description: Change, revoke, or overturn a punishment while retaining audit history
    usage: /removepunishment <player|case> <action> [expiration] <reason> [CONFIRM]
    permission: enthusiastaff.remove
  unban:
    description: End the latest active ban through the central sanction-change workflow
    usage: /unban <player|case> <reason> [CONFIRM]
    permission: enthusiastaff.remove
  unmute:
    description: End the latest active mute through the central sanction-change workflow
    usage: /unmute <player|case> <reason> [CONFIRM]
    permission: enthusiastaff.remove
  removewarning:
    description: Revoke the latest warning while retaining history
    usage: /removewarning <player|case> <reason> [CONFIRM]
    permission: enthusiastaff.remove
  unwarn:
    description: Alias for removing the latest warning
    usage: /unwarn <player|case> <reason> [CONFIRM]
    permission: enthusiastaff.remove
  report:
    description: Submit a private player report with recent context
    usage: /report <player|uuid> <reason-id> <description>
  reports:
    description: Open staff report management
    usage: /reports
    permission: enthusiastaff.reports.manage
  aireview:
    description: Review central AI moderation decisions and corrections
    usage: /aireview [list|refresh|view|allow|block|review|label|approve|reject]
    permission: enthusiastaff.ai-review.queue
  freeze:
    description: Manage and inspect durable player freezes
    usage: /freeze <player> <reason> | /freeze keep <player> <reason> CONFIRM | /freeze status <player|uuid> | /freeze list
    permission: enthusiastaff.freeze
  unfreeze:
    description: Release a durable staff freeze
    usage: /unfreeze <player> <reason> CONFIRM
    permission: enthusiastaff.freeze
  staff:
    description: Enter or exit durable staff mode, recover snapshots, or choose entry visibility
    usage: /staff [recover|-v|vanish|-nv|visible|inventory|tab <show|hide>]
    aliases: [sm, staffmode]
    permission: enthusiastaff.staffmode
  staffinv:
    description: Toggle the persistent Staff Mode tools inventory on or off
    usage: /staffinv
    aliases: [staffinventory]
    permission: enthusiastaff.staffmode
  stafftools:
    description: Use the staff-mode operational tool menu and text fallbacks
    usage: /stafftools | /stafftools help | /stafftools random | /stafftools spectate <player>
    permission: enthusiastaff.stafftools.menu
  cheattester:
    description: Configure and run bounded evidence-only cheat tester probes and virtual fake bases
    usage: /cheattester <select|run|cancel|status|config|base>
    permission: enthusiastaff.cheattester
  fakebase:
    description: Manage bounded client-only fake-base probes
    usage: /fakebase <create|extend|clear|teleport|status> [player]
    permission: enthusiastaff.cheattester.fake-base
  vanish:
    description: Toggle durable rank-aware vanish or spectator tab presentation
    usage: /vanish | /vanish tab <show|hide>
    permission: enthusiastaff.vanish
  staffchat:
    description: Toggle the configured RoseChat staff channel
    usage: /staffchat
  staffwho:
    description: Show online staff operational state and pending punishment-request count
    usage: /staffwho
    permission: enthusiastaff.staffwho
  client:
    description: Inspect or save a point-in-time client evidence snapshot
    usage: /client <player|uuid> [save CONFIRM]
    permission: enthusiastaff.client
  invsee:
    description: Inspect and safely edit a live or offline player inventory
    usage: /invsee <player|uuid>
    permission: enthusiastaff.inventory.view
  endersee:
    description: Inspect and safely edit a live or offline Ender chest
    usage: /endersee <player|uuid>
    permission: enthusiastaff.inventory.view
  staffflags:
    description: List, create and resolve audited player investigation flags
    usage: /staffflags list <player> | add <player> <category> <hours|permanent> <case-id|none> <reason> | resolve <flag-uuid> <reason>
  inspect:
    description: Inspect a player and run case-linked asset actions
    usage: /inspect <player>
    permission: enthusiastaff.inspect
  case:
    description: View case detail or perform case-linked recovery actions
    usage: /case [view] <case-id> | /case restoreitems <case-id> | /case recoveritems <case-id>
  link:
    description: Link this online Minecraft account to Discord with a one-use code
    usage: /link [code]
    aliases: [discordlink]
  unlink:
    description: Remove this Minecraft account's current Discord link after confirmation
    usage: /unlink CONFIRM
