config-version: 1

# BOOTSTRAP promotes to SHADOW_MIGRATION after MariaDB and schema verification.
# ACTIVE is refused until a successful cutover record exists.
operational-mode: BOOTSTRAP

# The storage, workers, network, inventory, and channel sections are captured at
# startup. Changing them requires a full server restart; /estaff reload rejects
# the entire candidate when any of these values differ from the active snapshot.
storage:
  # Environment variables remain supported. When none of the three configured
  # variables has a value, credentials-file is used instead. Never put secrets
  # directly in this YAML file.
  jdbc-url-environment: ES_DATABASE_URL
  username-environment: ES_DATABASE_USER
  password-environment: ES_DATABASE_PASSWORD
  credentials-file: plugins/EnthusiaStaff/database.properties
  maximum-pool-size: 8
  connection-timeout-millis: 5000

workers:
  threads: 4
  queue-capacity: 256

# Staff-mode direct movement and tester tools read these values when the Paper runtime is
# created. Changes are intentionally restart-only and are not applied by /estaff reload.
staff-tools:
  random-teleport:
    disabled-servers: []
    disabled-worlds: []
  cheat-tester:
    # Tester probes are deliberately short and evidence-only. Values outside code safety bounds fail startup.
    timeout-millis: 4000
    probe-ticks: 60
    maximum-active-global: 8
    maximum-active-per-staff: 2
    fake-entity-distance: 3.0
    velocity:
      horizontal: 0.75
      vertical: 0.30
    no-fall:
      vertical: 0.70
  cooldowns:
    random-teleport-millis: 2000
    target-tool-millis: 750
    toggle-tool-millis: 500
    menu-millis: 500

# Reloadable history presentation and event inclusion settings.
history:
  # Accepted range: 1-100. Pagination is performed by MariaDB.
  page-size: 8
  include-request-events: true
  include-appeal-events: true
  # Any valid IANA timezone is accepted, such as UTC or America/Chicago.
  timezone: UTC

# Reloadable validation settings for sanction lifecycle changes.
sanction-actions:
  minimum-reason-length: 3
  maximum-reason-length: 500
  # When false, a permanent sanction cannot be reduced to a finite expiration.
  allow-permanent-reduction: true

# This section is reloadable. Unknown keys inside this section are rejected.
# The subsystem remains disabled unless explicitly enabled.
punishment-request-alerts:
  enabled: false

  polling:
    # Values below 250 ms are rejected to prevent database hammering.
    interval-millis: 10000
    recipient-limit: 100
    direct-batch: 4
    reviewer-batch: 4
    operational-batch: 2
    total-claim-limit: 100
    presentation-limit: 100

  delivery:
    lease-seconds: 45
    maximum-attempts: 6
    retry-base-seconds: 5
    retry-maximum-seconds: 300
    join-delay-ticks: 40

  maintenance:
    request-expiration:
      interval-seconds: 60
      batch: 100

    intent-expiration:
      interval-seconds: 60
      batch: 100

    lease-reclaim:
      interval-seconds: 30
      batch: 100

    retention:
      interval-minutes: 60
      batch: 100
      days: 30

network:
  # Use a stable identifier such as HUB or SMP on each backend.
  server-id: SMP

inventory:
  # HUB and SMP intentionally use separate inventory profiles.
  scope-id: SMP

economy:
  # Outside the current /estaff reload scope; restart to apply changes.
  # Each source must appear exactly once. Nested shulkers and bundles are handled by Currency.
  removal-order: [BANK, INVENTORY, ENDER_CHEST]

rosechat:
  # Outside the current /estaff reload scope; restart to apply changes.
  staff-channel: staff
  global-channel: global
  private-channels: []

channel:
  enabled: false
  host: 127.0.0.1
  port: 28765
  proxy-id: VELOCITY
  backend-secret-environment: ES_CHANNEL_SMP_SECRET
  proxy-secret-environment: ES_CHANNEL_VELOCITY_SECRET
  tls:
    # Relative paths resolve inside the EnthusiaStaff plugin data directory.
    trust-store: channel-trust.p12
    trust-store-password-environment: ES_CHANNEL_TLS_TRUSTSTORE_PASSWORD

automod:
  # Outside the current /estaff reload scope; restart to apply changes.
  # Exact variants are intentionally empty. Populate them privately and enable only after review.
  enabled: false
  exact-variants: []

visibility:
  # Outside the current /estaff reload scope; restart to apply changes.
  matrix:
    MOD: [MOD, DEVELOPER]
    DEVELOPER: [MOD, DEVELOPER]
    ADMIN: [MOD, DEVELOPER, ADMIN]
    FOUNDER: [MOD, DEVELOPER, ADMIN, FOUNDER]
