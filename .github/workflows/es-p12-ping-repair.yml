name: ES-P12 ping API repair

on:
  push:
    branches:
      - "package/es-p12-staff-operational-hardening"

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == '[ES-P12] Stage ping API repair'
    name: Validate and publish ping API repair
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Apply repair
        run: python3 scripts/es_p12_ping_repair.py

      - name: Compile and test Paper
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :paper:test --no-daemon --no-build-cache --no-configuration-cache --console=plain

      - name: Publish validated repair
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/es_p12_ping_repair.py .github/workflows/es-p12-ping-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            paper/src/main/java/net/enthusia/staff/paper/visibility/VanishManager.java \
            paper/src/main/java/net/enthusia/staff/paper/visibility/VanishBroadcastListener.java \
            paper/src/test/java/net/enthusia/staff/paper/visibility/VanishBroadcastListenerTest.java \
            scripts/es_p12_ping_repair.py \
            .github/workflows/es-p12-ping-repair.yml
          git commit -m "ES-P12: avoid deprecated ping player iteration"
          git push origin HEAD:package/es-p12-staff-operational-hardening
