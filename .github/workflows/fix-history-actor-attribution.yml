name: Fix history actor attribution

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/punishment-history-lifecycle
          fetch-depth: 0
      - name: Correct mutation actor presentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          history = Path('persistence/src/main/java/net/enthusia/staff/persistence/JdbcModerationHistoryStore.java')
          text = history.read_text(encoding='utf-8')
          old = '"event.actor_id, COALESCE(actor.current_username, c.actor_name) AS actor_name,"'
          new = '"event.actor_id, actor.current_username AS actor_name,"'
          if text.count(old) != 1:
              raise SystemExit('expected one sanction event actor fallback')
          history.write_text(text.replace(old, new), encoding='utf-8')

          case_command = Path('paper/src/main/java/net/enthusia/staff/paper/command/CaseCommand.java')
          text = case_command.read_text(encoding='utf-8')
          old = 'entry.actorName().ifPresent(value -> line.append(" | actor: ").append(value));'
          new = '''entry.actorName().ifPresentOrElse(
                        value -> line.append(" | actor: ").append(value),
                        () -> entry.actorId().ifPresent(value -> line.append(" | actor: ").append(value))
                );'''
          if text.count(old) != 1:
              raise SystemExit('expected one case timeline actor renderer')
          case_command.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add persistence/src/main/java/net/enthusia/staff/persistence/JdbcModerationHistoryStore.java paper/src/main/java/net/enthusia/staff/paper/command/CaseCommand.java
          git commit -m "Correct sanction history actor attribution"
          git push origin HEAD:feature/punishment-history-lifecycle
