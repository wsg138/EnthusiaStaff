name: Apply punishment review wiring fix

on:
  push:
    branches:
      - section/punishment-request-interfaces

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: section/punishment-request-interfaces
          fetch-depth: 0

      - name: Apply scoped bootstrap edit and remove this workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          plugin = Path('paper/src/main/java/net/enthusia/staff/paper/EnthusiaStaffPaperPlugin.java')
          text = plugin.read_text(encoding='utf-8')
          marker = 'PunishmentRequestGuiController punishmentRequestGui'
          start = text.index(marker)
          end = text.index('        punishmentRequestGui.register();', start)
          block = text[start:end]
          old = '                punishmentRequestService,\n                authorizationPolicy,'
          new = '                punishmentRequestService,\n                playerDirectory,\n                authorizationPolicy,'
          if new not in block:
              if old not in block:
                  raise SystemExit('Expected punishment request GUI constructor arguments were not found')
              block = block.replace(old, new, 1)
              text = text[:start] + block + text[end:]
              plugin.write_text(text, encoding='utf-8')

          Path('.github/workflows/apply-punishment-review-fix.yml').unlink()
          PY

      - name: Commit exact bootstrap edit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/src/main/java/net/enthusia/staff/paper/EnthusiaStaffPaperPlugin.java .github/workflows/apply-punishment-review-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "Wire punishment request player directory explicitly"
          git push origin HEAD:section/punishment-request-interfaces
