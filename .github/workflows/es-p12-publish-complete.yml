name: ES-P12 terminal publication

on:
  push:
    branches:
      - "state/es-p12-complete"

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == '[ES-P12] Stage completion publication'
    name: Validate and publish terminal package state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply terminal state
        run: python3 scripts/es_p12_publish_complete.py

      - name: Validate docs-only changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            "ai-agents/reports/package-handoffs/2026-09-24-es-p12-staff-operational-hardening.md"
            "ai-agents/work-packages/PACKAGE-REGISTRY.md"
            "ai-agents/work-packages/packages/ES-P12.md"
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected changed paths:\n%s\n' "${changed[*]}"
            exit 1
          fi
          grep -Fq 'Canonical status: `COMPLETE`' ai-agents/reports/package-handoffs/2026-09-24-es-p12-staff-operational-hardening.md
          grep -Fq '`ES-P12 — Staff operational hardening` is `COMPLETE`.' ai-agents/work-packages/PACKAGE-REGISTRY.md
          grep -Fq '`COMPLETE` — PR #246 merged normally' ai-agents/work-packages/packages/ES-P12.md
          grep -Fq '753ef35496c15abe361cad51704b610af540b0f0' ai-agents/work-packages/packages/ES-P12.md

      - name: Publish terminal state
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/es_p12_publish_complete.py .github/workflows/es-p12-publish-complete.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ai-agents/work-packages/packages/ES-P12.md \
            ai-agents/work-packages/PACKAGE-REGISTRY.md \
            ai-agents/reports/package-handoffs/2026-09-24-es-p12-staff-operational-hardening.md \
            scripts/es_p12_publish_complete.py \
            .github/workflows/es-p12-publish-complete.yml
          git diff --cached --check
          git commit -m "ES-P12: publish terminal completion state"
          git push origin HEAD:state/es-p12-complete
