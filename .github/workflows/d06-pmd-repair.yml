name: D06 PMD repair

on:
  push:
    branches:
      - "package/es-d06-read-only-moderation-ux"

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == '[ES-D06] Stage PMD repair runner'
    name: Apply and validate D06 PMD repairs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Apply exact finding repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          endpoint_path = "paper/src/main/java/net/enthusia/staff/paper/auth/DiscordStaffAuthorityEndpoint.java"
          endpoint = read(endpoint_path)
          endpoint = endpoint.replace(
              '    private static final String PATH = "/v1/staff-rank";\n',
              '    private static final String PATH = "/v1/staff-rank";\n'
              '    private static final String GET_METHOD = "GET";\n',
              1,
          )
          endpoint = endpoint.replace(
              '        ThreadPoolExecutor createdExecutor = new ThreadPoolExecutor(\n',
              '        ThreadPoolExecutor createdExecutor = new ThreadPoolExecutor( // NOPMD - ownership transfers to this AutoCloseable; close() and startup rollback shut it down.\n',
              1,
          )
          endpoint = endpoint.replace(
              '            if (!"GET".equals(exchange.getRequestMethod())) {\n',
              '            if (!GET_METHOD.equals(exchange.getRequestMethod())) {\n',
              1,
          )
          write(endpoint_path, endpoint)

          player_path = "domain/src/main/java/net/enthusia/staff/domain/player/PlayerResolution.java"
          player = read(player_path)
          old = '''        public Ambiguous {\n            if (matches == null || matches.size() < MIN_AMBIGUOUS_MATCHES) {\n                throw new IllegalArgumentException("ambiguous resolution requires at least two matches");\n            }\n            truncated = truncated || matches.size() > MAX_AMBIGUOUS_MATCHES;\n            matches = List.copyOf(matches.subList(0, Math.min(matches.size(), MAX_AMBIGUOUS_MATCHES)));\n        }\n'''
          new = '''        public Ambiguous(List<PlayerIdentity> matches, boolean truncated) {\n            if (matches == null || matches.size() < MIN_AMBIGUOUS_MATCHES) {\n                throw new IllegalArgumentException("ambiguous resolution requires at least two matches");\n            }\n            this.truncated = truncated || matches.size() > MAX_AMBIGUOUS_MATCHES;\n            this.matches = List.copyOf(matches.subList(0, Math.min(matches.size(), MAX_AMBIGUOUS_MATCHES)));\n        }\n'''
          if old not in player:
              raise SystemExit("PlayerResolution canonical constructor shape changed")
          player = player.replace(old, new, 1)
          write(player_path, player)

          controller_path = "staff-bot/src/main/java/net/enthusia/staff/discordbot/StaffModerationController.java"
          controller = read(controller_path)
          controller = controller.replace(
              '    private static final String GENERIC_UNAVAILABLE = "The read-only moderation view is temporarily unavailable.";\n',
              '    private static final String GENERIC_UNAVAILABLE = "The read-only moderation view is temporarily unavailable.";\n'
              '    private static final String ITEM_SEPARATOR = " — ";\n',
              1,
          )
          panel_calls = controller.count('StringBuilder content = panel(')
          if panel_calls != 7:
              raise SystemExit(f"Expected 7 panel calls, found {panel_calls}")
          controller = controller.replace(
              'StringBuilder content = panel(',
              'StringBuilder content = new StringBuilder(MAX_CONTENT).append(',
          )
          profile_old = '''        content.append("Active Discord sanctions: not available before Discord enforcement (D07)\\n")\n                .append("Active Minecraft sanctions: ").append(snapshot.activeMinecraftSanctions().size()).append('\\n')\n                .append("Recent history entries: ").append(snapshot.recentHistory().size()).append('\\n')\n                .append("Recent cases: ").append(snapshot.recentCases().size()).append('\\n')\n                .append("Recent notes: ").append(snapshot.recentNotes().size());\n'''
          profile_new = '''        content.append("Active Discord sanctions: not available before Discord enforcement (D07)\\nActive Minecraft sanctions: ")\n                .append(snapshot.activeMinecraftSanctions().size())\n                .append("\\nRecent history entries: ").append(snapshot.recentHistory().size())\n                .append("\\nRecent cases: ").append(snapshot.recentCases().size())\n                .append("\\nRecent notes: ").append(snapshot.recentNotes().size());\n'''
          if profile_old not in controller:
              raise SystemExit("profile append block shape changed")
          controller = controller.replace(profile_old, profile_new, 1)
          history_old = '''        content.append("Discord: no Discord punishment history exists before D07; D06 does not invent entries.\\n")\n                .append("Cases: ").append(snapshot.recentCases().size())\n                .append(" | Notes: ").append(snapshot.recentNotes().size());\n'''
          history_new = '''        content.append("Discord: no Discord punishment history exists before D07; D06 does not invent entries.\\nCases: ")\n                .append(snapshot.recentCases().size())\n                .append(" | Notes: ").append(snapshot.recentNotes().size());\n'''
          if history_old not in controller:
              raise SystemExit("history append block shape changed")
          controller = controller.replace(history_old, history_new, 1)
          separator_count = controller.count('.append(" — ")')
          if separator_count < 4:
              raise SystemExit(f"Expected at least 4 separator appends, found {separator_count}")
          controller = controller.replace('.append(" — ")', '.append(ITEM_SEPARATOR)')
          panel_method = '''    private static StringBuilder panel(String title) {\n        return new StringBuilder(MAX_CONTENT).append(title);\n    }\n\n'''
          if panel_method not in controller:
              raise SystemExit("panel helper shape changed")
          controller = controller.replace(panel_method, '', 1)
          write(controller_path, controller)

          test_paths = [
              "staff-bot/src/test/java/net/enthusia/staff/discordbot/StaffModerationAmbiguityLimitTest.java",
              "staff-bot/src/test/java/net/enthusia/staff/discordbot/StaffModerationControllerTest.java",
              "staff-bot/src/test/java/net/enthusia/staff/discordbot/StaffModerationReadServiceTest.java",
          ]
          expected_allocations = {test_paths[0]: 1, test_paths[1]: 3, test_paths[2]: 3}
          for path in test_paths:
              text = read(path)
              if 'import java.util.HashMap;\n' not in text:
                  raise SystemExit(f"HashMap import shape changed in {path}")
              allocations = text.count('new HashMap<>()')
              if allocations != expected_allocations[path]:
                  raise SystemExit(f"Expected {expected_allocations[path]} HashMap fields in {path}, found {allocations}")
              text = text.replace('import java.util.HashMap;\n', 'import java.util.concurrent.ConcurrentHashMap;\n', 1)
              text = text.replace('new HashMap<>()', 'new ConcurrentHashMap<>()')
              write(path, text)
          PY

      - name: Verify PMD findings are resolved
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://github.com/pmd/pmd/releases/download/pmd_releases%2F6.55.0/pmd-bin-6.55.0.zip' \
            --output /tmp/pmd.zip
          unzip -q /tmp/pmd.zip -d /tmp
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.java')
          input="$(IFS=,; echo "${files[*]}")"
          /tmp/pmd-bin-6.55.0/bin/run.sh pmd \
            -d "${input}" \
            -R ruleset.xml \
            -f text \
            -r /tmp/pmd-findings.txt
          cat /tmp/pmd-findings.txt

      - name: Run focused tests
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :domain:test :staff-bot:test :paper:test \
            --no-daemon \
            --no-build-cache \
            --no-configuration-cache \
            --console=plain

      - name: Commit repairs and remove temporary diagnostics
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/d06-pmd-diagnostics.yml .github/workflows/d06-pmd-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add domain/src/main/java/net/enthusia/staff/domain/player/PlayerResolution.java \
            paper/src/main/java/net/enthusia/staff/paper/auth/DiscordStaffAuthorityEndpoint.java \
            staff-bot/src/main/java/net/enthusia/staff/discordbot/StaffModerationController.java \
            staff-bot/src/test/java/net/enthusia/staff/discordbot/StaffModerationAmbiguityLimitTest.java \
            staff-bot/src/test/java/net/enthusia/staff/discordbot/StaffModerationControllerTest.java \
            staff-bot/src/test/java/net/enthusia/staff/discordbot/StaffModerationReadServiceTest.java \
            .github/workflows/d06-pmd-diagnostics.yml \
            .github/workflows/d06-pmd-repair.yml
          git commit -m "[ES-D06] Resolve hosted PMD findings"
          git push origin HEAD:package/es-d06-read-only-moderation-ux
