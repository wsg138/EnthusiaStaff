name: Apply Codacy Fixes

on:
  workflow_dispatch:
  push:
    branches:
      - agent/expand-test-coverage

permissions:
  contents: write

concurrency:
  group: apply-codacy-fixes
  cancel-in-progress: false

jobs:
  fix:
    name: Apply and validate exact Codacy fixes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/expand-test-coverage
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Apply deterministic fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, content: str) -> None:
              Path(path).write_text(content, encoding="utf-8")

          def replace_exact(content: str, old: str, new: str, expected: int | None = None) -> str:
              count = content.count(old)
              if expected is not None and count != expected:
                  raise SystemExit(f"Expected {expected} occurrences of {old!r}, found {count}")
              if count == 0:
                  raise SystemExit(f"Required text not found: {old!r}")
              return content.replace(old, new)

          def insert_after(content: str, marker: str, addition: str) -> str:
              if addition.strip() in content:
                  raise SystemExit(f"Addition already present after {marker!r}")
              if content.count(marker) != 1:
                  raise SystemExit(f"Expected one marker {marker!r}, found {content.count(marker)}")
              return content.replace(marker, marker + addition, 1)

          # Common validation literals.
          path = "common/src/test/java/net/enthusia/staff/common/ChecksTest.java"
          text = read(path)
          text = insert_after(text, "class ChecksTest {\n", "    private static final String FIELD = \"field\";\n\n")
          text = replace_exact(text, '"field"', "FIELD", 7)
          write(path, text)

          # Paper lifecycle handle names.
          path = "paper/src/test/java/net/enthusia/staff/paper/PaperRuntimeLifecycleTest.java"
          text = read(path)
          text = insert_after(
              text,
              '    private static final String STORAGE = "storage";\n',
              '    private static final String TASK = "task";\n'
              '    private static final String CHANNEL = "channel";\n'
          )
          text = replace_exact(text, '"task"', "TASK", 5)
          text = replace_exact(text, '"channel"', "CHANNEL", 5)
          write(path, text)

          # Paper health issue key.
          path = "paper/src/test/java/net/enthusia/staff/paper/RuntimeHealthTest.java"
          text = read(path)
          text = insert_after(text, "class RuntimeHealthTest {\n", '    private static final String DATABASE = "database";\n\n')
          text = replace_exact(text, '"database"', "DATABASE", 5)
          write(path, text)

          # Keep metadata checks visible to static JUnit analysis by asserting once
          # at method scope instead of only inside callbacks.
          path = "paper/src/test/java/net/enthusia/staff/paper/config/PluginMetadataIntegrityTest.java"
          text = read(path)
          old = '''    @Test
              void everyCommandPermissionReferencesADeclaredPermission() throws IOException {
                  JsonNode metadata = pluginMetadata();
                  JsonNode permissions = metadata.path("permissions");

                  metadata.path("commands").properties().forEach(entry -> {
                      JsonNode permission = entry.getValue().path("permission");
                      if (!permission.isMissingNode()) {
                          assertTrue(permissions.has(permission.asText()), entry.getKey() + " -> " + permission.asText());
                      }
                  });
              }
          '''.replace("              ", "")
          new = '''    @Test
              void everyCommandPermissionReferencesADeclaredPermission() throws IOException {
                  JsonNode metadata = pluginMetadata();
                  JsonNode permissions = metadata.path("permissions");
                  Set<String> missingPermissions = new HashSet<>();

                  metadata.path("commands").properties().forEach(entry -> {
                      JsonNode permission = entry.getValue().path("permission");
                      if (!permission.isMissingNode() && !permissions.has(permission.asText())) {
                          missingPermissions.add(entry.getKey() + " -> " + permission.asText());
                      }
                  });

                  assertTrue(missingPermissions.isEmpty(), "Undeclared command permissions: " + missingPermissions);
              }
          '''.replace("              ", "")
          text = replace_exact(text, old, new, 1)

          old = '''    @Test
              void everyPermissionChildReferencesAnotherDeclaredPermission() throws IOException {
                  JsonNode permissions = pluginMetadata().path("permissions");

                  permissions.properties().forEach(parent -> parent.getValue()
                          .path("children")
                          .properties()
                          .forEach(child -> assertTrue(
                                  permissions.has(child.getKey()),
                                  parent.getKey() + " -> " + child.getKey()
                          )));
              }
          '''.replace("              ", "")
          new = '''    @Test
              void everyPermissionChildReferencesAnotherDeclaredPermission() throws IOException {
                  JsonNode permissions = pluginMetadata().path("permissions");
                  Set<String> missingChildren = new HashSet<>();

                  permissions.properties().forEach(parent -> parent.getValue()
                          .path("children")
                          .properties()
                          .filter(child -> !permissions.has(child.getKey()))
                          .forEach(child -> missingChildren.add(
                                  parent.getKey() + " -> " + child.getKey()
                          )));

                  assertTrue(missingChildren.isEmpty(), "Undeclared child permissions: " + missingChildren);
              }
          '''.replace("              ", "")
          text = replace_exact(text, old, new, 1)
          write(path, text)

          # Database configuration credentials.
          path = "persistence/src/test/java/net/enthusia/staff/persistence/DatabaseConfigTest.java"
          text = read(path)
          text = insert_after(
              text,
              '    private static final String URL = "jdbc:mariadb://127.0.0.1:3306/enthusiastaff";\n',
              '    private static final String USERNAME = "staff";\n'
              '    private static final String PASSWORD = "secret";\n'
          )
          text = replace_exact(text, '"staff"', "USERNAME", 15)
          text = replace_exact(text, '"secret"', "PASSWORD", 14)
          write(path, text)

          # JDBC transaction messages and expected values.
          path = "persistence/src/test/java/net/enthusia/staff/persistence/JdbcTransactionSupportTest.java"
          text = read(path)
          text = insert_after(
              text,
              "final class JdbcTransactionSupportTest {\n",
              '    private static final String TRANSACTION_FAILED = "Transaction failed";\n'
              '    private static final String COMMITTED = "committed";\n'
              '    private static final String WRONG_COUNT = "wrong count";\n'
              '    private static final String WRONG_BATCH = "wrong batch";\n\n'
          )
          text = replace_exact(text, '"Transaction failed"', "TRANSACTION_FAILED", 5)
          text = replace_exact(text, '"committed"', "COMMITTED", 4)
          text = replace_exact(text, '"wrong count"', "WRONG_COUNT", 8)
          text = replace_exact(text, '"wrong batch"', "WRONG_BATCH", 5)
          write(path, text)

          # Split constructor validation into small fail-closed helpers.
          path = "protocol/src/main/java/net/enthusia/staff/protocol/EnvelopeAuthenticator.java"
          text = read(path)
          old = '''        if (protocolVersion < 1 || clock == null || permittedAge == null || permittedClockSkew == null
                          || permittedAge.isZero() || permittedAge.isNegative() || permittedClockSkew.isNegative()
                          || serverKeys == null || serverKeys.isEmpty() || replayGuard == null) {
                      throw new IllegalArgumentException("authenticator configuration must be present and time bounds must be safe");
                  }
          '''.replace("          ", "")
          new = '''        validateConfiguration(
                          protocolVersion,
                          clock,
                          permittedAge,
                          permittedClockSkew,
                          serverKeys,
                          replayGuard
                  );
          '''.replace("          ", "")
          text = replace_exact(text, old, new, 1)
          marker = '''    public ProtocolEnvelope sign(UnsignedEnvelope envelope) {
          '''.replace("          ", "")
          helpers = '''    private static void validateConfiguration(
                          int protocolVersion,
                          Clock clock,
                          Duration permittedAge,
                          Duration permittedClockSkew,
                          Map<String, SecretKey> serverKeys,
                          ReplayGuard replayGuard
                  ) {
                      if (protocolVersion < 1) {
                          throw invalidConfiguration();
                      }
                      requirePresent(clock, permittedAge, permittedClockSkew, serverKeys, replayGuard);
                      if (serverKeys.isEmpty()) {
                          throw invalidConfiguration();
                      }
                      validateTimeBounds(permittedAge, permittedClockSkew);
                  }

                  private static void requirePresent(Object... values) {
                      for (Object value : values) {
                          if (value == null) {
                              throw invalidConfiguration();
                          }
                      }
                  }

                  private static void validateTimeBounds(Duration permittedAge, Duration permittedClockSkew) {
                      if (permittedAge.isZero() || permittedAge.isNegative()) {
                          throw invalidConfiguration();
                      }
                      if (permittedClockSkew.isNegative()) {
                          throw invalidConfiguration();
                      }
                  }

                  private static IllegalArgumentException invalidConfiguration() {
                      return new IllegalArgumentException(
                              "authenticator configuration must be present and time bounds must be safe"
                      );
                  }

          '''.replace("          ", "")
          if text.count(marker) != 1:
              raise SystemExit("EnvelopeAuthenticator sign marker was not unique")
          text = text.replace(marker, helpers + marker, 1)
          write(path, text)

          # Protocol test identifiers.
          path = "protocol/src/test/java/net/enthusia/staff/protocol/EnvelopeAuthenticatorTest.java"
          text = read(path)
          text = insert_after(
              text,
              '    private static final Duration MAX_SKEW = Duration.ofSeconds(30);\n',
              '    private static final String HUB = "hub";\n'
          )
          text = replace_exact(text, '"hub"', "HUB", 6)
          write(path, text)

          path = "protocol/src/test/java/net/enthusia/staff/protocol/ProtocolEnvelopeTest.java"
          text = read(path)
          text = insert_after(
              text,
              '    private static final UUID MESSAGE_ID = UUID.fromString("53fa6153-2ad8-42ba-a4e9-8fb10d630f08");\n',
              '    private static final String HUB = "hub";\n'
              '    private static final String TYPE = "TYPE";\n'
              '    private static final String NONCE = "nonce";\n'
          )
          text = replace_exact(text, '"hub"', "HUB", 10)
          text = replace_exact(text, '"TYPE"', "TYPE", 11)
          text = replace_exact(text, '"nonce"', "NONCE", 10)
          write(path, text)

          path = "protocol/src/test/java/net/enthusia/staff/protocol/ReplayGuardTest.java"
          text = read(path)
          text = insert_after(
              text,
              '    private static final Instant NOW = Instant.parse("2026-07-28T00:00:00Z");\n',
              '    private static final String BACKEND = "backend";\n'
              '    private static final String BACKEND_ONE = "backend-1";\n'
          )
          text = replace_exact(text, '"backend-1"', "BACKEND_ONE", 7)
          text = replace_exact(text, '"backend"', "BACKEND", 6)
          write(path, text)

          # Velocity configuration literals.
          path = "velocity/src/test/java/net/enthusia/staff/velocity/VelocityConfigurationTest.java"
          text = read(path)
          text = insert_after(
              text,
              "final class VelocityConfigurationTest {\n",
              '    private static final String SECRET = "SECRET";\n'
              '    private static final String TLS_KEY_STORE = "channel.tls-key-store";\n\n'
          )
          text = replace_exact(text, '"SECRET"', "SECRET", 8)
          text = replace_exact(text, '"channel.tls-key-store"', "TLS_KEY_STORE", 5)
          write(path, text)

          path = "velocity/src/test/java/net/enthusia/staff/velocity/VelocityRuntimeHealthTest.java"
          text = read(path)
          text = insert_after(
              text,
              "class VelocityRuntimeHealthTest {\n",
              '    private static final String CHANNEL = "channel";\n\n'
          )
          text = replace_exact(text, '"channel"', "CHANNEL", 5)
          write(path, text)
          PY

      - name: Build and test the corrected branch
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean build jacocoAggregateReport runtimeJars \
            --no-daemon \
            --no-build-cache \
            --no-configuration-cache \
            --console=plain

      - name: Commit validated corrections
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "::error::The guarded fixer produced no changes."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            common/src/test/java/net/enthusia/staff/common/ChecksTest.java \
            paper/src/test/java/net/enthusia/staff/paper/PaperRuntimeLifecycleTest.java \
            paper/src/test/java/net/enthusia/staff/paper/RuntimeHealthTest.java \
            paper/src/test/java/net/enthusia/staff/paper/config/PluginMetadataIntegrityTest.java \
            persistence/src/test/java/net/enthusia/staff/persistence/DatabaseConfigTest.java \
            persistence/src/test/java/net/enthusia/staff/persistence/JdbcTransactionSupportTest.java \
            protocol/src/main/java/net/enthusia/staff/protocol/EnvelopeAuthenticator.java \
            protocol/src/test/java/net/enthusia/staff/protocol/EnvelopeAuthenticatorTest.java \
            protocol/src/test/java/net/enthusia/staff/protocol/ProtocolEnvelopeTest.java \
            protocol/src/test/java/net/enthusia/staff/protocol/ReplayGuardTest.java \
            velocity/src/test/java/net/enthusia/staff/velocity/VelocityConfigurationTest.java \
            velocity/src/test/java/net/enthusia/staff/velocity/VelocityRuntimeHealthTest.java
          git commit -m "Resolve Codacy findings in expanded test coverage"
          git push origin HEAD:agent/expand-test-coverage
