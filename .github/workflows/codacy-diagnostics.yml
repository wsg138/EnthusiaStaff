name: Codacy Diagnostics

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - agent/expand-test-coverage

permissions:
  contents: read

jobs:
  export:
    name: Export exact Codacy issue delta
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require Codacy repository token
        run: |
          if [[ -z "${CODACY_PROJECT_TOKEN}" ]]; then
            echo "::error::CODACY_PROJECT_TOKEN is not configured."
            exit 1
          fi

      - name: Export branch and main issues
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/codacy
          git diff --name-only origin/main...HEAD -- '*.java' > build/reports/codacy/changed-java-files.txt

          python3 - <<'PY'
          import collections
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          root = Path("build/reports/codacy")
          paths = [
              line.strip()
              for line in (root / "changed-java-files.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          if not paths:
              raise SystemExit("No changed Java files were found")

          token = os.environ["CODACY_PROJECT_TOKEN"]
          branch = "agent/expand-test-coverage"

          def fetch(path: str, branch_name: str):
              encoded = urllib.parse.quote(path, safe="")
              query = urllib.parse.urlencode({"branch": branch_name})
              url = f"https://api.codacy.com/2.0/project/file/issues/{encoded}?{query}"
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "project-token": token,
                  },
              )
              for attempt in range(1, 7):
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          return json.loads(response.read().decode("utf-8"))
                  except urllib.error.HTTPError as error:
                      if error.code == 404:
                          return []
                      if error.code not in {429, 500, 502, 503, 504} or attempt == 6:
                          body = error.read().decode("utf-8", errors="replace")
                          raise RuntimeError(
                              f"Codacy request failed for {path} on {branch_name}: "
                              f"HTTP {error.code}: {body[:300]}"
                          ) from error
                  except urllib.error.URLError as error:
                      if attempt == 6:
                          raise RuntimeError(
                              f"Codacy request failed for {path} on {branch_name}: {error}"
                          ) from error
                  time.sleep(attempt * 2)
              raise AssertionError("unreachable")

          branch_results = {}
          main_results = {}
          delta = []

          for path in paths:
              current = fetch(path, branch)
              baseline = fetch(path, "main")
              branch_results[path] = current
              main_results[path] = baseline

              remaining = collections.Counter(
                  (item.get("patternId"), item.get("message"), item.get("level"))
                  for item in baseline
              )
              for item in sorted(current, key=lambda value: value.get("startLine", 0)):
                  signature = (
                      item.get("patternId"),
                      item.get("message"),
                      item.get("level"),
                  )
                  if remaining[signature] > 0:
                      remaining[signature] -= 1
                  else:
                      delta.append({"filePath": path, **item})

          (root / "branch-issues.json").write_text(
              json.dumps(branch_results, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (root / "main-issues.json").write_text(
              json.dumps(main_results, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (root / "new-issues.json").write_text(
              json.dumps(delta, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          by_level = collections.Counter(item.get("level", "unknown") for item in delta)
          lines = [
              "# Exact Codacy issue delta",
              "",
              f"- Changed Java files queried: **{len(paths)}**",
              f"- New branch issues: **{len(delta)}**",
              f"- Levels: `{', '.join(f'{key}: {value}' for key, value in sorted(by_level.items())) or 'none'}`",
              "",
              "## Findings",
              "",
          ]
          if delta:
              for item in delta:
                  lines.append(
                      f"- `{item['filePath']}:{item.get('startLine', '?')}` "
                      f"pattern `{item.get('patternId', '?')}` ({item.get('level', 'unknown')}) — "
                      f"{item.get('message', '').strip()}"
                  )
          else:
              lines.append("- None")

          text = "\n".join(lines) + "\n"
          (root / "summary.md").write_text(text, encoding="utf-8")
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(text)
          PY

      - name: Upload Codacy diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: codacy-exact-diagnostics-${{ github.event.pull_request.number || github.run_id }}
          path: build/reports/codacy
          if-no-files-found: error
          retention-days: 3
