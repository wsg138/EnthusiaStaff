name: Codacy Diagnostics

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - agent/expand-test-coverage

permissions:
  contents: read

jobs:
  export:
    name: Export Codacy PR diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODACY_API_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

    steps:
      - name: Require Codacy token
        run: |
          if [[ -z "${CODACY_API_TOKEN}" ]]; then
            echo "::error::CODACY_PROJECT_TOKEN is not configured."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Codacy Cloud CLI
        run: npm install --global @codacy/codacy-cloud-cli

      - name: Export pull-request analysis
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/codacy

          pr_number="${{ github.event.pull_request.number }}"
          if [[ -z "${pr_number}" ]]; then
            pr_number="29"
          fi
          echo "pr_number=${pr_number}" >> "${GITHUB_ENV}"

          codacy pull-request gh wsg138 EnthusiaStaff "${pr_number}" \
            --output json > build/reports/codacy/pull-request.json
          codacy pull-request gh wsg138 EnthusiaStaff "${pr_number}" \
            --diff --output json > build/reports/codacy/diff.json

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("build/reports/codacy")
          pr_payload = json.loads((root / "pull-request.json").read_text(encoding="utf-8"))
          diff_payload = json.loads((root / "diff.json").read_text(encoding="utf-8"))

          lines = [
              "# Codacy PR diagnostics",
              "",
              f"- Pull request: **#{os.environ.get('pr_number', '29')}**",
              f"- Summary keys: `{', '.join(sorted(pr_payload)) if isinstance(pr_payload, dict) else type(pr_payload).__name__}`",
              f"- Diff keys: `{', '.join(sorted(diff_payload)) if isinstance(diff_payload, dict) else type(diff_payload).__name__}`",
              "",
              "The complete machine-readable outputs are attached in the workflow artifact.",
          ]
          text = "\n".join(lines) + "\n"
          (root / "summary.md").write_text(text, encoding="utf-8")
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(text)
          PY

      - name: Upload Codacy diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: codacy-pr-${{ env.pr_number }}-diagnostics
          path: build/reports/codacy
          if-no-files-found: error
          retention-days: 3
