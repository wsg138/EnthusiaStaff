name: Codacy Diagnostics

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - agent/expand-test-coverage

permissions:
  contents: read

jobs:
  export:
    name: Reproduce Codacy PMD findings
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Download PMD 7.26.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --output pmd.zip \
            "https://github.com/pmd/pmd/releases/download/pmd_releases%2F7.26.0/pmd-dist-7.26.0-bin.zip"
          unzip -q pmd.zip

      - name: Analyze changed Java files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/pmd
          git diff --name-only origin/main...HEAD -- '*.java' > build/reports/pmd/changed-java-files.txt

          if [[ ! -s build/reports/pmd/changed-java-files.txt ]]; then
            echo "::error::No changed Java files were found."
            exit 1
          fi

          files_csv="$(paste -sd, build/reports/pmd/changed-java-files.txt)"
          rulesets="category/java/errorprone.xml,category/java/bestpractices.xml"

          set +e
          pmd-bin-7.26.0/bin/pmd check \
            --dir "${files_csv}" \
            --rulesets "${rulesets}" \
            --format json \
            --report-file build/reports/pmd/report.json \
            --no-cache \
            --minimum-priority 5
          json_status=$?

          pmd-bin-7.26.0/bin/pmd check \
            --dir "${files_csv}" \
            --rulesets "${rulesets}" \
            --format text \
            --report-file build/reports/pmd/report.txt \
            --no-cache \
            --minimum-priority 5
          text_status=$?
          set -e

          for status in "${json_status}" "${text_status}"; do
            if [[ "${status}" -ne 0 && "${status}" -ne 4 ]]; then
              echo "::error::PMD failed with unexpected exit code ${status}."
              exit "${status}"
            fi
          done

          python3 - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          root = Path("build/reports/pmd")
          payload = json.loads((root / "report.json").read_text(encoding="utf-8"))
          violations = []
          for file_result in payload.get("files", []):
              filename = file_result.get("filename", "unknown")
              for violation in file_result.get("violations", []):
                  violations.append({"file": filename, **violation})

          rules = Counter(item.get("rule", "unknown") for item in violations)
          categories = Counter(item.get("ruleset", "unknown") for item in violations)
          lines = [
              "# PMD reproduction of Codacy findings",
              "",
              f"- Changed Java files scanned: **{len((root / 'changed-java-files.txt').read_text(encoding='utf-8').splitlines())}**",
              f"- PMD findings: **{len(violations)}**",
              f"- Rulesets: `{', '.join(f'{name}: {count}' for name, count in sorted(categories.items()))}`",
              "",
              "## Rule counts",
              "",
          ]
          if rules:
              lines.extend(f"- `{rule}`: {count}" for rule, count in sorted(rules.items()))
          else:
              lines.append("- None")

          lines.extend(["", "## Findings", ""])
          for item in violations:
              lines.append(
                  f"- `{item['file']}:{item.get('beginline', '?')}` "
                  f"`{item.get('rule', 'unknown')}` — {item.get('description', '').strip()}"
              )

          text = "\n".join(lines) + "\n"
          (root / "summary.md").write_text(text, encoding="utf-8")
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(text)
          PY

      - name: Upload PMD diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: codacy-pmd-diagnostics-${{ github.event.pull_request.number || github.run_id }}
          path: build/reports/pmd
          if-no-files-found: error
          retention-days: 3
