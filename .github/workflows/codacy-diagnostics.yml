name: Apply Codacy Fixes

on:
  workflow_dispatch:
  push:
    branches:
      - agent/expand-test-coverage

permissions:
  contents: write

concurrency:
  group: apply-codacy-fixes
  cancel-in-progress: true

jobs:
  fix:
    name: Apply and validate exact Codacy fixes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/expand-test-coverage
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Apply deterministic fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          def load(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def save(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def replace_literal(
              path: str,
              literal: str,
              constant: str,
              marker: str,
              declaration: str,
          ) -> None:
              text = load(path)
              if declaration.strip() in text:
                  return
              quoted = f'"{literal}"'
              if text.count(quoted) < 2:
                  raise SystemExit(f"Expected duplicate literal {quoted} in {path}")
              if text.count(marker) != 1:
                  raise SystemExit(f"Marker is not unique in {path}: {marker!r}")
              text = text.replace(quoted, constant)
              text = text.replace(marker, marker + declaration, 1)
              save(path, text)

          replace_literal(
              "common/src/test/java/net/enthusia/staff/common/ChecksTest.java",
              "field",
              "FIELD",
              "class ChecksTest {\n",
              '    private static final String FIELD = "field";\n\n',
          )

          lifecycle = "paper/src/test/java/net/enthusia/staff/paper/PaperRuntimeLifecycleTest.java"
          replace_literal(
              lifecycle,
              "task",
              "TASK",
              '    private static final String STORAGE = "storage";\n',
              '    private static final String TASK = "task";\n',
          )
          replace_literal(
              lifecycle,
              "channel",
              "CHANNEL",
              '    private static final String TASK = "task";\n',
              '    private static final String CHANNEL = "channel";\n',
          )

          replace_literal(
              "paper/src/test/java/net/enthusia/staff/paper/RuntimeHealthTest.java",
              "database",
              "DATABASE",
              "class RuntimeHealthTest {\n",
              '    private static final String DATABASE = "database";\n\n',
          )

          metadata_path = "paper/src/test/java/net/enthusia/staff/paper/config/PluginMetadataIntegrityTest.java"
          metadata = load(metadata_path)
          command_method = '''    @Test
          void everyCommandPermissionReferencesADeclaredPermission() throws IOException {
              JsonNode metadata = pluginMetadata();
              JsonNode permissions = metadata.path("permissions");
              Set<String> missingPermissions = new HashSet<>();

              metadata.path("commands").properties().forEach(entry -> {
                  JsonNode permission = entry.getValue().path("permission");
                  if (!permission.isMissingNode() && !permissions.has(permission.asText())) {
                      missingPermissions.add(entry.getKey() + " -> " + permission.asText());
                  }
              });

              assertTrue(missingPermissions.isEmpty(), "Undeclared command permissions: " + missingPermissions);
          }
'''
          child_method = '''    @Test
          void everyPermissionChildReferencesAnotherDeclaredPermission() throws IOException {
              JsonNode permissions = pluginMetadata().path("permissions");
              Set<String> missingChildren = new HashSet<>();

              permissions.properties().forEach(parent -> parent.getValue()
                      .path("children")
                      .properties()
                      .filter(child -> !permissions.has(child.getKey()))
                      .forEach(child -> missingChildren.add(
                              parent.getKey() + " -> " + child.getKey()
                      )));

              assertTrue(missingChildren.isEmpty(), "Undeclared child permissions: " + missingChildren);
          }
'''
          patterns = (
              (
                  r"    @Test\n    void everyCommandPermissionReferencesADeclaredPermission\(\) throws IOException \{.*?\n    \}\n(?=\n    @Test)",
                  command_method.rstrip("\n"),
              ),
              (
                  r"    @Test\n    void everyPermissionChildReferencesAnotherDeclaredPermission\(\) throws IOException \{.*?\n    \}\n(?=\n    @Test)",
                  child_method.rstrip("\n"),
              ),
          )
          for pattern, replacement in patterns:
              metadata, count = re.subn(pattern, replacement, metadata, count=1, flags=re.DOTALL)
              if count != 1:
                  raise SystemExit(f"Unable to replace metadata test matching {pattern}")
          save(metadata_path, metadata)

          database_config = "persistence/src/test/java/net/enthusia/staff/persistence/DatabaseConfigTest.java"
          replace_literal(
              database_config,
              "staff",
              "USERNAME",
              '    private static final String URL = "jdbc:mariadb://127.0.0.1:3306/enthusiastaff";\n',
              '    private static final String USERNAME = "staff";\n',
          )
          replace_literal(
              database_config,
              "secret",
              "PASSWORD",
              '    private static final String USERNAME = "staff";\n',
              '    private static final String PASSWORD = "secret";\n',
          )

          jdbc_test = "persistence/src/test/java/net/enthusia/staff/persistence/JdbcTransactionSupportTest.java"
          constants = (
              ("Transaction failed", "TRANSACTION_FAILED"),
              ("committed", "COMMITTED"),
              ("wrong count", "WRONG_COUNT"),
              ("wrong batch", "WRONG_BATCH"),
          )
          marker = "final class JdbcTransactionSupportTest {\n"
          for literal, constant in constants:
              declaration = f'    private static final String {constant} = "{literal}";\n'
              replace_literal(jdbc_test, literal, constant, marker, declaration)
              marker = declaration
          jdbc_text = load(jdbc_test)
          first_test = "\n    @Test\n"
          if "WRONG_BATCH;\n\n    @Test" not in jdbc_text:
              jdbc_text = jdbc_text.replace("WRONG_BATCH;\n    @Test", "WRONG_BATCH;\n\n    @Test", 1)
              save(jdbc_test, jdbc_text)

          authenticator_path = "protocol/src/main/java/net/enthusia/staff/protocol/EnvelopeAuthenticator.java"
          authenticator = load(authenticator_path)
          constructor_pattern = re.compile(
              r"        if \(protocolVersion < 1.*?\n        \}\n        this\.protocolVersion",
              re.DOTALL,
          )
          constructor_replacement = '''        validateConfiguration(
                  protocolVersion,
                  clock,
                  permittedAge,
                  permittedClockSkew,
                  serverKeys,
                  replayGuard
          );
          this.protocolVersion'''
          authenticator, count = constructor_pattern.subn(constructor_replacement, authenticator, count=1)
          if count != 1:
              raise SystemExit("Unable to replace EnvelopeAuthenticator constructor validation")

          if "private static void validateConfiguration(" not in authenticator:
              helpers = '''    private static void validateConfiguration(
                  int protocolVersion,
                  Clock clock,
                  Duration permittedAge,
                  Duration permittedClockSkew,
                  Map<String, SecretKey> serverKeys,
                  ReplayGuard replayGuard
          ) {
              if (protocolVersion < 1) {
                  throw invalidConfiguration();
              }
              requirePresent(clock, permittedAge, permittedClockSkew, serverKeys, replayGuard);
              if (serverKeys.isEmpty()) {
                  throw invalidConfiguration();
              }
              validateTimeBounds(permittedAge, permittedClockSkew);
          }

          private static void requirePresent(Object... values) {
              for (Object value : values) {
                  if (value == null) {
                      throw invalidConfiguration();
                  }
              }
          }

          private static void validateTimeBounds(Duration permittedAge, Duration permittedClockSkew) {
              if (permittedAge.isZero() || permittedAge.isNegative()) {
                  throw invalidConfiguration();
              }
              if (permittedClockSkew.isNegative()) {
                  throw invalidConfiguration();
              }
          }

          private static IllegalArgumentException invalidConfiguration() {
              return new IllegalArgumentException(
                      "authenticator configuration must be present and time bounds must be safe"
              );
          }

'''
              marker = "    public ProtocolEnvelope sign(UnsignedEnvelope envelope) {\n"
              if authenticator.count(marker) != 1:
                  raise SystemExit("EnvelopeAuthenticator sign marker is not unique")
              authenticator = authenticator.replace(marker, helpers + marker, 1)
          save(authenticator_path, authenticator)

          replace_literal(
              "protocol/src/test/java/net/enthusia/staff/protocol/EnvelopeAuthenticatorTest.java",
              "hub",
              "HUB",
              '    private static final Duration MAX_SKEW = Duration.ofSeconds(30);\n',
              '    private static final String HUB = "hub";\n',
          )

          protocol_envelope_test = "protocol/src/test/java/net/enthusia/staff/protocol/ProtocolEnvelopeTest.java"
          protocol_marker = '    private static final UUID MESSAGE_ID = UUID.fromString("53fa6153-2ad8-42ba-a4e9-8fb10d630f08");\n'
          for literal, constant in (("hub", "HUB"), ("TYPE", "TYPE"), ("nonce", "NONCE")):
              declaration = f'    private static final String {constant} = "{literal}";\n'
              replace_literal(protocol_envelope_test, literal, constant, protocol_marker, declaration)
              protocol_marker = declaration

          replay_test = "protocol/src/test/java/net/enthusia/staff/protocol/ReplayGuardTest.java"
          replay_marker = '    private static final Instant NOW = Instant.parse("2026-07-28T00:00:00Z");\n'
          for literal, constant in (("backend", "BACKEND"), ("backend-1", "BACKEND_ONE")):
              declaration = f'    private static final String {constant} = "{literal}";\n'
              replace_literal(replay_test, literal, constant, replay_marker, declaration)
              replay_marker = declaration

          velocity_config_test = "velocity/src/test/java/net/enthusia/staff/velocity/VelocityConfigurationTest.java"
          velocity_marker = "final class VelocityConfigurationTest {\n"
          for literal, constant in (("SECRET", "SECRET"), ("channel.tls-key-store", "TLS_KEY_STORE")):
              declaration = f'    private static final String {constant} = "{literal}";\n'
              replace_literal(velocity_config_test, literal, constant, velocity_marker, declaration)
              velocity_marker = declaration
          velocity_text = load(velocity_config_test)
          if "TLS_KEY_STORE;\n\n    @Test" not in velocity_text:
              velocity_text = velocity_text.replace("TLS_KEY_STORE;\n    @Test", "TLS_KEY_STORE;\n\n    @Test", 1)
              save(velocity_config_test, velocity_text)

          replace_literal(
              "velocity/src/test/java/net/enthusia/staff/velocity/VelocityRuntimeHealthTest.java",
              "channel",
              "CHANNEL",
              "class VelocityRuntimeHealthTest {\n",
              '    private static final String CHANNEL = "channel";\n\n',
          )
          PY

          git diff --check

      - name: Build and test the corrected branch
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean build jacocoAggregateReport runtimeJars \
            --no-daemon \
            --no-build-cache \
            --no-configuration-cache \
            --console=plain

      - name: Commit validated corrections
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "::error::The guarded fixer produced no changes."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            common/src/test/java/net/enthusia/staff/common/ChecksTest.java \
            paper/src/test/java/net/enthusia/staff/paper/PaperRuntimeLifecycleTest.java \
            paper/src/test/java/net/enthusia/staff/paper/RuntimeHealthTest.java \
            paper/src/test/java/net/enthusia/staff/paper/config/PluginMetadataIntegrityTest.java \
            persistence/src/test/java/net/enthusia/staff/persistence/DatabaseConfigTest.java \
            persistence/src/test/java/net/enthusia/staff/persistence/JdbcTransactionSupportTest.java \
            protocol/src/main/java/net/enthusia/staff/protocol/EnvelopeAuthenticator.java \
            protocol/src/test/java/net/enthusia/staff/protocol/EnvelopeAuthenticatorTest.java \
            protocol/src/test/java/net/enthusia/staff/protocol/ProtocolEnvelopeTest.java \
            protocol/src/test/java/net/enthusia/staff/protocol/ReplayGuardTest.java \
            velocity/src/test/java/net/enthusia/staff/velocity/VelocityConfigurationTest.java \
            velocity/src/test/java/net/enthusia/staff/velocity/VelocityRuntimeHealthTest.java
          git commit -m "Resolve Codacy findings in expanded test coverage"
          git push origin HEAD:agent/expand-test-coverage
