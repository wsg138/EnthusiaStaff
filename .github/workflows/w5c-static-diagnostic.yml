name: W5C Static Diagnostic

on:
  push:
    branches:
      - w5c/implementation-work
    paths:
      - ".github/workflows/w5c-static-diagnostic.yml"
      - "domain/src/main/java/net/enthusia/staff/domain/policyv2/appeal/**"
      - "persistence/src/main/java/net/enthusia/staff/persistence/JdbcPolicyV2FullOverturnStore.java"
      - "integration-tests/src/test/java/net/enthusia/staff/integration/PolicyV2FullOverturnIntegrationTest.java"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: PMD 6.55 changed Java
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --location --silent --show-error \
            "https://github.com/pmd/pmd/releases/download/pmd_releases%2F6.55.0/pmd-bin-6.55.0.zip" \
            -o /tmp/pmd.zip
          unzip -q /tmp/pmd.zip -d /tmp
          FILES="$(
            git diff --name-only fbab20bf44548c71f0ad9cc586c66a94e368b34e...HEAD -- '*.java' \
              | paste -sd, -
          )"
          test -n "$FILES"
          set +e
          /tmp/pmd-bin-6.55.0/bin/run.sh pmd -d "$FILES" -R ruleset.xml -f text -r /tmp/pmd.txt
          status=$?
          set -e
          cat /tmp/pmd.txt
          if [ "$status" -eq 4 ]; then
            echo "::error::PMD reported findings"
            exit 1
          fi
          exit "$status"
      - name: Lizard changed production Java
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --quiet lizard==1.17.10
          PROD="$(
            git diff --name-only fbab20bf44548c71f0ad9cc586c66a94e368b34e...HEAD -- \
              'domain/src/main/java/**/*.java' 'persistence/src/main/java/**/*.java'
          )"
          test -n "$PROD"
          python - <<'PY'
          import subprocess, sys
          files = subprocess.check_output([
              "git","diff","--name-only",
              "fbab20bf44548c71f0ad9cc586c66a94e368b34e...HEAD","--",
              "domain/src/main/java","persistence/src/main/java"
          ], text=True).splitlines()
          proc = subprocess.run(["lizard","-C","8","-L","50",*files], text=True)
          raise SystemExit(proc.returncode)
          PY
      - name: Diff whitespace
        run: git diff --check fbab20bf44548c71f0ad9cc586c66a94e368b34e...HEAD
      - name: Codacy PR issues
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error \
            'https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/repositories/EnthusiaStaff/pull-requests/409/issues?status=new&limit=100' \
            | python -m json.tool
