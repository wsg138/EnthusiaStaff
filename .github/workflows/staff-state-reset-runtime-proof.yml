name: Staff state reset runtime proof

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "paper/**"
      - "validation/staff-state-reset-proof/**"
      - ".github/workflows/staff-state-reset-runtime-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staff-state-reset-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    name: Same JAR on Leaf 115 and Paper 128/129/134
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      LEAF_SHA256: 29468f84fe484412b117207c975c3fc520d0e9bd5fca96c57f63eaf707d25077
      PAPER128_SHA256: 85efd679ac1b5c0133aa53ea4222fcdc65b8a5b0d7f4e85497b64747f19634aa
      PAPER129_SHA256: b1d8f6bfa1b6101fa8e947b53041cb3bdf5540e7b83b6547ca19ba7edefeb083
      PAPER134_SHA256: 16c5494aed1015de4e7c6e5aefece74e0b398f733bd3fcd8975c820598c19bca
      MINEFLAYER_COMMIT: f9e7db4447afda7838f08aa13430ec768738c178
      PAPER_USER_AGENT: EnthusiaStaff-state-reset-proof/1.0.0

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build candidate and proof plugin
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x gradlew
          ./gradlew :paper:test :paper:shadowJar --no-daemon --no-build-cache --no-configuration-cache --console=plain
          mkdir -p "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/evidence"
          jar_path="$(find paper/build/libs -maxdepth 1 -type f -name 'EnthusiaStaff-Paper-*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$jar_path"
          cp "$jar_path" "$RUNNER_TEMP/candidate/EnthusiaStaff-Paper.jar"
          sha256sum "$RUNNER_TEMP/candidate/EnthusiaStaff-Paper.jar" | tee "$RUNNER_TEMP/evidence/candidate.sha256"
          unzip -p "$RUNNER_TEMP/candidate/EnthusiaStaff-Paper.jar" plugin.yml | tee "$RUNNER_TEMP/evidence/plugin.yml"
          grep -F "api-version: '1.21'" "$RUNNER_TEMP/evidence/plugin.yml"
          (cd validation/staff-state-reset-proof && mvn -B -q package)
          cp validation/staff-state-reset-proof/target/staff-state-reset-proof-1.0.0.jar "$RUNNER_TEMP/StaffStateResetProof.jar"
          printf 'source=%s\n' "$(git rev-parse HEAD)" | tee "$RUNNER_TEMP/evidence/source.txt"

      - name: Install protocol clients
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/mf-pre263" "$RUNNER_TEMP/mf-263"
          (cd "$RUNNER_TEMP/mf-pre263" && npm init -y >/dev/null && npm install --no-audit --no-fund "https://github.com/zkonikishi/Mineflayer/archive/$MINEFLAYER_COMMIT.tar.gz")
          npm install --prefix "$RUNNER_TEMP/mf-263" --no-save --package-lock=false --ignore-scripts 'mineflayer@npm:@wp2508/mineflayer@4.42.2' >/dev/null

      - name: Fetch exact runtime artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/servers"
          mkdir -p "$root/leaf115" "$root/paper128" "$root/paper129" "$root/paper134"
          leaf_url="https://api.leafmc.one/v2/projects/leaf/versions/1.21.11/builds/115/downloads/leaf-1.21.11-115.jar"
          curl --fail --location --retry 4 --retry-all-errors "$leaf_url" -o "$root/leaf115/server.jar"
          test "$(sha256sum "$root/leaf115/server.jar" | awk '{print $1}')" = "$LEAF_SHA256"
          printf 'runtime=Leaf 1.21.11 build 115\nsha256=%s\nurl=%s\n' "$LEAF_SHA256" "$leaf_url" > "$root/leaf115/receipt.txt"

          fetch_paper() {
            local version="$1" build="$2" expected="$3" dest="$4"
            local response node url actual
            response="$(curl --fail --silent --show-error --header "User-Agent: $PAPER_USER_AGENT" "https://fill.papermc.io/v3/projects/paper/versions/$version/builds")"
            node="$(jq -c --argjson build "$build" 'first(.[] | select(.id == $build))' <<<"$response")"
            test "$node" != "null"
            url="$(jq -r '.downloads["server:default"].url' <<<"$node")"
            curl --fail --location --retry 4 --retry-all-errors --header "User-Agent: $PAPER_USER_AGENT" "$url" -o "$dest/server.jar"
            actual="$(sha256sum "$dest/server.jar" | awk '{print $1}')"
            test "$actual" = "$expected"
            printf 'runtime=Paper %s build %s\nsha256=%s\nurl=%s\n' "$version" "$build" "$actual" "$url" > "$dest/receipt.txt"
          }
          fetch_paper 26.2 128 "$PAPER128_SHA256" "$root/paper128"
          fetch_paper 26.2 129 "$PAPER129_SHA256" "$root/paper129"
          fetch_paper 26.3 134 "$PAPER134_SHA256" "$root/paper134"

      - name: Run four-runtime real-client matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/runtime-proof"
          mkdir -p "$root"

          run_one() {
            local name="$1" port="$2" version="$3" expected_runtime="$4"
            local dir="$root/$name"
            mkdir -p "$dir/server/plugins"
            cp "$RUNNER_TEMP/servers/$name/server.jar" "$dir/server/server.jar"
            cp "$RUNNER_TEMP/servers/$name/receipt.txt" "$dir/runtime-receipt.txt"
            cp "$RUNNER_TEMP/candidate/EnthusiaStaff-Paper.jar" "$dir/server/plugins/EnthusiaStaff-Paper.jar"
            cp "$RUNNER_TEMP/StaffStateResetProof.jar" "$dir/server/plugins/StaffStateResetProof.jar"
            printf 'eula=true\n' > "$dir/server/eula.txt"
            cat > "$dir/server/server.properties" <<EOF
          online-mode=false
          enforce-secure-profile=false
          server-port=$port
          server-ip=127.0.0.1
          spawn-protection=0
          allow-flight=true
          gamemode=creative
          force-gamemode=false
          white-list=false
          max-players=4
          view-distance=3
          simulation-distance=3
          enable-status=false
          level-type=minecraft:flat
          level-seed=1
          motd=staff-state-reset-$name
          EOF

            (
              cd "$dir/server"
              java -Xms1G -Xmx2G -jar server.jar nogui > console.log 2>&1
            ) &
            local server_pid=$!
            local ready=0
            for _ in $(seq 1 150); do
              if grep -q "Done (" "$dir/server/logs/latest.log" 2>/dev/null; then ready=1; break; fi
              if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
              sleep 1
            done
            if [[ "$ready" != 1 ]]; then
              tail -n 240 "$dir/server/console.log" || true
              return 1
            fi
            grep -F "$expected_runtime" "$dir/server/staff-state-reset-proof.txt"
            ! grep -q "Unsupported API version" "$dir/server/console.log"
            ! grep -Eq "NoSuchMethodError|NoSuchFieldError|ClassNotFoundException|LinkageError" "$dir/server/console.log"

            local node_path="$RUNNER_TEMP/mf-pre263/node_modules"
            if [[ "$version" == "26.3" ]]; then node_path="$RUNNER_TEMP/mf-263/node_modules"; fi
            NODE_PATH="$node_path" node validation/staff-state-reset-proof/client.js "$port" "$version" \
              > "$dir/client.log" 2> "$dir/client-console.log" &
            local client_pid=$!

            local completed=0
            for _ in $(seq 1 150); do
              if grep -q '^DONE=true$' "$dir/server/staff-state-reset-proof.txt" 2>/dev/null; then
                completed=1
                break
              fi
              if ! kill -0 "$server_pid" 2>/dev/null; then
                break
              fi
              sleep 1
            done

            if [[ "$completed" != 1 ]]; then
              echo "::error::$name did not complete the reset proof"
              cat "$dir/server/staff-state-reset-proof.txt" 2>/dev/null || true
              tail -n 300 "$dir/server/console.log" 2>/dev/null || true
              cat "$dir/client.log" 2>/dev/null || true
              kill "$client_pid" 2>/dev/null || true
              kill "$server_pid" 2>/dev/null || true
              wait "$client_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
              return 1
            fi

            for _ in $(seq 1 30); do
              kill -0 "$server_pid" 2>/dev/null || break
              sleep 1
            done
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            wait "$client_pid" 2>/dev/null || true

            cp "$dir/server/staff-state-reset-proof.txt" "$dir/evidence.txt"
            cp "$dir/server/console.log" "$dir/console.log"
            cp "$dir/client.log" "$dir/client-evidence.log"
            cp "$dir/client-console.log" "$dir/client-console-evidence.log"
            echo "===== completed $name ====="
            grep -E '^(RUNTIME|STATE|GEOMETRY|DONE|FAIL)' "$dir/evidence.txt"
          }

          run_one leaf115 25590 1.21.11 'RUNTIME|brandId=winds-studio:leaf|minecraft=1.21.11|build=115'
          run_one paper128 25591 26.2 'RUNTIME|brandId=papermc:paper|minecraft=26.2|build=128'
          run_one paper129 25592 26.2 'RUNTIME|brandId=papermc:paper|minecraft=26.2|build=129'
          run_one paper134 25593 26.3 'RUNTIME|brandId=papermc:paper|minecraft=26.3|build=134'

      - name: Verify state and geometry acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/runtime-proof"
          require() {
            local file="$1" pattern="$2"
            grep -Eq "$pattern" "$file" || {
              echo "::error::Missing '$pattern' in $file"
              tail -n 240 "$file" || true
              return 1
            }
          }
          for name in leaf115 paper128 paper129 paper134; do
            evidence="$root/$name/server/staff-state-reset-proof.txt"
            client="$root/$name/client.log"
            require "$evidence" '^HARNESS_READY=true$'
            for state in VISIBLE_CREATIVE VISIBLE_SURVIVAL VISIBLE_SPECTATOR VISIBLE_CREATIVE_2 VANISH_ON_CREATIVE VANISHED_SELECT_SURVIVAL VANISH_OFF_SURVIVAL VANISH_ON_SURVIVAL VANISHED_SELECT_SPECTATOR VANISH_OFF_SPECTATOR VANISH_ON_SPECTATOR VANISHED_SELECT_CREATIVE ADVENTURE_REJECTED VANISH_OFF_CREATIVE VISIBLE_SPECTATOR_FINAL FOUNDER_VISIBLE_CREATIVE FOUNDER_VISIBLE_SURVIVAL FOUNDER_VISIBLE_SPECTATOR FOUNDER_VISIBLE_CREATIVE_2 FOUNDER_VANISH_ON_CREATIVE FOUNDER_VANISHED_SELECT_SURVIVAL FOUNDER_VANISH_OFF_SURVIVAL FOUNDER_VANISH_ON_SURVIVAL FOUNDER_VANISHED_SELECT_SPECTATOR FOUNDER_VANISH_OFF_SPECTATOR FOUNDER_VANISH_ON_SPECTATOR FOUNDER_VANISHED_SELECT_CREATIVE FOUNDER_VANISH_OFF_CREATIVE; do
              require "$evidence" "^STATE\\|$state\\|pass=true"
            done
            for phase in VISIBLE_WALL VISIBLE_FLOOR VISIBLE_CEILING VANISHED_WALL VANISHED_FLOOR VANISHED_CEILING VISIBLE_FINAL_TELEPORT_WALL; do
              require "$evidence" "^GEOMETRY\\|$phase\\|pass=true\\|mode=SPECTATOR"
            done
            require "$client" '^MARKER\\|STATE\\|VISIBLE_SURVIVAL\\|mode=survival
            require "$client" '^DONE=true\\|mode=creative$'
            require "$evidence" '^DONE=true$'
            if grep -q '^FAIL|' "$evidence"; then
              grep '^FAIL|' "$evidence"
              exit 1
            fi
            cmp "$RUNNER_TEMP/candidate/EnthusiaStaff-Paper.jar" "$root/$name/server/plugins/EnthusiaStaff-Paper.jar"
            echo "===== $name ====="
            cat "$root/$name/runtime-receipt.txt"
            grep -E '^(RUNTIME|STATE|GEOMETRY|DONE|FAIL)' "$evidence"
          done
          echo 'COMMON_JAR_IDENTICAL=true'

      - name: Upload runtime proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: staff-state-reset-runtime-proof
          path: |
            ${{ runner.temp }}/evidence/
            ${{ runner.temp }}/runtime-proof/*/evidence.txt
            ${{ runner.temp }}/runtime-proof/*/console.log
            ${{ runner.temp }}/runtime-proof/*/client-evidence.log
            ${{ runner.temp }}/runtime-proof/*/client-console-evidence.log
            ${{ runner.temp }}/runtime-proof/*/runtime-receipt.txt
            ${{ runner.temp }}/servers/*/receipt.txt
          if-no-files-found: warn
          retention-days: 30

            require "$client" '^MARKER\\|STATE\\|VISIBLE_SPECTATOR\\|mode=spectator
            require "$client" '^DONE=true\\|mode=creative$'
            require "$evidence" '^DONE=true$'
            if grep -q '^FAIL|' "$evidence"; then
              grep '^FAIL|' "$evidence"
              exit 1
            fi
            cmp "$RUNNER_TEMP/candidate/EnthusiaStaff-Paper.jar" "$root/$name/server/plugins/EnthusiaStaff-Paper.jar"
            echo "===== $name ====="
            cat "$root/$name/runtime-receipt.txt"
            grep -E '^(RUNTIME|STATE|GEOMETRY|DONE|FAIL)' "$evidence"
          done
