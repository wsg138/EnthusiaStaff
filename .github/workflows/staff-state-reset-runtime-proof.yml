            ${{ runner.temp }}/runtime-proof/*/console.log
            ${{ runner.temp }}/runtime-proof/*/client-evidence.log
            ${{ runner.temp }}/runtime-proof/*/client-console-evidence.log
            ${{ runner.temp }}/runtime-proof/*/runtime-receipt.txt
            ${{ runner.temp }}/servers/*/receipt.txt
          if-no-files-found: warn
          retention-days: 30

            require "$client" '^MARKER\\|STATE\\|VANISHED_SELECT_SURVIVAL\\|mode=survival
