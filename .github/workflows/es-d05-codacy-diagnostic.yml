name: ES-D05 Codacy Diagnostic

on:
  push:
    branches:
      - validation/es-d05-final-666b37a
    paths:
      - ".github/workflows/es-d05-codacy-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read public Codacy PR 160 issue metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import urllib.request

          url = "https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/repositories/EnthusiaStaff/pull-requests/160/issues"
          request = urllib.request.Request(url, headers={"Accept": "application/json", "User-Agent": "EnthusiaStaff-validation"})
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          print(json.dumps(payload, indent=2, sort_keys=True))
          raise SystemExit("validation-only diagnostic intentionally fails after publishing public issue metadata")
          PY
