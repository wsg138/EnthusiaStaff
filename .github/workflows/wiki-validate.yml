name: Validate Wiki

on:
  pull_request:
    paths:
      - "docs/wiki/**"
      - "scripts/wiki/**"
      - ".github/workflows/wiki-*.yml"
  push:
    branches:
      - main
    paths:
      - "docs/wiki/**"
      - "scripts/wiki/**"
      - ".github/workflows/wiki-*.yml"

permissions:
  contents: read

concurrency:
  group: wiki-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Wiki source
        run: python scripts/wiki/validate_wiki.py
