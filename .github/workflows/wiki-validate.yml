name: Validate Wiki

on:
  pull_request:
    paths:
      - "docs/wiki/**"
      - "scripts/wiki/**"
      - ".github/workflows/wiki-*.yml"
  push:
    branches:
      - main
    paths:
      - "docs/wiki/**"
      - "scripts/wiki/**"
      - ".github/workflows/wiki-*.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Wiki source
        run: python scripts/wiki/validate_wiki.py

  publish-wiki-once:
    name: Publish Wiki once
    needs: validate
    if: >-
      github.event_name == 'pull_request' &&
      github.event.number == 40 &&
      github.head_ref == 'agent/wiki-information-architecture' &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Clone live Wiki
        env:
          WIKI_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone \
            "https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" \
            wiki-live

      - name: Create pre-publish bundle and backup branch
        id: backup
        run: |
          set -euo pipefail

          timestamp="$(date -u +'%Y%m%d-%H%M%S')"
          backup_branch="backup/wiki-information-architecture-${timestamp}-run-${GITHUB_RUN_ID}"
          wiki_branch="$(
            git -C wiki-live symbolic-ref --short refs/remotes/origin/HEAD |
            sed 's#^origin/##'
          )"

          git -C wiki-live bundle create \
            "${GITHUB_WORKSPACE}/wiki-before-information-architecture.bundle" --all
          git -C wiki-live branch "${backup_branch}" "origin/${wiki_branch}"
          git -C wiki-live push origin "${backup_branch}"

          echo "branch=${backup_branch}" >> "${GITHUB_OUTPUT}"
          echo "wiki_branch=${wiki_branch}" >> "${GITHUB_OUTPUT}"

      - name: Upload pre-publish Wiki bundle
        uses: actions/upload-artifact@v7
        with:
          name: wiki-before-information-architecture-${{ github.run_id }}
          path: wiki-before-information-architecture.bundle
          retention-days: 90
          if-no-files-found: error

      - name: Replace Wiki Markdown from reviewed source
        run: |
          set -euo pipefail

          find wiki-live -maxdepth 1 -type f \
            \( -name '*.md' -o -name '*.markdown' \) -delete
          cp docs/wiki/pages/*.md wiki-live/

          git -C wiki-live config user.name "github-actions[bot]"
          git -C wiki-live config \
            user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git -C wiki-live add -A

          if git -C wiki-live diff --cached --quiet; then
            echo "Live Wiki already matches reviewed source." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          git -C wiki-live commit \
            -m "Publish Wiki information architecture from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git -C wiki-live push origin \
            "HEAD:${{ steps.backup.outputs.wiki_branch }}"

      - name: Write publication summary
        run: |
          {
            echo "## Wiki publication"
            echo
            echo "- Reviewed source: \`${{ github.event.pull_request.head.sha }}\`"
            echo "- Backup branch: \`${{ steps.backup.outputs.branch }}\`"
            echo "- Backup artifact: \`wiki-before-information-architecture-${GITHUB_RUN_ID}\`"
            echo "- Published branch: \`${{ steps.backup.outputs.wiki_branch }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
