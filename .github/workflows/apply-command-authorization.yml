name: Apply command authorization update

on:
  push:
    branches:
      - section/command-authorization-hardening
    paths:
      - scripts/patch-command-authorization.py
      - .github/workflows/apply-command-authorization.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Apply guarded source update
        run: python3 scripts/patch-command-authorization.py

      - name: Commit inspector authorization changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/src/main/java/net/enthusia/staff/paper/command/InspectCommand.java
          git commit -m "Gate player inspector explicitly"
          git push origin "HEAD:${GITHUB_REF_NAME}"
