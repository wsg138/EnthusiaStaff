name: Moderation Web Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "moderation-web/**"
      - "staff-bot/src/main/resources/moderation-preview/**"
      - ".github/workflows/moderation-web-validation.yml"

permissions:
  contents: read

concurrency:
  group: moderation-web-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate Cloudflare moderation web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Record checked-out SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          TESTED_SHA="$(git rev-parse HEAD)"
          test -n "${TESTED_SHA}"
          echo "TESTED_SHA=${TESTED_SHA}" >> "${GITHUB_ENV}"

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Diagnose Codacy Lizard thresholds
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check lizard==1.23.0
          git diff --name-only --diff-filter=ACMR origin/main...HEAD -- '*.java' '*.js' '*.mjs' | sort -u > /tmp/pr-code.txt
          echo '=== all current PR code files ==='
          cat /tmp/pr-code.txt
          echo '=== enabled medium NLOC>50 / params>8 candidates ==='
          while IFS= read -r file; do
            [[ -f "$file" ]] || continue
            lizard -T nloc=50 -C 999 -a 8 -w "$file" || true
          done < /tmp/pr-code.txt
          echo '=== enabled minor CCN>10 candidates ==='
          while IFS= read -r file; do
            [[ -f "$file" ]] || continue
            lizard -T nloc=999 -C 10 -a 999 -w "$file" || true
          done < /tmp/pr-code.txt
          echo '=== files above Codacy medium file-NLOC threshold by physical lines (upper-bound screen) ==='
          while IFS= read -r file; do
            [[ -f "$file" ]] || continue
            lines=$(wc -l < "$file")
            if (( lines > 500 )); then printf '%s %s\n' "$lines" "$file"; fi
          done < /tmp/pr-code.txt

      - name: Validate Worker, assets and security contract
        working-directory: moderation-web
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts
          npm run check
          test "${TESTED_SHA}" = "$(git -C .. rev-parse HEAD)"
