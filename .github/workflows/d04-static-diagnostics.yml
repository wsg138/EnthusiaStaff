name: D04 static diagnostics

on:
  push:
    branches:
      - package/es-d04-account-linking

permissions:
  contents: read

jobs:
  codacy-issues:
    runs-on: ubuntu-latest
    steps:
      - name: List current PR static-analysis issues
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          base = (
              "https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/"
              "repositories/EnthusiaStaff/pull-requests/151/issues"
          )
          query = urllib.parse.urlencode({"status": "new", "limit": 100})
          request = urllib.request.Request(
              f"{base}?{query}",
              headers={"Accept": "application/json", "User-Agent": "EnthusiaStaff-D04-diagnostics"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)

          issues = payload.get("data", [])
          print(f"D04_CODACY_ISSUE_COUNT={len(issues)}")
          for issue in issues:
              commit_issue = issue.get("commitIssue") or {}
              pattern = commit_issue.get("patternInfo") or {}
              tool = commit_issue.get("toolInfo") or {}
              record = {
                  "issue_id": issue.get("issueId"),
                  "file": commit_issue.get("filePath"),
                  "line": commit_issue.get("lineNumber"),
                  "pattern_id": pattern.get("id"),
                  "title": pattern.get("title"),
                  "category": pattern.get("category"),
                  "subcategory": pattern.get("subCategory"),
                  "level": pattern.get("level"),
                  "severity": pattern.get("severityLevel"),
                  "tool": tool.get("name"),
              }
              print("D04_CODACY_ISSUE=" + json.dumps(record, sort_keys=True))
          PY
