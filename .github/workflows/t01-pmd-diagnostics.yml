name: T01 Codacy hosted PR diagnostics

on:
  push:
    branches:
      - "package/es-t01-staff-teleport-hardening"

permissions:
  contents: read

jobs:
  diagnose:
    name: Read hosted Codacy PR diff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
    steps:
      - name: Set up Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Install Codacy Cloud CLI
        shell: bash
        run: npm install --global @codacy/codacy-cloud-cli

      - name: Print hosted PR analysis and annotated diff
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CODACY_PROJECT_TOKEN}"
          codacy pull-request gh wsg138 EnthusiaStaff 215 --output json
          codacy pull-request gh wsg138 EnthusiaStaff 215 --diff --output json
