name: T01 PMD 6.55 diagnostics

on:
  push:
    branches:
      - "package/es-t01-staff-teleport-hardening"

permissions:
  contents: read

jobs:
  diagnose:
    name: Report PMD 6.55 findings on changed Java
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Run repository PMD rules on PR Java files
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.java')
          if (( ${#files[@]} == 0 )); then
            echo "No changed Java files."
            exit 0
          fi
          curl --fail --location --silent --show-error \
            'https://github.com/pmd/pmd/releases/download/pmd_releases%2F6.55.0/pmd-bin-6.55.0.zip' \
            --output /tmp/pmd.zip
          unzip -q /tmp/pmd.zip -d /tmp
          input="$(IFS=,; echo "${files[*]}")"
          set +e
          /tmp/pmd-bin-6.55.0/bin/run.sh pmd \
            -d "${input}" \
            -R ruleset.xml \
            -f text \
            -r /tmp/pmd-findings.txt
          status=$?
          set -e
          echo "PMD exit status: ${status}"
          cat /tmp/pmd-findings.txt
          if (( status != 0 && status != 4 )); then
            exit "${status}"
          fi
