name: D07 removal target repair

on:
  push:
    branches:
      - "package/es-d07-discord-punishment-enforcement"

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == '[ES-D07] Stage removal target repair'
    name: Apply and validate D07 removal target repair
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Apply exact removal target repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          path = "staff-bot/src/main/java/net/enthusia/staff/discordbot/DiscordPunishmentCommandController.java"
          text = read(path)
          text = replace_once(
              text,
              '''    Prepared remove(long actorId, String actorName, long targetId, DiscordConsequenceType type) {\n        DiscordPunishmentService.Confirmation confirmation = service.prepareRemoval(\n                actorId,\n                actorName,\n                targetId,\n                type,\n                DiscordPunishmentTermination.END\n        );\n        return preparedRemoval(confirmation, type);\n    }\n\n    Prepared unrestrict(long actorId, String actorName, long targetId, String scopeId) {\n        DiscordPunishmentService.Confirmation confirmation = service.prepareRestrictionRemoval(\n                actorId,\n                actorName,\n                targetId,\n                scopeId,\n                DiscordPunishmentTermination.END\n        );\n        return preparedRemoval(confirmation, DiscordConsequenceType.CHANNEL_RESTRICTION);\n    }\n''',
              '''    Prepared remove(long actorId, String actorName, String targetId, DiscordConsequenceType type) {\n        DiscordPunishmentService.Confirmation confirmation = service.prepareRemoval(\n                actorId,\n                actorName,\n                parseUnsigned(targetId),\n                type,\n                DiscordPunishmentTermination.END\n        );\n        return preparedRemoval(confirmation, type);\n    }\n\n    Prepared unrestrict(long actorId, String actorName, String targetId, String scopeId) {\n        DiscordPunishmentService.Confirmation confirmation = service.prepareRestrictionRemoval(\n                actorId,\n                actorName,\n                parseUnsigned(targetId),\n                scopeId,\n                DiscordPunishmentTermination.END\n        );\n        return preparedRemoval(confirmation, DiscordConsequenceType.CHANNEL_RESTRICTION);\n    }\n''',
              "controller removal target",
          )
          text = replace_once(
              text,
              '''    private static long parseUnsigned(String value) {\n        try {\n            long parsed = Long.parseUnsignedLong(value);\n            requirePositive(parsed);\n            return parsed;\n        } catch (NumberFormatException exception) {\n            throw new IllegalArgumentException("invalid Discord user id", exception);\n        }\n    }\n''',
              '''    private static long parseUnsigned(String value) {\n        if (value == null || value.isBlank()) {\n            throw new IllegalArgumentException("Discord user id is required");\n        }\n        try {\n            long parsed = Long.parseUnsignedLong(value.trim());\n            requirePositive(parsed);\n            return parsed;\n        } catch (NumberFormatException exception) {\n            throw new IllegalArgumentException("invalid Discord user id", exception);\n        }\n    }\n''',
              "controller user-id validation",
          )
          write(path, text)

          path = "staff-bot/src/main/java/net/enthusia/staff/discordbot/JdaStaffModerationListener.java"
          text = read(path)
          text = replace_once(
              text,
              '    private static final String USER_OPTION = "user";\n',
              '    private static final String USER_OPTION = "user";\n    private static final String USER_ID_OPTION = "user-id";\n',
              "listener user-id option",
          )
          text = replace_once(
              text,
              '''    private void dispatchQuickPunishment(SlashCommandInteractionEvent event, long actorId, String actorName) {\n        DiscordPunishmentCommandController punishment = punishments.orElse(null);\n        if (punishment == null) {\n            unavailable(event);\n            return;\n        }\n        User target = event.getOption(USER_OPTION).getAsUser();\n        Supplier<DiscordPunishmentCommandController.Prepared> work = quickWork(\n                punishment, event, actorId, actorName, target.getIdLong()\n        );\n        dispatchPunishment(event, work);\n    }\n\n    private static Supplier<DiscordPunishmentCommandController.Prepared> quickWork(\n            DiscordPunishmentCommandController punishment,\n            SlashCommandInteractionEvent event,\n            long actorId,\n            String actorName,\n            long targetId\n    ) {\n        String reason = option(event, REASON_OPTION, "");\n        String explanation = option(event, EXPLANATION_OPTION, "");\n        return switch (event.getName()) {\n            case WARN -> () -> punishment.warn(actorId, actorName, targetId, reason, explanation);\n            case MUTE -> () -> punishment.mute(\n                    actorId, actorName, targetId, option(event, DURATION_OPTION, ""), reason, explanation);\n            case UNMUTE -> () -> punishment.remove(actorId, actorName, targetId, DiscordConsequenceType.MUTE);\n            case KICK -> () -> punishment.kick(actorId, actorName, targetId, reason, explanation);\n            case BAN -> () -> punishment.ban(\n                    actorId,\n                    actorName,\n                    targetId,\n                    option(event, DURATION_OPTION, ""),\n                    reason,\n                    explanation,\n                    integerOption(event, DELETE_SECONDS_OPTION, 0)\n            );\n            case UNBAN -> () -> punishment.remove(actorId, actorName, targetId, DiscordConsequenceType.BAN);\n            case RESTRICT -> () -> punishment.restrict(\n                    actorId,\n                    actorName,\n                    targetId,\n                    option(event, DURATION_OPTION, ""),\n                    reason,\n                    explanation,\n                    option(event, SCOPE_KIND_OPTION, ""),\n                    option(event, SCOPE_ID_OPTION, ""),\n                    option(event, MODE_OPTION, "")\n            );\n            case UNRESTRICT -> () -> punishment.unrestrict(\n                    actorId, actorName, targetId, option(event, SCOPE_ID_OPTION, ""));\n            default -> throw new IllegalArgumentException("not a Discord punishment command");\n        };\n    }\n''',
              '''    private void dispatchQuickPunishment(SlashCommandInteractionEvent event, long actorId, String actorName) {\n        DiscordPunishmentCommandController punishment = punishments.orElse(null);\n        if (punishment == null) {\n            unavailable(event);\n            return;\n        }\n        dispatchPunishment(event, quickWork(punishment, event, actorId, actorName));\n    }\n\n    private static Supplier<DiscordPunishmentCommandController.Prepared> quickWork(\n            DiscordPunishmentCommandController punishment,\n            SlashCommandInteractionEvent event,\n            long actorId,\n            String actorName\n    ) {\n        if (isRemovalCommand(event.getName())) {\n            return quickRemovalWork(punishment, event, actorId, actorName);\n        }\n        User target = event.getOption(USER_OPTION).getAsUser();\n        return quickIssueWork(punishment, event, actorId, actorName, target.getIdLong());\n    }\n\n    private static boolean isRemovalCommand(String command) {\n        return UNMUTE.equals(command) || UNBAN.equals(command) || UNRESTRICT.equals(command);\n    }\n\n    private static Supplier<DiscordPunishmentCommandController.Prepared> quickRemovalWork(\n            DiscordPunishmentCommandController punishment,\n            SlashCommandInteractionEvent event,\n            long actorId,\n            String actorName\n    ) {\n        String targetId = option(event, USER_ID_OPTION, "");\n        return switch (event.getName()) {\n            case UNMUTE -> () -> punishment.remove(actorId, actorName, targetId, DiscordConsequenceType.MUTE);\n            case UNBAN -> () -> punishment.remove(actorId, actorName, targetId, DiscordConsequenceType.BAN);\n            case UNRESTRICT -> () -> punishment.unrestrict(\n                    actorId, actorName, targetId, option(event, SCOPE_ID_OPTION, ""));\n            default -> throw new IllegalArgumentException("not a Discord punishment removal command");\n        };\n    }\n\n    private static Supplier<DiscordPunishmentCommandController.Prepared> quickIssueWork(\n            DiscordPunishmentCommandController punishment,\n            SlashCommandInteractionEvent event,\n            long actorId,\n            String actorName,\n            long targetId\n    ) {\n        String reason = option(event, REASON_OPTION, "");\n        String explanation = option(event, EXPLANATION_OPTION, "");\n        return switch (event.getName()) {\n            case WARN -> () -> punishment.warn(actorId, actorName, targetId, reason, explanation);\n            case MUTE -> () -> punishment.mute(\n                    actorId, actorName, targetId, option(event, DURATION_OPTION, ""), reason, explanation);\n            case KICK -> () -> punishment.kick(actorId, actorName, targetId, reason, explanation);\n            case BAN -> () -> punishment.ban(\n                    actorId, actorName, targetId, option(event, DURATION_OPTION, ""),\n                    reason, explanation, integerOption(event, DELETE_SECONDS_OPTION, 0));\n            case RESTRICT -> () -> punishment.restrict(\n                    actorId, actorName, targetId, option(event, DURATION_OPTION, ""), reason, explanation,\n                    option(event, SCOPE_KIND_OPTION, ""), option(event, SCOPE_ID_OPTION, ""),\n                    option(event, MODE_OPTION, ""));\n            default -> throw new IllegalArgumentException("not a Discord punishment issue command");\n        };\n    }\n''',
              "listener quick command split",
          )
          text = replace_once(
              text,
              '''    private static CommandData restrictionRemovalSlash(DefaultMemberPermissions discovery) {\n        return Commands.slash(UNRESTRICT, "End a Discord restriction on one exact scope")\n                .addOptions(\n                        userOption(),\n                        stringOption(SCOPE_ID_OPTION, "Exact Discord channel/category ID", true)\n                )\n                .setDefaultPermissions(discovery);\n    }\n''',
              '''    private static CommandData restrictionRemovalSlash(DefaultMemberPermissions discovery) {\n        return Commands.slash(UNRESTRICT, "End a Discord restriction on one exact scope")\n                .addOptions(\n                        stringOption(USER_ID_OPTION, "Exact Discord user ID", true),\n                        stringOption(SCOPE_ID_OPTION, "Exact Discord channel/category ID", true)\n                )\n                .setDefaultPermissions(discovery);\n    }\n''',
              "listener restriction removal command",
          )
          text = replace_once(
              text,
              '''    private static CommandData removalSlash(\n            String name,\n            String description,\n            DefaultMemberPermissions discovery\n    ) {\n        return Commands.slash(name, description)\n                .addOptions(userOption())\n                .setDefaultPermissions(discovery);\n    }\n''',
              '''    private static CommandData removalSlash(\n            String name,\n            String description,\n            DefaultMemberPermissions discovery\n    ) {\n        return Commands.slash(name, description)\n                .addOptions(stringOption(USER_ID_OPTION, "Exact Discord user ID", true))\n                .setDefaultPermissions(discovery);\n    }\n''',
              "listener generic removal command",
          )
          write(path, text)

          path = "staff-bot/src/test/java/net/enthusia/staff/discordbot/JdaStaffModerationListenerTest.java"
          text = read(path)
          text = replace_once(
              text,
              'import net.dv8tion.jda.api.interactions.commands.DefaultMemberPermissions;\n',
              'import net.dv8tion.jda.api.interactions.commands.DefaultMemberPermissions;\nimport net.dv8tion.jda.api.interactions.commands.OptionType;\n',
              "listener test option type import",
          )
          text = replace_once(
              text,
              'class JdaStaffModerationListenerTest {\n',
              'class JdaStaffModerationListenerTest {\n    private static final String USER_ID_OPTION = "user-id";\n',
              "listener test user-id constant",
          )
          text = replace_once(
              text,
              '''    @Test\n    void unrestrictRequiresExactScopeId() {\n        SlashCommandData unrestrict = (SlashCommandData) command(\n                JdaStaffModerationListener.commands(true), "unrestrict"\n        );\n\n        assertEquals(\n                java.util.List.of("user", "scope-id"),\n                unrestrict.getOptions().stream().map(option -> option.getName()).toList()\n        );\n        assertTrue(unrestrict.getOptions().stream().allMatch(option -> option.isRequired()));\n    }\n''',
              '''    @Test\n    void removalCommandsUseExactDiscordUserIds() {\n        for (String name : java.util.List.of("unmute", "unban", "unrestrict")) {\n            SlashCommandData command = (SlashCommandData) command(JdaStaffModerationListener.commands(true), name);\n            assertEquals(USER_ID_OPTION, command.getOptions().getFirst().getName());\n            assertEquals(OptionType.STRING, command.getOptions().getFirst().getType());\n            assertTrue(command.getOptions().getFirst().isRequired());\n        }\n    }\n\n    @Test\n    void unrestrictRequiresExactScopeId() {\n        SlashCommandData unrestrict = (SlashCommandData) command(\n                JdaStaffModerationListener.commands(true), "unrestrict"\n        );\n\n        assertEquals(\n                java.util.List.of(USER_ID_OPTION, "scope-id"),\n                unrestrict.getOptions().stream().map(option -> option.getName()).toList()\n        );\n        assertTrue(unrestrict.getOptions().stream().allMatch(option -> option.isRequired()));\n    }\n''',
              "listener test removal metadata",
          )
          write(path, text)
          PY

      - name: Run focused staff-bot tests
        run: ./gradlew --no-daemon :staff-bot:test

      - name: Run repository PMD on changed Java
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://github.com/pmd/pmd/releases/download/pmd_releases%2F6.55.0/pmd-bin-6.55.0.zip' \
            --output /tmp/pmd.zip
          unzip -q /tmp/pmd.zip -d /tmp
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.java')
          input="$(IFS=,; echo "${files[*]}")"
          set +e
          /tmp/pmd-bin-6.55.0/bin/run.sh pmd \
            -d "${input}" \
            -R ruleset.xml \
            -f text \
            -r /tmp/pmd-findings.txt
          status=$?
          set -e
          cat /tmp/pmd-findings.txt
          exit "$status"

      - name: Commit validated removal target repair and remove runner
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/d07-removal-target-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(es-d07): make removal targets addressable after enforcement'
          git push origin HEAD:package/es-d07-discord-punishment-enforcement
