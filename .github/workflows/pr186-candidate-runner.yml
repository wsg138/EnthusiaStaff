name: PR186 candidate runner

on:
  push:
    branches:
      - "diagnostic/pr186-final-gate-worker-20260830-a"

permissions:
  contents: read

jobs:
  validate:
    name: Validate final narrowed PR186 candidate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: 5acc2c9f9ca53df614efb64780e011396b115e0c
          fetch-depth: 0

      - name: Verify candidate and frozen product branch
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE=5acc2c9f9ca53df614efb64780e011396b115e0c
          PRODUCT=b9823409b189e54cb3e1da803db474b139897131
          test "$(git rev-parse HEAD)" = "${CANDIDATE}"
          REMOTE="$(git ls-remote origin refs/heads/owner/staging-web-moderation-console | cut -f1)"
          test "${REMOTE}" = "${PRODUCT}"
          git diff --exit-code
          git diff --check
          node --check staff-bot/src/main/resources/moderation-preview/model.js
          node --check staff-bot/src/main/resources/moderation-preview/app.js
          node --check staff-bot/src/main/resources/moderation-preview/workflow.js
          node --check staff-bot/src/main/resources/moderation-preview/review.js
          ! grep -F "new InetSocketAddress" staff-bot/src/main/java/net/enthusia/staff/discordbot/ModerationPreviewWebConfig.java
          grep -F "StaffBotConfiguration.loopbackSocketAddress(host, port)" staff-bot/src/main/java/net/enthusia/staff/discordbot/ModerationPreviewWebConfig.java
          grep -F "static InetSocketAddress loopbackSocketAddress" staff-bot/src/main/java/net/enthusia/staff/discordbot/StaffBotConfiguration.java
          test "$(grep -c 'nosemgrep -- Literal .* loopback bind' staff-bot/src/main/java/net/enthusia/staff/discordbot/StaffBotConfiguration.java)" = "2"
          grep -F "$('#punishmentDialog').scrollTop = 0;" staff-bot/src/main/resources/moderation-preview/workflow.js
          grep -F "body.scrollTop = 0;" staff-bot/src/main/resources/moderation-preview/workflow.js
          grep -F "body.scrollLeft = 0;" staff-bot/src/main/resources/moderation-preview/workflow.js
          ! grep -F "parent.scrollTop = 0;" staff-bot/src/main/resources/moderation-preview/model.js
          ! grep -F "parent.scrollLeft = 0;" staff-bot/src/main/resources/moderation-preview/model.js
          ! grep -F "catch (Throwable" staff-bot/src/test/java/net/enthusia/staff/discordbot/ModerationPreviewWebRuntimeTest.java
          ! grep -F "server = null" staff-bot/src/main/java/net/enthusia/staff/discordbot/ModerationPreviewWebRuntime.java
          ! grep -F "executor = null" staff-bot/src/main/java/net/enthusia/staff/discordbot/ModerationPreviewWebRuntime.java

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clean build, tests, coverage, runtime jars
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean build jacocoAggregateReport runtimeJars \
            --no-daemon \
            --no-build-cache \
            --no-configuration-cache \
            --console=plain

      - name: Re-verify frozen candidate and product branch
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE=5acc2c9f9ca53df614efb64780e011396b115e0c
          PRODUCT=b9823409b189e54cb3e1da803db474b139897131
          test "$(git rev-parse HEAD)" = "${CANDIDATE}"
          REMOTE="$(git ls-remote origin refs/heads/owner/staging-web-moderation-console | cut -f1)"
          test "${REMOTE}" = "${PRODUCT}"
          git diff --exit-code
