name: ES-P12 freeze notifier Folia repair

on:
  push:
    branches:
      - "package/es-p12-staff-operational-hardening"

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == '[ES-P12] Stage freeze notifier Folia repair'
    name: Validate and publish freeze notifier Folia repair
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Apply repair
        run: python3 scripts/es_p12_freeze_notifier_folia_repair.py

      - name: Install Lizard
        run: python3 -m pip install --disable-pip-version-check lizard==1.23.0

      - name: Check Lizard bounds
        shell: bash
        run: |
          lizard -C 8 -L 50 -a 8 -w \
            paper/src/main/java/net/enthusia/staff/paper/freeze/FreezeStaffNotifier.java

      - name: Check PMD
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://github.com/pmd/pmd/releases/download/pmd_releases%2F6.55.0/pmd-bin-6.55.0.zip' \
            --output /tmp/pmd.zip
          unzip -q /tmp/pmd.zip -d /tmp
          /tmp/pmd-bin-6.55.0/bin/run.sh pmd \
            -d 'paper/src/main/java/net/enthusia/staff/paper/freeze/FreezeStaffNotifier.java,paper/src/test/java/net/enthusia/staff/paper/freeze/FreezeStaffNotifierTest.java' \
            -R ruleset.xml \
            -f text \
            -r /tmp/pmd-findings.txt
          cat /tmp/pmd-findings.txt

      - name: Run Paper tests
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :paper:test --no-daemon --no-build-cache --no-configuration-cache --console=plain
          git diff --check

      - name: Publish validated repair
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/es_p12_freeze_notifier_folia_repair.py .github/workflows/es-p12-freeze-notifier-folia-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            paper/src/main/java/net/enthusia/staff/paper/freeze/FreezeStaffNotifier.java \
            paper/src/test/java/net/enthusia/staff/paper/freeze/FreezeStaffNotifierTest.java \
            scripts/es_p12_freeze_notifier_folia_repair.py \
            .github/workflows/es-p12-freeze-notifier-folia-repair.yml
          git commit -m "ES-P12: make freeze alerts entity-owner safe"
          git push origin HEAD:package/es-p12-staff-operational-hardening
