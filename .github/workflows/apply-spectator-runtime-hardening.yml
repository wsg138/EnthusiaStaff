name: Apply spectator runtime hardening

on:
  push:
    branches:
      - section/helper-rank-authority
    paths:
      - scripts/patch-spectator-runtime-hardening.py
      - .github/workflows/apply-spectator-runtime-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Apply guarded source updates
        run: python3 scripts/patch-spectator-runtime-hardening.py

      - name: Commit source updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/src/main/java/net/enthusia/staff/paper/visibility/VanishManager.java \
                  paper/src/main/java/net/enthusia/staff/paper/staff/StaffModeAccessPolicy.java \
                  paper/src/main/java/net/enthusia/staff/paper/staff/StaffModeManager.java \
                  paper/src/test/java/net/enthusia/staff/paper/staff/StaffModeAccessPolicyTest.java \
                  paper/src/main/resources/plugin.yml
          git commit -m "Harden spectator and staff-mode transitions"
          git push origin "HEAD:${GITHUB_REF_NAME}"
