name: Moderation Read Relay Staging Deploy

on:
  push:
    branches:
      - main
      - package/es-d16-moderation-read-bridge
    paths:
      - "moderation-web/src/relay.js"
      - "moderation-web/wrangler-relay.jsonc"
      - "moderation-web/test/backend.test.mjs"
      - ".github/workflows/moderation-read-relay-staging-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_ZONE: enthusia.info
  READ_RELAY_NAME: enthusia-moderation-read-relay-staging

jobs:
  deploy:
    name: Deploy authenticated read relay
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    timeout-minutes: 15

    steps:
      - name: Check out exact commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Record source SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          test -n "$SOURCE_SHA"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Resolve Cloudflare account and Workers subdomain
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" ]]
          zone="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/zones?name=${EXPECTED_ZONE}&status=active")"
          printf '%s' "$zone" | jq -e '.success == true' >/dev/null
          count="$(printf '%s' "$zone" | jq '[.result[] | select(.name == env.EXPECTED_ZONE)] | length')"
          [[ "$count" == '1' ]]
          account_id="$(printf '%s' "$zone" | jq -r '.result[] | select(.name == env.EXPECTED_ZONE) | .account.id')"
          [[ "$account_id" =~ ^[0-9a-f]{32}$ ]]

          workers="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${account_id}/workers/subdomain")"
          printf '%s' "$workers" | jq -e '.success == true' >/dev/null
          subdomain="$(printf '%s' "$workers" | jq -r '.result.subdomain')"
          [[ "$subdomain" =~ ^[A-Za-z0-9-]+$ ]]
          relay_origin="https://${READ_RELAY_NAME}.${subdomain}.workers.dev"

          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          echo "READ_RELAY_ORIGIN=$relay_origin" >> "$GITHUB_ENV"
          echo "relay origin: \`${relay_origin}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate relay source
        working-directory: moderation-web
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts
          npm test
          npx wrangler deploy --config wrangler-relay.jsonc --dry-run --outdir .wrangler-relay-dry-run
          [[ "$SOURCE_SHA" == "$(git -C .. rev-parse HEAD)" ]]

      - name: Deploy relay with derived read key
        working-directory: moderation-web
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BOT_TOKEN: ${{ secrets.ENTHUSIA_STAFF_BOT_TOKEN }}
        run: |
          set -Eeuo pipefail
          secrets_file="$(mktemp)"
          cleanup() { rm -f "$secrets_file"; }
          trap cleanup EXIT
          chmod 600 "$secrets_file"

          python3 - "$secrets_file" <<'PY'
          import hashlib
          import json
          import os
          import sys

          token = os.environ['BOT_TOKEN'].strip()
          if not token or any(ch.isspace() for ch in token):
              raise SystemExit('protected bot token is empty or malformed')
          read_key_hex = hashlib.sha256(
              b'enthusia-staff-moderation-read-api-v1\0' + token.encode('utf-8')
          ).hexdigest()
          with open(sys.argv[1], 'w', encoding='utf-8') as handle:
              json.dump({'READ_API_SIGNING_KEY_HEX': read_key_hex}, handle)
          PY
          unset BOT_TOKEN

          npx wrangler deploy --config wrangler-relay.jsonc --secrets-file "$secrets_file"
          cleanup
          trap - EXIT

      - name: Verify relay authentication fence
        shell: bash
        run: |
          set -Eeuo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status=''
          for attempt in $(seq 1 30); do
            status="$(curl --silent --show-error \
              -X POST \
              -H 'Content-Type: application/json; charset=utf-8' \
              --data '{}' \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --max-time 20 \
              "${READ_RELAY_ORIGIN}/v1/moderation/bootstrap" || true)"
            [[ "$status" == '401' ]] && break
            sleep 2
          done
          [[ "$status" == '401' ]]
          jq -e '.code == "unauthorized" and .message == "Request rejected."' "$response_file" >/dev/null

      - name: Verify signed relay reaches Bloom read API
        if: github.ref == 'refs/heads/package/es-d16-moderation-read-bridge'
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.ENTHUSIA_STAFF_BOT_TOKEN }}
        run: |
          set -Eeuo pipefail
          body_file="$(mktemp)"
          proof_file="$(mktemp)"
          response_file="$(mktemp)"
          cleanup() { rm -f "$body_file" "$proof_file" "$response_file"; }
          trap cleanup EXIT
          chmod 600 "$body_file" "$proof_file" "$response_file"

          python3 - "$body_file" "$proof_file" <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          import os
          import secrets
          import sys
          import time

          body_path, proof_path = sys.argv[1:]
          token = os.environ['BOT_TOKEN'].strip()
          if not token or any(ch.isspace() for ch in token):
              raise SystemExit('protected bot token is empty or malformed')
          key = hashlib.sha256(
              b'enthusia-staff-moderation-read-api-v1\0' + token.encode('utf-8')
          ).digest()
          actor = str(10**17 + secrets.randbelow(9 * 10**17))
          body = json.dumps({
              'actorId': actor,
              'guildId': '1',
              'messages': None,
              'targetKey': f'discord:{actor}',
          }, separators=(',', ':')).encode('utf-8')
          timestamp = str(int(time.time()))
          nonce = base64.urlsafe_b64encode(secrets.token_bytes(24)).rstrip(b'=').decode('ascii')
          digest = hashlib.sha256(body).hexdigest()
          canonical = f'v1\nPOST\n/v1/moderation/bootstrap\n{timestamp}\n{nonce}\n{digest}'.encode('utf-8')
          signature = base64.urlsafe_b64encode(
              hmac.new(key, canonical, hashlib.sha256).digest()
          ).rstrip(b'=').decode('ascii')
          with open(body_path, 'wb') as handle:
              handle.write(body)
          with open(proof_path, 'w', encoding='utf-8') as handle:
              handle.write(f'{timestamp}\t{nonce}\t{signature}\n')
          PY
          unset BOT_TOKEN

          IFS=$'\t' read -r timestamp nonce signature < "$proof_file"
          status="$(curl --silent --show-error \
            -X POST \
            -H 'Content-Type: application/json; charset=utf-8' \
            -H "X-Enthusia-Read-Timestamp: $timestamp" \
            -H "X-Enthusia-Read-Nonce: $nonce" \
            -H "X-Enthusia-Read-Signature: $signature" \
            --data-binary @"$body_file" \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --max-time 20 \
            "${READ_RELAY_ORIGIN}/v1/moderation/bootstrap")"
          response_code="$(jq -r '.code // "missing_code"' "$response_file" 2>/dev/null || printf 'non_json')"
          [[ "$response_code" =~ ^[a-z0-9_]+$ ]] || response_code='invalid_code_shape'
          echo "::notice::Signed relay probe HTTP ${status} code=${response_code}"
          {
            echo "- signed relay probe HTTP status: \`${status}\`"
            echo "- signed relay probe response code: \`${response_code}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$status" == '403' ]]
          [[ "$response_code" == 'forbidden' ]]
          jq -e '.message == "Access denied."' "$response_file" >/dev/null

          cleanup
          trap - EXIT
          {
            echo '## Moderation read relay staging'
            echo
            echo "- exact source: \`$SOURCE_SHA\`"
            echo '- unsigned relay request: **rejected**'
            echo '- signed synthetic wrong-guild request: **403 forbidden from Bloom read API**'
            echo '- real player or message data queried by probe: **NO**'
            echo '- raw Discord bot token uploaded to Cloudflare: **NO**'
          } >> "$GITHUB_STEP_SUMMARY"
