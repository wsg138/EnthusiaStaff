name: PR186 Codacy diagnostics

on:
  push:
    branches:
      - "diagnostic/pr186-codacy-remaining-20260829"

permissions:
  contents: read

jobs:
  diagnose:
    name: Summarize current public Codacy findings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch and group exact PR findings
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            'https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/repositories/EnthusiaStaff/pull-requests/186/issues?limit=100' \
            -H 'Accept: application/json' \
            -o /tmp/codacy-pr-issues.json
          jq -r '
            [.data[] | select(.deltaType == "Added") | {
              pattern: .commitIssue.patternInfo.id,
              level: .commitIssue.patternInfo.level,
              file: .commitIssue.filePath
            }]
            | sort_by(.pattern, .file)
            | group_by(.pattern)
            | .[]
            | [.[0].pattern, .[0].level, (length|tostring), ([.[].file] | unique | join(","))]
            | @tsv
          ' /tmp/codacy-pr-issues.json
          echo 'TOTAL'
          jq '[.data[] | select(.deltaType == "Added")] | length' /tmp/codacy-pr-issues.json
