name: Apply reviewed local patch

on:
  push:
    branches:
      - feature/punishment-history-lifecycle
    paths:
      - .github/workflows/apply-local-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/punishment-history-lifecycle
          fetch-depth: 0
      - name: Apply prepared patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import pathlib
          import subprocess
          import zlib

          encoded = """"""
          patch = zlib.decompress(base64.b64decode(encoded))
          path = pathlib.Path("/tmp/punishment-history.patch")
          path.write_bytes(patch)
          subprocess.run(["git", "apply", "--whitespace=fix", str(path)], check=True)
          PY
      - name: Commit reviewed changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add domain persistence paper integration-tests
          git commit -m "Harden exact sanction lifecycle concurrency and tests"
          git push origin HEAD:feature/punishment-history-lifecycle
