name: D07 Codacy repair

on:
  push:
    branches:
      - "tmp/es-d07-codacy-inspect-20260914"

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'chore: run validated D07 Codacy repair'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repair controls
        uses: actions/checkout@v6
        with:
          ref: tmp/es-d07-codacy-inspect-20260914
          path: control
          fetch-depth: 1

      - name: Check out exact D07 PR head
        uses: actions/checkout@v6
        with:
          ref: package/es-d07-discord-punishment-enforcement
          path: work
          fetch-depth: 0

      - name: Verify and apply Codacy repairs
        shell: bash
        run: |
          set -euo pipefail
          cd work
          test "$(git rev-parse HEAD)" = 'bbb5545fd67ef2e9f69ef96ee5b69dbd9c5986bf'
          python3 ../control/.github/d07-codacy-repair.py

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Run focused D07 tests and runtime verification
        working-directory: work
        run: ./gradlew --no-daemon --no-configuration-cache :staff-bot:test :staff-bot:verifyStaffBotRuntime

      - name: Require repository PMD on changed Java
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://github.com/pmd/pmd/releases/download/pmd_releases%2F6.55.0/pmd-bin-6.55.0.zip' \
            --output /tmp/pmd.zip
          unzip -q /tmp/pmd.zip -d /tmp
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.java'; git diff --name-only -- '*.java'; git ls-files --others --exclude-standard -- '*.java')
          mapfile -t files < <(printf '%s\n' "${files[@]}" | awk 'NF && !seen[$0]++')
          input="$(IFS=,; echo "${files[*]}")"
          /tmp/pmd-bin-6.55.0/bin/run.sh pmd -d "$input" -R ruleset.xml -f text -r /tmp/pmd.txt
          cat /tmp/pmd.txt

      - name: Require Lizard method and argument limits
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet lizard
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.java'; git diff --name-only -- '*.java'; git ls-files --others --exclude-standard -- '*.java')
          mapfile -t files < <(printf '%s\n' "${files[@]}" | awk 'NF && !seen[$0]++')
          lizard -l java -C 8 -L 50 -a 8 -w "${files[@]}"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('staff-bot/src/test/java/net/enthusia/staff/discordbot/DiscordPunishmentWorkerTest.java')
          nloc = sum(1 for line in p.read_text().splitlines() if line.strip() and not line.lstrip().startswith('//'))
          if nloc >= 500:
              raise SystemExit(f'worker test remains too large: {nloc} nonblank/non-line-comment lines')
          print(f'worker test bounded line count: {nloc}')
          PY

      - name: Commit one coherent product repair
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add staff-bot/src/main/java/net/enthusia/staff/discordbot/DiscordPunishmentService.java \
                  staff-bot/src/main/java/net/enthusia/staff/discordbot/DiscordPunishmentRuntime.java \
                  staff-bot/src/main/java/net/enthusia/staff/discordbot/DiscordPunishmentCommandController.java \
                  staff-bot/src/main/java/net/enthusia/staff/discordbot/JdaStaffModerationListener.java \
                  staff-bot/src/test/java/net/enthusia/staff/discordbot/DiscordPunishmentWorkerTest.java \
                  staff-bot/src/test/java/net/enthusia/staff/discordbot/DiscordPunishmentWorkerTestSupport.java
          git commit -m 'refactor(es-d07): satisfy Codacy complexity boundaries'
          git push origin HEAD:package/es-d07-discord-punishment-enforcement
