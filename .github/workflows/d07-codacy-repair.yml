name: D07 CodeRabbit repair

on:
  push:
    branches:
      - "tmp/es-d07-codacy-inspect-20260914"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tmp/es-d07-codacy-inspect-20260914
          path: control
          fetch-depth: 1
      - uses: actions/checkout@v6
        with:
          ref: package/es-d07-discord-punishment-enforcement
          path: work
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Repair, validate, and push D07
        shell: bash
        run: |
          set -euo pipefail
          cd work
          test "$(git rev-parse HEAD)" = '97f6f235fbaefb4b3956d8aef7fe9e132823b682'
          python3 ../control/.github/d07-coderabbit-repair.py
          ./gradlew --no-daemon --no-configuration-cache clean build :staff-bot:verifyStaffBotRuntime
          curl --fail --location --silent --show-error 'https://github.com/pmd/pmd/releases/download/pmd_releases%2F6.55.0/pmd-bin-6.55.0.zip' --output /tmp/pmd.zip
          unzip -q /tmp/pmd.zip -d /tmp
          { git diff --name-only origin/main...HEAD -- '*.java'; git diff --name-only -- '*.java'; git ls-files --others --exclude-standard -- '*.java'; } | awk 'NF' | sort -u > /tmp/d07-java-files
          input="$(paste -sd, /tmp/d07-java-files)"
          /tmp/pmd-bin-6.55.0/bin/run.sh pmd -d "$input" -R ruleset.xml -f text -r /tmp/pmd.txt
          cat /tmp/pmd.txt
          python3 -m pip install --disable-pip-version-check --quiet lizard
          mapfile -t files < /tmp/d07-java-files
          lizard -l java -C 8 -L 50 -a 8 -w "${files[@]}"
          python3 -c "from pathlib import Path; p=Path('staff-bot/src/test/java/net/enthusia/staff/discordbot/DiscordPunishmentWorkerTest.java'); n=sum(1 for x in p.read_text().splitlines() if x.strip() and not x.lstrip().startswith('//')); print('worker test bounded line count:', n); assert n < 500"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add domain/src/main/java/net/enthusia/staff/domain/discord/DiscordPunishment.java \
                  domain/src/test/java/net/enthusia/staff/domain/discord/DiscordPunishmentTest.java \
                  staff-bot/src/main/java/net/enthusia/staff/discordbot/DiscordPunishmentWorker.java \
                  staff-bot/src/main/java/net/enthusia/staff/discordbot/DiscordDurationParser.java \
                  staff-bot/src/test/java/net/enthusia/staff/discordbot/DiscordDurationParserTest.java \
                  staff-bot/src/main/java/net/enthusia/staff/discordbot/DiscordPunishmentConfiguration.java \
                  staff-bot/src/test/java/net/enthusia/staff/discordbot/DiscordPunishmentConfigurationTest.java \
                  staff-bot/src/main/java/net/enthusia/staff/discordbot/JdaMuteRoleOwnership.java \
                  staff-bot/src/main/java/net/enthusia/staff/discordbot/JdaDiscordPunishmentGateway.java \
                  staff-bot/src/test/java/net/enthusia/staff/discordbot/JdaDiscordPunishmentGatewayTest.java
          git commit -m 'fix(es-d07): resolve final review findings'
          git push origin HEAD:package/es-d07-discord-punishment-enforcement
