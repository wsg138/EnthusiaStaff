name: D07 Codacy repair

on:
  push:
    branches:
      - "tmp/es-d07-codacy-inspect-20260914"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tmp/es-d07-codacy-inspect-20260914
          path: control
          fetch-depth: 1
      - uses: actions/checkout@v6
        with:
          ref: package/es-d07-discord-punishment-enforcement
          path: work
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Repair, validate, and push D07
        shell: bash
        run: |
          set -euo pipefail
          cd work
          test "$(git rev-parse HEAD)" = 'bbb5545fd67ef2e9f69ef96ee5b69dbd9c5986bf'
          python3 ../control/.github/d07-codacy-repair.py
          python3 ../control/.github/d07-codacy-repair-followup.py
          ./gradlew --no-daemon --no-configuration-cache :staff-bot:test :staff-bot:verifyStaffBotRuntime
          curl --fail --location --silent --show-error 'https://github.com/pmd/pmd/releases/download/pmd_releases%2F6.55.0/pmd-bin-6.55.0.zip' --output /tmp/pmd.zip
          unzip -q /tmp/pmd.zip -d /tmp
          { git diff --name-only origin/main...HEAD -- '*.java'; git diff --name-only -- '*.java'; git ls-files --others --exclude-standard -- '*.java'; } | awk 'NF' | sort -u > /tmp/d07-java-files
          input="$(paste -sd, /tmp/d07-java-files)"
          /tmp/pmd-bin-6.55.0/bin/run.sh pmd -d "$input" -R ruleset.xml -f text -r /tmp/pmd.txt
          cat /tmp/pmd.txt
          python3 -m pip install --disable-pip-version-check --quiet lizard
          mapfile -t files < /tmp/d07-java-files
          lizard -l java -C 8 -L 50 -a 8 -w "${files[@]}"
          python3 -c "from pathlib import Path; p=Path('staff-bot/src/test/java/net/enthusia/staff/discordbot/DiscordPunishmentWorkerTest.java'); n=sum(1 for x in p.read_text().splitlines() if x.strip() and not x.lstrip().startswith('//')); print('worker test bounded line count:', n); assert n < 500"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add staff-bot/src/main/java/net/enthusia/staff/discordbot/DiscordPunishmentService.java staff-bot/src/main/java/net/enthusia/staff/discordbot/DiscordPunishmentRuntime.java staff-bot/src/main/java/net/enthusia/staff/discordbot/DiscordPunishmentCommandController.java staff-bot/src/main/java/net/enthusia/staff/discordbot/JdaStaffModerationListener.java staff-bot/src/test/java/net/enthusia/staff/discordbot/DiscordPunishmentWorkerTest.java staff-bot/src/test/java/net/enthusia/staff/discordbot/DiscordPunishmentWorkerFakeGateway.java staff-bot/src/test/java/net/enthusia/staff/discordbot/DiscordPunishmentWorkerFakeRepository.java
          git commit -m 'refactor(es-d07): satisfy Codacy complexity boundaries'
          git push origin HEAD:package/es-d07-discord-punishment-enforcement
