name: StaffBot isolated Discord configuration preflight

on:
  pull_request:
    paths:
      - "tools/staffbot-chat-preflight/**"
      - ".github/workflows/staffbot-chat-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-isolation-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify fail-closed test/production route isolation
        run: python -m unittest discover -s tools/staffbot-chat-preflight -p "test_*.py" -v
