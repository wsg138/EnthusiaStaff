# Temporary read-only diagnostics for PR807; remove after review.
name: Temporary PR807 Codacy annotation evidence
on:
  pull_request:
    paths:
      - ".github/workflows/temporary-codacy-pr807-annotation.yml"
permissions:
  contents: read
  checks: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Print exact existing Codacy issue annotations
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/check-runs/130936988452/annotations?per_page=100" \
            -o /tmp/pr807_annotations.json
          python3 - <<'PY'
          import json
          with open("/tmp/pr807_annotations.json", encoding="utf-8") as f:
              findings = json.load(f)
          print("CODACY_ANNOTATIONS_COUNT=" + str(len(findings)))
          for finding in findings:
              print(json.dumps({
                  "path": finding.get("path"),
                  "line": finding.get("start_line"),
                  "message": finding.get("message"),
                  "level": finding.get("annotation_level"),
              }, ensure_ascii=False))
          PY
