name: Temporary current Error Prone diagnostics

on:
  push:
    branches: [feature/readable-network-verify]
    paths: [.github/workflows/temp-errorprone-current.yml]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/readable-network-verify
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure Error Prone 2.50
        run: |
          cat > /tmp/errorprone.init.gradle <<'EOF'
          initscript {
              repositories {
                  gradlePluginPortal()
                  mavenCentral()
              }
              dependencies {
                  classpath 'net.ltgt.gradle:gradle-errorprone-plugin:4.1.0'
              }
          }
          allprojects {
              afterEvaluate { p ->
                  if (p.plugins.hasPlugin('java-library')) {
                      p.apply plugin: net.ltgt.gradle.errorprone.ErrorPronePlugin
                      p.dependencies.add('errorprone', 'com.google.errorprone:error_prone_core:2.50.0')
                      p.tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach { task ->
                          task.options.compilerArgs.removeAll { it == '-Werror' }
                          task.options.compilerArgs.add('-XDaddTypeAnnotationsToSymbol=true')
                          task.options.errorprone.allErrorsAsWarnings.set(true)
                      }
                  }
              }
          }
          EOF
      - name: Analyze changed production and test Java
        run: ./gradlew -I /tmp/errorprone.init.gradle :protocol:compileJava :paper:compileJava :velocity:compileJava :velocity:compileTestJava --no-daemon --console=plain
