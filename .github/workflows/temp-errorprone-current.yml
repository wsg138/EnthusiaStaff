name: Temporary Error Prone cleanup

on:
  push:
    branches: [feature/readable-network-verify]
    paths:
      - .github/workflows/temp-errorprone-current.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/readable-network-verify
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply individual analyzer fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('velocity/src/test/java/net/enthusia/staff/velocity/VelocitySecurityEventSubmissionTest.java'): [
                  (
                      'import java.net.InetSocketAddress;',
                      'import java.net.InetAddress;\nimport java.net.InetSocketAddress;'
                  ),
                  (
                      'new InetSocketAddress("127.0.0.1", 25565)',
                      'new InetSocketAddress(InetAddress.getLoopbackAddress(), 25565)'
                  ),
              ],
              Path('velocity/src/test/java/net/enthusia/staff/velocity/VelocityConfigurationReloadCoordinatorTest.java'): [
                  (
                      'if (value == candidate && rejectCandidate.getAndSet(false)) {',
                      'if (candidate.equals(value) && rejectCandidate.getAndSet(false)) {'
                  ),
              ],
              Path('velocity/src/test/java/net/enthusia/staff/velocity/VelocityAdministrationCommandTest.java'): [
                  (
                      '    private record TestInvocation(CommandSource source, String alias, String[] arguments)',
                      '    @SuppressWarnings("ArrayRecordComponent") // Velocity Invocation requires String[] arguments.\n'
                      '    private record TestInvocation(CommandSource source, String alias, String[] arguments)'
                  ),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text()
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected one match for {old!r}, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - name: Configure Error Prone 2.50
        run: |
          cat > /tmp/errorprone.init.gradle <<'EOF'
          initscript {
              repositories {
                  gradlePluginPortal()
                  mavenCentral()
              }
              dependencies {
                  classpath 'net.ltgt.gradle:gradle-errorprone-plugin:4.1.0'
              }
          }
          allprojects {
              afterEvaluate { p ->
                  if (p.plugins.hasPlugin('java-library')) {
                      p.apply plugin: net.ltgt.gradle.errorprone.ErrorPronePlugin
                      p.dependencies.add('errorprone', 'com.google.errorprone:error_prone_core:2.50.0')
                      p.tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach { task ->
                          task.options.compilerArgs.removeAll { it == '-Werror' }
                          task.options.compilerArgs.add('-XDaddTypeAnnotationsToSymbol=true')
                          task.options.errorprone.allErrorsAsWarnings.set(true)
                      }
                  }
              }
          }
          EOF
      - name: Verify Velocity analyzer cleanup
        run: ./gradlew -I /tmp/errorprone.init.gradle :velocity:compileJava :velocity:compileTestJava --no-daemon --console=plain
      - name: Commit cleanup and remove temporary workflow
        run: |
          rm .github/workflows/temp-errorprone-current.yml
          git config user.name "P2wn"
          git config user.email "racecarboy77@gmail.com"
          git add velocity/src/test/java/net/enthusia/staff/velocity/VelocitySecurityEventSubmissionTest.java \
                  velocity/src/test/java/net/enthusia/staff/velocity/VelocityConfigurationReloadCoordinatorTest.java \
                  velocity/src/test/java/net/enthusia/staff/velocity/VelocityAdministrationCommandTest.java \
                  .github/workflows/temp-errorprone-current.yml
          git commit -m "Resolve re-attributed Velocity analyzer findings"
          git push origin HEAD:feature/readable-network-verify
