name: Prepare PR27 main integration

on:
  push:
    branches:
      - section/punishment-request-notifications-recovery

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR branch head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Create isolated Git merge result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main:refs/remotes/origin/main
          SOURCE_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          git checkout -B automation/pr27-main-integration "$SOURCE_SHA"

          set +e
          git merge --no-commit --no-ff refs/remotes/origin/main
          MERGE_STATUS=$?
          set -e

          mkdir -p .merge-analysis
          {
            printf 'source=%s\n' "$SOURCE_SHA"
            printf 'main=%s\n' "$MAIN_SHA"
            printf 'merge_status=%s\n' "$MERGE_STATUS"
          } > .merge-analysis/shas.txt
          git status --short > .merge-analysis/status.txt
          git diff --name-only --diff-filter=U > .merge-analysis/conflicts.txt
          git ls-files -u > .merge-analysis/unmerged-stages.txt

          while IFS= read -r path; do
            test -n "$path" || continue
            git checkout --conflict=merge -- "$path" 2>/dev/null \
              || git checkout --ours -- "$path" 2>/dev/null \
              || git checkout --theirs -- "$path" 2>/dev/null \
              || true
            if test -e "$path" || test -L "$path"; then
              git add -- "$path"
            else
              git rm --ignore-unmatch -- "$path"
            fi
          done < .merge-analysis/conflicts.txt

          git rm --ignore-unmatch .github/workflows/export-pr27-source.yml
          git add -A
          git commit --no-verify -m "Prepare current main integration for PR27 conflict resolution"
          git push --force origin HEAD:refs/heads/automation/pr27-main-integration
