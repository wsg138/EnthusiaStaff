name: Branch source export

on:
  push:
    branches:
      - section/punishment-request-notifications-recovery

permissions:
  contents: read
  issues: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch head
        uses: actions/checkout@v6

      - name: Upload exact source snapshot
        id: source
        uses: actions/upload-artifact@v7
        with:
          name: branch-source-${{ github.sha }}
          path: |
            .github
            build.gradle.kts
            settings.gradle.kts
            gradle.properties
            gradle
            gradlew
            gradlew.bat
            common
            domain
            integration-contracts
            integration-tests
            paper
            persistence
            protocol
            velocity
          if-no-files-found: error
          retention-days: 1

      - name: Report temporary artifact coordinates
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.source.outputs.artifact-id }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/27/comments" \
            -f body="TEMPORARY SOURCE EXPORT — run ${GITHUB_RUN_ID}; artifact ${ARTIFACT_ID}; commit ${GITHUB_SHA}. This comment will be removed after connector-backed integration."
