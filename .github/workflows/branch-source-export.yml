name: Branch source export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Upload exact source snapshot
        uses: actions/upload-artifact@v7
        with:
          name: branch-source-${{ github.event.pull_request.head.sha }}
          path: |
            .github
            build.gradle.kts
            settings.gradle.kts
            gradle.properties
            gradle
            gradlew
            gradlew.bat
            common
            domain
            integration-contracts
            integration-tests
            paper
            persistence
            protocol
            velocity
          if-no-files-found: error
          retention-days: 1
