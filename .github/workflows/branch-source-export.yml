name: Apply reviewed punishment history patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/punishment-history-lifecycle
          fetch-depth: 0
      - name: Apply reviewed changes
        shell: bash
        run: |
          cat .github/review-patch/part-* > /tmp/review-fixes.b64
          base64 -d /tmp/review-fixes.b64 | gzip -d > /tmp/review-fixes.patch
          patch -p1 < /tmp/review-fixes.patch
          cat > .github/workflows/branch-source-export.yml <<'YAML'
          name: Branch source export

          on:
            pull_request:
              branches:
                - main

          permissions:
            contents: read

          jobs:
            export:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Upload source tree
                  uses: actions/upload-artifact@v4
                  with:
                    name: branch-source
                    path: |
                      .
                      !.git
                      !**/build
                    include-hidden-files: true
                    retention-days: 1
          YAML
          git rm -r .github/review-patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add persistence paper integration-tests docs reports .github
          git commit -m "Address punishment history review findings"
          git push origin HEAD:feature/punishment-history-lifecycle
