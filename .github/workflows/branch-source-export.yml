name: Apply connector integration patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply exact-source integration
        shell: bash
        run: |
          test -f .github/estaff-integration.patch.gz.b64
          base64 --decode .github/estaff-integration.patch.gz.b64 | gzip --decompress > /tmp/estaff-integration.patch
          git apply --check /tmp/estaff-integration.patch
          git apply /tmp/estaff-integration.patch
          rm .github/estaff-integration.patch.gz.b64
          rm .github/workflows/branch-source-export.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement safe EnthusiaStaff configuration reload"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
