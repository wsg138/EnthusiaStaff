name: Branch source export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: branch-source
          path: |
            .
            !.git
            !**/build
          include-hidden-files: true
          retention-days: 1
