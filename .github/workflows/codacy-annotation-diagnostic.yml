name: Codacy annotation diagnostic
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  checks: read
jobs:
  annotations:
    if: github.head_ref == 'diagnostic/codacy-297-annotations'
    runs-on: ubuntu-latest
    steps:
      - name: Read Codacy annotations from validation head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/wsg138/EnthusiaStaff/check-runs/110850471856/annotations?per_page=100"             | jq -r '.[] | [.path, (.start_line|tostring), (.end_line|tostring), .annotation_level, .title, .message] | @tsv'
