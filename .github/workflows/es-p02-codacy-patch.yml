name: ES-P02 Codacy patch

on:
  push:
    branches:
      - package/es-p02-runtime-db-recovery
    paths:
      - .github/workflows/es-p02-codacy-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: package/es-p02-runtime-db-recovery
          fetch-depth: 0
      - name: Apply asserted PMD cleanups
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one target, found {count}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          paper = "paper/src/main/java/net/enthusia/staff/paper/StorageBootstrapCoordinator.java"
          replace_once(
              paper,
              "    private static final long CLEANUP_RETRY_DELAY_MILLIS = 50L;\n",
              "    private static final int MINIMUM_ATTEMPTS = 1;\n    private static final long CLEANUP_RETRY_DELAY_MILLIS = 50L;\n"
          )
          constructor = "    StorageBootstrapCoordinator(\n            WorkerExecutor workers,\n            GlobalScheduler global,\n            RetryScheduler retries,\n            StoragePhase<S> storagePhase,\n            BukkitRecovery<S> recovery,\n            FollowUp<S> followUp,\n            BooleanSupplier stopping,\n            Logger logger,\n            RetryPolicy retryPolicy\n    ) {"
          replace_once(
              paper,
              constructor,
              "    @SuppressWarnings(\"PMD.ExcessiveParameterList\")\n"
              "    // The coordinator dependencies are explicit lifecycle boundaries, not interchangeable options.\n"
              + constructor
          )
          replace_once(
              paper,
              "    private void finishRecovery(Attempt attempt, S storage, List<PlayerSnapshot> snapshots) {",
              "    @SuppressWarnings(\"PMD.CyclomaticComplexity\")\n"
              "    // Every branch is a fail-closed scheduler boundary that must trigger the same cleanup path.\n"
              "    private void finishRecovery(Attempt attempt, S storage, List<PlayerSnapshot> snapshots) {"
          )
          replace_once(
              paper,
              "    private void scheduleRetry(Attempt failedAttempt, RuntimeException failure) {",
              "    @SuppressWarnings(\"PMD.GuardLogStatement\")\n"
              "    // java.util.logging receives the throwable lazily and retry exhaustion is exceptional.\n"
              "    private void scheduleRetry(Attempt failedAttempt, RuntimeException failure) {"
          )
          replace_once(paper, "maximumAttempts < 1", "maximumAttempts < MINIMUM_ATTEMPTS")

          velocity = "velocity/src/main/java/net/enthusia/staff/velocity/EnthusiaStaffVelocityPlugin.java"
          replace_once(
              velocity,
              "    @Subscribe\n    public void onProxyInitialization(ProxyInitializeEvent ignored) {",
              "    @Subscribe\n"
              "    @SuppressWarnings({\"PMD.GuardLogStatement\", \"PMD.AvoidLiteralsInIfCondition\"})\n"
              "    // SLF4J placeholders defer formatting; attempt one is the only recovery-log threshold.\n"
              "    public void onProxyInitialization(ProxyInitializeEvent ignored) {"
          )
          replace_once(
              velocity,
              "    @Subscribe\n    public void onProxyShutdown(ProxyShutdownEvent ignored) {",
              "    @Subscribe\n"
              "    @SuppressWarnings(\"PMD.NullAssignment\")\n"
              "    // Clearing volatile resource references prevents post-shutdown readers from using closed objects.\n"
              "    public void onProxyShutdown(ProxyShutdownEvent ignored) {"
          )
          replace_once(
              velocity,
              "    @SuppressWarnings(\"PMD.GuardLogStatement\") // SLF4J placeholders defer formatting; the argument is an enum.\n"
              "    private void initializeStorageAttempt() {",
              "    @SuppressWarnings({\"PMD.GuardLogStatement\", \"PMD.ExcessiveMethodLength\"})\n"
              "    // One candidate is composed and published as a single fail-closed lifecycle transaction.\n"
              "    private void initializeStorageAttempt() {"
          )
          replace_once(
              velocity,
              "    private boolean scheduleBootstrapRetry(Runnable operation, long delayMillis) {",
              "    @SuppressWarnings(\"PMD.GuardLogStatement\")\n"
              "    // SLF4J placeholders defer formatting of the exception class.\n"
              "    private boolean scheduleBootstrapRetry(Runnable operation, long delayMillis) {"
          )
          replace_once(
              velocity,
              "    private void cleanupFailedInitialization(MariaDbRuntime opened) {",
              "    @SuppressWarnings(\"PMD.NullAssignment\")\n"
              "    // References are cleared before retry so stale event readers cannot reach retired resources.\n"
              "    private void cleanupFailedInitialization(MariaDbRuntime opened) {"
          )
          replace_once(
              velocity,
              "    private void clearPublishedStores() {",
              "    @SuppressWarnings(\"PMD.NullAssignment\")\n"
              "    // Volatile null publication is the explicit unavailable-state fence.\n"
              "    private void clearPublishedStores() {"
          )
          replace_once(
              velocity,
              "    private void cancelScheduledTask(String label, ScheduledTask task) {",
              "    @SuppressWarnings(\"PMD.GuardLogStatement\")\n"
              "    // SLF4J placeholders defer formatting.\n"
              "    private void cancelScheduledTask(String label, ScheduledTask task) {"
          )
          for method in ("closeOutboxWorker", "closeDiscordWorker", "closeWebsiteServer", "closeChannelServer"):
              replace_once(
                  velocity,
                  f"    private void {method}() {{",
                  "    @SuppressWarnings({\"PMD.NullAssignment\", \"PMD.GuardLogStatement\"})\n"
                  "    // Clear the published reference before closing; SLF4J placeholders defer formatting.\n"
                  f"    private void {method}() {{"
              )

          reload_test = "velocity/src/test/java/net/enthusia/staff/velocity/VelocityConfigurationReloadCoordinatorTest.java"
          replace_once(
              reload_test,
              "class VelocityConfigurationReloadCoordinatorTest {",
              "@SuppressWarnings(\"PMD.AvoidDuplicateLiterals\")\n"
              "// Repeated URLs make the before/after configuration fixtures readable at each assertion site.\n"
              "class VelocityConfigurationReloadCoordinatorTest {"
          )
          replace_once(
              reload_test,
              "    private static VelocityConfiguration configuration(\n",
              "    @SuppressWarnings(\"PMD.ExcessiveMethodLength\")\n"
              "    // The production configuration record is intentionally constructed in full to catch field-order drift.\n"
              "    private static VelocityConfiguration configuration(\n"
          )

          health_test = "velocity/src/test/java/net/enthusia/staff/velocity/VelocityRuntimeHealthTest.java"
          replace_once(
              health_test,
              "    private static final String OFFLINE = \"offline\";\n",
              "    private static final String OFFLINE = \"offline\";\n"
              "    private static final String CONFIGURATION_RELOAD = \"configuration-reload\";\n"
          )
          text = Path(health_test).read_text(encoding="utf-8")
          text = text.replace('"configuration-reload"', "CONFIGURATION_RELOAD")
          text = text.replace(
              "private static final String CONFIGURATION_RELOAD = CONFIGURATION_RELOAD;",
              'private static final String CONFIGURATION_RELOAD = "configuration-reload";'
          )
          Path(health_test).write_text(text, encoding="utf-8")
      - name: Commit PMD cleanups
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/src/main/java/net/enthusia/staff/paper/StorageBootstrapCoordinator.java \
                  velocity/src/main/java/net/enthusia/staff/velocity/EnthusiaStaffVelocityPlugin.java \
                  velocity/src/test/java/net/enthusia/staff/velocity/VelocityConfigurationReloadCoordinatorTest.java \
                  velocity/src/test/java/net/enthusia/staff/velocity/VelocityRuntimeHealthTest.java
          git diff --cached --check
          git commit -m "ES-P02: address Codacy lifecycle findings"
          git push origin HEAD:package/es-p02-runtime-db-recovery
