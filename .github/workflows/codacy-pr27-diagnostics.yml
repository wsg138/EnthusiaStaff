name: Temporary PR 27 Codacy Diagnostics

on:
  push:
    branches:
      - section/punishment-request-notifications-recovery
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    name: Export exact PR 27 Codacy findings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

    steps:
      - name: Check out exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Export and sanitize PR findings
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CODACY_PROJECT_TOKEN}" ]]; then
            echo "::error::CODACY_PROJECT_TOKEN is not configured."
            exit 1
          fi
          mkdir -p build/reports/codacy-pr27

          python3 - <<'PY'
          import collections
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          root = Path("build/reports/codacy-pr27")
          token = os.environ["CODACY_PROJECT_TOKEN"]
          base_url = (
              "https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/"
              "repositories/EnthusiaStaff/pull-requests/27/issues"
          )

          def request_page(cursor=None):
              query = {"status": "new", "onlyPotential": "false", "limit": "100"}
              if cursor:
                  query["cursor"] = cursor
              url = base_url + "?" + urllib.parse.urlencode(query)
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "project-token": token,
                  },
              )
              for attempt in range(1, 7):
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          return json.loads(response.read().decode("utf-8"))
                  except urllib.error.HTTPError as error:
                      body = error.read().decode("utf-8", errors="replace")
                      if error.code not in {429, 500, 502, 503, 504} or attempt == 6:
                          raise RuntimeError(
                              f"Codacy PR issues request failed: HTTP {error.code}: {body[:300]}"
                          ) from error
                  except urllib.error.URLError as error:
                      if attempt == 6:
                          raise RuntimeError(f"Codacy PR issues request failed: {error}") from error
                  time.sleep(attempt * 2)
              raise AssertionError("unreachable")

          records = []
          analyzed_values = []
          cursor = None
          page_count = 0
          reported_total = None
          while True:
              payload = request_page(cursor)
              page_count += 1
              analyzed_values.append(payload.get("analyzed"))
              data = payload.get("data")
              if not isinstance(data, list):
                  raise RuntimeError(f"Unexpected Codacy data shape: {type(data).__name__}")
              records.extend(item for item in data if isinstance(item, dict))
              pagination = payload.get("pagination") if isinstance(payload.get("pagination"), dict) else {}
              if reported_total is None:
                  reported_total = pagination.get("total")
              cursor = pagination.get("cursor")
              if not cursor:
                  break
              if page_count >= 20:
                  raise RuntimeError("Codacy PR issues pagination exceeded 20 pages")

          def first(mapping, *keys):
              for key in keys:
                  value = mapping.get(key)
                  if value is not None:
                      return value
              return None

          sanitized = []
          for wrapper in records:
              commit_issue = wrapper.get("commitIssue") if isinstance(wrapper.get("commitIssue"), dict) else wrapper
              nested = commit_issue.get("commitIssue") if isinstance(commit_issue.get("commitIssue"), dict) else commit_issue
              pattern = nested.get("patternInfo") if isinstance(nested.get("patternInfo"), dict) else {}
              tool = nested.get("toolInfo") if isinstance(nested.get("toolInfo"), dict) else {}
              location = nested.get("location") if isinstance(nested.get("location"), dict) else {}
              delta_type = wrapper.get("deltaType")

              issue = {
                  "issueId": first(commit_issue, "issueId", "id", "uuid", "fingerprint") or first(nested, "issueId", "id", "uuid", "fingerprint"),
                  "deltaType": delta_type,
                  "tool": first(tool, "name", "id", "uuid") or first(nested, "tool", "toolName", "toolId"),
                  "toolUuid": first(tool, "uuid", "id"),
                  "patternId": first(pattern, "id", "patternId", "name") or first(nested, "patternId", "ruleId"),
                  "patternName": first(pattern, "title", "name") or first(nested, "patternName", "ruleName"),
                  "level": first(pattern, "level", "severityLevel") or first(nested, "level", "severity"),
                  "severityLevel": first(pattern, "severityLevel", "level") or first(nested, "severityLevel", "severity"),
                  "category": first(pattern, "category", "subCategory") or first(nested, "category"),
                  "subCategory": first(pattern, "subCategory"),
                  "filePath": first(nested, "filePath", "path", "filename") or first(location, "filePath", "path", "filename"),
                  "startLine": first(nested, "lineNumber", "startLine", "line") or first(location, "startLine", "line"),
                  "endLine": first(nested, "endLine") or first(location, "endLine"),
                  "message": first(nested, "message", "description", "title"),
                  "language": first(nested, "language"),
                  "url": first(nested, "url", "issueUrl", "htmlUrl"),
                  "rawWrapperKeys": sorted(wrapper.keys()),
                  "rawCommitIssueKeys": sorted(commit_issue.keys()),
                  "rawNestedKeys": sorted(nested.keys()),
                  "rawPatternKeys": sorted(pattern.keys()),
                  "rawToolKeys": sorted(tool.keys()),
              }
              sanitized.append(issue)

          def severity_key(issue):
              return str(issue.get("severityLevel") or issue.get("level") or "").strip().lower()

          high = [issue for issue in sanitized if severity_key(issue) in {"critical", "high", "error"}]
          patterns = collections.Counter(
              (
                  str(issue.get("tool") or "unknown-tool"),
                  str(issue.get("patternId") or "unknown-pattern"),
                  str(issue.get("patternName") or "unknown-name"),
                  str(issue.get("severityLevel") or issue.get("level") or "unknown-severity"),
              )
              for issue in sanitized
          )
          areas = collections.Counter(
              (
                  str(issue.get("filePath") or "unknown").split("/", 1)[0],
                  "test" if "/src/test/" in str(issue.get("filePath") or "") or str(issue.get("filePath") or "").startswith("integration-tests/") else "production",
                  str(issue.get("severityLevel") or issue.get("level") or "unknown-severity"),
              )
              for issue in sanitized
          )
          severities = collections.Counter(
              str(issue.get("severityLevel") or issue.get("level") or "unknown")
              for issue in sanitized
          )

          output = {
              "checkedOutHead": os.popen("git rev-parse HEAD").read().strip(),
              "analyzedValues": analyzed_values,
              "pages": page_count,
              "reportedTotal": reported_total,
              "issueCount": len(sanitized),
              "severities": dict(sorted(severities.items())),
              "highCount": len(high),
              "highIssues": high,
              "patternGroups": [
                  {
                      "tool": tool,
                      "patternId": pattern_id,
                      "patternName": pattern_name,
                      "severity": severity,
                      "count": count,
                  }
                  for (tool, pattern_id, pattern_name, severity), count in sorted(patterns.items())
              ],
              "sourceAreaGroups": [
                  {"area": area, "codeKind": kind, "severity": severity, "count": count}
                  for (area, kind, severity), count in sorted(areas.items())
              ],
              "issues": sanitized,
          }
          (root / "sanitized-pr-findings.json").write_text(
              json.dumps(output, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print("=== CODACY PR 27 PR-SPECIFIC SUMMARY ===")
          print(f"checked_out_head={output['checkedOutHead']}")
          print(f"analyzed_values={json.dumps(analyzed_values)}")
          print(f"pages={page_count}")
          print(f"reported_total={reported_total}")
          print(f"issue_count={len(sanitized)}")
          print("severities=" + json.dumps(dict(sorted(severities.items())), sort_keys=True))
          print(f"high_count={len(high)}")

          print("\n=== HIGH ISSUES ===")
          print(json.dumps(high, indent=2, sort_keys=True))

          print("\n=== PATTERN GROUPS ===")
          for group in output["patternGroups"]:
              print(json.dumps(group, sort_keys=True))

          print("\n=== SOURCE AREA GROUPS ===")
          for group in output["sourceAreaGroups"]:
              print(json.dumps(group, sort_keys=True))
          PY

      - name: Upload sanitized diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: codacy-pr27-pr-specific-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/reports/codacy-pr27/sanitized-pr-findings.json
          if-no-files-found: error
          retention-days: 3
