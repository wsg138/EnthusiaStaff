name: ES-X02 Lifecycle-Clean Currency Reimport

on:
  push:
    branches:
      - package/es-x02-currency-provider

permissions:
  contents: write

jobs:
  reimport:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out aggregate package branch
        uses: actions/checkout@v4
        with:
          ref: package/es-x02-currency-provider
          fetch-depth: 0

      - name: Check out exact merged EnthusiaCurrency source
        uses: actions/checkout@v4
        with:
          repository: wsg138/EnthusiaCurrency
          ref: b922c5af30860a6c205f9ee16b817349a7677cd0
          path: .es-x02-currency-source
          persist-credentials: false

      - name: Replace aggregate mirror exactly
        shell: bash
        run: |
          set -Eeuo pipefail
          actual="$(git -C .es-x02-currency-source rev-parse HEAD)"
          test "$actual" = 'b922c5af30860a6c205f9ee16b817349a7677cd0'
          find components/enthusia-currency -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          rsync -a --delete --exclude='.git/' .es-x02-currency-source/ components/enthusia-currency/
          rm -rf .es-x02-currency-source
          printf '%s\n' \
            '# Component metadata — enthusia-currency' \
            '' \
            '| Field | Value |' \
            '| --- | --- |' \
            '| Component ID | `COMP-CURRENCY` |' \
            '| Standalone repository | `wsg138/EnthusiaCurrency` |' \
            '| Standalone default branch | `main` |' \
            '| Aggregate path | `components/enthusia-currency/` |' \
            '| Verified standalone head at setup | `9696501a01cc11f6e5220c5297a6f34b64204e61` |' \
            '| Last synchronized external SHA | `b922c5af30860a6c205f9ee16b817349a7677cd0` |' \
            '| Last synchronized aggregate-main SHA | `UNSET` |' \
            '| Synchronization state | `SYNC_PENDING` |' \
            '| Content-hash method | `tools/component-sync/component_sync.py`; SHA-256 over sorted POSIX paths and raw bytes; `COMPONENT-METADATA.md` excluded as aggregate-only orchestration metadata |' \
            '| Current blockers | Exact-head aggregate hosted/static/review/Pi validation, normal Staff merge, and post-merge parity remain pending. |' \
            '' \
            'Exact merged standalone content is imported on `package/es-x02-currency-provider`. The aggregate-main SHA is recorded only after the normal EnthusiaStaff merge and successful post-merge parity proof.' \
            > components/enthusia-currency/COMPONENT-METADATA.md
          rm .github/workflows/es-x02-final-lifecycle-reimport.yml
          git diff --check

      - name: Commit exact reimport
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(es-x02): import Vault lifecycle correction'
          git push origin HEAD:package/es-x02-currency-provider
