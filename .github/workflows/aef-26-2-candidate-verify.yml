name: AEF Paper 26.2 Candidate Verification

on:
  push:
    branches:
      - ci/aef-26-2-verify

permissions:
  contents: read

jobs:
  verify-aef:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact AEF candidate commit (public, no credentials retained)
        uses: actions/checkout@v4
        with:
          repository: wsg138/AnarchyExploitFixes
          ref: 74b897e8c98a679e826779bcc5cb1a0c03007602
          path: aef
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile both plugin variants and run shared tests
        working-directory: aef
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean build

      - name: Download pinned Paper 26.2 test server and required dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aef-smoke/plugins
          curl --fail --location --silent --show-error 'https://fill-data.papermc.io/v1/objects/b1d8f6bfa1b6101fa8e947b53041cb3bdf5540e7b83b6547ca19ba7edefeb083/paper-26.2-129.jar' -o aef-smoke/paper.jar
          curl --fail --location --silent --show-error 'https://github.com/retrooper/packetevents/releases/download/v2.13.0/packetevents-spigot-2.13.0.jar' -o aef-smoke/plugins/packetevents-spigot.jar
          curl --fail --location --silent --show-error 'https://github.com/tr7zw/Item-NBT-API/releases/download/2.16.0/item-nbt-api-plugin-2.16.0.jar' -o aef-smoke/plugins/item-nbt-api-plugin.jar
          echo 'b1d8f6bfa1b6101fa8e947b53041cb3bdf5540e7b83b6547ca19ba7edefeb083  aef-smoke/paper.jar' | sha256sum -c -
          echo '6d9ece0d87ee727a79a20b7ffbd432021609c6f52bafcb654fc2d3e9b6f064c5  aef-smoke/plugins/packetevents-spigot.jar' | sha256sum -c -
          echo 'efcab32a211efe60b28a880d0fa18c0b2315b09e4002c1aef89ab4c9b78edba2  aef-smoke/plugins/item-nbt-api-plugin.jar' | sha256sum -c -
          cp aef/AnarchyExploitFixesFolia/build/libs/AnarchyExploitFixes-Folia-*.jar aef-smoke/plugins/aef.jar
          echo eula=true > aef-smoke/eula.txt
          printf '%s\n' 'online-mode=false' 'server-port=25569' 'enable-rcon=false' 'enable-query=false' 'spawn-protection=0' 'max-players=1' 'view-distance=3' 'simulation-distance=3' > aef-smoke/server.properties

      - name: Smoke test AEF boot on ephemeral Paper 26.2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, threading, queue, time, sys
          root = Path("aef-smoke")
          log = root / "startup.log"
          process = subprocess.Popen(["java","-Xms512M","-Xmx2048M","-jar","paper.jar","nogui"],
                                     cwd=root, stdin=subprocess.PIPE, stdout=subprocess.PIPE,
                                     stderr=subprocess.STDOUT, text=True, bufsize=1)
          lines = queue.Queue()
          def read_output():
              for line in process.stdout:
                  lines.put(line)
          reader = threading.Thread(target=read_output,daemon=True)
          reader.start()
          messages = []
          ready = False
          deadline = time.monotonic() + 180
          try:
              while time.monotonic() < deadline:
                  try:
                      line = lines.get(timeout=1)
                  except queue.Empty:
                      if process.poll() is not None:
                          break
                      continue
                  messages.append(line)
                  if "Done (" in line or "Done!" in line:
                      ready = True
                      break
          finally:
              if ready and process.poll() is None:
                  # Exercise console dispatch and asynchronous module reload on
                  # an isolated server, never the live network.
                  process.stdin.write("aef version\n")
                  process.stdin.write("aef reload\n")
                  process.stdin.flush()
                  time.sleep(8)
              if process.poll() is None:
                  try:
                      process.stdin.write("stop\n")
                      process.stdin.flush()
                      process.wait(timeout=25)
                  except Exception:
                      process.kill()
                      process.wait(timeout=10)
              reader.join(timeout=3)
              while not lines.empty():
                  messages.append(lines.get_nowait())
              log.write_text("".join(messages))
          full = "".join(messages)
          enabled = "Enabling AnarchyExploitFixes" in full
          disabled = "Disabling AnarchyExploitFixes" in full[:full.find("Done (")] if "Done (" in full else False
          bad = any(s in full for s in ("Error occurred while enabling AnarchyExploitFixes",
                                       "Could not load 'plugins/aef.jar'",
                                       "Could not load plugin 'aef.jar'"))
          console_version = "2.7.13-enthusia-26.2-SNAPSHOT by" in full
          reload_started = "Reloading AnarchyExploitFixes" in full
          reload_completed = "Reload complete." in full
          module_error = any("Failed while loading config" in line
                             or ("[AEF]" in line and ("ERROR" in line or " SEVERE" in line))
                             for line in messages)
          print(f"Paper 26.2 ready={ready}; AEF enabled={enabled}; version={console_version}; reload_started={reload_started}; reload_completed={reload_completed}; module_error={module_error}; bad={bad}")
          print("Startup log saved:", log)
          if not ready or not enabled or disabled or bad or module_error or not console_version or not reload_started or not reload_completed:
              print("Candidate is NOT ready for deployment; inspect smoke artifact.",file=sys.stderr)
              sys.exit(1)
          PY

      - name: Upload isolated Paper startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aef-paper-26-2-smoke
          path: aef-smoke/startup.log
          if-no-files-found: warn

      - name: Upload candidate JARs and JUnit results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aef-26-2-candidate-74b897e8c9
          path: |
            aef/AnarchyExploitFixesFolia/build/libs/*.jar
            aef/AnarchyExploitFixesLegacy/build/libs/*.jar
            aef/shared/build/test-results/test/*.xml
          if-no-files-found: error
