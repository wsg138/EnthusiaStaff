name: ES-X05 exact site import

# Temporary branch-only import workflow; removed before final validation and merge.
on:
  push:
    branches: [package/es-x05-state-publication]
    paths: [.github/workflows/es-x05-import-site.yml]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out aggregate branch
        uses: actions/checkout@v4
        with:
          ref: package/es-x05-state-publication
      - name: Check out immutable standalone merge
        uses: actions/checkout@v4
        with:
          repository: wsg138/enthusia-site
          ref: b385f78c522f452cc48d78ed19fd2ee82573f64d
          path: .component-source/enthusia-site
          persist-credentials: false
      - name: Import exact tree and prove parity
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil

          source = Path('.component-source/enthusia-site')
          destination = Path('components/enthusia-site')
          if not (source / 'package.json').is_file():
              raise SystemExit('Standalone source checkout is incomplete')
          shutil.rmtree(destination, ignore_errors=True)
          shutil.copytree(source, destination, ignore=shutil.ignore_patterns('.git'))
          PY
          mkdir -p ai-agents/reports/package-handoffs
          python tools/component-sync/component_sync.py compare \
            components/enthusia-site \
            .component-source/enthusia-site \
            --aggregate-sha IMPORT_BRANCH_PENDING \
            --standalone-sha b385f78c522f452cc48d78ed19fd2ee82573f64d \
            > ai-agents/reports/package-handoffs/2026-08-06-es-x05-component-parity.json
          test "$(python -c 'import json; print(str(json.load(open("ai-agents/reports/package-handoffs/2026-08-06-es-x05-component-parity.json"))["parity"]).lower())')" = true
          HASH="$(python -c 'import json; print(json.load(open("ai-agents/reports/package-handoffs/2026-08-06-es-x05-component-parity.json"))["aggregate_hash"])')"
          cat > components/enthusia-site/COMPONENT-METADATA.md <<EOF
          # Component metadata — enthusia-site

          | Field | Value |
          | --- | --- |
          | Component ID | `COMP-SITE` |
          | Standalone repository | `wsg138/enthusia-site` |
          | Standalone default branch | `main` |
          | Aggregate path | `components/enthusia-site/` |
          | Last synchronized external SHA | `b385f78c522f452cc48d78ed19fd2ee82573f64d` |
          | Standalone continuation merge | `b385f78c522f452cc48d78ed19fd2ee82573f64d` via `wsg138/enthusia-site#2` |
          | Last synchronized aggregate-main SHA | `PENDING_PR_73_MERGE` |
          | Synchronization state | `PARITY_VERIFIED_ON_PR_BRANCH` |
          | Active package | `ES-X05` |
          | Content hash | `${HASH}` |
          | Content-hash method | `tools/component-sync/component_sync.py`; SHA-256 over sorted POSIX paths and raw bytes; `COMPONENT-METADATA.md` excluded as aggregate-only orchestration metadata |
          | Parity evidence | `ai-agents/reports/package-handoffs/2026-08-06-es-x05-component-parity.json` |

          No permanent component branch or isolated-component PR exists or is required.
          EOF
          python tools/component-sync/component_sync.py compare \
            components/enthusia-site \
            .component-source/enthusia-site \
            --aggregate-sha IMPORT_BRANCH_PENDING \
            --standalone-sha b385f78c522f452cc48d78ed19fd2ee82573f64d \
            > /tmp/final-parity.json
          cmp ai-agents/reports/package-handoffs/2026-08-06-es-x05-component-parity.json /tmp/final-parity.json
      - name: Commit exact import
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/enthusia-site ai-agents/reports/package-handoffs/2026-08-06-es-x05-component-parity.json
          git commit -m "Import exact merged Enthusia site component"
          git push origin HEAD:package/es-x05-state-publication
