name: Apply punishment history review fixes

on:
  push:
    branches:
      - feature/punishment-history-lifecycle
    paths:
      - .github/workflows/apply-punishment-history-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/punishment-history-lifecycle
          fetch-depth: 0
      - name: Apply reviewed changes
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/review-fixes.patch
          patch -p1 < /tmp/review-fixes.patch
          git rm .github/workflows/apply-punishment-history-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add persistence paper integration-tests docs reports
          git commit -m "Address punishment history review findings"
          git push origin HEAD:feature/punishment-history-lifecycle
