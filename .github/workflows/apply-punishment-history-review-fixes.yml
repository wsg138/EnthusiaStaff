name: Apply punishment history review fixes

on:
  push:
    branches:
      - feature/punishment-history-lifecycle
    paths:
      - .github/workflows/apply-punishment-history-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/punishment-history-lifecycle
          fetch-depth: 0
      - name: Apply reviewed fixes
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import pathlib
          import zlib
          encoded = """"""
          script = zlib.decompress(base64.b64decode(encoded)).decode('utf-8')
          pathlib.Path('/tmp/apply_review_fixes.py').write_text(script, encoding='utf-8')
          exec(compile(script, '/tmp/apply_review_fixes.py', 'exec'))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Address punishment history review findings"
          git push origin HEAD:feature/punishment-history-lifecycle
