          ''')
          replace_once(path, "  return String(value).replaceAll('_', ' ').toLowerCase().replace(/\\b\\w/g, (letter) => letter.toUpperCase());\n", "  return String(value).replace(/_/g, ' ').toLowerCase().replace(/\\b\\w/g, (letter) => letter.toUpperCase());\n")
          replace_once(path, '''function mapHistoryRow(row) {
