name: ES-D16 Coordinated Repair

on:
  push:
    branches:
      - package/es-d16-moderation-read-bridge
    paths:
      - ".github/workflows/es-d16-codacy-diagnostics.yml"

permissions:
  contents: write

jobs:
  repair:
    name: Repair current ES-D16 findings and validate before push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: package/es-d16-moderation-read-bridge
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Apply coordinated repairs
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          # Java: eliminate null collection result, method-level synchronization, repeated literals,
          # dynamic regex compilation, and nullable read-server lifecycle state.
          path = 'staff-bot/src/main/java/net/enthusia/staff/discordbot/ModerationReadApiAuthenticator.java'
          replace_once(path, 'import java.util.Objects;\n', 'import java.util.Objects;\nimport java.util.Optional;\n')
          replace_once(path, '''        byte[] suppliedSignature = decodeSignature(signature);
          if (suppliedSignature == null) {
              return Result.MALFORMED;
          }
          byte[] expected = sign(canonical(method, path, body, timestamp.raw(), nonce));
          if (!MessageDigest.isEqual(expected, suppliedSignature)) {
          ''', '''        Optional<byte[]> suppliedSignature = decodeSignature(signature);
          if (suppliedSignature.isEmpty()) {
              return Result.MALFORMED;
          }
          byte[] expected = sign(canonical(method, path, body, timestamp.raw(), nonce));
          if (!MessageDigest.isEqual(expected, suppliedSignature.orElseThrow())) {
          ''')
          replace_once(path, '''    private static byte[] decodeSignature(String signature) {
              try {
                  byte[] decoded = Base64.getUrlDecoder().decode(signature);
                  return decoded.length == KEY_BYTES ? decoded : null;
              } catch (IllegalArgumentException exception) {
                  return null;
              }
          }
          ''', '''    private static Optional<byte[]> decodeSignature(String signature) {
              try {
                  byte[] decoded = Base64.getUrlDecoder().decode(signature);
                  return decoded.length == KEY_BYTES ? Optional.of(decoded) : Optional.empty();
              } catch (IllegalArgumentException exception) {
                  return Optional.empty();
              }
          }
          ''')

          path = 'staff-bot/src/test/java/net/enthusia/staff/discordbot/ModerationReadApiAuthenticatorTest.java'
          replace_once(path, '    private static final String PATH = "/v1/moderation/bootstrap";\n', '    private static final String PATH = "/v1/moderation/bootstrap";\n    private static final String POST_METHOD = "POST";\n')
          file = Path(path)
          text = file.read_text(encoding='utf-8')
          text = text.replace('signature(KEY, "POST",', 'signature(KEY, POST_METHOD,')
          text = text.replace('verify("POST",', 'verify(POST_METHOD,')
          file.write_text(text, encoding='utf-8')

          path = 'staff-bot/src/main/java/net/enthusia/staff/discordbot/ModerationReadApiRateLimiter.java'
          replace_once(path, 'final class ModerationReadApiRateLimiter {\n    private final int capacity;\n', 'final class ModerationReadApiRateLimiter {\n    private final Object monitor = new Object();\n    private final int capacity;\n')
          replace_once(path, '''    synchronized boolean tryAcquire() {
              Instant now = clock.instant();
              if (!now.isBefore(windowStart.plus(window))) {
                  windowStart = now;
                  used = 0;
              }
              if (used >= capacity) {
                  return false;
              }
              used++;
              return true;
          }
          ''', '''    boolean tryAcquire() {
              synchronized (monitor) {
                  Instant now = clock.instant();
                  if (!now.isBefore(windowStart.plus(window))) {
                      windowStart = now;
                      used = 0;
                  }
                  if (used >= capacity) {
                      return false;
                  }
                  used++;
                  return true;
              }
          }
          ''')

          path = 'staff-bot/src/main/java/net/enthusia/staff/discordbot/ModerationReadReplayGuard.java'
          replace_once(path, 'import java.util.Objects;\n', 'import java.util.Objects;\nimport java.util.regex.Pattern;\n')
          replace_once(path, 'final class ModerationReadReplayGuard {\n    private final int capacity;\n', 'final class ModerationReadReplayGuard {\n    private static final Pattern NONCE = Pattern.compile("[A-Za-z0-9_-]{32,64}");\n\n    private final Object monitor = new Object();\n    private final int capacity;\n')
          replace_once(path, '''    synchronized boolean claim(String nonce, Instant now) {
              Objects.requireNonNull(now, "now");
              if (nonce == null || !nonce.matches("[A-Za-z0-9_-]{32,64}")) {
                  return false;
              }
              prune(now);
              if (expirations.containsKey(nonce) || expirations.size() >= capacity) {
                  return false;
              }
              expirations.put(nonce, now.plus(ttl));
              return true;
          }
          ''', '''    boolean claim(String nonce, Instant now) {
              Objects.requireNonNull(now, "now");
              if (nonce == null || !NONCE.matcher(nonce).matches()) {
                  return false;
              }
              synchronized (monitor) {
                  prune(now);
                  if (expirations.containsKey(nonce) || expirations.size() >= capacity) {
                      return false;
                  }
                  expirations.put(nonce, now.plus(ttl));
                  return true;
              }
          }
          ''')

          path = 'staff-bot/src/main/java/net/enthusia/staff/discordbot/ModerationReadTarget.java'
          replace_once(path, 'import java.util.OptionalLong;\n', 'import java.util.OptionalLong;\nimport java.util.regex.Pattern;\n')
          replace_once(path, '''sealed interface ModerationReadTarget permits ModerationReadTarget.DiscordUser, ModerationReadTarget.MessageContext {
              long userId();
          ''', '''sealed interface ModerationReadTarget permits ModerationReadTarget.DiscordUser, ModerationReadTarget.MessageContext {
              int DISCORD_PARTS = 2;
              int MESSAGE_PARTS = 4;
              String DISCORD_KIND = "discord";
              String MESSAGE_KIND = "message";
              Pattern SNOWFLAKE = Pattern.compile("[1-9][0-9]{0,19}");

              long userId();
          ''')
          replace_once(path, '        if (parts.length == 2 && "discord".equals(parts[0])) {\n', '        if (parts.length == DISCORD_PARTS && DISCORD_KIND.equals(parts[0])) {\n')
          replace_once(path, '        if (parts.length == 4 && "message".equals(parts[0])) {\n', '        if (parts.length == MESSAGE_PARTS && MESSAGE_KIND.equals(parts[0])) {\n')
          replace_once(path, '        if (value == null || !value.matches("[1-9][0-9]{0,19}")) {\n', '        if (value == null || !SNOWFLAKE.matcher(value).matches()) {\n')

          path = 'staff-bot/src/main/java/net/enthusia/staff/discordbot/ModerationReadApiServer.java'
          replace_once(path, '    private static final String BIND_HOST = "127.0.0.1";\n', '    private static final String BIND_HOST = "127.0.0.1";\n    private static final String POST_METHOD = "POST";\n')
          replace_once(path, '            if (!"POST".equals(exchange.getRequestMethod())) {\n', '            if (!POST_METHOD.equals(exchange.getRequestMethod())) {\n')

          path = 'staff-bot/src/main/java/net/enthusia/staff/discordbot/JdaModerationUiPreviewListener.java'
          replace_once(path, '    private ModerationReadApiServer readApiServer;\n', '    private Optional<ModerationReadApiServer> readApiServer = Optional.empty();\n')
          replace_once(path, '''    private boolean startReadApi(JDA jda) {
              if (readApiServer != null) {
                  return true;
              }
              if (moderation.isEmpty()) {
                  return false;
              }
              try {
                  ModerationReadApiService service = new ModerationReadApiService(guildId, moderation.orElseThrow(), jda);
                  readApiServer = new ModerationReadApiServer(discordBotToken, service);
                  readApiServer.start();
                  return true;
              } catch (java.io.IOException | RuntimeException exception) {
                  log("moderation_read_api_start_failed", exception);
                  closeReadApi();
                  return false;
              }
          }
          ''', '''    private boolean startReadApi(JDA jda) {
              if (readApiServer.isPresent()) {
