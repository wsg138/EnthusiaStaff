name: ES-D16 Coordinated Repair

on:
  push:
    branches: [package/es-d16-moderation-read-bridge]
    paths: [".github/workflows/es-d16-codacy-diagnostics.yml"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: package/es-d16-moderation-read-bridge
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Apply coordinated repairs
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          import re
          from pathlib import Path

          def edit(path, transform):
              p = Path(path)
              before = p.read_text(encoding='utf-8')
              after = transform(before)
              if after == before:
                  raise SystemExit(f'{path}: transform made no change')
              p.write_text(after, encoding='utf-8')

          def once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one literal, found {text.count(old)}')
              return text.replace(old, new)

          def rx(text, pattern, replacement, label, flags=re.S | re.M):
              out, count = re.subn(pattern, lambda _: replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected one regex match, found {count}')
              return out

          def authenticator(text):
              text = once(text, 'import java.util.Objects;\n', 'import java.util.Objects;\nimport java.util.Optional;\n', 'auth import')
              text = once(text, 'byte[] suppliedSignature = decodeSignature(signature);', 'Optional<byte[]> suppliedSignature = decodeSignature(signature);', 'auth signature type')
              text = once(text, 'if (suppliedSignature == null) {', 'if (suppliedSignature.isEmpty()) {', 'auth empty')
              text = once(text, 'MessageDigest.isEqual(expected, suppliedSignature)', 'MessageDigest.isEqual(expected, suppliedSignature.orElseThrow())', 'auth compare')
              return rx(text,
                  r'^    private static byte\[\] decodeSignature\(String signature\) \{.*?^    \}\n',
                  '''    private static Optional<byte[]> decodeSignature(String signature) {
              try {
                  byte[] decoded = Base64.getUrlDecoder().decode(signature);
                  return decoded.length == KEY_BYTES ? Optional.of(decoded) : Optional.empty();
              } catch (IllegalArgumentException exception) {
                  return Optional.empty();
              }
          }
          ''', 'auth decode')
          edit('staff-bot/src/main/java/net/enthusia/staff/discordbot/ModerationReadApiAuthenticator.java', authenticator)

          def auth_test(text):
              text = once(text, '    private static final String PATH = "/v1/moderation/bootstrap";\n', '    private static final String PATH = "/v1/moderation/bootstrap";\n    private static final String POST_METHOD = "POST";\n', 'test constant')
              text = text.replace('signature(KEY, "POST",', 'signature(KEY, POST_METHOD,')
              text = text.replace('verify("POST",', 'verify(POST_METHOD,')
              return text
          edit('staff-bot/src/test/java/net/enthusia/staff/discordbot/ModerationReadApiAuthenticatorTest.java', auth_test)

          def rate_limiter(text):
              text = once(text, 'final class ModerationReadApiRateLimiter {\n    private final int capacity;\n', 'final class ModerationReadApiRateLimiter {\n    private final Object monitor = new Object();\n    private final int capacity;\n', 'rate lock')
              return rx(text, r'^    synchronized boolean tryAcquire\(\) \{.*?^    \}\n', '''    boolean tryAcquire() {
              synchronized (monitor) {
                  Instant now = clock.instant();
                  if (!now.isBefore(windowStart.plus(window))) {
                      windowStart = now;
                      used = 0;
                  }
                  if (used >= capacity) {
                      return false;
                  }
                  used++;
                  return true;
              }
          }
          ''', 'rate method')
          edit('staff-bot/src/main/java/net/enthusia/staff/discordbot/ModerationReadApiRateLimiter.java', rate_limiter)

          def replay_guard(text):
              text = once(text, 'import java.util.Objects;\n', 'import java.util.Objects;\nimport java.util.regex.Pattern;\n', 'replay import')
              text = once(text, 'final class ModerationReadReplayGuard {\n    private final int capacity;\n', 'final class ModerationReadReplayGuard {\n    private static final Pattern NONCE = Pattern.compile("[A-Za-z0-9_-]{32,64}");\n\n    private final Object monitor = new Object();\n    private final int capacity;\n', 'replay fields')
              return rx(text, r'^    synchronized boolean claim\(String nonce, Instant now\) \{.*?^    \}\n', '''    boolean claim(String nonce, Instant now) {
              Objects.requireNonNull(now, "now");
              if (nonce == null || !NONCE.matcher(nonce).matches()) {
                  return false;
              }
              synchronized (monitor) {
                  prune(now);
                  if (expirations.containsKey(nonce) || expirations.size() >= capacity) {
                      return false;
                  }
                  expirations.put(nonce, now.plus(ttl));
                  return true;
              }
          }
          ''', 'replay method')
          edit('staff-bot/src/main/java/net/enthusia/staff/discordbot/ModerationReadReplayGuard.java', replay_guard)

          def target(text):
              text = once(text, 'import java.util.OptionalLong;\n', 'import java.util.OptionalLong;\nimport java.util.regex.Pattern;\n', 'target import')
              text = once(text, 'sealed interface ModerationReadTarget permits ModerationReadTarget.DiscordUser, ModerationReadTarget.MessageContext {\n    long userId();', 'sealed interface ModerationReadTarget permits ModerationReadTarget.DiscordUser, ModerationReadTarget.MessageContext {\n    int DISCORD_PARTS = 2;\n    int MESSAGE_PARTS = 4;\n    String DISCORD_KIND = "discord";\n    String MESSAGE_KIND = "message";\n    Pattern SNOWFLAKE = Pattern.compile("[1-9][0-9]{0,19}");\n\n    long userId();', 'target constants')
              text = once(text, 'parts.length == 2 && "discord".equals(parts[0])', 'parts.length == DISCORD_PARTS && DISCORD_KIND.equals(parts[0])', 'target discord')
              text = once(text, 'parts.length == 4 && "message".equals(parts[0])', 'parts.length == MESSAGE_PARTS && MESSAGE_KIND.equals(parts[0])', 'target message')
              return once(text, '!value.matches("[1-9][0-9]{0,19}")', '!SNOWFLAKE.matcher(value).matches()', 'target snowflake')
          edit('staff-bot/src/main/java/net/enthusia/staff/discordbot/ModerationReadTarget.java', target)

          def api_server(text):
              text = once(text, '    private static final String BIND_HOST = "127.0.0.1";\n', '    private static final String BIND_HOST = "127.0.0.1";\n    private static final String POST_METHOD = "POST";\n', 'server constant')
              return once(text, '!"POST".equals(exchange.getRequestMethod())', '!POST_METHOD.equals(exchange.getRequestMethod())', 'server post')
          edit('staff-bot/src/main/java/net/enthusia/staff/discordbot/ModerationReadApiServer.java', api_server)

          def listener(text):
              text = once(text, '    private ModerationReadApiServer readApiServer;\n', '    private Optional<ModerationReadApiServer> readApiServer = Optional.empty();\n', 'listener field')
              text = rx(text, r'^    private boolean startReadApi\(JDA jda\) \{.*?^    \}\n', '''    private boolean startReadApi(JDA jda) {
              if (readApiServer.isPresent()) {
                  return true;
              }
              if (moderation.isEmpty()) {
                  return false;
              }
              try {
                  readApiServer = Optional.of(createStartedReadApi(jda));
                  return true;
              } catch (java.io.IOException | RuntimeException exception) {
                  log("moderation_read_api_start_failed", exception);
                  closeReadApi();
                  return false;
              }
          }

          private ModerationReadApiServer createStartedReadApi(JDA jda) throws java.io.IOException {
              ModerationReadApiService service = new ModerationReadApiService(guildId, moderation.orElseThrow(), jda);
              ModerationReadApiServer candidate = new ModerationReadApiServer(discordBotToken, service);
              try {
                  candidate.start();
                  return candidate;
              } catch (RuntimeException exception) {
                  candidate.close();
                  throw exception;
              }
          }
          ''', 'listener start')
              return rx(text, r'^    private void closeReadApi\(\) \{.*?^    \}\n', '''    private void closeReadApi() {
              readApiServer.ifPresent(ModerationReadApiServer::close);
              readApiServer = Optional.empty();
          }
          ''', 'listener close')
          edit('staff-bot/src/main/java/net/enthusia/staff/discordbot/JdaModerationUiPreviewListener.java', listener)

          def backend(text):
              text = once(text, 'proxyModerationRead(env, session, endpoint, browserUrl)', 'proxyModerationRead(env, session, endpoint, browserInput = {})', 'backend proxy args')
              text = once(text, 'readRequest(session, endpoint, browserUrl)', 'readRequest(session, endpoint, browserInput)', 'backend proxy body')
              text = rx(text, r'^export function browserMessageQuery\(url\) \{.*?^\}\n\n^export function readRequest\(session, endpoint, browserUrl\) \{.*?^\}\n', '''const MESSAGE_FILTER_KEYS = new Set(['channel', 'before', 'after', 'author', 'text', 'date', 'limit']);

          export function browserMessageQuery(input) {
              if (!input || typeof input !== 'object' || Array.isArray(input)) throw new Error('invalid message filters');
              for (const key of Object.keys(input)) {
                  if (!MESSAGE_FILTER_KEYS.has(key)) throw new Error('invalid message filter');
              }
              const query = {};
              const channelId = snowflakeFilter(input.channel, 'channel');
              const beforeMessageId = snowflakeFilter(input.before, 'before');
              const afterMessageId = snowflakeFilter(input.after, 'after');
              const authorId = snowflakeFilter(input.author, 'author');
              if (channelId !== null) query.channelId = channelId;
              if (beforeMessageId !== null) query.beforeMessageId = beforeMessageId;
              if (afterMessageId !== null) query.afterMessageId = afterMessageId;
              if (authorId !== null) query.authorId = authorId;
              if (input.text !== undefined) {
                  if (typeof input.text !== 'string' || input.text.length > MAX_FILTER_TEXT) throw new Error('invalid message text filter');
                  query.text = input.text;
              }
              if (input.date !== undefined) {
                  if (typeof input.date !== 'string' || !/^\\d{4}-\\d{2}-\\d{2}$/.test(input.date)) throw new Error('invalid date filter');
                  query.date = input.date;
              }
              query.limit = input.limit === undefined ? 25 : boundedLimit(String(input.limit));
              if (query.beforeMessageId && query.afterMessageId) throw new Error('conflicting cursors');
              return query;
          }

          export function readRequest(session, endpoint, browserInput = {}) {
              const request = {actorId: session.actorId, guildId: session.guildId, targetKey: session.targetKey, messages: null};
              if (endpoint === 'messages') request.messages = browserMessageQuery(browserInput);
              return request;
          }
          ''', 'backend query')
              return rx(text, r'^function copySnowflake\(url, target, field, parameter\) \{.*?^\}\n', '''function snowflakeFilter(value, parameter) {
              if (value === undefined || value === null) return null;
              if (typeof value !== 'string' || !/^[1-9][0-9]{0,19}$/.test(value)) throw new Error(`invalid ${parameter} filter`);
              return value;
          }
          ''', 'backend snowflake')
          edit('moderation-web/src/backend.js', backend)

          def worker_index(text):
              text = once(text, "handleRead(request, env, url, 'bootstrap')", "handleRead(request, env, 'bootstrap')", 'index bootstrap')
              text = once(text, "handleRead(request, env, url, 'messages')", "handleRead(request, env, 'messages')", 'index messages')
              return rx(text, r'^async function handleRead\(request, env, url, endpoint\) \{.*?^\}\n', '''async function handleRead(request, env, endpoint) {
              const expectedMethod = endpoint === 'messages' ? 'POST' : 'GET';
              if (request.method !== expectedMethod) return methodNotAllowed();
              const session = await currentSession(request, env);
              if (!session) return textResponse('Session expired.', 401);
              const parsed = endpoint === 'messages' ? await readMessagePayload(request) : {value: {}};
              if (parsed.error) return parsed.error;
              try {
                  return await proxyModerationRead(env, session, endpoint, parsed.value);
              } catch {
                  return jsonResponse({code: 'invalid_request', message: 'Read request is invalid.'}, 400);
              }
          }

          async function readMessagePayload(request) {
              const body = await readBoundedBody(request, MAX_REQUEST_BYTES);
              if (!body) return {error: textResponse('Read request is too large.', 413)};
              try {
                  return {value: JSON.parse(new TextDecoder().decode(body))};
              } catch {
                  return {error: textResponse('Read request is invalid.', 400)};
              }
          }
          ''', 'index read')
          edit('moderation-web/src/index.js', worker_index)

          def backend_test(text):
              text = rx(text, r"  const url = new URL\('https://staff-staging\.enthusia\.info/api/messages\?.*?'\);\n  assert\.deepEqual\(browserMessageQuery\(url\),", "  const filters = {channel:'1541286004298752091', before:'1541300000000000001', author:'1049827163345127424', date:'2026-08-31', text:'hello', limit:'50'};\n  assert.deepEqual(browserMessageQuery(filters),", 'test valid')
              text = rx(text, r"  for \(const raw of \[.*?^  \}\n", '''  for (const filters of [
              {channel:'0'}, {before:'1', after:'2'}, {author:'abc'}, {date:'August-31'},
              {limit:'51'}, {text:'x'.repeat(201)}, {target:'discord:999'}, {actor:'999'}, {guild:'999'}
            ]) {
              assert.throws(() => browserMessageQuery(filters));
            }
          ''', 'test rejects')
              text = rx(text, r"  const browser = new URL\('https://staff-staging\.enthusia\.info/api/messages\?.*?'\);", "  const browser = {channel:'1541286004298752091'};", 'test bind')
              return once(text, "await proxyModerationRead(env, session, 'bootstrap', new URL('https://staff-staging.enthusia.info/api/bootstrap'));", "await proxyModerationRead(env, session, 'bootstrap');", 'test fixed origin')
          edit('moderation-web/test/backend.test.mjs', backend_test)

          def real_data(text):
              text = rx(text, r'^function applyLiveBootstrap\(payload\) \{.*?^\}\n', '''function asArray(value) {
              return Array.isArray(value) ? value : [];
          }

          function firstText(...values) {
              for (const value of values) {
                  if (typeof value === 'string' && value.length > 0) return value;
              }
              return '';
          }

          function optionalText(value) {
              return typeof value === 'string' ? value : '';
          }

          function nullableText(value) {
              const text = optionalText(value);
              return text.length > 0 ? text : null;
          }

          function applyLiveBootstrap(payload) {
              liveModeration.bootstrap = payload;
              applyLiveCollections(payload);
              applyIdentity(payload.identity ?? {});
              applyRestrictionTargets();
              state.history = asArray(payload.history).map(mapHistoryRow);
              replaceMessagePage(payload.messages ?? {});
              state.contextId = nullableText(payload.centeredMessageId);
              renderAll();
          }

          function applyLiveCollections(payload) {
              liveModeration.cases = asArray(payload.cases);
              liveModeration.notes = asArray(payload.notes);
              liveModeration.sanctions = asArray(payload.activeSanctions);
              liveModeration.accounts = asArray(payload.linkedAccounts);
              liveModeration.channels = asArray(payload.channels);
          }
          ''', 'real bootstrap')
              text = rx(text, r'^function applyIdentity\(source\) \{.*?^\}\n', '''function applyIdentity(source) {
              const main = liveModeration.accounts.find((account) => account.main);
              const alts = liveModeration.accounts.filter((account) => !account.main).map(mapLinkedAlt);
              Object.assign(identity, {
                  displayName: firstText(source.displayName, source.serverName, source.globalName, source.username, source.discordId, 'Unknown Discord user'),
                  username: firstText(source.username, 'unknown'),
                  discordId: firstText(source.discordId, 'Unavailable'),
                  minecraft: firstText(source.minecraftMain, linkedAccountName(main), 'No linked Minecraft main'),
                  minecraftUuid: firstText(main?.playerId, 'Unavailable'), alts,
                  status: firstText(source.targetStatus, 'Unknown'), statusDetail: sanctionStatusDetail(),
                  avatarUrl: optionalText(source.avatarUrl), linkState: firstText(source.linkState, 'Unknown'),
                  globalName: optionalText(source.globalName), serverName: optionalText(source.serverName)
              });
          }

          function mapLinkedAlt(account) {
              return {name:firstText(account.username, account.playerId), platform:friendlyPlatform(account.platform), status:'Linked', playerId:account.playerId};
          }

          function linkedAccountName(account) {
              return account ? firstText(account.username, account.playerId) : '';
          }

          function sanctionStatusDetail() {
              const count = liveModeration.sanctions.length;
              return count > 0 ? `${count} active` : 'No active sanctions';
          }
          ''', 'real identity')
              text = once(text, ".replaceAll('_', ' ')", ".replace(/_/g, ' ')", 'real compatibility')
              text = rx(text, r'^function mapHistoryRow\(row\) \{.*?^\}\n\n', '', 'real duplicate history')
              text = rx(text, r'^function mapMessage\(message\) \{.*?^\}\n', '''function mapMessage(message) {
              const author = message.author ?? {};
              const authorName = firstText(author.displayName, author.username, author.discordId, 'Unknown author');
              return {
                  id:message.id, author:authorName, username:firstText(author.username, 'unknown'), initials:initials(authorName),
                  target:Boolean(message.targetAuthor), channel:firstText(message.channelName, message.channelId), channelId:message.channelId,
                  category:optionalText(message.categoryName), time:message.createdAt, text:optionalText(message.content),
                  edited:Boolean(message.editedAt), editedAt:nullableText(message.editedAt), attachments:asArray(message.attachments).map(mapAttachment),
                  replyTo:nullableText(message.replyToMessageId), deleted:Boolean(message.deletedKnown), authorId:optionalText(author.discordId)
              };
          }

          function mapAttachment(attachment) {
              return {name:firstText(attachment.fileName, 'Attachment'), detail:[firstText(attachment.contentType, 'Attachment'), formatBytes(attachment.size)].filter(Boolean).join(' · '), url:optionalText(attachment.url)};
          }
          ''', 'real message')
              text = rx(text, r'^function initials\(value\) \{.*?^\}\n', '''function initials(value) {
              const text = String(value ?? '').trim();
              if (!text) return '?';
              return text.split(/\\s+/).slice(0, 2).map((part) => part.charAt(0)).join('').toUpperCase();
          }
          ''', 'real initials')
              text = rx(text, r'^function filtersNode\(\) \{.*?^\}\n', '''function filtersNode() {
              return element('section', {className:'card filters-card'}, element('div', {className:'filter-row'},
                  labeledControl('Search messages', searchFilterNode()), labeledControl('Author', authorFilterNode()),
                  labeledControl('Channel', channelFilterNode()), labeledControl('Date', dateFilterNode()), selectedFilterNode()));
          }

          function searchFilterNode() { return element('input', {id:'messageSearch', type:'search', placeholder:'Search loaded message text', value:state.search}); }
          function authorFilterNode() { return element('input', {id:'authorFilter', type:'search', placeholder:'Author ID or name', value:state.author ?? ''}); }
          function channelFilterNode() { return element('select', {id:'channelFilter'}, optionNode('all','All loaded channels',state.channel === 'all'), liveModeration.channels.map(channelFilterOption)); }
          function channelFilterOption(item) { const category = item.categoryName ? ` · ${item.categoryName}` : ''; return optionNode(item.id, `#${item.name}${category}`, state.channel === item.id); }
          function dateFilterNode() { return element('input', {id:'dateFilter', type:'date', value:state.date === 'all' ? '' : state.date}); }
          function selectedFilterNode() { const selected = element('input', {id:'selectedFilter', type:'checkbox', checked:state.selectedOnly}); return element('label', {className:'checkbox-control'}, selected, ' Selected only'); }
          ''', 'real filters')
              return once(text, "const response = await fetch(`/api/messages?${params}`, {headers:{Accept:'application/json'}});", "const response = await fetch('/api/messages', {method:'POST', headers:{Accept:'application/json', 'Content-Type':'application/json'}, body:JSON.stringify(Object.fromEntries(params.entries()))});", 'real fixed fetch')
          edit('staff-bot/src/main/resources/moderation-preview/real-data.js', real_data)

          def real_policy(text):
              return rx(text, r'^function mapHistoryRow\(row\) \{.*?^\}\n', '''function mapHistoryRow(row) {
              const occurred = firstText(row.occurredAt, new Date(0).toISOString());
              const family = optionalText(row.sanctionFamily);
              return {
                  id:firstText(row.caseId, row.stableKey), date:occurred.slice(0, 10), key:firstText(family, 'other'),
                  offense:firstText(row.reason, row.exactReasonId, row.eventType, 'Moderation event'), action:firstText(row.punishmentType, row.eventType, 'Record'),
                  duration:'—', staff:firstText(row.actorName, 'System'), status:firstText(row.status, 'Recorded'),
                  ladderRelevant:LIVE_LADDER_FAMILIES.has(family), exactReasonId:nullableText(row.exactReasonId), sanctionFamily:nullableText(family)
              };
          }
          ''', 'policy history')
          edit('staff-bot/src/main/resources/moderation-preview/real-policy.js', real_policy)

          def deployment(text):
              text = once(text, "body = f'v1|staging|{nonce}|846729778400460871|1410303324745371709|discord:846729778400460871|{now}|{now + 120}'", "test_actor_id = str(10**17 + secrets.randbelow(9 * 10**17))\n          body = f'v1|staging|{nonce}|{test_actor_id}|1410303324745371709|discord:{test_actor_id}|{now}|{now + 120}'", 'deploy synthetic actor')
              return rx(text, r'\n      - name: Record sanitized Codacy issue metadata\n.*?(?=\n      - name: Require fixed private tunnel provisioning)', '', 'deploy diagnostics')
          edit('.github/workflows/moderation-web-staging-deploy.yml', deployment)
          PY
          git diff --check

      - name: Validate moderation web
        working-directory: moderation-web
        run: |
          npm ci --ignore-scripts
          npm run check

      - name: Run clean Java gate
        run: ./gradlew --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks clean test check runtimeJars

      - name: Commit coordinated repair
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'P2wn'
          git config user.email 'racecarboy77@gmail.com'
          git add moderation-web staff-bot .github/workflows/moderation-web-staging-deploy.yml
          git diff --cached --check
          git commit -m 'ES-D16: resolve moderation bridge static findings'
          git push origin HEAD:package/es-d16-moderation-read-bridge
