              }
              if (moderation.isEmpty()) {
                  return false;
              }
              try {
                  readApiServer = Optional.of(createStartedReadApi(jda));
                  return true;
              } catch (java.io.IOException | RuntimeException exception) {
                  log("moderation_read_api_start_failed", exception);
                  closeReadApi();
                  return false;
              }
          }

              private ModerationReadApiServer createStartedReadApi(JDA jda) throws java.io.IOException {
                  ModerationReadApiService service = new ModerationReadApiService(guildId, moderation.orElseThrow(), jda);
                  ModerationReadApiServer candidate = new ModerationReadApiServer(discordBotToken, service);
                  try {
                      candidate.start();
                      return candidate;
                  } catch (RuntimeException exception) {
                      candidate.close();
                      throw exception;
                  }
              }
          ''')
          replace_once(path, '''    private void closeReadApi() {
              if (readApiServer != null) {
                  readApiServer.close();
                  readApiServer = null;
              }
          }
          ''', '''    private void closeReadApi() {
              readApiServer.ifPresent(ModerationReadApiServer::close);
              readApiServer = Optional.empty();
          }
          ''')

          # Worker: accept only explicit browser message-filter fields and keep outbound origin fixed.
          path = 'moderation-web/src/backend.js'
          replace_once(path, '''export async function proxyModerationRead(env, session, endpoint, browserUrl) {
              const keyHex = readSigningKey(env);
              if (!keyHex) return unavailable();
              const path = endpointPath(endpoint);
              const body = JSON.stringify(readRequest(session, endpoint, browserUrl));
          ''', '''export async function proxyModerationRead(env, session, endpoint, browserInput = {}) {
              const keyHex = readSigningKey(env);
              if (!keyHex) return unavailable();
              const path = endpointPath(endpoint);
              const body = JSON.stringify(readRequest(session, endpoint, browserInput));
          ''')
          replace_once(path, '''export function browserMessageQuery(url) {
              const query = {};
              copySnowflake(url, query, 'channelId', 'channel');
              copySnowflake(url, query, 'beforeMessageId', 'before');
              copySnowflake(url, query, 'afterMessageId', 'after');
              copySnowflake(url, query, 'authorId', 'author');
              const text = url.searchParams.get('text');
              if (text !== null) {
                  if (text.length > MAX_FILTER_TEXT) throw new Error('invalid message text filter');
                  query.text = text;
              }
              const date = url.searchParams.get('date');
              if (date !== null) {
                  if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(date)) throw new Error('invalid date filter');
                  query.date = date;
              }
              const rawLimit = url.searchParams.get('limit');
              query.limit = rawLimit === null ? 25 : boundedLimit(rawLimit);
              if (query.beforeMessageId && query.afterMessageId) throw new Error('conflicting cursors');
              return query;
          }

          export function readRequest(session, endpoint, browserUrl) {
              const request = {
                  actorId: session.actorId,
                  guildId: session.guildId,
                  targetKey: session.targetKey,
                  messages: null
              };
              if (endpoint === 'messages') request.messages = browserMessageQuery(browserUrl);
              return request;
          }
          ''', '''const MESSAGE_FILTER_KEYS = new Set(['channel', 'before', 'after', 'author', 'text', 'date', 'limit']);

          export function browserMessageQuery(input) {
              if (!input || typeof input !== 'object' || Array.isArray(input)) throw new Error('invalid message filters');
              for (const key of Object.keys(input)) {
                  if (!MESSAGE_FILTER_KEYS.has(key)) throw new Error('invalid message filter');
              }
              const query = {};
              const channelId = snowflakeFilter(input.channel, 'channel');
              const beforeMessageId = snowflakeFilter(input.before, 'before');
              const afterMessageId = snowflakeFilter(input.after, 'after');
              const authorId = snowflakeFilter(input.author, 'author');
              if (channelId !== null) query.channelId = channelId;
              if (beforeMessageId !== null) query.beforeMessageId = beforeMessageId;
              if (afterMessageId !== null) query.afterMessageId = afterMessageId;
              if (authorId !== null) query.authorId = authorId;
              if (input.text !== undefined) {
                  if (typeof input.text !== 'string' || input.text.length > MAX_FILTER_TEXT) {
                      throw new Error('invalid message text filter');
                  }
                  query.text = input.text;
              }
              if (input.date !== undefined) {
                  if (typeof input.date !== 'string' || !/^\\d{4}-\\d{2}-\\d{2}$/.test(input.date)) {
                      throw new Error('invalid date filter');
                  }
                  query.date = input.date;
              }
              query.limit = input.limit === undefined ? 25 : boundedLimit(String(input.limit));
              if (query.beforeMessageId && query.afterMessageId) throw new Error('conflicting cursors');
              return query;
          }

          export function readRequest(session, endpoint, browserInput = {}) {
              const request = {
                  actorId: session.actorId,
                  guildId: session.guildId,
                  targetKey: session.targetKey,
                  messages: null
              };
              if (endpoint === 'messages') request.messages = browserMessageQuery(browserInput);
              return request;
          }
          ''')
          replace_once(path, '''function copySnowflake(url, target, field, parameter) {
              const value = url.searchParams.get(parameter);
              if (value === null) return;
              if (!/^[1-9][0-9]{0,19}$/.test(value)) throw new Error(`invalid ${parameter} filter`);
              target[field] = value;
          }
          ''', '''function snowflakeFilter(value, parameter) {
              if (value === undefined || value === null) return null;
              if (typeof value !== 'string' || !/^[1-9][0-9]{0,19}$/.test(value)) {
                  throw new Error(`invalid ${parameter} filter`);
              }
              return value;
          }
          ''')

          path = 'moderation-web/src/index.js'
          replace_once(path, "  if (url.pathname === '/api/bootstrap') return handleRead(request, env, url, 'bootstrap');\n  if (url.pathname === '/api/messages') return handleRead(request, env, url, 'messages');\n", "  if (url.pathname === '/api/bootstrap') return handleRead(request, env, 'bootstrap');\n  if (url.pathname === '/api/messages') return handleRead(request, env, 'messages');\n")
          replace_once(path, '''async function handleRead(request, env, url, endpoint) {
              if (request.method !== 'GET') return methodNotAllowed();
              const session = await currentSession(request, env);
              if (!session) return textResponse('Session expired.', 401);
              try {
                  return await proxyModerationRead(env, session, endpoint, url);
              } catch {
                  return jsonResponse({code: 'invalid_request', message: 'Read request is invalid.'}, 400);
              }
          }
          ''', '''async function handleRead(request, env, endpoint) {
              const expectedMethod = endpoint === 'messages' ? 'POST' : 'GET';
              if (request.method !== expectedMethod) return methodNotAllowed();
              const session = await currentSession(request, env);
              if (!session) return textResponse('Session expired.', 401);
              const parsed = endpoint === 'messages' ? await readMessagePayload(request) : {value: {}};
              if (parsed.error) return parsed.error;
              try {
                  return await proxyModerationRead(env, session, endpoint, parsed.value);
              } catch {
                  return jsonResponse({code: 'invalid_request', message: 'Read request is invalid.'}, 400);
              }
          }

          async function readMessagePayload(request) {
              const body = await readBoundedBody(request, MAX_REQUEST_BYTES);
              if (!body) return {error: textResponse('Read request is too large.', 413)};
              try {
                  const value = JSON.parse(new TextDecoder().decode(body));
                  return {value};
              } catch {
                  return {error: textResponse('Read request is invalid.', 400)};
              }
          }
          ''')

          path = 'moderation-web/test/backend.test.mjs'
          replace_once(path, '''  const url = new URL('https://staff-staging.enthusia.info/api/messages?channel=1541286004298752091&before=1541300000000000001&author=1049827163345127424&date=2026-08-31&text=hello&limit=50');
              assert.deepEqual(browserMessageQuery(url), {
          ''', '''  const filters = {channel:'1541286004298752091', before:'1541300000000000001', author:'1049827163345127424', date:'2026-08-31', text:'hello', limit:'50'};
              assert.deepEqual(browserMessageQuery(filters), {
          ''')
          replace_once(path, '''  for (const raw of [
              '?channel=0',
              '?before=1&after=2',
              '?author=abc',
              '?date=August-31',
              '?limit=51',
              `?text=${'x'.repeat(201)}`
            ]) {
              assert.throws(() => browserMessageQuery(new URL(`https://staff-staging.enthusia.info/api/messages${raw}`)));
            }
          ''', '''  for (const filters of [
              {channel:'0'},
              {before:'1', after:'2'},
