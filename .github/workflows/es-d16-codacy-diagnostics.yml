            }
          ''')
          replace_once(path, '''  const browser = new URL('https://staff-staging.enthusia.info/api/messages?target=discord:999&actor=999&guild=999&channel=1541286004298752091');

              assert.deepEqual(readRequest(session, 'messages', browser), {
          ''', '''  const browser = {channel:'1541286004298752091'};

              assert.deepEqual(readRequest(session, 'messages', browser), {
          ''')
          replace_once(path, "    await proxyModerationRead(env, session, 'bootstrap', new URL('https://staff-staging.enthusia.info/api/bootstrap'));\n", "    await proxyModerationRead(env, session, 'bootstrap');\n")

          # UI: remove duplicate history mapper, simplify hotspots, and send message filters to a fixed literal endpoint.
          path = 'staff-bot/src/main/resources/moderation-preview/real-data.js'
          replace_once(path, '''function applyLiveBootstrap(payload) {
              liveModeration.bootstrap = payload;
              liveModeration.cases = Array.isArray(payload.cases) ? payload.cases : [];
              liveModeration.notes = Array.isArray(payload.notes) ? payload.notes : [];
              liveModeration.sanctions = Array.isArray(payload.activeSanctions) ? payload.activeSanctions : [];
              liveModeration.accounts = Array.isArray(payload.linkedAccounts) ? payload.linkedAccounts : [];
              liveModeration.channels = Array.isArray(payload.channels) ? payload.channels : [];
              applyIdentity(payload.identity || {});
              applyRestrictionTargets();
              state.history = (Array.isArray(payload.history) ? payload.history : []).map(mapHistoryRow);
              replaceMessagePage(payload.messages || {});
              state.contextId = payload.centeredMessageId || null;
              renderAll();
          }
          ''', '''function asArray(value) {
              return Array.isArray(value) ? value : [];
          }

          function firstText(...values) {
              for (const value of values) {
                  if (typeof value === 'string' && value.length > 0) return value;
              }
              return '';
          }

          function optionalText(value) {
              return typeof value === 'string' ? value : '';
          }

          function nullableText(value) {
              const text = optionalText(value);
              return text.length > 0 ? text : null;
