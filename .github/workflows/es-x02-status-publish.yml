name: ES-X02 status publication

on:
  push:
    branches:
      - status/es-x02-blocked-static-20260812

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: status/es-x02-blocked-static-20260812
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/es_x02_status_publish.py
      - run: |
          rm tools/es_x02_status_publish.py
          rm .github/workflows/es-x02-status-publish.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: publish ES-X02 blocked state"
          git push origin HEAD:status/es-x02-blocked-static-20260812
