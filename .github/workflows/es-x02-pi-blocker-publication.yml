name: ES-X02 Pi Blocker Publication

on:
  push:
    branches:
      - status/es-x02-pi-runner-blocked-20260813

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: status/es-x02-pi-runner-blocked-20260813
          fetch-depth: 0
      - name: Publish current canonical ES-X02 blocker
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/es_x02_publish_pi_blocker.py
          rm .github/workflows/es-x02-pi-blocker-publication.yml
          rm tools/es_x02_publish_pi_blocker.py
          git diff --check
      - name: Commit canonical blocked state
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs(es-x02): publish Pi runner blocker state'
          git push origin HEAD:status/es-x02-pi-runner-blocked-20260813
