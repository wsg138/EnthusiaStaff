# Temporary read-only Codacy evidence job. Must be removed before source merge.
name: Temporary PR806 Codacy annotation evidence
on:
  pull_request:
    paths:
      - ".github/workflows/temporary-codacy-pr806-annotation.yml"
permissions:
  contents: read
  checks: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read existing Codacy check-run annotations
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/check-runs/130932619951/annotations?per_page=100" \
            -o /tmp/pr806_annotations.json
          python3 - <<'PY'
          import json
          with open("/tmp/pr806_annotations.json", encoding="utf-8") as f:
              data = json.load(f)
          print("CODACY_ANNOTATIONS_COUNT=" + str(len(data)))
          for entry in data:
              print(json.dumps({
                  "path": entry.get("path"),
                  "line": entry.get("start_line"),
                  "message": entry.get("message"),
                  "level": entry.get("annotation_level"),
              }, ensure_ascii=False))
          PY
