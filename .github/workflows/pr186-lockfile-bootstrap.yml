name: PR186 Lockfile Publisher

on:
  push:
    branches:
      - owner/staging-web-moderation-console
    paths:
      - ".github/workflows/pr186-lockfile-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Validate and preserve exact npm lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Generate and validate exact lockfile
        working-directory: moderation-web
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check

      - name: Publish lockfile-only commit with exact-head guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          api_root = "https://api.github.com"
          repository = os.environ["GITHUB_REPOSITORY"]
          expected_head = os.environ["EXPECTED_HEAD"]
          branch = "owner/staging-web-moderation-console"
          token = os.environ["GH_TOKEN"]
          head_ref = f"heads/{branch}"
          head_path = f"/repos/{repository}/git/ref/{head_ref}"
          update_path = f"/repos/{repository}/git/refs/{head_ref}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(api_root + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read()
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"GitHub API {method} {path} failed: HTTP {error.code}: {detail}") from error
              return json.loads(raw) if raw else {}

          def require_expected_head():
              actual = api("GET", head_path)["object"]["sha"]
              if actual != expected_head:
                  raise SystemExit(f"branch moved: expected {expected_head}, found {actual}")

          require_expected_head()
          parent = api("GET", f"/repos/{repository}/git/commits/{expected_head}")
          content = Path("moderation-web/package-lock.json").read_text(encoding="utf-8")
          blob = api("POST", f"/repos/{repository}/git/blobs", {"content": content, "encoding": "utf-8"})
          tree = api("POST", f"/repos/{repository}/git/trees", {
              "base_tree": parent["tree"]["sha"],
              "tree": [{
                  "path": "moderation-web/package-lock.json",
                  "mode": "100644",
                  "type": "blob",
                  "sha": blob["sha"],
              }],
          })
          commit = api("POST", f"/repos/{repository}/git/commits", {
              "message": "[PR186] Add exact npm lockfile",
              "tree": tree["sha"],
              "parents": [expected_head],
          })
          require_expected_head()
          api("PATCH", update_path, {"sha": commit["sha"], "force": False})
          print(f"Published exact lockfile commit {commit['sha']}")
          PY
