name: PR186 Final Repair Publisher

on:
  push:
    branches:
      - owner/staging-web-moderation-console
    paths:
      - ".github/workflows/pr186-lockfile-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Validate and publish consolidated repair
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-read-only: true

      - name: Apply reviewed repairs and exact lockfile
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/pr186-final-review-repair.py
          cd moderation-web
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check

      - name: Validate focused Java configuration tests
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x gradlew
          ./gradlew :staff-bot:test \
            --tests net.enthusia.staff.discordbot.ModerationPreviewWebConfigTest \
            --no-daemon \
            --no-build-cache \
            --no-configuration-cache \
            --console=plain
          git diff --check

      - name: Publish one guarded repair commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          API = "https://api.github.com"
          REPOSITORY = os.environ["GITHUB_REPOSITORY"]
          EXPECTED_HEAD = os.environ["EXPECTED_HEAD"]
          BRANCH = "owner/staging-web-moderation-console"
          TOKEN = os.environ["GH_TOKEN"]
          FILES = [
              ".github/workflows/moderation-web-staging-deploy.yml",
              ".github/workflows/moderation-web-validation.yml",
              "moderation-web/package-lock.json",
              "moderation-web/src/index.js",
              "moderation-web/src/request-body.js",
              "moderation-web/test/request-body.test.mjs",
              "staff-bot/src/main/java/net/enthusia/staff/discordbot/ModerationPreviewWebConfig.java",
              "staff-bot/src/test/java/net/enthusia/staff/discordbot/ModerationPreviewWebConfigTest.java",
          ]
          TEMP_FILES = [
              ".github/workflows/pr186-lockfile-bootstrap.yml",
              "tools/pr186-final-review-repair.py",
          ]
          HEAD_REF = f"heads/{BRANCH}"
          HEAD_PATH = f"/repos/{REPOSITORY}/git/ref/{HEAD_REF}"
          UPDATE_PATH = f"/repos/{REPOSITORY}/git/refs/{HEAD_REF}"
          HEADERS = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {TOKEN}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(API + path, data=data, method=method, headers=HEADERS)
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read()
              return json.loads(raw) if raw else {}

          def require_expected_head():
              actual = api("GET", HEAD_PATH)["object"]["sha"]
              if actual != EXPECTED_HEAD:
                  raise SystemExit(f"branch moved: expected {EXPECTED_HEAD}, found {actual}")

          require_expected_head()
          parent = api("GET", f"/repos/{REPOSITORY}/git/commits/{EXPECTED_HEAD}")
          base_tree = parent["tree"]["sha"]
          entries = []
          for path in FILES:
              content = Path(path).read_text(encoding="utf-8")
              blob = api("POST", f"/repos/{REPOSITORY}/git/blobs", {"content": content, "encoding": "utf-8"})
              entries.append({"path": path, "mode": "100644", "type": "blob", "sha": blob["sha"]})
          for path in TEMP_FILES:
              entries.append({"path": path, "mode": "100644", "type": "blob", "sha": None})

          tree = api("POST", f"/repos/{REPOSITORY}/git/trees", {"base_tree": base_tree, "tree": entries})
          commit = api("POST", f"/repos/{REPOSITORY}/git/commits", {
              "message": "[PR186] Resolve final review security findings",
              "tree": tree["sha"],
              "parents": [EXPECTED_HEAD],
          })
          require_expected_head()
          api("PATCH", UPDATE_PATH, {"sha": commit["sha"], "force": False})
          print(f"Published consolidated repair commit {commit['sha']}")
          PY
