name: PR186 Final Review Repair

on:
  push:
    branches:
      - owner/staging-web-moderation-console
    paths:
      - ".github/workflows/pr186-lockfile-bootstrap.yml"

permissions:
  contents: write

jobs:
  repair:
    name: Apply and validate final review repairs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-read-only: true

      - name: Apply reviewed repairs
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/pr186-final-review-repair.py
          cd moderation-web
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json

      - name: Validate moderation web with locked dependencies
        working-directory: moderation-web
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts
          npm run check

      - name: Validate focused Java configuration tests
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x gradlew
          ./gradlew :staff-bot:test \
            --tests net.enthusia.staff.discordbot.ModerationPreviewWebConfigTest \
            --no-daemon \
            --no-build-cache \
            --no-configuration-cache \
            --console=plain
          git diff --check

      - name: Remove temporary repair scaffolding
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/pr186-lockfile-bootstrap.yml tools/pr186-final-review-repair.py

      - name: Commit consolidated repairs
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'P2wn'
          git config user.email 'racecarboy77@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m '[PR186] Resolve final review security findings'

      - name: Push validated repair commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
            push origin HEAD:owner/staging-web-moderation-console
