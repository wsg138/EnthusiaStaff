name: Temporary verifier cleanup patch

on:
  push:
    branches: [feature/readable-network-verify]
    paths: [.github/workflows/temp-verifier-cleanup-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/readable-network-verify
      - name: Apply narrow cleanup edits
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('velocity/src/main/java/net/enthusia/staff/velocity/EnthusiaStaffVelocityPlugin.java'): [
                  (
                      '                () -> websiteApiServer != null && websiteModerationStore != null,\n                dataDirectory\n        ));',
                      '                () -> websiteApiServer != null && websiteModerationStore != null\n        ));'
                  ),
                  (
                      '        next.whenComplete((ignored, failure) -> {',
                      '        var unused = next.whenComplete((ignored, failure) -> {'
                  ),
              ],
              Path('velocity/src/main/java/net/enthusia/staff/velocity/VelocityConfiguration.java'): [
                  ('raw.split(",")', 'raw.split(",", -1)'),
                  (
                      'return configured == null || configured.isBlank() ? defaultValue : bool(properties, key);',
                      'return (configured == null || configured.isBlank()) ? defaultValue : bool(properties, key);'
                  ),
              ],
              Path('velocity/src/main/java/net/enthusia/staff/velocity/DiscordEventRenderer.java'): [
                  (
                      'if (value == null || value.isNull() || value.isContainerNode() && !value.isArray()) {',
                      'if (value == null || value.isNull() || (value.isContainerNode() && !value.isArray())) {'
                  ),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text()
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one match for {old!r}, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - name: Commit cleanup
        run: |
          git config user.name "P2wn"
          git config user.email "racecarboy77@gmail.com"
          git add velocity/src/main/java/net/enthusia/staff/velocity/EnthusiaStaffVelocityPlugin.java \
                  velocity/src/main/java/net/enthusia/staff/velocity/VelocityConfiguration.java \
                  velocity/src/main/java/net/enthusia/staff/velocity/DiscordEventRenderer.java
          git commit -m "Clean verifier-adjacent Error Prone findings"
          git push origin HEAD:feature/readable-network-verify
