name: ES-P02 synchronize main

on:
  push:
    branches:
      - package/es-p02-runtime-db-recovery

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge current main and resolve package records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EnthusiaStaff package worker"
          git config user.email "noreply@enthusia.invalid"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_exit=$?
          set -e

          if [ "$merge_exit" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            expected=(
              "ai-agents/AGENTS.md"
              "ai-agents/UNIVERSAL-AGENT-PROMPT.md"
              "ai-agents/WORKSPACE-STATE.md"
              "ai-agents/reports/agent-handoffs/latest.md"
              "ai-agents/reports/package-handoffs/2026-08-05-es-p02-runtime-db-recovery.md"
              "ai-agents/work-packages/PACKAGE-REGISTRY.md"
              "ai-agents/work-packages/WORKER-PROTOCOL.md"
              "ai-agents/work-packages/packages/ES-P02.md"
            )
            if [ "${conflicts[*]}" != "${expected[*]}" ]; then
              printf 'Unexpected conflict set:\n%s\n' "${conflicts[*]}"
              exit 1
            fi

            git checkout --theirs -- \
              ai-agents/AGENTS.md \
              ai-agents/UNIVERSAL-AGENT-PROMPT.md \
              ai-agents/WORKSPACE-STATE.md \
              ai-agents/reports/agent-handoffs/latest.md \
              ai-agents/work-packages/PACKAGE-REGISTRY.md \
              ai-agents/work-packages/WORKER-PROTOCOL.md
            git checkout --ours -- \
              ai-agents/reports/package-handoffs/2026-08-05-es-p02-runtime-db-recovery.md \
              ai-agents/work-packages/packages/ES-P02.md
          fi

          git rm .github/workflows/es-p02-merge-diagnostic.yml
          git add -A
          git commit -m "merge(main): synchronize ES-P02 recovery branch"
          git push origin HEAD:package/es-p02-runtime-db-recovery
