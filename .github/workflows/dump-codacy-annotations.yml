name: Dump Codacy annotations

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/dump-codacy-annotations.yml"

permissions:
  contents: read
  checks: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Read exact-head Codacy annotations
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: "5703f0abca2d50c8f0bb5b648dfa24912a5cb426"
        shell: bash
        run: |
          set -Eeuo pipefail
          check_run_id=""
          for attempt in $(seq 1 180); do
            check_run_id="$(
              curl --fail --silent --show-error \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs?per_page=100" \
                | jq -r '
                    [.check_runs[]
                      | select(.app.slug == "codacy-production")
                      | select(.head_sha == env.HEAD_SHA)]
                    | sort_by(.id)
                    | last
                    | select(.status == "completed")
                    | .id // empty
                  '
            )"
            if [ -n "$check_run_id" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$check_run_id" ]; then
            echo "::error::Exact-head Codacy check did not complete in the bounded wait"
            exit 1
          fi
          echo "CODACY_CHECK_RUN_ID=$check_run_id"
          for page in 1 2 3 4; do
            echo "ANNOTATION_PAGE=$page"
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/check-runs/$check_run_id/annotations?per_page=100&page=$page" \
              | jq -c '.[] | {path,start_line,end_line,annotation_level,title,message,raw_details}'
          done

      - name: Triage public Codacy critical and high findings
        shell: bash
        run: |
          set -Eeuo pipefail
          base="https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/repositories/EnthusiaStaff/pull-requests/771/issues?limit=100&status=new"
          for cursor in 1 2; do
            url="$base"
            if [ "$cursor" = "2" ]; then url="$base&cursor=2"; fi
            curl --fail --silent --show-error -H "Accept: application/json" "$url" > "/tmp/codacy-issues-$cursor.json"
            echo "CODACY_PAGE=$cursor"
            jq -c '{count: (.data | length), pagination: .pagination}' "/tmp/codacy-issues-$cursor.json"
            jq -c '[.data[].commitIssue.patternInfo.severityLevel] | group_by(.) | map({level: .[0], count: length})' "/tmp/codacy-issues-$cursor.json"
            jq -c '.data[] | .commitIssue | select(.patternInfo.category == "Security") | {severity: .patternInfo.severityLevel, level: .patternInfo.level, pattern: .patternInfo.id, file: .filePath, line: .lineNumber, message: .message, lineText: .lineText}' "/tmp/codacy-issues-$cursor.json"
          done
