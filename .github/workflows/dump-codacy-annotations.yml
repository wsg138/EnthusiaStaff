name: Dump Codacy annotations

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/dump-codacy-annotations.yml"

permissions:
  contents: read
  checks: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Read exact-head Codacy annotations
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: "23e66070154eda7b4eb5e682577c4588956887d7"
        shell: bash
        run: |
          set -Eeuo pipefail
          check_run_id=""
          for attempt in $(seq 1 180); do
            check_run_id="$(
              curl --fail --silent --show-error \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs?per_page=100" \
                | jq -r '
                    [.check_runs[]
                      | select(.app.slug == "codacy-production")
                      | select(.head_sha == env.HEAD_SHA)]
                    | sort_by(.id)
                    | last
                    | select(.status == "completed")
                    | .id // empty
                  '
            )"
            if [ -n "$check_run_id" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$check_run_id" ]; then
            echo "::error::Exact-head Codacy check did not complete in the bounded wait"
            exit 1
          fi
          echo "CODACY_CHECK_RUN_ID=$check_run_id"
          for page in 1 2 3 4; do
            echo "ANNOTATION_PAGE=$page"
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/check-runs/$check_run_id/annotations?per_page=100&page=$page" \
              | jq -c '.[] | {path,start_line,end_line,annotation_level,title,message,raw_details}'
          done

      - name: Read public Codacy PR issue summary without credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          url="https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/repositories/EnthusiaStaff/pull-requests/765/issues?limit=100&status=new"
          if curl --silent --show-error --fail -H "Accept: application/json" "$url" > /tmp/codacy-issues.json; then
            echo "CODACY_PUBLIC_API_OK=true"
            jq -c '{total: (.data | length), sample: (.data // [] | .[:2]), pagination: .pagination}' /tmp/codacy-issues.json
            jq -c '(.data // [])[] | select((tostring | test("critical";"i"))) ' /tmp/codacy-issues.json
          else
            echo "CODACY_PUBLIC_API_UNAVAILABLE=true"
          fi
