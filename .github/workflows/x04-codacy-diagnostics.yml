name: X04 Codacy diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

jobs:
  codacy-issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Inspect branch issues through scoped Codacy CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${CODACY_PROJECT_TOKEN}"
          npm install --global @codacy/codacy-cloud-cli
          codacy issues gh wsg138 EnthusiaStaff \
            --branch package/es-x04-commend-provider \
            --output json > codacy-branch.json
          echo '=== JSON shape ==='
          jq 'if type == "array" then {type:"array",count:length,first:(.[0] // null)} else {type:(type),keys:(keys),sample:.} end' codacy-branch.json | head -c 12000
          echo
          echo '=== Commend component issue objects ==='
          jq '[.. | objects | select(((.filePath? // .path? // "") | startswith("components/enthusia-commend/")))]' codacy-branch.json
