name: X04 Codacy diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  codacy-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public Codacy PR findings
        shell: bash
        run: |
          set -Eeuo pipefail
          url='https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/repositories/EnthusiaStaff/pull-requests/152/issues?status=new&limit=1000'
          curl --fail --silent --show-error --location --header 'Accept: application/json' "$url" -o codacy.json
          jq '{pagination, count:(.data|length), issues:[.data[] | {id, filePath, lineNumber, message, patternInfo, toolInfo}]}' codacy.json
