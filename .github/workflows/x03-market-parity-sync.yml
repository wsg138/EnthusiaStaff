name: ES-X03 temporary Market parity sync

on:
  push:
    branches:
      - diagnostic/es-x03-codacy-20260904

permissions:
  contents: write

jobs:
  sync-market:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact Staff product branch
        uses: actions/checkout@v4
        with:
          ref: package/es-x03-market-provider
          fetch-depth: 0
          path: staff

      - name: Verify frozen Staff head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C staff rev-parse HEAD)"
          expected="2f4678db255ef4df74b0cc497538a35c4afa6a03"
          test "$actual" = "$expected" || {
            echo "Staff product head moved: expected $expected, got $actual" >&2
            exit 1
          }

      - name: Check out exact standalone Market product
        uses: actions/checkout@v4
        with:
          repository: wsg138/EnthusiaMarket
          ref: cc19fa966dcb155fa1743f5076fb5152e74bdf8f
          path: market
          persist-credentials: false

      - name: Allow repository-owned mirrored Market migrations
        shell: bash
        run: |
          set -euo pipefail
          marker='!components/enthusia-market/src/main/resources/migrations/*.sql'
          if ! grep -Fxq "$marker" staff/.gitignore; then
            cat >> staff/.gitignore <<'EOF'

          # Repository-owned mirrored Market migrations remain tracked.
          !components/enthusia-market/src/main/resources/migrations/*.sql
          EOF
          fi

      - name: Sync only proven divergent product paths
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            '.github/workflows/build.yml'
            'docs/db-schema.md'
            'docs/moderation-provider.md'
            'docs/requirements.md'
            'src/main/kotlin/net/badgersmc/em/application/AuctionLifecycleService.kt'
            'src/main/kotlin/net/badgersmc/em/application/SellOfferService.kt'
            'src/main/kotlin/net/badgersmc/em/application/StallBuyoutService.kt'
            'src/main/kotlin/net/badgersmc/em/infrastructure/moderation/JdbcMarketModerationStore.kt'
            'src/main/kotlin/net/badgersmc/em/infrastructure/moderation/MarketModerationProvider.kt'
            'src/main/kotlin/net/badgersmc/em/infrastructure/persistence/ShopModerationFenceQueries.kt'
            'src/main/kotlin/net/badgersmc/em/infrastructure/persistence/ShopRepositorySql.kt'
            'src/main/resources/migrations/V025__auction_duration.sql'
            'src/main/resources/migrations/V026__maintenance_freeze.sql'
            'src/main/resources/migrations/V027__unfreeze_owned_stalls.sql'
            'src/main/resources/migrations/V028__market_moderation_provider.sql'
            'src/test/kotlin/net/badgersmc/em/application/AuctionLifecycleServiceTest.kt'
            'src/test/kotlin/net/badgersmc/em/application/SellOfferServiceTest.kt'
            'src/test/kotlin/net/badgersmc/em/application/StallBuyoutServiceTest.kt'
            'src/test/kotlin/net/badgersmc/em/infrastructure/moderation/JdbcMarketModerationMariaDbTest.kt'
            'src/test/kotlin/net/badgersmc/em/infrastructure/moderation/JdbcMarketModerationStoreTest.kt'
            'wiki/docs/admins/troubleshooting.md'
          )
          for path in "${paths[@]}"; do
            mkdir -p "staff/components/enthusia-market/$(dirname "$path")"
            cp "market/$path" "staff/components/enthusia-market/$path"
          done

      - name: Prove full standalone-to-aggregate parity
        shell: bash
        run: |
          set -euo pipefail
          mismatch=0
          while IFS= read -r -d '' path; do
            target="staff/components/enthusia-market/$path"
            if [[ ! -f "$target" ]] || ! cmp -s "market/$path" "$target"; then
              echo "PARITY_MISMATCH $path" >&2
              mismatch=1
            fi
          done < <(git -C market ls-files -z)
          while IFS= read -r -d '' aggregate_path; do
            path="${aggregate_path#components/enthusia-market/}"
            [[ "$path" == 'COMPONENT-METADATA.md' ]] && continue
            if ! git -C market ls-files --error-unmatch -- "$path" >/dev/null 2>&1; then
              echo "AGGREGATE_ONLY_PATH $path" >&2
              mismatch=1
            fi
          done < <(git -C staff ls-files -z 'components/enthusia-market/**')
          test "$mismatch" -eq 0

      - name: Verify bounded diff
        shell: bash
        run: |
          set -euo pipefail
          git -C staff diff --check
          {
            git -C staff diff --name-only -- .gitignore components/enthusia-market
            git -C staff ls-files --others --exclude-standard -- components/enthusia-market
          } | sort -u > /tmp/actual
          cat > /tmp/expected <<'EOF'
          .gitignore
          components/enthusia-market/.github/workflows/build.yml
          components/enthusia-market/docs/db-schema.md
          components/enthusia-market/docs/moderation-provider.md
          components/enthusia-market/docs/requirements.md
          components/enthusia-market/src/main/kotlin/net/badgersmc/em/application/AuctionLifecycleService.kt
          components/enthusia-market/src/main/kotlin/net/badgersmc/em/application/SellOfferService.kt
          components/enthusia-market/src/main/kotlin/net/badgersmc/em/application/StallBuyoutService.kt
          components/enthusia-market/src/main/kotlin/net/badgersmc/em/infrastructure/moderation/JdbcMarketModerationStore.kt
          components/enthusia-market/src/main/kotlin/net/badgersmc/em/infrastructure/moderation/MarketModerationProvider.kt
          components/enthusia-market/src/main/kotlin/net/badgersmc/em/infrastructure/persistence/ShopModerationFenceQueries.kt
          components/enthusia-market/src/main/kotlin/net/badgersmc/em/infrastructure/persistence/ShopRepositorySql.kt
          components/enthusia-market/src/main/resources/migrations/V025__auction_duration.sql
          components/enthusia-market/src/main/resources/migrations/V026__maintenance_freeze.sql
          components/enthusia-market/src/main/resources/migrations/V027__unfreeze_owned_stalls.sql
          components/enthusia-market/src/main/resources/migrations/V028__market_moderation_provider.sql
          components/enthusia-market/src/test/kotlin/net/badgersmc/em/application/AuctionLifecycleServiceTest.kt
          components/enthusia-market/src/test/kotlin/net/badgersmc/em/application/SellOfferServiceTest.kt
          components/enthusia-market/src/test/kotlin/net/badgersmc/em/application/StallBuyoutServiceTest.kt
          components/enthusia-market/src/test/kotlin/net/badgersmc/em/infrastructure/moderation/JdbcMarketModerationMariaDbTest.kt
          components/enthusia-market/src/test/kotlin/net/badgersmc/em/infrastructure/moderation/JdbcMarketModerationStoreTest.kt
          components/enthusia-market/wiki/docs/admins/troubleshooting.md
          EOF
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Commit and fast-forward product branch
        shell: bash
        run: |
          set -euo pipefail
          git -C staff config user.name 'github-actions[bot]'
          git -C staff config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C staff add .gitignore components/enthusia-market
          git -C staff commit -m 'ES-X03: sync current Market hardening'
          git -C staff push origin HEAD:refs/heads/package/es-x03-market-provider
