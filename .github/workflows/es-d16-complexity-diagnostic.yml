name: ES-D16 complexity diagnostic

on:
  push:
    branches:
      - package/es-d16-moderation-read-bridge

permissions:
  contents: read

jobs:
  lizard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analyzer
        run: python -m pip install --disable-pip-version-check lizard==1.23.0
      - name: Analyze post-green D16 delta
        shell: bash
        run: |
          set -euo pipefail
          base=a77c77c4362e6a20b1ce190159f0a1632149a4c0
          git diff --name-only --diff-filter=ACMR "$base...HEAD" -- '*.java' '*.js' '*.mjs' > /tmp/es-d16-code.txt
          echo '=== changed source ==='
          cat /tmp/es-d16-code.txt
          echo '=== Codacy-style default warnings ==='
          while IFS= read -r file; do
            [[ -f "$file" ]] || continue
            echo "--- $file"
            lizard -w "$file" || true
          done < /tmp/es-d16-code.txt
          echo '=== project limits (CCN 8 / 50 lines / 5 params) ==='
          while IFS= read -r file; do
            [[ -f "$file" ]] || continue
            echo "--- $file"
            lizard -C 8 -L 50 -a 5 -w "$file" || true
          done < /tmp/es-d16-code.txt
