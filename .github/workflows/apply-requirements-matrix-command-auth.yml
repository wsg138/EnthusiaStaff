name: Apply requirements matrix checkpoint

on:
  push:
    branches:
      - section/command-authorization-hardening
    paths:
      - scripts/patch-requirements-matrix-command-auth.py
      - .github/workflows/apply-requirements-matrix-command-auth.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Apply guarded matrix update
        run: python3 scripts/patch-requirements-matrix-command-auth.py

      - name: Commit requirements matrix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/REQUIREMENTS-MATRIX.md
          git commit -m "Update production readiness checkpoint"
          git push origin "HEAD:${GITHUB_REF_NAME}"
