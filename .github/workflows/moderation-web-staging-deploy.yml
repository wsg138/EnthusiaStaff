name: Moderation Web Staging Deploy

on:
  push:
    branches:
      - main
      - package/es-d16-moderation-read-bridge
    paths:
      - "moderation-web/**"
      - "staff-bot/src/main/resources/moderation-preview/**"
      - ".github/workflows/moderation-web-staging-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_HOST: staff-staging.enthusia.info
  EXPECTED_ZONE: enthusia.info
  READ_BACKEND_HOST: moderation-read-staging.enthusia.info
  READ_TUNNEL_NAME: enthusia-moderation-read-staging

jobs:
  deploy:
    name: Deploy moderation web staging to Cloudflare
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    timeout-minutes: 20

    steps:
      - name: Check out exact commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Record source SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          test -n "$SOURCE_SHA"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Assert required protected configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BOT_TOKEN: ${{ secrets.ENTHUSIA_STAFF_BOT_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" ]]
          [[ -n "$BOT_TOKEN" ]]
          [[ "$READ_BACKEND_HOST" == 'moderation-read-staging.enthusia.info' ]]
          [[ "$READ_TUNNEL_NAME" == 'enthusia-moderation-read-staging' ]]

      - name: Resolve Cloudflare zone account
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -Eeuo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/zones?name=${EXPECTED_ZONE}&status=active")"
          printf '%s' "$response" | jq -e '.success == true' >/dev/null
          count="$(printf '%s' "$response" | jq '[.result[] | select(.name == env.EXPECTED_ZONE)] | length')"
          [[ "$count" == '1' ]]
          account_id="$(printf '%s' "$response" | jq -r '.result[] | select(.name == env.EXPECTED_ZONE) | .account.id')"
          zone_id="$(printf '%s' "$response" | jq -r '.result[] | select(.name == env.EXPECTED_ZONE) | .id')"
          [[ "$account_id" =~ ^[0-9a-f]{32}$ ]]
          [[ "$zone_id" =~ ^[0-9a-f]{32}$ ]]
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ZONE_ID=$zone_id" >> "$GITHUB_ENV"
          echo "Resolved ${EXPECTED_ZONE} to its owning Cloudflare account." >> "$GITHUB_STEP_SUMMARY"

      - name: Provision fixed moderation read tunnel and hostname
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -Eeuo pipefail
          api_base='https://api.cloudflare.com/client/v4'
          auth_header="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          tunnels="$(curl --fail-with-body --silent --show-error --get \
            -H "$auth_header" -H 'Content-Type: application/json' \
            --data-urlencode "name=${READ_TUNNEL_NAME}" \
            --data-urlencode 'is_deleted=false' \
            --data-urlencode 'per_page=100' \
            "${api_base}/accounts/${CLOUDFLARE_ACCOUNT_ID}/cfd_tunnel")"
          printf '%s' "$tunnels" | jq -e '.success == true' >/dev/null
          tunnel_count="$(printf '%s' "$tunnels" | jq --arg name "$READ_TUNNEL_NAME" '[.result[] | select(.name == $name and .deleted_at == null)] | length')"

          if [[ "$tunnel_count" == '0' ]]; then
            payload="$(jq -cn --arg name "$READ_TUNNEL_NAME" '{name:$name, config_src:"cloudflare"}')"
            created="$(curl --fail-with-body --silent --show-error \
              -X POST -H "$auth_header" -H 'Content-Type: application/json' \
              --data "$payload" \
              "${api_base}/accounts/${CLOUDFLARE_ACCOUNT_ID}/cfd_tunnel")"
            printf '%s' "$created" | jq -e '.success == true and .result.config_src == "cloudflare"' >/dev/null
            tunnel_id="$(printf '%s' "$created" | jq -r '.result.id')"
            tunnel_created='yes'
          elif [[ "$tunnel_count" == '1' ]]; then
            tunnel_id="$(printf '%s' "$tunnels" | jq -r --arg name "$READ_TUNNEL_NAME" '.result[] | select(.name == $name and .deleted_at == null) | .id')"
            config_src="$(printf '%s' "$tunnels" | jq -r --arg name "$READ_TUNNEL_NAME" '.result[] | select(.name == $name and .deleted_at == null) | .config_src')"
            [[ "$config_src" == 'cloudflare' ]] || {
              echo '::error::Existing moderation read tunnel is not remotely managed; refusing to repurpose it.'
              exit 1
            }
            tunnel_created='no'
          else
            echo '::error::Multiple active moderation read tunnels share the protected staging name.'
            exit 1
          fi
          [[ "$tunnel_id" =~ ^[0-9a-fA-F-]{36}$ ]]

          ingress="$(jq -cn --arg host "$READ_BACKEND_HOST" '{config:{ingress:[{hostname:$host,service:"http://127.0.0.1:8766"},{service:"http_status:404"}]}}')"
          configured="$(curl --fail-with-body --silent --show-error \
            -X PUT -H "$auth_header" -H 'Content-Type: application/json' \
            --data "$ingress" \
            "${api_base}/accounts/${CLOUDFLARE_ACCOUNT_ID}/cfd_tunnel/${tunnel_id}/configurations")"
          printf '%s' "$configured" | jq -e --arg host "$READ_BACKEND_HOST" '
            .success == true
            and .result.config.ingress[0].hostname == $host
            and .result.config.ingress[0].service == "http://127.0.0.1:8766"
            and .result.config.ingress[1].service == "http_status:404"' >/dev/null

          records="$(curl --fail-with-body --silent --show-error --get \
            -H "$auth_header" -H 'Content-Type: application/json' \
            --data-urlencode "name=${READ_BACKEND_HOST}" \
            --data-urlencode 'per_page=100' \
            "${api_base}/zones/${CLOUDFLARE_ZONE_ID}/dns_records")"
          printf '%s' "$records" | jq -e '.success == true' >/dev/null
          record_count="$(printf '%s' "$records" | jq --arg name "$READ_BACKEND_HOST" '[.result[] | select(.name == $name)] | length')"
          cname_target="${tunnel_id}.cfargotunnel.com"
          dns_payload="$(jq -cn \
            --arg name "$READ_BACKEND_HOST" \
            --arg content "$cname_target" \
            '{type:"CNAME",name:$name,content:$content,ttl:1,proxied:true,comment:"ES-D16 staging moderation read bridge"}')"

          if [[ "$record_count" == '0' ]]; then
            dns_result="$(curl --fail-with-body --silent --show-error \
              -X POST -H "$auth_header" -H 'Content-Type: application/json' \
              --data "$dns_payload" \
              "${api_base}/zones/${CLOUDFLARE_ZONE_ID}/dns_records")"
          elif [[ "$record_count" == '1' ]]; then
            record_type="$(printf '%s' "$records" | jq -r --arg name "$READ_BACKEND_HOST" '.result[] | select(.name == $name) | .type')"
            [[ "$record_type" == 'CNAME' ]] || {
              echo '::error::Protected moderation backend hostname is occupied by a non-CNAME record; refusing to overwrite it.'
              exit 1
            }
            record_id="$(printf '%s' "$records" | jq -r --arg name "$READ_BACKEND_HOST" '.result[] | select(.name == $name) | .id')"
            [[ "$record_id" =~ ^[0-9a-f]{32}$ ]]
            dns_result="$(curl --fail-with-body --silent --show-error \
              -X PATCH -H "$auth_header" -H 'Content-Type: application/json' \
              --data "$dns_payload" \
              "${api_base}/zones/${CLOUDFLARE_ZONE_ID}/dns_records/${record_id}")"
          else
            echo '::error::Protected moderation backend hostname has multiple DNS records; refusing ambiguous replacement.'
            exit 1
          fi
          printf '%s' "$dns_result" | jq -e --arg name "$READ_BACKEND_HOST" --arg content "$cname_target" '
            .success == true
            and .result.type == "CNAME"
            and .result.name == $name
            and .result.content == $content
            and .result.proxied == true' >/dev/null

          echo "READ_TUNNEL_ID=$tunnel_id" >> "$GITHUB_ENV"
          {
            echo '### Private moderation read transport'
            echo
            echo "- tunnel: \`${READ_TUNNEL_NAME}\` (created this run: ${tunnel_created})"
            echo "- hostname: \`https://${READ_BACKEND_HOST}\`"
            echo '- origin ingress: `http://127.0.0.1:8766`'
            echo '- direct public origin port: **not configured**'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate Cloudflare application
        working-directory: moderation-web
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts
          npm run check
          [[ "$SOURCE_SHA" == "$(git -C .. rev-parse HEAD)" ]]

      - name: Deploy Worker with derived staging bridge secrets
        working-directory: moderation-web
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BOT_TOKEN: ${{ secrets.ENTHUSIA_STAFF_BOT_TOKEN }}
        run: |
          set -Eeuo pipefail
          secrets_file="$(mktemp)"
          cleanup() { rm -f "$secrets_file"; }
          trap cleanup EXIT
          chmod 600 "$secrets_file"

          python3 - "$secrets_file" <<'PY'
          import hashlib
          import json
          import os
          import sys

          token = os.environ['BOT_TOKEN'].strip()
          if not token or any(ch.isspace() for ch in token):
              raise SystemExit('protected bot token is empty or malformed')
          launch_key_hex = hashlib.sha256(
              b'enthusia-staff-moderation-launch-v1\0' + token.encode('utf-8')
          ).hexdigest()
          read_key_hex = hashlib.sha256(
              b'enthusia-staff-moderation-read-api-v1\0' + token.encode('utf-8')
          ).hexdigest()
          with open(sys.argv[1], 'w', encoding='utf-8') as handle:
              json.dump({
                  'LAUNCH_SIGNING_KEY_HEX': launch_key_hex,
                  'READ_API_SIGNING_KEY_HEX': read_key_hex,
              }, handle)
          PY
          unset BOT_TOKEN

          npx wrangler deploy --secrets-file "$secrets_file"
          rm -f "$secrets_file"
          trap - EXIT

      - name: Verify permanent staging origin
        shell: bash
        run: |
          set -Eeuo pipefail

          health=''
          for attempt in $(seq 1 30); do
            if candidate="$(curl --fail --silent --show-error --max-time 20 "https://${EXPECTED_HOST}/health" 2>/dev/null)" \
              && printf '%s' "$candidate" | jq -e '.status == "ok" and .environment == "staging" and .mode == "simulation-only"' >/dev/null 2>&1; then
              health="$candidate"
              break
            fi
            echo "Waiting for Cloudflare DNS/TLS propagation (${attempt}/30)..."
            sleep 10
          done

          [[ -n "$health" ]]

          root_status="$(curl --fail-with-body --silent --output root.out --write-out '%{http_code}' --max-time 20 "https://${EXPECTED_HOST}/" || true)"
          [[ "$root_status" == '401' ]]
          grep -Fqx 'Open this panel from Discord.' root.out
          rm -f root.out

      - name: Verify live launch, session and replay contract
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.ENTHUSIA_STAFF_BOT_TOKEN }}
        run: |
          set -Eeuo pipefail
          ticket_file="$(mktemp)"
          cookie_jar="$(mktemp)"
          launch_headers="$(mktemp)"
          launch_body="$(mktemp)"
          panel_body="$(mktemp)"
          replay_body="$(mktemp)"
          cleanup() {
            rm -f "$ticket_file" "$cookie_jar" "$launch_headers" "$launch_body" \
              "$panel_body" "$replay_body"
          }
          trap cleanup EXIT
          chmod 600 "$ticket_file" "$cookie_jar"

          python3 - "$ticket_file" "$EXPECTED_HOST" <<'PY'
          import base64
          import hashlib
          import hmac
          import os
          import secrets
          import sys
          import time
          import urllib.parse

          output_path, host = sys.argv[1:]
          bot_token = os.environ['BOT_TOKEN'].strip()
          if not bot_token or any(ch.isspace() for ch in bot_token):
              raise SystemExit('protected bot token is empty or malformed')
          key = hashlib.sha256(b'enthusia-staff-moderation-launch-v1\0' + bot_token.encode('utf-8')).digest()
          now = int(time.time())
          nonce = base64.urlsafe_b64encode(secrets.token_bytes(24)).rstrip(b'=').decode('ascii')
          body = f'v1|staging|{nonce}|846729778400460871|1410303324745371709|discord:846729778400460871|{now}|{now + 120}'
          encoded = base64.urlsafe_b64encode(body.encode('utf-8')).rstrip(b'=').decode('ascii')
          signature = base64.urlsafe_b64encode(hmac.new(key, encoded.encode('ascii'), hashlib.sha256).digest()).rstrip(b'=').decode('ascii')
          token = f'{encoded}.{signature}'
          with open(output_path, 'w', encoding='utf-8') as handle:
              handle.write(f'https://{host}/launch?t={urllib.parse.quote(token, safe="")}')
          PY
          unset BOT_TOKEN

          first_status="$(curl --silent --show-error \
            --cookie-jar "$cookie_jar" \
            --output "$launch_body" \
            --dump-header "$launch_headers" \
            --write-out '%{http_code}' \
            --max-time 20 \
            "$(cat "$ticket_file")")"
          if [[ "$first_status" != '303' ]]; then
            echo "Live first-use launch returned HTTP ${first_status}; expected 303." >&2
            cat "$launch_body" >&2
            exit 1
          fi

          location="$(awk 'BEGIN { IGNORECASE=1 } /^location:/ { sub(/\r$/, ""); sub(/^[^:]+:[[:space:]]*/, ""); print; exit }' "$launch_headers")"
          if [[ "$location" != '/moderation' ]]; then
            echo "Live launch redirect target was unexpected: ${location:-<missing>}" >&2
            exit 1
          fi

          panel_status="$(curl --silent --show-error \
            --cookie "$cookie_jar" \
            --output "$panel_body" \
            --write-out '%{http_code}' \
            --max-time 20 \
            "https://${EXPECTED_HOST}/moderation")"
          if [[ "$panel_status" != '200' ]]; then
            echo "Authenticated moderation panel returned HTTP ${panel_status}; expected 200." >&2
            cat "$panel_body" >&2
            exit 1
          fi

          replay_status="$(curl --silent --show-error \
            --output "$replay_body" \
            --write-out '%{http_code}' \
            --max-time 20 \
            "$(cat "$ticket_file")")"
          if [[ "$replay_status" != '401' ]]; then
            echo "Launch replay returned HTTP ${replay_status}; expected 401." >&2
            exit 1
          fi
          grep -Fqx 'This moderation link is invalid, expired, or already used.' "$replay_body"

          cleanup
          trap - EXIT

          {
            echo '## Moderation web staging deployment'
            echo
            echo "- exact source: \`$SOURCE_SHA\`"
            echo "- host: \`https://${EXPECTED_HOST}\`"
            echo '- Worker + protected assets: **PASS**'
            echo '- Durable Object/session configuration: **deployed**'
            echo '- fixed private read hostname/tunnel configuration: **deployed**'
            echo '- DNS/TLS propagation: **PASS**'
            echo '- unauthenticated workspace rejection: **PASS**'
            echo '- protected-secret launch ticket first use: **PASS**'
            echo '- authenticated browser session: **PASS**'
            echo '- one-time launch replay rejection: **PASS**'
            echo '- runtime mode: **staging simulation only**'
            echo '- Discord bot token uploaded to Cloudflare: **NO**'
          } >> "$GITHUB_STEP_SUMMARY"
