name: Pi staging outcome diagnostics

on:
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Follow current-head Pi staging result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          auth=(-H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -H "Authorization: Bearer ${GH_TOKEN}")
          run_id=''
          status=''
          conclusion=''

          for attempt in $(seq 1 210); do
            runs="$(curl --fail --silent --show-error "${auth[@]}" \
              "${api}/actions/workflows/pi-staging-check.yml/runs?event=pull_request_target&per_page=100")"
            run_id="$(jq -r --arg sha "$HEAD_SHA" --argjson pr "$PR_NUMBER" '
              [.workflow_runs[]
                | select(.head_sha == $sha)
                | select(any(.pull_requests[]?; .number == $pr))]
              | sort_by(.created_at) | reverse | .[0].id // empty
            ' <<<"$runs")"
            if [[ -n "$run_id" ]]; then
              run="$(curl --fail --silent --show-error "${auth[@]}" "${api}/actions/runs/${run_id}")"
              status="$(jq -r '.status' <<<"$run")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
              echo "Pi source run ${run_id}: ${status} ${conclusion:-pending}"
              if [[ "$status" == 'completed' ]]; then
                break
              fi
            else
              echo "Current-head Pi run not visible yet (attempt ${attempt}/210)."
            fi
            sleep 10
          done

          if [[ -z "$run_id" || "$status" != 'completed' ]]; then
            echo 'Current-head Pi staging run did not complete within the diagnostic window.' >&2
            exit 1
          fi

          echo "SOURCE_PI_RUN_ID=$run_id"
          jobs="$(curl --fail --silent --show-error "${auth[@]}" "${api}/actions/runs/${run_id}/jobs?per_page=100")"
          echo '=== SOURCE JOBS ==='
          jq -r '.jobs[] | {id,name,status,conclusion,started_at,completed_at,failed_steps:[.steps[]? | select((.conclusion // .status) != "success" and (.conclusion // .status) != "skipped") | {number,name,status,conclusion}]}' <<<"$jobs"

          if [[ "$conclusion" == 'success' ]]; then
            echo "Pi staging passed for ${HEAD_SHA}."
            exit 0
          fi

          while IFS=$'\t' read -r job_id job_name; do
            [[ -n "$job_id" ]] || continue
            echo "=== FAILED SOURCE JOB LOG: $job_name ($job_id) ==="
            curl --fail --silent --show-error --location "${auth[@]}" \
              "${api}/actions/jobs/${job_id}/logs" -o "/tmp/${job_id}.log" || continue
            tail -n 500 "/tmp/${job_id}.log"
          done < <(jq -r '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled") | [.id,.name] | @tsv' <<<"$jobs")

          artifacts="$(curl --fail --silent --show-error "${auth[@]}" "${api}/actions/runs/${run_id}/artifacts?per_page=100")"
          artifact_id="$(jq -r '[.artifacts[] | select(.expired == false and (.name | startswith("pi-staging-failure-")))] | .[0].id // empty' <<<"$artifacts")"
          if [[ -n "$artifact_id" ]]; then
            mkdir -p /tmp/pi-failure
            curl --fail --silent --show-error --location "${auth[@]}" \
              "${api}/actions/artifacts/${artifact_id}/zip" -o /tmp/pi-failure.zip
            unzip -q /tmp/pi-failure.zip -d /tmp/pi-failure
            echo '=== SANITIZED FAILURE SUMMARY ==='
            find /tmp/pi-failure -type f -name 'failure-summary.md' -exec cat {} \;
            echo '=== SANITIZED PI EVIDENCE SUMMARY ==='
            find /tmp/pi-failure -type f -name 'summary.txt' -print -exec cat {} \;
            echo '=== SANITIZED STORAGE BOOTSTRAP EVIDENCE ==='
            find /tmp/pi-failure -type f -name '*storage-bootstrap.txt' -print -exec cat {} \;
            echo '=== SANITIZED STARTUP ERROR LINES ==='
            find /tmp/pi-failure -type f -name '*-start.log' -print \
              -exec grep -nEi 'error|exception|failed|failure|severe|timeout|MODE_BLOCKED|bootstrap|flyway|checksum' {} \; || true
          fi
          exit 1
