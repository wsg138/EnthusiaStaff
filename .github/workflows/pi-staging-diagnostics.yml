name: Pi staging failure diagnostics

on:
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Locate and report latest completed Pi failure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          auth=(-H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -H "Authorization: Bearer ${GH_TOKEN}")
          runs="$(curl --fail --silent --show-error "${auth[@]}" "${api}/actions/workflows/pi-staging-check.yml/runs?event=pull_request_target&per_page=100")"
          run_id="$(jq -r --argjson pr "$PR_NUMBER" '
            [.workflow_runs[]
              | select(.status == "completed" and .conclusion != "success")
              | select(any(.pull_requests[]?; .number == $pr))]
            | sort_by(.created_at) | reverse | .[0].id // empty
          ' <<<"$runs")"
          if [[ -z "$run_id" ]]; then
            echo 'No completed failing Pi staging run was found for this PR.'
            jq -r --argjson pr "$PR_NUMBER" '.workflow_runs[] | select(any(.pull_requests[]?; .number == $pr)) | [.id,.status,.conclusion,.created_at,.html_url] | @tsv' <<<"$runs"
            exit 1
          fi
          echo "SOURCE_PI_RUN_ID=$run_id"
          jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | {id,status,conclusion,created_at,updated_at,html_url,display_title,head_sha,event}' <<<"$runs"

          jobs="$(curl --fail --silent --show-error "${auth[@]}" "${api}/actions/runs/${run_id}/jobs?per_page=100")"
          echo '=== SOURCE JOBS ==='
          jq -r '.jobs[] | {id,name,status,conclusion,started_at,completed_at,failed_steps:[.steps[]? | select((.conclusion // .status) != "success" and (.conclusion // .status) != "skipped") | {number,name,status,conclusion}]}' <<<"$jobs"

          while IFS=$'\t' read -r job_id job_name; do
            [[ -n "$job_id" ]] || continue
            echo "=== FAILED SOURCE JOB LOG: $job_name ($job_id) ==="
            curl --fail --silent --show-error --location "${auth[@]}" "${api}/actions/jobs/${job_id}/logs" -o "/tmp/${job_id}.log" || continue
            tail -n 500 "/tmp/${job_id}.log"
          done < <(jq -r '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled") | [.id,.name] | @tsv' <<<"$jobs")

          artifacts="$(curl --fail --silent --show-error "${auth[@]}" "${api}/actions/runs/${run_id}/artifacts?per_page=100")"
          echo '=== SOURCE ARTIFACTS ==='
          jq -r '.artifacts[] | [.id,.name,.expired] | @tsv' <<<"$artifacts"
          artifact_id="$(jq -r '[.artifacts[] | select(.expired == false and (.name | startswith("pi-staging-failure-")))] | .[0].id // empty' <<<"$artifacts")"
          if [[ -n "$artifact_id" ]]; then
            mkdir -p /tmp/pi-failure
            curl --fail --silent --show-error --location "${auth[@]}" "${api}/actions/artifacts/${artifact_id}/zip" -o /tmp/pi-failure.zip
            unzip -q /tmp/pi-failure.zip -d /tmp/pi-failure
            echo '=== SANITIZED FAILURE SUMMARY ==='
            find /tmp/pi-failure -type f -name 'failure-summary.md' -exec cat {} \;
            echo '=== SANITIZED STAGING JOB LOGS ==='
            find /tmp/pi-failure -type f -path '*/job-logs/*.log' -print -exec tail -n 500 {} \;
            echo '=== SANITIZED PI EVIDENCE SUMMARY ==='
            find /tmp/pi-failure -type f -name 'summary.txt' -print -exec cat {} \;
            echo '=== SANITIZED STORAGE BOOTSTRAP EVIDENCE ==='
            find /tmp/pi-failure -type f -name '*storage-bootstrap.txt' -print -exec cat {} \;
            echo '=== SANITIZED STARTUP ERROR LINES ==='
            find /tmp/pi-failure -type f -name '*-start.log' -print -exec grep -nEi 'error|exception|failed|failure|severe|timeout|MODE_BLOCKED|bootstrap' {} \; || true
          fi
