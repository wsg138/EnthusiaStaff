name: PR239 static diagnostics

on:
  push:
    branches:
      - diag/pr239-codacy-70995a4

permissions:
  contents: read

jobs:
  static-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install analyzers
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check lizard==1.23.0
          curl -fsSL -o /tmp/pmd.zip 'https://github.com/pmd/pmd/releases/download/pmd_releases%2F6.55.0/pmd-bin-6.55.0.zip'
          unzip -q /tmp/pmd.zip -d /tmp
      - name: Print Lizard findings
        shell: bash
        run: |
          set +e
          lizard \
            paper/src/test/java/net/enthusia/staff/paper/AllFeatureSurfaceContractTest.java \
            paper/src/test/java/net/enthusia/staff/paper/command/StaffChatCommandTest.java \
            -C 8 -L 50 -a 8 -w
          status=$?
          echo "LIZARD_EXIT=$status"
          exit 0
      - name: Print PMD findings
        shell: bash
        run: |
          set +e
          /tmp/pmd-bin-6.55.0/bin/run.sh pmd \
            -d paper/src/test/java/net/enthusia/staff/paper/AllFeatureSurfaceContractTest.java,paper/src/test/java/net/enthusia/staff/paper/command/StaffChatCommandTest.java \
            -R ruleset.xml \
            -f text
          status=$?
          echo "PMD_EXIT=$status"
          exit 0
