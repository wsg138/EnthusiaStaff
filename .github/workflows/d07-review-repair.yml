name: D07 final review repair

on:
  push:
    branches:
      - "package/es-d07-discord-punishment-enforcement"

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == '[ES-D07] Retry final review repairs'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Apply reviewed D07 corrections
        run: python3 .github/d07-review-repair.py

      - name: Run focused staff-bot verification
        run: ./gradlew --no-daemon --no-configuration-cache :staff-bot:test :staff-bot:verifyStaffBotRuntime

      - name: Require repository PMD on changed Java
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://github.com/pmd/pmd/releases/download/pmd_releases%2F6.55.0/pmd-bin-6.55.0.zip' \
            --output /tmp/pmd.zip
          unzip -q /tmp/pmd.zip -d /tmp
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.java')
          input="$(IFS=,; echo "${files[*]}")"
          /tmp/pmd-bin-6.55.0/bin/run.sh pmd -d "$input" -R ruleset.xml -f text -r /tmp/pmd.txt
          cat /tmp/pmd.txt

      - name: Require changed Java under package complexity limits
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet lizard
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.java')
          lizard -l java -C 8 -L 50 -w "${files[@]}"

      - name: Commit validated review repairs and remove temporary repair files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/d07-review-repair.py .github/workflows/d07-review-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(es-d07): close enforcement recovery and authorization gaps'
          git push origin HEAD:package/es-d07-discord-punishment-enforcement
