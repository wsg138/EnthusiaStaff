name: Apply missing replay test helper

on:
  push:
    branches:
      - section/punishment-request-notifications-recovery

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-replay-test-helper]')
    name: Apply exact compile fix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out helper commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Apply helper and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "3e05a5e4a3545437431e5351e8e1f96e1db9c9c7"
          gzip -dc .github/missing-helper.patch.gz > /tmp/missing-helper.patch
          git apply --check /tmp/missing-helper.patch
          git apply --index /tmp/missing-helper.patch
          git rm .github/missing-helper.patch.gz .github/workflows/apply-missing-replay-test-helper.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add concurrent replay test fixture"
          git push origin HEAD:section/punishment-request-notifications-recovery
