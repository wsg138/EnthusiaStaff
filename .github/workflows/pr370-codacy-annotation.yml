name: PR370 Codacy Annotation Diagnostic

on:
  push:
    branches:
      - diagnostic/370-codacy-annotation

permissions:
  contents: read
  checks: read

jobs:
  annotations:
    runs-on: ubuntu-latest
    steps:
      - name: Print exact-head Codacy annotations
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: 3d8550a5702de481fcc2b5e1612c025b626e1593
        shell: bash
        run: |
          set -Eeuo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/commits/$SOURCE_SHA/check-runs?per_page=100")"
          check_id="$(printf '%s' "$response" | jq -r '[.check_runs[] | select(.app.slug=="codacy-production")] | sort_by(.id) | last | .id // empty')"
          test -n "$check_id"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/check-runs/$check_id/annotations?per_page=100" \
            | jq -c '.[] | {path,start_line,end_line,annotation_level,title,message,raw_details}'
