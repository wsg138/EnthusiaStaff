name: Codacy high finding audit once

on:
  push:
    branches:
      - section/punishment-request-notifications-recovery

permissions:
  contents: write

jobs:
  audit:
    if: contains(github.event.head_commit.message, '[codacy-high-audit]')
    name: Export exact high and security findings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
    steps:
      - name: Check out audit commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Query exact PR branch findings
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CODACY_PROJECT_TOKEN}"
          cat > high-request.json <<'JSON'
          {"branchName":"section/punishment-request-notifications-recovery","levels":["Error"],"categories":["ErrorProne"]}
          JSON
          cat > security-request.json <<'JSON'
          {"branchName":"section/punishment-request-notifications-recovery","levels":["Error","Warning"],"categories":["Security"]}
          JSON
          for item in high-errorprone security; do
            request="${item}-request.json"
            if [[ "${item}" == "high-errorprone" ]]; then request=high-request.json; fi
            curl --fail-with-body --silent --show-error \
              -X POST 'https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/repositories/EnthusiaStaff/issues/search?limit=100' \
              -H "project-token: ${CODACY_PROJECT_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data @"${request}" > "codacy-${item}.json"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ('codacy-high-errorprone.json', 'codacy-security.json'):
              payload=json.loads(Path(name).read_text())
              print(name, 'count=', len(payload.get('data', [])))
              for issue in payload.get('data', []):
                  print(json.dumps({
                      'issueId': issue.get('issueId'),
                      'filePath': issue.get('filePath'),
                      'lineNumber': issue.get('lineNumber'),
                      'message': issue.get('message'),
                      'patternInfo': issue.get('patternInfo'),
                      'commitInfo': issue.get('commitInfo'),
                  }, sort_keys=True))
          PY

      - name: Upload audit result
        uses: actions/upload-artifact@v7
        with:
          name: codacy-high-audit
          path: |
            codacy-high-errorprone.json
            codacy-security.json
          if-no-files-found: error
          retention-days: 1

      - name: Remove audit workflow and temporary branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/codacy-high-audit-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove one-time Codacy audit workflow"
          git push origin HEAD:section/punishment-request-notifications-recovery
          git push origin --delete codacy-audit-temp || true

# Registered in the preceding commit; this commit triggers the one-time audit.
