name: PMD diagnostics

on:
  push:
    branches:
      - feature/escalation-policy-aliases

permissions:
  contents: read

jobs:
  pmd:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select changed Java files
        shell: bash
        run: |
          git diff --name-only 4f7165adced48d98bce86730e89b92944afba063 HEAD -- '*.java' > changed-java.txt
          cat changed-java.txt
          test -s changed-java.txt

      - name: Run PMD Best Practices and Error Prone rules
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output pmd.zip \
            https://github.com/pmd/pmd/releases/download/pmd_releases/7.24.0/pmd-dist-7.24.0-bin.zip
          unzip -q pmd.zip
          pmd-bin-7.24.0/bin/pmd check \
            --file-list changed-java.txt \
            --rulesets category/java/bestpractices.xml,category/java/errorprone.xml \
            --format text \
            --minimum-priority 5 \
            --no-cache \
            --fail-on-violation false
