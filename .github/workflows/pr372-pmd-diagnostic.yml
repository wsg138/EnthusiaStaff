name: PR372 PMD Diagnostic

on:
  push:
    branches:
      - fix/detached-session-recovery

permissions:
  contents: read

jobs:
  pmd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run repository PMD rules on changed Java
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/pmd/pmd/releases/download/pmd_releases%2F6.55.0/pmd-bin-6.55.0.zip" \
            -o /tmp/pmd.zip
          unzip -q /tmp/pmd.zip -d /tmp
          set +e
          /tmp/pmd-bin-6.55.0/bin/run.sh pmd \
            -d paper/src/main/java/net/enthusia/staff/paper/staff/DetachedStaffSessionRecoveryPolicy.java,paper/src/main/java/net/enthusia/staff/paper/staff/StaffModeManager.java,paper/src/test/java/net/enthusia/staff/paper/staff/DetachedStaffRecoveryWiringTest.java,paper/src/test/java/net/enthusia/staff/paper/staff/DetachedStaffSessionRecoveryPolicyTest.java,persistence/src/main/java/net/enthusia/staff/persistence/JdbcStaffSessionStore.java,integration-tests/src/test/java/net/enthusia/staff/integration/StaffSessionShutdownRecoveryIntegrationTest.java \
            -R ruleset.xml \
            -f text \
            -r /tmp/pmd.txt
          pmd_status=$?
          set -e
          cat /tmp/pmd.txt
          if [ "$pmd_status" -ne 0 ] && [ "$pmd_status" -ne 4 ]; then
            exit "$pmd_status"
          fi
