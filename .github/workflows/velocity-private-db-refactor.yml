name: Temporary Velocity DB fallback refactor

on:
  push:
    branches:
      - fix/velocity-private-db-file-fallback

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/velocity-private-db-file-fallback
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Refactor credential source boundary
        shell: python
        run: |
          from pathlib import Path

          path = Path('velocity/src/main/java/net/enthusia/staff/velocity/VelocityConfiguration.java')
          text = path.read_text(encoding='utf-8')
          old = '''    public DatabaseConfig database(Path dataDirectory) {\n        return databaseFromPrivateFileOrEnvironment(\n                dataDirectory,\n                jdbcUrlEnvironment,\n                usernameEnvironment,\n                passwordEnvironment,\n                "db.jdbc-url",\n                "db.username",\n                "db.password",\n                maximumPoolSize,\n                connectionTimeoutMillis,\n                "MariaDB"\n        );\n    }\n\n    public DatabaseConfig liteBansDatabaseFromEnvironment() {\n'''
          new = '''    public DatabaseConfig database(Path dataDirectory) {\n        DatabaseCredentialSource source = new DatabaseCredentialSource(\n                jdbcUrlEnvironment,\n                usernameEnvironment,\n                passwordEnvironment,\n                "db.jdbc-url",\n                "db.username",\n                "db.password"\n        );\n        return databaseFromPrivateFileOrEnvironment(\n                dataDirectory, source, maximumPoolSize, connectionTimeoutMillis, "MariaDB"\n        );\n    }\n\n    public DatabaseConfig liteBansDatabaseFromEnvironment() {\n'''
          if text.count(old) != 1:
              raise SystemExit('Staff credential-source block not found exactly once')
          text = text.replace(old, new, 1)

          old = '''    public DatabaseConfig liteBansDatabase(Path dataDirectory) {\n        return databaseFromPrivateFileOrEnvironment(\n                dataDirectory,\n                liteBansJdbcUrlEnvironment,\n                liteBansUsernameEnvironment,\n                liteBansPasswordEnvironment,\n                "litebans.jdbc-url",\n                "litebans.username",\n                "litebans.password",\n                liteBansMaximumPoolSize,\n                liteBansConnectionTimeoutMillis,\n                "LiteBans database"\n        );\n    }\n\n    private static DatabaseConfig databaseFromPrivateFileOrEnvironment(\n            Path dataDirectory,\n            String urlEnvironment,\n            String usernameEnvironment,\n            String passwordEnvironment,\n            String urlKey,\n            String usernameKey,\n            String passwordKey,\n            int poolSize,\n            long timeoutMillis,\n            String label\n    ) {\n        String url = System.getenv(urlEnvironment);\n        String username = System.getenv(usernameEnvironment);\n        String password = System.getenv(passwordEnvironment);\n'''
          new = '''    public DatabaseConfig liteBansDatabase(Path dataDirectory) {\n        DatabaseCredentialSource source = new DatabaseCredentialSource(\n                liteBansJdbcUrlEnvironment,\n                liteBansUsernameEnvironment,\n                liteBansPasswordEnvironment,\n                "litebans.jdbc-url",\n                "litebans.username",\n                "litebans.password"\n        );\n        return databaseFromPrivateFileOrEnvironment(\n                dataDirectory, source, liteBansMaximumPoolSize, liteBansConnectionTimeoutMillis, "LiteBans database"\n        );\n    }\n\n    private static DatabaseConfig databaseFromPrivateFileOrEnvironment(\n            Path dataDirectory,\n            DatabaseCredentialSource source,\n            int poolSize,\n            long timeoutMillis,\n            String label\n    ) {\n        String url = System.getenv(source.urlEnvironment());\n        String username = System.getenv(source.usernameEnvironment());\n        String password = System.getenv(source.passwordEnvironment());\n'''
          if text.count(old) != 1:
              raise SystemExit('LiteBans/helper credential-source block not found exactly once')
          text = text.replace(old, new, 1)

          text = text.replace('''        url = secrets.getProperty(urlKey);\n        username = secrets.getProperty(usernameKey);\n        password = secrets.getProperty(passwordKey);\n''', '''        url = secrets.getProperty(source.urlKey());\n        username = secrets.getProperty(source.usernameKey());\n        password = secrets.getProperty(source.passwordKey());\n''', 1)

          record_anchor = '''    private static boolean present(String value) {\n        return value != null && !value.isBlank();\n    }\n\n'''
          record = '''    private record DatabaseCredentialSource(\n            String urlEnvironment,\n            String usernameEnvironment,\n            String passwordEnvironment,\n            String urlKey,\n            String usernameKey,\n            String passwordKey\n    ) {\n    }\n\n'''
          if text.count(record_anchor) != 1:
              raise SystemExit('Credential-source record anchor not found exactly once')
          text = text.replace(record_anchor, record_anchor + record, 1)
          path.write_text(text, encoding='utf-8')

          Path('.github/workflows/velocity-private-db-refactor.yml').unlink()
      - name: Validate focused and module tests
        run: |
          ./gradlew :velocity:test --tests net.enthusia.staff.velocity.VelocityConfigurationTest --no-daemon --console=plain
          ./gradlew :velocity:check --no-daemon --console=plain
      - name: Commit refactor and remove temporary workflow
        run: |
          git config user.name "wsg138"
          git config user.email "208424056+wsg138@users.noreply.github.com"
          git add velocity/src/main/java/net/enthusia/staff/velocity/VelocityConfiguration.java \
                  .github/workflows/velocity-private-db-refactor.yml
          git diff --cached --check
          git commit -m "Bound Velocity database credential source"
          git push origin HEAD:fix/velocity-private-db-file-fallback
