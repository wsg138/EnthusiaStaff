name: T01 staging App bootstrap preflight

on:
  push:
    branches:
      - "package/es-t01-staff-teleport-hardening"

permissions:
  contents: read

jobs:
  preflight:
    name: Prove private staging App authentication
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint short-lived private staging token
        uses: ./.github/actions/staging-app-token
        with:
          client-id: ${{ vars.ENTHUSIASTAFF_STAGING_APP_CLIENT_ID }}
          private-key: ${{ secrets.ENTHUSIASTAFF_STAGING_APP_PRIVATE_KEY }}

      - name: Verify private staging Actions access
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${STAGING_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/wsg138/EnthusiaStaff-Staging/actions/runs?per_page=1' \
            >/dev/null
          echo 'Private staging GitHub App authentication is operational.'
