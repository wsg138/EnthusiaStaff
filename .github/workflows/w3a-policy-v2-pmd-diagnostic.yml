name: W3A Policy v2 PMD Diagnostic

on:
  push:
    branches:
      - w3a/policy-v2-gui-pmd-diagnostic

permissions:
  contents: read

jobs:
  pmd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run repository PMD rules on W3A
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/pmd/pmd/releases/download/pmd_releases%2F6.55.0/pmd-bin-6.55.0.zip" \
            -o /tmp/pmd.zip
          unzip -q /tmp/pmd.zip -d /tmp
          set +e
          /tmp/pmd-bin-6.55.0/bin/run.sh pmd \
            -d paper/src/main/java/net/enthusia/staff/paper/punishment/policyv2,paper/src/test/java/net/enthusia/staff/paper/punishment/policyv2 \
            -R ruleset.xml \
            -f text \
            -r /tmp/pmd.txt
          status=$?
          set -e
          cat /tmp/pmd.txt
          if [ "$status" -ne 0 ] && [ "$status" -ne 4 ]; then exit "$status"; fi
          test ! -s /tmp/pmd.txt
