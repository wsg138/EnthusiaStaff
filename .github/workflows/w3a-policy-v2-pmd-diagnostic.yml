name: W3A Policy v2 Complexity Diagnostic

on:
  push:
    branches:
      - w3a/policy-v2-gui-pmd-diagnostic

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run repository PMD rules on W3A
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/pmd/pmd/releases/download/pmd_releases%2F6.55.0/pmd-bin-6.55.0.zip" \
            -o /tmp/pmd.zip
          unzip -q /tmp/pmd.zip -d /tmp
          /tmp/pmd-bin-6.55.0/bin/run.sh pmd \
            -d paper/src/main/java/net/enthusia/staff/paper/punishment/policyv2,paper/src/test/java/net/enthusia/staff/paper/punishment/policyv2 \
            -R ruleset.xml \
            -f text
      - name: Run Lizard method bounds
        run: |
          python -m pip install --quiet lizard==1.23.0
          lizard \
            -C 8 -L 50 \
            paper/src/main/java/net/enthusia/staff/paper/punishment/policyv2 \
            paper/src/test/java/net/enthusia/staff/paper/punishment/policyv2
