name: ES-P02 blocked registry patch

on:
  push:
    branches:
      - package/es-p02-runtime-db-recovery
    paths:
      - .github/workflows/es-p02-blocked-registry-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: package/es-p02-runtime-db-recovery
          fetch-depth: 0
      - name: Record canonical blocker
        shell: python
        run: |
          from pathlib import Path

          path = Path("ai-agents/work-packages/PACKAGE-REGISTRY.md")
          text = path.read_text(encoding="utf-8")

          old_state = "Canonical current state: `ES-P02 REVIEW — implementation, focused tests, documentation, and all confirmed review repairs are committed on package/es-p02-runtime-db-recovery in open non-draft PR #70. Exact-head hosted validation, merge, containment, cleanup, and finalization remain. Starting main is d94d0219a598c9afb7e19c4ea9fddafd554d6469. ES-X05 remains READY and unstarted.`"
          new_state = "Canonical current state: `ES-P02 BLOCKED — frozen product head b63fa1fa09ae4a9ea90988143ecda2cc7decbe14 passed Java 21 build/test/coverage, MariaDB/Testcontainers, migration integrity, runtime-JAR/provider-leak, Codacy, and review-thread gates in PR #70. Required exact-head Pi staging run 31072790867/job 92524036760 failed, and no ES-P02 package-specific infrastructure exception is approved. PR #70 remains open and unmerged. ES-X05 remains READY and unstarted.`"
          if text.count(old_state) != 1:
              raise SystemExit(f"expected canonical REVIEW state once, found {text.count(old_state)}")
          text = text.replace(old_state, new_state, 1)

          marker = "### `ES-P02` — Runtime database recovery and Velocity reload"
          start = text.index(marker)
          end = text.index("### `ES-P03`", start)
          section = text[start:end]
          replacements = {
              "| Status | `REVIEW` |": "| Status | `BLOCKED` |",
              "| Aggregate PR | `#70 — open, non-draft; exact-head validation pending` |": "| Aggregate PR | `#70 — open, non-draft, blocked; not merged` |",
              "| Final reviewed heads | `UNSET` |": "| Final reviewed heads | `Product head b63fa1fa09ae4a9ea90988143ecda2cc7decbe14; documentation-only blocker head recorded separately on branch` |",
              "| Blocker | `NONE. Implementation and review repair are complete; current-head hosted build, test, static-analysis, artifact, review-bot, and staging evidence remain before merge.` |": "| Blocker | `Required exact-head Pi staging run 31072790867/job 92524036760 failed. No successful Pi build/boot/restart evidence exists and no ES-P02 owner-approved infrastructure exception is recorded. Unblock with successful specialized-runner staging for the unchanged product head, or explicit ES-P02 approval plus proof that every zero-execution exception condition is met.` |"
          }
          for old, new in replacements.items():
              if section.count(old) != 1:
                  raise SystemExit(f"expected ES-P02 registry row once, found {section.count(old)}: {old}")
              section = section.replace(old, new, 1)
          text = text[:start] + section + text[end:]
          path.write_text(text, encoding="utf-8")
      - name: Commit registry blocker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-agents/work-packages/PACKAGE-REGISTRY.md
          git diff --cached --check
          git commit -m "ES-P02: mark package blocked on Pi staging"
          git push origin HEAD:package/es-p02-runtime-db-recovery
