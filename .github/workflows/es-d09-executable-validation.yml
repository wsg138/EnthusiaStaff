name: ES-D09 Executable Validation

on:
  push:
    branches:
      - diagnostic/es-d09-executable-validation-20260915

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out frozen D09 executable head
        uses: actions/checkout@v6
        with:
          ref: package/es-d09-discord-investigations
          fetch-depth: 0
      - name: Require exact executable head
        run: test "$(git rev-parse HEAD)" = "d2705f281b78fd87bbb1e7934edfca875e342bc0"
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Clean build and runtime verification
        run: |
          set -Eeuo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache --no-build-cache clean build :staff-bot:verifyStaffBotRuntime --console=plain
      - name: PMD changed Java
        run: |
          set -Eeuo pipefail
          curl --fail --location --silent --show-error 'https://github.com/pmd/pmd/releases/download/pmd_releases%2F6.55.0/pmd-bin-6.55.0.zip' --output /tmp/pmd.zip
          unzip -q /tmp/pmd.zip -d /tmp
          git diff --name-only origin/main...HEAD -- '*.java' | awk 'NF' | sort -u > /tmp/d09-java-files
          test -s /tmp/d09-java-files
          input="$(paste -sd, /tmp/d09-java-files)"
          /tmp/pmd-bin-6.55.0/bin/run.sh pmd -d "$input" -R ruleset.xml -f text -r /tmp/pmd.txt
          cat /tmp/pmd.txt
          test ! -s /tmp/pmd.txt
      - name: Changed Java complexity limits
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --quiet lizard
          mapfile -t files < /tmp/d09-java-files
          lizard -l java -C 8 -L 50 -a 8 -w "${files[@]}"
      - name: Bound worker regression size and diff whitespace
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('staff-bot/src/test/java/net/enthusia/staff/discordbot/DiscordInvestigationWorkerTest.java')
          count = sum(1 for line in path.read_text().splitlines() if line.strip() and not line.lstrip().startswith('//'))
          print('worker test bounded line count:', count)
          assert count < 500
          PY
          git diff --check origin/main...HEAD
