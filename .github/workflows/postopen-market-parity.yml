name: Market Component Parity

on:
  pull_request:
    branches:
      - codex/reopening-safety-2026-10-01

permissions:
  contents: read

jobs:
  market-parity:
    if: ${{ github.event.pull_request.number == 296 }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out aggregate candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Check out exact standalone Market source
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/wsg138/EnthusiaMarket.git "$RUNNER_TEMP/market"
          git -C "$RUNNER_TEMP/market" fetch --depth=1 origin 4b535850b60a3811551146c337520f8de171a5c9
          git -C "$RUNNER_TEMP/market" checkout --detach 4b535850b60a3811551146c337520f8de171a5c9

      - name: Verify deterministic component parity
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/component-sync/component_sync.py compare             components/enthusia-market "$RUNNER_TEMP/market"             --aggregate-sha "${GITHUB_SHA}"             --standalone-sha "4b535850b60a3811551146c337520f8de171a5c9"             | tee "$RUNNER_TEMP/market-parity.json"
          cat "$RUNNER_TEMP/market-parity.json"
