name: Apply final blocker follow-up

on:
  push:
    branches:
      - section/punishment-request-notifications-recovery

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-final-blocker-follow-up]')
    name: Apply reviewed follow-up patch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out helper commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Apply exact reviewed patch and remove helper files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "dc4a53e8febc27970f25f1a995309f12840562be"
          gzip -dc .github/final-followup.patch.gz > /tmp/final-followup.patch
          git apply --check /tmp/final-followup.patch
          git apply --index /tmp/final-followup.patch
          git rm .github/final-followup.patch.gz .github/workflows/apply-final-blocker-follow-up.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Close remaining operational shutdown races"
          git push origin HEAD:section/punishment-request-notifications-recovery
