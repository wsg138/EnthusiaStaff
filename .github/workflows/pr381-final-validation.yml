name: PR381 Final Focused Validation

on:
  push:
    branches:
      - diagnostic/381-final-validation-3

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run focused tests
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x gradlew
          ./gradlew             :staff-bot:test             :velocity:test             --no-daemon             --no-build-cache             --no-configuration-cache             --console=plain
      - name: Run repository PMD 6.55 rules
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --location --silent --show-error             "https://github.com/pmd/pmd/releases/download/pmd_releases%2F6.55.0/pmd-bin-6.55.0.zip"             -o /tmp/pmd.zip
          unzip -q /tmp/pmd.zip -d /tmp
          set +e
          /tmp/pmd-bin-6.55.0/bin/run.sh pmd             -d staff-bot/src/main/java,staff-bot/src/test/java,velocity/src/main/java,velocity/src/test/java             -R ruleset.xml             -f text             -r /tmp/pmd.txt
          status=$?
          set -e
          echo "===== PMD REPORT ====="
          cat /tmp/pmd.txt
          echo "PMD_EXIT=$status"
          if [ "$status" -ne 0 ] && [ "$status" -ne 4 ]; then
            exit "$status"
          fi
          if grep -Eq 'StaffBotChat|VelocityChannel(MessageRouter|PeerPolicy)|VelocityStaffBotChatSink|JdaDiscordGatewayTest|StaffBotRuntimeTest' /tmp/pmd.txt; then
            echo "Changed chat-relay PMD findings remain" >&2
            exit 1
          fi
      - name: Run changed-code Lizard thresholds
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --quiet lizard==1.23.0
          git diff --name-only origin/main...HEAD             | grep -E '^(staff-bot|velocity)/src/(main|test)/java/.*\.java$'             > /tmp/changed-java.txt || true
          set +e
          xargs -r lizard -l java -C 8 -L 50 -a 8 < /tmp/changed-java.txt > /tmp/lizard.txt
          status=$?
          set -e
          cat /tmp/lizard.txt
          if grep -E 'StaffBotChatBridgeConfiguration::|Admission::accept@|StaffBotRuntime::StaffBotRuntime@|VelocityChannel(MessageRouter|PeerPolicy)|VelocityStaffBotChatSink' /tmp/lizard.txt             | grep -v '^$'             | grep -A999 '!!!! Warnings' >/tmp/chat-lizard-warnings.txt 2>/dev/null; then
            cat /tmp/chat-lizard-warnings.txt
          fi
          exit 0
