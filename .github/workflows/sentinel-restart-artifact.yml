name: Sentinel Restart Artifact

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build-paper-artifact:
    name: Build exact Paper artifact for Sentinel
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Build the deployable Paper plugin
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x ./gradlew
          ./gradlew :paper:shadowJar --no-daemon --no-build-cache --no-configuration-cache --console=plain
          runtime_jar="$(find paper/build/libs -maxdepth 1 -type f -name 'EnthusiaStaff-Paper-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          [[ -n "$runtime_jar" && -f "$runtime_jar" ]] || { echo 'Expected Paper runtime JAR was not produced.' >&2; exit 1; }
          mkdir -p sentinel-artifact
          cp -- "$runtime_jar" sentinel-artifact/EnthusiaStaff-Paper.jar

      - name: Publish the exact Sentinel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enthusiastaff-sentinel-paper
          path: sentinel-artifact/EnthusiaStaff-Paper.jar
          if-no-files-found: error
          retention-days: 2
