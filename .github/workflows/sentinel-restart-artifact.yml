name: Sentinel Restart Artifact

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "docs/**"
      - "ai-agents/**"
      - "reports/**"
      - "**/*.md"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "ai-agents/**"
      - "reports/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: sentinel-artifact-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build-paper-artifact:
    name: Build exact Paper artifact for Sentinel
    # Same-repository PR commits are already covered by the push event. The
    # pull_request path exists only so public fork heads also receive an exact
    # artifact without requiring repository secrets.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the exact source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source binding
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Build deployable Paper artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x ./gradlew
          ./gradlew :paper:shadowJar :paper-authority-bridge:shadowJar --no-daemon --no-build-cache --no-configuration-cache --console=plain
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          runtime_jar="$(find paper/build/libs -maxdepth 1 -type f -name 'EnthusiaStaff-Paper-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          bridge_jar="$(find paper-authority-bridge/build/libs -maxdepth 1 -type f -name 'EnthusiaStaff-AuthorityBridge-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          [[ -n "$runtime_jar" && -f "$runtime_jar" ]] || { echo 'Expected Paper runtime JAR was not produced.' >&2; exit 1; }
          [[ -n "$bridge_jar" && -f "$bridge_jar" ]] || { echo 'Expected authority bridge JAR was not produced.' >&2; exit 1; }
          mkdir -p sentinel-artifact authority-bridge-artifact
          cp -- "$runtime_jar" sentinel-artifact/EnthusiaStaff-Paper.jar
          cp -- "$bridge_jar" authority-bridge-artifact/EnthusiaStaff-AuthorityBridge.jar
          sha256sum authority-bridge-artifact/EnthusiaStaff-AuthorityBridge.jar > authority-bridge-artifact/EnthusiaStaff-AuthorityBridge.jar.sha256
          printf '%s\n' "$SOURCE_SHA" > authority-bridge-artifact/source.txt

      - name: Publish the exact Sentinel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enthusiastaff-sentinel-paper
          path: sentinel-artifact/EnthusiaStaff-Paper.jar
          if-no-files-found: error
          retention-days: 3

      - name: Publish the exact authority bridge artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enthusiastaff-authority-bridge
          path: authority-bridge-artifact/
          if-no-files-found: error
          retention-days: 3
