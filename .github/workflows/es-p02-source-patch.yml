name: ES-P02 source patch

on:
  push:
    branches:
      - package/es-p02-runtime-db-recovery
    paths:
      - .github/workflows/es-p02-source-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: package/es-p02-runtime-db-recovery
          fetch-depth: 0
      - name: Apply asserted lifecycle replacements
        shell: python
        run: |
          from pathlib import Path

          def block(*lines: str) -> str:
              return "\n".join(lines) + "\n"

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          paper = "paper/src/main/java/net/enthusia/staff/paper/EnthusiaStaffPaperPlugin.java"
          replace_once(
              paper,
              "if (!storageBootstrap.start()) {",
              "if (!storageBootstrap.start() && storageBootstrap.retryScheduled()) {"
          )

          velocity = "velocity/src/main/java/net/enthusia/staff/velocity/EnthusiaStaffVelocityPlugin.java"
          replace_once(
              velocity,
              block(
                  "        MariaDbRuntime runtime = databaseRuntime;",
                  "        databaseRuntime = null;",
                  "        if (runtime != null) {",
                  "            runtime.close();",
                  "        }",
                  "        clearPublishedStores();"
              ),
              block(
                  "        MariaDbRuntime runtime = databaseRuntime;",
                  "        databaseRuntime = null;",
                  "        try {",
                  "            if (runtime != null) {",
                  "                runtime.close();",
                  "            }",
                  "        } finally {",
                  "            clearPublishedStores();",
                  "        }"
              )
          )
          replace_once(
              velocity,
              block(
                  "            server.start();",
                  "            websiteModerationStore = store;",
                  "            websiteApiServer = server;",
                  "            websiteMaintenanceTask = proxy.getScheduler()",
                  "                    .buildTask(this, this::maintainWebsiteApi)",
                  "                    .repeat(1, TimeUnit.MINUTES)",
                  "                    .schedule();",
                  "            logger.info("
              ),
              block(
                  "            server.start();",
                  "            ScheduledTask maintenance = proxy.getScheduler()",
                  "                    .buildTask(this, this::maintainWebsiteApi)",
                  "                    .repeat(1, TimeUnit.MINUTES)",
                  "                    .schedule();",
                  "            websiteModerationStore = store;",
                  "            websiteApiServer = server;",
                  "            websiteMaintenanceTask = maintenance;",
                  "            server = null;",
                  "            logger.info("
              )
          )
          replace_once(
              velocity,
              block(
                  "            case APPLIED, NO_CHANGES -> {",
                  "                updateHealthIssue(\"configuration-reload\", null);",
                  "                updateHealthIssue(\"configuration-restart-required\", null);",
                  "                MariaDbRuntime runtime = databaseRuntime;",
                  "                if (runtime != null) {",
                  "                    health.update(authorityMode.get(), operationalIssues(authorityMode.get()));",
                  "                }",
                  "            }"
              ),
              block(
                  "            case APPLIED, NO_CHANGES -> {",
                  "                updateHealthIssue(\"configuration-reload\", null);",
                  "                updateHealthIssue(\"configuration-restart-required\", null);",
                  "            }"
              )
          )
          replace_once(
              velocity,
              block(
                  "    private void updateHealthIssue(String component, String reason) {",
                  "        VelocityRuntimeHealth.Snapshot snapshot = health.snapshot();",
                  "        Map<String, String> issues = new LinkedHashMap<>(snapshot.issues());",
                  "        if (reason == null || reason.isBlank()) {",
                  "            issues.remove(component);",
                  "        } else {",
                  "            issues.put(component, reason);",
                  "        }",
                  "        health.update(snapshot.mode(), issues);",
                  "    }"
              ),
              block(
                  "    private void updateHealthIssue(String component, String reason) {",
                  "        health.updateIssue(authorityMode.get(), component, reason);",
                  "    }"
              )
          )
          replace_once(
              velocity,
              block(
                  "        @Override",
                  "        public boolean hasPermission(Invocation invocation) {",
                  "            return invocation.source().hasPermission(\"enthusiastaff.status\");",
                  "        }"
              ),
              block(
                  "        @Override",
                  "        public boolean hasPermission(Invocation invocation) {",
                  "            String[] arguments = invocation.arguments();",
                  "            if (arguments.length > 0 && arguments[0].equalsIgnoreCase(\"reload\")) {",
                  "                return invocation.source().hasPermission(\"enthusiastaff.reload\");",
                  "            }",
                  "            return invocation.source().hasPermission(\"enthusiastaff.status\");",
                  "        }"
              )
          )
      - name: Commit lifecycle repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/src/main/java/net/enthusia/staff/paper/EnthusiaStaffPaperPlugin.java \
                  velocity/src/main/java/net/enthusia/staff/velocity/EnthusiaStaffVelocityPlugin.java
          git diff --cached --check
          git commit -m "ES-P02: repair lifecycle publication races"
          git push origin HEAD:package/es-p02-runtime-db-recovery
