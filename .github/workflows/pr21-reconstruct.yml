name: Reconstruct PR21 wiring

on:
  push:
    branches:
      - section/punishment-request-interfaces
    paths:
      - .github/workflows/pr21-reconstruct.yml

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: section/punishment-request-interfaces

      - name: Confirm clean checkout and original PR commits
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
          echo "Original PR #21 commits from the reviewed base to the pre-reconstruction head:"
          git log --reverse --format='%H %s' \
            133ace65b9ccdfd459d38089928e4bea612ed2a6..6ce349f10166f696c9d1160fe51931671d9ab851

      - name: Restore wiring and compile affected modules
        shell: bash
        run: |
          set -euo pipefail
          cat .github/pr21-reconstruct/chunk-*.b64 | base64 --decode > /tmp/pr21-patch.tar.gz
          echo "8d9af1fdda2b887da2a887e725bcffece5a9156dcb78e8c045d19112c6f1b78c  /tmp/pr21-patch.tar.gz" \
            | sha256sum --check
          tar -xzf /tmp/pr21-patch.tar.gz -C .
          rm -rf .github/pr21-reconstruct
          rm -f .github/workflows/pr21-reconstruct.yml

          set +e
          ./gradlew :domain:compileJava :paper:compileJava --stacktrace
          compile_status=$?
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/src/main/java .github
          git commit -m "Restore punishment request interface wiring"
          git push origin HEAD:section/punishment-request-interfaces

          exit "$compile_status"
