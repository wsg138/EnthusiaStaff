# Temporary read-only diagnostic; remove before merge.
name: Temporary PR814 Codacy annotation evidence
on:
  pull_request:
    paths:
      - ".github/workflows/temporary-codacy-pr814-evidence.yml"
permissions:
  contents: read
  checks: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Retrieve exact PR814 Codacy findings
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/check-runs/131271256263/annotations?per_page=100" \
            -o /tmp/pr814_codacy.json
          python3 - <<'PY'
          import json
          with open("/tmp/pr814_codacy.json", encoding="utf-8") as f:
              issues = json.load(f)
          print("CODACY_ANNOTATIONS_COUNT=" + str(len(issues)))
          for a in issues:
              print(json.dumps({
                  "path": a.get("path"),
                  "line": a.get("start_line"),
                  "message": a.get("message"),
                  "level": a.get("annotation_level"),
              }, ensure_ascii=False))
          PY
