name: ES-D09 authority repair diagnostic

on:
  push:
    branches:
      - diagnostic/es-d09-authority-repair-20260915
    paths:
      - .github/diagnostics/es-d09-authority-repair.py
      - .github/diagnostics/es-d09-authority-repair-fix.py
      - .github/workflows/es-d09-authority-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out diagnostic tooling
        uses: actions/checkout@v6
        with:
          ref: diagnostic/es-d09-authority-repair-20260915
          path: tooling

      - name: Check out clean product candidate
        uses: actions/checkout@v6
        with:
          ref: candidate/es-d09-authority-repair-20260915
          fetch-depth: 0
          path: product

      - name: Require exact phase-one base
        working-directory: product
        run: test "$(git rev-parse HEAD)" = "d2705f281b78fd87bbb1e7934edfca875e342bc0"

      - name: Apply authority repair
        run: |
          python tooling/.github/diagnostics/es-d09-authority-repair-fix.py \
            tooling/.github/diagnostics/es-d09-authority-repair.py /tmp/es-d09-authority-repair.py
          python /tmp/es-d09-authority-repair.py product

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile affected runtime and integration tests
        working-directory: product
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache \
            :domain:compileJava \
            :persistence:compileJava \
            :staff-bot:compileJava \
            :paper:compileJava \
            :integration-tests:compileTestJava \
            --console=plain

      - name: Run D09 persistence integration tests
        working-directory: product
        run: |
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache \
            :integration-tests:test \
            --tests net.enthusia.staff.integration.DiscordInvestigationPersistenceIntegrationTest \
            --console=plain

      - name: Require clean patch formatting
        working-directory: product
        run: git diff --check

      - name: Commit validated candidate
        working-directory: product
        run: |
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            domain/src/main/java/net/enthusia/staff/domain/investigation \
            domain/src/main/java/net/enthusia/staff/domain/ports/DiscordInvestigationStore.java \
            persistence/src/main/java/net/enthusia/staff/persistence/JdbcDiscordInvestigationCaseStore.java \
            persistence/src/main/java/net/enthusia/staff/persistence/JdbcDiscordInvestigationEvidenceStore.java \
            persistence/src/main/java/net/enthusia/staff/persistence/JdbcDiscordInvestigationSource.java \
            persistence/src/main/java/net/enthusia/staff/persistence/JdbcDiscordInvestigationStore.java \
            persistence/src/main/resources/db/migration/V22__discord_investigation_state.sql \
            staff-bot/src/main/java/net/enthusia/staff/discordbot/DiscordInvestigationService.java \
            staff-bot/src/main/java/net/enthusia/staff/discordbot/DiscordInvestigationWorker.java \
            staff-bot/src/main/java/net/enthusia/staff/discordbot/DiscordInvestigationCommandController.java
          git commit -m "[ES-D09] Attach investigation state to authoritative cases"
          git push origin HEAD:candidate/es-d09-authority-repair-20260915
