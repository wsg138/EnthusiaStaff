name: Pi Staging

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pi-staging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-staging:
    name: Pi boot and restart staging
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      STAGING_TOKEN: ${{ secrets.ENTHUSIASTAFF_STAGING_TOKEN }}
      SOURCE_REPOSITORY: ${{ github.repository }}
      SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      SOURCE_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      SOURCE_PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
      SOURCE_PR_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
      STAGING_REPOSITORY: wsg138/EnthusiaStaff-Staging
      STAGING_WORKFLOW: plugin-live-test.yml
      REQUEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Determine whether live staging is trusted
        id: trust
        shell: bash
        run: |
          set -Eeuo pipefail
          eligible=true
          reason='main commit or same-repository pull request'

          if [[ "${GITHUB_EVENT_NAME}" == 'pull_request' \
              && "${SOURCE_PR_HEAD_REPOSITORY}" != "${SOURCE_REPOSITORY}" ]]; then
            eligible=false
            reason='fork pull requests are intentionally limited to hosted build, test, and Codacy checks'
          fi

          printf 'eligible=%s\n' "$eligible" >> "$GITHUB_OUTPUT"
          printf 'reason=%s\n' "$reason" >> "$GITHUB_OUTPUT"

          {
            echo '## Pi staging eligibility'
            echo
            echo "- Eligible: \`$eligible\`"
            echo "- Reason: $reason"
            echo "- Source SHA: \`$SOURCE_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Explain fork safety boundary
        if: steps.trust.outputs.eligible != 'true'
        shell: bash
        run: |
          echo "::notice::${{ steps.trust.outputs.reason }}"

      - name: Require cross-repository staging token
        if: steps.trust.outputs.eligible == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "$STAGING_TOKEN" ]]; then
            echo '::error::Missing ENTHUSIASTAFF_STAGING_TOKEN. Add a fine-grained token with Actions read/write access to wsg138/EnthusiaStaff-Staging as a repository Actions secret.'
            exit 1
          fi

      - name: Dispatch verified staging workflow
        if: steps.trust.outputs.eligible == 'true'
        id: dispatch
        shell: bash
        run: |
          set -Eeuo pipefail

          payload="$({
            jq -n \
              --arg ref 'main' \
              --arg source_sha "$SOURCE_SHA" \
              --arg source_pr_number "$SOURCE_PR_NUMBER" \
              --arg source_pr_head_repository "$SOURCE_PR_HEAD_REPOSITORY" \
              --arg source_pr_head_ref "$SOURCE_PR_HEAD_REF" \
              --arg request_id "$REQUEST_ID" \
              '{
                ref: $ref,
                inputs: {
                  source_sha: $source_sha,
                  source_pr_number: $source_pr_number,
                  source_pr_head_repository: $source_pr_head_repository,
                  source_pr_head_ref: $source_pr_head_ref,
                  source_pr_head_sha: (if $source_pr_number == "" then "" else $source_sha end),
                  request_id: $request_id,
                  run_pi_test: "true"
                }
              }'
          })"

          curl --fail --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header "Authorization: Bearer $STAGING_TOKEN" \
            --data "$payload" \
            "https://api.github.com/repos/$STAGING_REPOSITORY/actions/workflows/$STAGING_WORKFLOW/dispatches"

          expected_title="EnthusiaStaff staging $REQUEST_ID / $SOURCE_SHA"
          printf 'expected_title=%s\n' "$expected_title" >> "$GITHUB_OUTPUT"
          echo "Dispatched $expected_title"

      - name: Locate dispatched staging run
        if: steps.trust.outputs.eligible == 'true'
        id: locate
        shell: bash
        env:
          EXPECTED_TITLE: ${{ steps.dispatch.outputs.expected_title }}
        run: |
          set -Eeuo pipefail

          run_id=''
          for attempt in $(seq 1 60); do
            response="$(curl --fail --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header "Authorization: Bearer $STAGING_TOKEN" \
              "https://api.github.com/repos/$STAGING_REPOSITORY/actions/workflows/$STAGING_WORKFLOW/runs?event=workflow_dispatch&per_page=50")"

            run_id="$(jq -r --arg title "$EXPECTED_TITLE" \
              '.workflow_runs[] | select(.display_title == $title) | .id' \
              <<< "$response" | head -n 1)"

            if [[ -n "$run_id" && "$run_id" != 'null' ]]; then
              break
            fi
            sleep 5
          done

          if [[ -z "$run_id" || "$run_id" == 'null' ]]; then
            echo "::error::Unable to locate dispatched staging run: $EXPECTED_TITLE"
            exit 1
          fi

          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
          printf 'run_url=https://github.com/%s/actions/runs/%s\n' "$STAGING_REPOSITORY" "$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for staging verdict
        if: steps.trust.outputs.eligible == 'true'
        shell: bash
        env:
          STAGING_RUN_ID: ${{ steps.locate.outputs.run_id }}
          STAGING_RUN_URL: ${{ steps.locate.outputs.run_url }}
        run: |
          set -Eeuo pipefail

          conclusion=''
          status=''
          for attempt in $(seq 1 180); do
            response="$(curl --fail --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header "Authorization: Bearer $STAGING_TOKEN" \
              "https://api.github.com/repos/$STAGING_REPOSITORY/actions/runs/$STAGING_RUN_ID")"

            status="$(jq -r '.status' <<< "$response")"
            conclusion="$(jq -r '.conclusion // ""' <<< "$response")"
            echo "Staging run $STAGING_RUN_ID: $status ${conclusion:-pending}"

            if [[ "$status" == 'completed' ]]; then
              break
            fi
            sleep 10
          done

          if [[ "$status" != 'completed' ]]; then
            echo "::error::Staging run did not complete before this check timed out: $STAGING_RUN_URL"
            exit 1
          fi

          {
            echo '## Pi staging verdict'
            echo
            echo "- Result: \`$conclusion\`"
            echo "- Staging run: $STAGING_RUN_URL"
            echo "- Tested source SHA: \`$SOURCE_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$conclusion" != 'success' ]]; then
            jobs="$(curl --fail --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header "Authorization: Bearer $STAGING_TOKEN" \
              "https://api.github.com/repos/$STAGING_REPOSITORY/actions/runs/$STAGING_RUN_ID/jobs?per_page=100")"
            jq -r '.jobs[] | "::error::Staging job \(.name): \(.conclusion // .status)"' <<< "$jobs"
            echo "::error::Pi staging failed: $STAGING_RUN_URL"
            exit 1
          fi
