name: D07 PMD diagnostics

on:
  push:
    branches:
      - "package/es-d07-discord-punishment-enforcement"

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.head_commit.message == 'chore(es-d07): stage PMD diagnostics'
    name: Report D07 PMD findings
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Run repository PMD on changed Java
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://github.com/pmd/pmd/releases/download/pmd_releases%2F6.55.0/pmd-bin-6.55.0.zip' \
            --output /tmp/pmd.zip
          unzip -q /tmp/pmd.zip -d /tmp
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.java')
          printf 'Changed Java files (%s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          input="$(IFS=,; echo "${files[*]}")"
          set +e
          /tmp/pmd-bin-6.55.0/bin/run.sh pmd \
            -d "${input}" \
            -R ruleset.xml \
            -f text \
            -r /tmp/pmd-findings.txt
          status=$?
          set -e
          cat /tmp/pmd-findings.txt
          exit "$status"

      - name: Run focused D07 tests
        if: always()
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :domain:test :persistence:test :staff-bot:test :integration-tests:test \
            --no-daemon \
            --no-build-cache \
            --no-configuration-cache \
            --console=plain
