name: X04 fail-closed reconciliation fix

on:
  push:
    branches:
      - package/es-x04-commend-provider

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: package/es-x04-commend-provider
          fetch-depth: 0
      - name: Apply fail-closed reconciliation repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old!r}')
              path.write_text(text.replace(old, new, 1))

          component_api = Path('components/enthusia-commend/src/main/java/org/enthusia/rep/api/ReputationModerationApi.java')
          replace_once(
              component_api,
              '    boolean canGiveReputation(UUID playerId);\n\n    Optional<ReputationBlacklist> getBlacklist(UUID playerId);',
              '    boolean canGiveReputation(UUID playerId);\n\n'
              '    /** Fail closed while the authoritative moderation owner is reconciling this player. */\n'
              '    void markReconciliationPending(UUID playerId);\n\n'
              '    /** Clear the temporary fail-closed fence only after authoritative reconciliation settles. */\n'
              '    void clearReconciliationPending(UUID playerId);\n\n'
              '    Optional<ReputationBlacklist> getBlacklist(UUID playerId);'
          )
          Path('integration-contracts/src/main/java/org/enthusia/rep/api/ReputationModerationApi.java').write_text(
              component_api.read_text()
          )

          service = Path('components/enthusia-commend/src/main/java/org/enthusia/rep/moderation/ReputationModerationService.java')
          replace_once(service, 'import java.util.LinkedHashMap;\nimport java.util.Map;',
                       'import java.util.HashSet;\nimport java.util.LinkedHashMap;\nimport java.util.Map;')
          replace_once(service, 'import java.util.Optional;\nimport java.util.UUID;',
                       'import java.util.Optional;\nimport java.util.Set;\nimport java.util.UUID;')
          replace_once(service,
              '    private final ReputationModerationStore store;\n    private final Object stateLock = new Object();\n    private ReputationModerationStore.State state;',
              '    private final ReputationModerationStore store;\n    private final Object stateLock = new Object();\n'
              '    private final Set<UUID> reconciliationPending = new HashSet<>();\n'
              '    private ReputationModerationStore.State state;')
          replace_once(service,
              '    @Override\n    public boolean canGiveReputation(UUID playerId) {\n        return !isReputationBlacklisted(playerId);\n    }\n\n    @Override\n    public Optional<ReputationBlacklist> getBlacklist(UUID playerId) {',
              '    @Override\n    public boolean canGiveReputation(UUID playerId) {\n        synchronized (stateLock) {\n'
              '            UUID requiredPlayerId = Objects.requireNonNull(playerId, PLAYER_ID_ARGUMENT);\n'
              '            return !reconciliationPending.contains(requiredPlayerId)\n'
              '                    && getBlacklistLocked(requiredPlayerId)\n'
              '                    .map(value -> !value.activeAt(clock.instant()))\n'
              '                    .orElse(true);\n'
              '        }\n'
              '    }\n\n'
              '    @Override\n'
              '    public void markReconciliationPending(UUID playerId) {\n'
              '        synchronized (stateLock) {\n'
              '            reconciliationPending.add(Objects.requireNonNull(playerId, PLAYER_ID_ARGUMENT));\n'
              '        }\n'
              '    }\n\n'
              '    @Override\n'
              '    public void clearReconciliationPending(UUID playerId) {\n'
              '        synchronized (stateLock) {\n'
              '            reconciliationPending.remove(Objects.requireNonNull(playerId, PLAYER_ID_ARGUMENT));\n'
              '        }\n'
              '    }\n\n'
              '    @Override\n'
              '    public Optional<ReputationBlacklist> getBlacklist(UUID playerId) {'
          )

          component_test = Path('components/enthusia-commend/src/test/java/org/enthusia/rep/moderation/ReputationModerationServiceTest.java')
          test_marker = '''    @Test
    void staleReputationAndBlacklistRevisionFailClosedWithoutMutation() {'''
          test_addition = '''    @Test
    void pendingAuthoritativeReconciliationFailsClosedWithoutChangingReputation() {
        AtomicReference<ReputationStateSnapshot> state = new AtomicReference<>(snapshot(7));
        ReputationModerationService service = new ReputationModerationService(
                Clock.fixed(NOW, ZoneOffset.UTC), ignored -> state.get(), temporaryDirectory.resolve(STATE_FILE));

        service.markReconciliationPending(PLAYER);
        assertFalse(service.canGiveReputation(PLAYER));
        assertTrue(service.getBlacklist(PLAYER).isEmpty());
        assertEquals(state.get(), service.snapshot(PLAYER));

        service.clearReconciliationPending(PLAYER);
        assertTrue(service.canGiveReputation(PLAYER));

        ReputationMutationResult applied = service.applyBlacklist(
                UUID.randomUUID(), PLAYER, Optional.empty(), CASE_ONE, 0L, state.get().checksum());
        assertEquals(ReputationMutationResult.Status.APPLIED, applied.status());
        service.markReconciliationPending(PLAYER);
        service.clearReconciliationPending(PLAYER);
        assertFalse(service.canGiveReputation(PLAYER));
    }

''' + test_marker
          replace_once(component_test, test_marker, test_addition)

          integration = Path('paper/src/main/java/net/enthusia/staff/paper/integration/ReputationIntegration.java')
          replace_once(integration,
              '    ReputationMutationResult reconcileApply(\n',
              '    void markReconciliationPending(UUID playerId) {\n'
              '        requireAvailable();\n'
              '        api.markReconciliationPending(Objects.requireNonNull(playerId, PLAYER_ID_ARGUMENT));\n'
              '    }\n\n'
              '    void clearReconciliationPending(UUID playerId) {\n'
              '        requireAvailable();\n'
              '        api.clearReconciliationPending(Objects.requireNonNull(playerId, PLAYER_ID_ARGUMENT));\n'
              '    }\n\n'
              '    ReputationMutationResult reconcileApply(\n'
          )

          synchronizer = Path('paper/src/main/java/net/enthusia/staff/paper/integration/ReputationRestrictionSynchronizer.java')
          replace_once(synchronizer,
              '''            if (authoritative != null) {
                reconcileActive(playerId, authoritative, current);
                return;
            }
            if (current.isPresent() && current.orElseThrow().status() == ReputationBlacklist.Status.ACTIVE) {
                removeStaleRestriction(playerId, current.orElseThrow());
                return;
            }
            tracked.remove(playerId);''',
              '''            if (authoritative != null) {
                if (reconcileActive(playerId, authoritative, current)) {
                    reputation.clearReconciliationPending(playerId);
                }
                return;
            }
            if (current.isPresent() && current.orElseThrow().status() == ReputationBlacklist.Status.ACTIVE) {
                if (removeStaleRestriction(playerId, current.orElseThrow())) {
                    reputation.clearReconciliationPending(playerId);
                    tracked.remove(playerId);
                }
                return;
            }
            reputation.clearReconciliationPending(playerId);
            tracked.remove(playerId);'''
          )
          replace_once(synchronizer,
              '''    private void reconcileActive(
            UUID playerId,
            ActiveSanction authoritative,
            Optional<ReputationBlacklist> current
    ) {''',
              '''    private boolean reconcileActive(
            UUID playerId,
            ActiveSanction authoritative,
            Optional<ReputationBlacklist> current
    ) {'''
          )
          replace_once(synchronizer,
              '''            if (value.status() == ReputationBlacklist.Status.ACTIVE
                    && value.caseId().equals(caseId)
                    && value.expirationAt().equals(expiration)) {
                return;
            }''',
              '''            if (value.status() == ReputationBlacklist.Status.ACTIVE
                    && value.caseId().equals(caseId)
                    && value.expirationAt().equals(expiration)) {
                return true;
            }'''
          )
          replace_once(synchronizer,
              '''        verifyResult(result, "apply", playerId);
    }

    private void removeStaleRestriction(UUID playerId, ReputationBlacklist current) {''',
              '''        return verifyResult(result, "apply", playerId);
    }

    private boolean removeStaleRestriction(UUID playerId, ReputationBlacklist current) {'''
          )
          replace_once(synchronizer,
              '''        verifyResult(result, "remove", playerId);
        if (result.success()) {
            tracked.remove(playerId);
        }
    }

    private void verifyResult(ReputationMutationResult result, String operation, UUID playerId) {
        if (!result.success()) {
            plugin.getLogger().warning("Reputation blacklist " + operation + " for " + playerId
                    + " will retry after provider response " + result.status() + ": " + result.detail());
            return;
        }
        if (!result.before().equals(result.after())) {
            plugin.getLogger().severe("Reputation provider changed score/category state while performing blacklist "
                    + operation + " for " + playerId + "; provider state requires review");
        }
    }''',
              '''        return verifyResult(result, "remove", playerId);
    }

    private boolean verifyResult(ReputationMutationResult result, String operation, UUID playerId) {
        if (!result.success()) {
            plugin.getLogger().warning("Reputation blacklist " + operation + " for " + playerId
                    + " will retry after provider response " + result.status() + ": " + result.detail());
            return false;
        }
        if (!result.before().equals(result.after())) {
            plugin.getLogger().severe("Reputation provider changed score/category state while performing blacklist "
                    + operation + " for " + playerId + "; provider state requires review");
            return false;
        }
        return true;
    }'''
          )
          replace_once(synchronizer,
              '''    private void trigger(UUID playerId) {
        if (closed || playerId == null) {
            return;
        }
        tracked.add(playerId);
        submit(playerId);
    }''',
              '''    private void trigger(UUID playerId) {
        if (closed || playerId == null) {
            return;
        }
        tracked.add(playerId);
        try {
            reputation.markReconciliationPending(playerId);
        } catch (RuntimeException exception) {
            logRetryable("Could not install fail-closed reputation reconciliation fence for " + playerId, exception);
        }
        submit(playerId);
    }'''
          )

          integration_test = Path('paper/src/test/java/net/enthusia/staff/paper/integration/ReputationIntegrationTest.java')
          replace_once(integration_test,
              '''    @Test
    void reconciliationPreservesProviderStaleStateResult() {''',
              '''    @Test
    void reconciliationFenceDelegatesToProvider() {
        RecordingApi api = new RecordingApi();
        ReputationIntegration integration = available(api, true);

        integration.markReconciliationPending(PLAYER);
        integration.clearReconciliationPending(PLAYER);

        assertEquals(1, api.pendingMarks);
        assertEquals(1, api.pendingClears);
    }

    @Test
    void reconciliationPreservesProviderStaleStateResult() {'''
          )
          replace_once(integration_test,
              '''        private int applyCalls;
        private int removeCalls;

        @Override
        public int apiVersion() {''',
              '''        private int applyCalls;
        private int removeCalls;
        private int pendingMarks;
        private int pendingClears;

        @Override
        public int apiVersion() {'''
          )
          replace_once(integration_test,
              '''        @Override
        public Optional<ReputationBlacklist> getBlacklist(UUID playerId) {
            return current;
        }''',
              '''        @Override
        public void markReconciliationPending(UUID playerId) {
            pendingMarks++;
        }

        @Override
        public void clearReconciliationPending(UUID playerId) {
            pendingClears++;
        }

        @Override
        public Optional<ReputationBlacklist> getBlacklist(UUID playerId) {
            return current;
        }'''
          )
          PY
          git rm .github/workflows/x04-failclosed-reconciliation-fix.yml
          git config user.name 'P2wn'
          git config user.email 'racecarboy77@gmail.com'
          git add components/enthusia-commend/src/main/java/org/enthusia/rep/api/ReputationModerationApi.java \
                  components/enthusia-commend/src/main/java/org/enthusia/rep/moderation/ReputationModerationService.java \
                  components/enthusia-commend/src/test/java/org/enthusia/rep/moderation/ReputationModerationServiceTest.java \
                  integration-contracts/src/main/java/org/enthusia/rep/api/ReputationModerationApi.java \
                  paper/src/main/java/net/enthusia/staff/paper/integration/ReputationIntegration.java \
                  paper/src/main/java/net/enthusia/staff/paper/integration/ReputationRestrictionSynchronizer.java \
                  paper/src/test/java/net/enthusia/staff/paper/integration/ReputationIntegrationTest.java
          git commit -m 'ES-X04: fail closed during reputation reconciliation'
          git push origin HEAD:package/es-x04-commend-provider
