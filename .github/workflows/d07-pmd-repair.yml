name: D07 PMD repair

on:
  push:
    branches:
      - "package/es-d07-discord-punishment-enforcement"

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == '[ES-D07] Stage PMD repair runner'
    name: Apply and validate D07 PMD repairs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Apply exact D07 repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          # Integration-test constants and executor ownership.
          path = "integration-tests/src/test/java/net/enthusia/staff/integration/DiscordPunishmentPersistenceIntegrationTest.java"
          text = read(path)
          text = replace_once(
              text,
              '    private static final DiscordGuildId GUILD_ID = new DiscordGuildId("1410303324745371709");\n',
              '    private static final DiscordGuildId GUILD_ID = new DiscordGuildId("1410303324745371709");\n'
              '    private static final String CREATE_OPERATION_PREFIX = "d07-create-";\n',
              "integration operation prefix",
          )
          count = text.count('"d07-create-" +')
          if count != 5:
              raise SystemExit(f"integration operation literals: expected 5, found {count}")
          text = text.replace('"d07-create-" +', 'CREATE_OPERATION_PREFIX +')
          old = '''            ExecutorService executor = Executors.newFixedThreadPool(2);\n            try {\n                Future<CreateAttempt> firstAttempt = executor.submit(\n                        () -> createWhenReleased(repository, first, ready, start)\n                );\n                Future<CreateAttempt> secondAttempt = executor.submit(\n                        () -> createWhenReleased(repository, second, ready, start)\n                );\n                assertTrue(ready.await(2, TimeUnit.SECONDS));\n                start.countDown();\n\n                CreateAttempt firstResult = firstAttempt.get(10, TimeUnit.SECONDS);\n                CreateAttempt secondResult = secondAttempt.get(10, TimeUnit.SECONDS);\n                long successes = List.of(firstResult, secondResult).stream().filter(CreateAttempt::success).count();\n                assertEquals(1L, successes);\n                CreateAttempt rejected = firstResult.success() ? secondResult : firstResult;\n                assertInstanceOf(ModerationPersistenceException.class, rejected.failure());\n                assertEquals(1, repository.activeForTarget(\n                        GUILD_ID, userId, DiscordConsequenceType.MUTE, 10\n                ).size());\n            } finally {\n                start.countDown();\n                executor.shutdownNow();\n            }\n'''
          new = '''            try (ExecutorService executor = Executors.newFixedThreadPool(2)) {\n                try {\n                    Future<CreateAttempt> firstAttempt = executor.submit(\n                            () -> createWhenReleased(repository, first, ready, start)\n                    );\n                    Future<CreateAttempt> secondAttempt = executor.submit(\n                            () -> createWhenReleased(repository, second, ready, start)\n                    );\n                    assertTrue(ready.await(2, TimeUnit.SECONDS));\n                    start.countDown();\n\n                    CreateAttempt firstResult = firstAttempt.get(10, TimeUnit.SECONDS);\n                    CreateAttempt secondResult = secondAttempt.get(10, TimeUnit.SECONDS);\n                    long successes = List.of(firstResult, secondResult).stream().filter(CreateAttempt::success).count();\n                    assertEquals(1L, successes);\n                    CreateAttempt rejected = firstResult.success() ? secondResult : firstResult;\n                    assertInstanceOf(ModerationPersistenceException.class, rejected.failure());\n                    assertEquals(1, repository.activeForTarget(\n                            GUILD_ID, userId, DiscordConsequenceType.MUTE, 10\n                    ).size());\n                } finally {\n                    start.countDown();\n                    executor.shutdownNow();\n                }\n            }\n'''
          text = replace_once(text, old, new, "integration executor ownership")
          write(path, text)

          # Split duration parsing into bounded validation/conversion helpers.
          path = "staff-bot/src/main/java/net/enthusia/staff/discordbot/DiscordDurationParser.java"
          text = read(path)
          old = '''    Parsed parse(String raw, boolean permanentAllowed) {\n        if (raw == null || raw.isBlank()) {\n            throw new IllegalArgumentException("duration is required");\n        }\n        String normalized = raw.trim().toLowerCase(Locale.ROOT);\n        if (normalized.equals("perm") || normalized.equals("permanent")) {\n            if (!permanentAllowed) {\n                throw new IllegalArgumentException("permanent duration is not valid for this consequence");\n            }\n            return new Parsed(SanctionLength.permanent(), false);\n        }\n        Duration preset = PRESETS.get(normalized);\n        if (preset != null) {\n            return new Parsed(SanctionLength.temporary(preset), false);\n        }\n        Matcher matcher = TEMPORARY.matcher(normalized);\n        if (!matcher.matches()) {\n            throw new IllegalArgumentException("duration must be a preset, custom number plus s/m/h/d/w, or permanent");\n        }\n        long quantity = Long.parseLong(matcher.group(1));\n        Duration duration = switch (matcher.group(2)) {\n            case "s" -> Duration.ofSeconds(quantity);\n            case "m" -> Duration.ofMinutes(quantity);\n            case "h" -> Duration.ofHours(quantity);\n            case "d" -> Duration.ofDays(quantity);\n            case "w" -> Duration.ofDays(Math.multiplyExact(quantity, 7));\n            default -> throw new IllegalArgumentException("unsupported duration unit");\n        };\n        if (duration.compareTo(MAXIMUM) > 0) {\n            throw new IllegalArgumentException("duration exceeds the parser safety maximum");\n        }\n        return new Parsed(SanctionLength.temporary(duration), true);\n    }\n'''
          new = '''    Parsed parse(String raw, boolean permanentAllowed) {\n        String normalized = normalize(raw);\n        if (isPermanent(normalized)) {\n            return permanent(permanentAllowed);\n        }\n        Duration preset = PRESETS.get(normalized);\n        return preset == null ? custom(normalized) : temporary(preset, false);\n    }\n\n    private static String normalize(String raw) {\n        if (raw == null || raw.isBlank()) {\n            throw new IllegalArgumentException("duration is required");\n        }\n        return raw.trim().toLowerCase(Locale.ROOT);\n    }\n\n    private static boolean isPermanent(String value) {\n        return value.equals("perm") || value.equals("permanent");\n    }\n\n    private static Parsed permanent(boolean allowed) {\n        if (!allowed) {\n            throw new IllegalArgumentException("permanent duration is not valid for this consequence");\n        }\n        return new Parsed(SanctionLength.permanent(), false);\n    }\n\n    private static Parsed custom(String value) {\n        Matcher matcher = TEMPORARY.matcher(value);\n        if (!matcher.matches()) {\n            throw new IllegalArgumentException("duration must be a preset, custom number plus s/m/h/d/w, or permanent");\n        }\n        long quantity = Long.parseLong(matcher.group(1));\n        Duration duration = duration(quantity, matcher.group(2));\n        if (duration.compareTo(MAXIMUM) > 0) {\n            throw new IllegalArgumentException("duration exceeds the parser safety maximum");\n        }\n        return temporary(duration, true);\n    }\n\n    private static Parsed temporary(Duration duration, boolean custom) {\n        return new Parsed(SanctionLength.temporary(duration), custom);\n    }\n\n    private static Duration duration(long quantity, String unit) {\n        return switch (unit) {\n            case "s" -> Duration.ofSeconds(quantity);\n            case "m" -> Duration.ofMinutes(quantity);\n            case "h" -> Duration.ofHours(quantity);\n            case "d" -> Duration.ofDays(quantity);\n            case "w" -> Duration.ofDays(Math.multiplyExact(quantity, 7));\n            default -> throw new IllegalArgumentException("unsupported duration unit");\n        };\n    }\n'''
          text = replace_once(text, old, new, "duration parser split")
          write(path, text)

          # Replace magic zero user-id condition with a named invalid sentinel.
          path = "staff-bot/src/main/java/net/enthusia/staff/discordbot/DiscordPunishmentCommandController.java"
          text = read(path)
          text = replace_once(
              text,
              '    private static final String PANEL_MODAL_PREFIX = "d07m:";\n',
              '    private static final String PANEL_MODAL_PREFIX = "d07m:";\n'
              '    private static final long INVALID_USER_ID = 0L;\n',
              "controller invalid id constant",
          )
          text = replace_once(text, '        if (value == 0L) {\n', '        if (value == INVALID_USER_ID) {\n', "controller invalid id check")
          write(path, text)

          # Make confirmation-store locking explicit and block-scoped while preserving insertion-order eviction.
          path = "staff-bot/src/main/java/net/enthusia/staff/discordbot/DiscordPunishmentConfirmationStore.java"
          text = read(path)
          old = '''    private final Clock clock;\n    private final Duration ttl;\n    private final int capacity;\n    private final LinkedHashMap<UUID, Draft> drafts = new LinkedHashMap<>();\n'''
          new = '''    private final Clock clock;\n    private final Duration ttl;\n    private final int capacity;\n    private final Object lock = new Object();\n    // Linked insertion order provides deterministic eviction; lock guards every access.\n    @SuppressWarnings("PMD.DocumentMutableMapFieldConcurrency")\n    private final LinkedHashMap<UUID, Draft> drafts = new LinkedHashMap<>();\n'''
          text = replace_once(text, old, new, "confirmation fields")
          old = '''    synchronized UUID put(DraftFactory factory) {\n        if (factory == null) {\n            throw new IllegalArgumentException("draft factory must be present");\n        }\n        purgeExpired();\n        if (drafts.size() >= capacity) {\n            Iterator<Map.Entry<UUID, Draft>> iterator = drafts.entrySet().iterator();\n            if (iterator.hasNext()) {\n                iterator.next();\n                iterator.remove();\n            }\n        }\n        UUID token = UUID.randomUUID();\n        drafts.put(token, factory.create(clock.instant().plus(ttl)));\n        return token;\n    }\n\n    synchronized Draft claimForActor(UUID token, UUID actorId) {\n        if (token == null || actorId == null) {\n            throw new IllegalArgumentException("confirmation token and actor must be present");\n        }\n        Draft draft = drafts.get(token);\n        if (draft == null) {\n            throw unavailable();\n        }\n        if (!clock.instant().isBefore(draft.expiresAt())) {\n            drafts.remove(token);\n            throw unavailable();\n        }\n        if (!draft.authorization().actorId().equals(actorId)) {\n            throw new SecurityException("confirmation belongs to another staff actor");\n        }\n        drafts.remove(token);\n        return draft;\n    }\n\n    synchronized int size() {\n        purgeExpired();\n        return drafts.size();\n    }\n\n    private void purgeExpired() {\n        Instant now = clock.instant();\n        drafts.entrySet().removeIf(entry -> !now.isBefore(entry.getValue().expiresAt()));\n    }\n'''
          new = '''    UUID put(DraftFactory factory) {\n        if (factory == null) {\n            throw new IllegalArgumentException("draft factory must be present");\n        }\n        synchronized (lock) {\n            purgeExpiredLocked();\n            evictOldestIfFull();\n            UUID token = UUID.randomUUID();\n            drafts.put(token, factory.create(clock.instant().plus(ttl)));\n            return token;\n        }\n    }\n\n    Draft claimForActor(UUID token, UUID actorId) {\n        if (token == null || actorId == null) {\n            throw new IllegalArgumentException("confirmation token and actor must be present");\n        }\n        synchronized (lock) {\n            Draft draft = drafts.get(token);\n            requireAvailable(token, draft);\n            if (!draft.authorization().actorId().equals(actorId)) {\n                throw new SecurityException("confirmation belongs to another staff actor");\n            }\n            drafts.remove(token);\n            return draft;\n        }\n    }\n\n    int size() {\n        synchronized (lock) {\n            purgeExpiredLocked();\n            return drafts.size();\n        }\n    }\n\n    private void evictOldestIfFull() {\n        if (drafts.size() < capacity) {\n            return;\n        }\n        Iterator<Map.Entry<UUID, Draft>> iterator = drafts.entrySet().iterator();\n        if (iterator.hasNext()) {\n            iterator.next();\n            iterator.remove();\n        }\n    }\n\n    private void requireAvailable(UUID token, Draft draft) {\n        if (draft == null) {\n            throw unavailable();\n        }\n        if (!clock.instant().isBefore(draft.expiresAt())) {\n            drafts.remove(token);\n            throw unavailable();\n        }\n    }\n\n    private void purgeExpiredLocked() {\n        Instant now = clock.instant();\n        drafts.entrySet().removeIf(entry -> !now.isBefore(entry.getValue().expiresAt()));\n    }\n'''
          text = replace_once(text, old, new, "confirmation locking")
          write(path, text)

          # Worker: exhaustive switch and keep member-bound sanctions reconciling while a user is absent.
          path = "staff-bot/src/main/java/net/enthusia/staff/discordbot/DiscordPunishmentWorker.java"
          text = read(path)
          text = replace_once(
              text,
              '    private static final String NATIVE_BAN_OWNERSHIP_CONFLICT = "NATIVE_BAN_OWNERSHIP_CONFLICT";\n',
              '    private static final String NATIVE_BAN_OWNERSHIP_CONFLICT = "NATIVE_BAN_OWNERSHIP_CONFLICT";\n'
              '    private static final String TARGET_NOT_IN_GUILD = "TARGET_NOT_IN_GUILD";\n',
              "worker reconciliation constants",
          )
          text = replace_once(
              text,
              '''        switch (work.type()) {\n            case APPLY -> apply(work, stored);\n            case REMOVE -> remove(work, stored);\n            case RECONCILE -> reconcile(work, stored);\n        }\n''',
              '''        switch (work.type()) {\n            case APPLY -> apply(work, stored);\n            case REMOVE -> remove(work, stored);\n            case RECONCILE -> reconcile(work, stored);\n            default -> throw new IllegalStateException("unsupported D07 work type");\n        }\n''',
              "worker switch default",
          )
          text = replace_once(
              text,
              '''        if (NATIVE_BAN_OWNERSHIP_CONFLICT.equals(failure.errorCode())) {\n            return List.of(reconcileLater());\n        }\n''',
              '''        if (keepsPeriodicReconciliation(failure.errorCode())) {\n            return List.of(reconcileLater());\n        }\n''',
              "worker periodic reconciliation",
          )
          marker = '''    private DiscordPunishment reconciled(\n'''
          helper = '''    private static boolean keepsPeriodicReconciliation(String errorCode) {\n        return NATIVE_BAN_OWNERSHIP_CONFLICT.equals(errorCode) || TARGET_NOT_IN_GUILD.equals(errorCode);\n    }\n\n'''
          text = replace_once(text, marker, helper + marker, "worker reconciliation helper")
          write(path, text)

          path = "staff-bot/src/test/java/net/enthusia/staff/discordbot/DiscordPunishmentWorkerTest.java"
          text = read(path)
          marker = '''    private static DiscordPunishmentWorker newWorker(FakeRepository repository, FakeGateway gateway) {\n'''
          test = '''    @Test\n    void absentMemberReconciliationRemainsScheduledForRejoinRecovery() {\n        FakeRepository repository = new FakeRepository(appliedMute());\n        FakeGateway gateway = new FakeGateway();\n        gateway.reconcileFailure = new DiscordPunishmentGateway.EffectException("TARGET_NOT_IN_GUILD", false);\n        repository.enqueue(WorkType.RECONCILE, NOW, 1);\n\n        newWorker(repository, gateway).runCycle();\n\n        assertEquals(DiscordPunishmentState.APPLIED, repository.current.punishment().state());\n        assertTrue(repository.current.punishment().externalApplied());\n        assertEquals(Optional.of("TARGET_NOT_IN_GUILD"), repository.current.punishment().lastErrorCode());\n        assertEquals(1, gateway.reconcileCalls);\n        assertEquals(1, repository.work.size());\n        assertEquals(WorkType.RECONCILE, repository.work.peek().type());\n        assertTrue(repository.work.peek().dueAt().isAfter(NOW));\n    }\n\n'''
          text = replace_once(text, marker, test + marker, "worker rejoin recovery test")
          write(path, text)

          # Gateway: explicit switch defaults and named Discord response codes.
          path = "staff-bot/src/main/java/net/enthusia/staff/discordbot/JdaDiscordPunishmentGateway.java"
          text = read(path)
          text = replace_once(
              text,
              '    private static final int MAX_AUDIT_REASON = 500;\n',
              '    private static final int MAX_AUDIT_REASON = 500;\n'
              '    private static final String UNKNOWN_MEMBER = "UNKNOWN_MEMBER";\n'
              '    private static final String UNKNOWN_USER = "UNKNOWN_USER";\n'
              '    private static final String UNSUPPORTED_CONSEQUENCE = "UNSUPPORTED_CONSEQUENCE";\n',
              "gateway response constants",
          )
          replacements = [
              (
                  '''                case CHANNEL_RESTRICTION -> restrictionContainer(guild, intent.restriction().orElseThrow());\n                case WARNING, KICK -> { }\n            }\n''',
                  '''                case CHANNEL_RESTRICTION -> restrictionContainer(guild, intent.restriction().orElseThrow());\n                case WARNING, KICK -> { }\n                default -> throw failure(UNSUPPORTED_CONSEQUENCE, false);\n            }\n''',
                  "gateway preflight default",
              ),
              (
                  '''                case CHANNEL_RESTRICTION -> removeRestriction(guild, punishment);\n                case WARNING, KICK -> { }\n            }\n''',
                  '''                case CHANNEL_RESTRICTION -> removeRestriction(guild, punishment);\n                case WARNING, KICK -> { }\n                default -> throw failure(UNSUPPORTED_CONSEQUENCE, false);\n            }\n''',
                  "gateway remove default",
              ),
              (
                  '''                case CHANNEL_RESTRICTION -> applyRestriction(guild, punishment);\n                case WARNING, KICK -> { }\n            }\n''',
                  '''                case CHANNEL_RESTRICTION -> applyRestriction(guild, punishment);\n                case WARNING, KICK -> { }\n                default -> throw failure(UNSUPPORTED_CONSEQUENCE, false);\n            }\n''',
                  "gateway reconcile default",
              ),
              (
                  '''            case CHANNEL_RESTRICTION -> applyRestriction(guild, punishment);\n            case WARNING -> { }\n        }\n''',
                  '''            case CHANNEL_RESTRICTION -> applyRestriction(guild, punishment);\n            case WARNING -> { }\n            default -> throw failure(UNSUPPORTED_CONSEQUENCE, false);\n        }\n''',
                  "gateway apply default",
              ),
          ]
          for old, new, label in replacements:
              text = replace_once(text, old, new, label)
          text = replace_once(
              text,
              '            if ("UNKNOWN_MEMBER".equals(code) || "UNKNOWN_USER".equals(code)) {\n',
              '            if (UNKNOWN_MEMBER.equals(code) || UNKNOWN_USER.equals(code)) {\n',
              "gateway unknown target codes",
          )
          write(path, text)

          # Locale-stable public text and test actor labels.
          path = "staff-bot/src/main/java/net/enthusia/staff/discordbot/JdaPunishmentNotifier.java"
          text = read(path)
          text = replace_once(text, 'package net.enthusia.staff.discordbot;\n\n', 'package net.enthusia.staff.discordbot;\n\nimport java.util.Locale;\n', "notifier locale import")
          text = replace_once(text, '.name().toLowerCase()\n', '.name().toLowerCase(Locale.ROOT)\n', "notifier locale conversion")
          write(path, text)

          path = "staff-bot/src/test/java/net/enthusia/staff/discordbot/DiscordPunishmentAuthorizationTest.java"
          text = read(path)
          text = replace_once(text, 'import java.time.Duration;\n', 'import java.time.Duration;\nimport java.util.Locale;\n', "authorization test locale import")
          text = replace_once(text, 'rank.name().toLowerCase()', 'rank.name().toLowerCase(Locale.ROOT)', "authorization test locale conversion")
          write(path, text)

          # Test executors are explicit AutoCloseable resources; named first-cycle sentinel avoids magic literal.
          path = "staff-bot/src/test/java/net/enthusia/staff/discordbot/DiscordPunishmentCoordinatorTest.java"
          text = read(path)
          text = replace_once(
              text,
              'class DiscordPunishmentCoordinatorTest {\n',
              'class DiscordPunishmentCoordinatorTest {\n    private static final int FIRST_CYCLE = 1;\n',
              "coordinator first cycle constant",
          )
          old = '''        ScheduledExecutorService scheduler = Executors.newSingleThreadScheduledExecutor();\n        ExecutorService control = Executors.newSingleThreadExecutor();\n        DiscordPunishmentCoordinator coordinator = new DiscordPunishmentCoordinator(\n                cycle, Duration.ofMillis(5), scheduler\n        );\n        try {\n            coordinator.start();\n            coordinator.resume();\n            assertTrue(firstEntered.await(2, TimeUnit.SECONDS));\n\n            Future<?> paused = control.submit(coordinator::pause);\n            assertThrows(TimeoutException.class, () -> paused.get(100, TimeUnit.MILLISECONDS));\n            releaseFirst.countDown();\n            paused.get(2, TimeUnit.SECONDS);\n\n            coordinator.resume();\n            assertTrue(secondEntered.await(2, TimeUnit.SECONDS));\n        } finally {\n            releaseFirst.countDown();\n            coordinator.close();\n            control.shutdownNow();\n        }\n'''
          new = '''        try (ScheduledExecutorService scheduler = Executors.newSingleThreadScheduledExecutor();\n             ExecutorService control = Executors.newSingleThreadExecutor()) {\n            DiscordPunishmentCoordinator coordinator = new DiscordPunishmentCoordinator(\n                    cycle, Duration.ofMillis(5), scheduler\n            );\n            try {\n                coordinator.start();\n                coordinator.resume();\n                assertTrue(firstEntered.await(2, TimeUnit.SECONDS));\n\n                Future<?> paused = control.submit(coordinator::pause);\n                assertThrows(TimeoutException.class, () -> paused.get(100, TimeUnit.MILLISECONDS));\n                releaseFirst.countDown();\n                paused.get(2, TimeUnit.SECONDS);\n\n                coordinator.resume();\n                assertTrue(secondEntered.await(2, TimeUnit.SECONDS));\n            } finally {\n                releaseFirst.countDown();\n                coordinator.close();\n                control.shutdownNow();\n            }\n        }\n'''
          text = replace_once(text, old, new, "coordinator pause resource ownership")
          old = '''        ScheduledExecutorService scheduler = Executors.newSingleThreadScheduledExecutor();\n        ExecutorService control = Executors.newSingleThreadExecutor();\n        DiscordPunishmentCoordinator coordinator = new DiscordPunishmentCoordinator(\n                () -> {\n                    entered.countDown();\n                    await(release);\n                },\n                Duration.ofMillis(5),\n                scheduler\n        );\n        try {\n            coordinator.start();\n            coordinator.resume();\n            assertTrue(entered.await(2, TimeUnit.SECONDS));\n\n            Future<?> closed = control.submit(coordinator::close);\n            assertThrows(TimeoutException.class, () -> closed.get(100, TimeUnit.MILLISECONDS));\n            release.countDown();\n            closed.get(2, TimeUnit.SECONDS);\n\n            assertThrows(IllegalStateException.class, coordinator::resume);\n        } finally {\n            release.countDown();\n            coordinator.close();\n            control.shutdownNow();\n        }\n'''
          new = '''        try (ScheduledExecutorService scheduler = Executors.newSingleThreadScheduledExecutor();\n             ExecutorService control = Executors.newSingleThreadExecutor()) {\n            DiscordPunishmentCoordinator coordinator = new DiscordPunishmentCoordinator(\n                    () -> {\n                        entered.countDown();\n                        await(release);\n                    },\n                    Duration.ofMillis(5),\n                    scheduler\n            );\n            try {\n                coordinator.start();\n                coordinator.resume();\n                assertTrue(entered.await(2, TimeUnit.SECONDS));\n\n                Future<?> closed = control.submit(coordinator::close);\n                assertThrows(TimeoutException.class, () -> closed.get(100, TimeUnit.MILLISECONDS));\n                release.countDown();\n                closed.get(2, TimeUnit.SECONDS);\n\n                assertThrows(IllegalStateException.class, coordinator::resume);\n            } finally {\n                release.countDown();\n                coordinator.close();\n                control.shutdownNow();\n            }\n        }\n'''
          text = replace_once(text, old, new, "coordinator close resource ownership")
          text = replace_once(text, '            if (call == 1) {\n', '            if (call == FIRST_CYCLE) {\n', "coordinator first cycle check")
          write(path, text)
          PY

      - name: Verify PMD findings are resolved
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://github.com/pmd/pmd/releases/download/pmd_releases%2F6.55.0/pmd-bin-6.55.0.zip' \
            --output /tmp/pmd.zip
          unzip -q /tmp/pmd.zip -d /tmp
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.java')
          input="$(IFS=,; echo "${files[*]}")"
          /tmp/pmd-bin-6.55.0/bin/run.sh pmd \
            -d "${input}" \
            -R ruleset.xml \
            -f text \
            -r /tmp/pmd-findings.txt
          cat /tmp/pmd-findings.txt

      - name: Run focused D07 tests
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :domain:test :persistence:test :staff-bot:test :integration-tests:test \
            --no-daemon \
            --no-build-cache \
            --no-configuration-cache \
            --console=plain

      - name: Commit repairs and remove temporary diagnostics
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/d07-pmd-diagnostics.yml .github/workflows/d07-pmd-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(es-d07): resolve static analysis and rejoin recovery"
          git push origin HEAD:package/es-d07-discord-punishment-enforcement
