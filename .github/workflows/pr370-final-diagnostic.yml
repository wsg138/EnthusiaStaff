name: PR370 Final Diagnostic

on:
  push:
    branches:
      - diagnostic/370-final-static

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Velocity tests
        run: ./gradlew :velocity:test --no-daemon --stacktrace
      - name: Run PMD on chat relay
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --location --silent --show-error \
            "https://github.com/pmd/pmd/releases/download/pmd_releases%2F6.55.0/pmd-bin-6.55.0.zip" \
            -o /tmp/pmd.zip
          unzip -q /tmp/pmd.zip -d /tmp
          set +e
          /tmp/pmd-bin-6.55.0/bin/run.sh pmd \
            -d velocity/src/main/java/net/enthusia/staff/velocity/VelocityChatBridgeRelay.java,velocity/src/test/java/net/enthusia/staff/velocity/VelocityChatBridgeRelayTest.java \
            -R ruleset.xml -f text -r /tmp/pmd.txt
          status=$?
          set -e
          cat /tmp/pmd.txt
          if [ "$status" -ne 0 ] && [ "$status" -ne 4 ]; then exit "$status"; fi
          test ! -s /tmp/pmd.txt
