name: ES-P12 review repair batch

on:
  push:
    branches:
      - "package/es-p12-staff-operational-hardening"

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == '[ES-P12] Stage review repair batch v2'
    name: Validate and publish review repair batch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Apply repair batch
        run: python3 scripts/es_p12_review_repair_v2.py

      - name: Install Lizard
        run: python3 -m pip install --disable-pip-version-check lizard==1.23.0

      - name: Check changed production complexity
        shell: bash
        run: |
          set -euo pipefail
          lizard -C 8 -L 50 -a 8 -w \
            paper/src/main/java/net/enthusia/staff/paper/command/StaffWhoCommand.java \
            paper/src/main/java/net/enthusia/staff/paper/visibility/VanishManager.java \
            paper/src/main/java/net/enthusia/staff/paper/enforcement/PaperBanEnforcementListener.java \
            paper/src/main/java/net/enthusia/staff/paper/freeze/FreezeManager.java \
            paper/src/main/java/net/enthusia/staff/paper/PaperPresenceListener.java \
            paper/src/main/java/net/enthusia/staff/paper/freeze/FreezeNoticeService.java \
            paper/src/main/java/net/enthusia/staff/paper/PaperRuntimeComponents.java \
            paper/src/main/java/net/enthusia/staff/paper/PaperCommandRegistrar.java \
            paper/src/main/java/net/enthusia/staff/paper/command/FreezeCommand.java
          python3 - <<'PY'
          import lizard
          path = 'paper/src/main/java/net/enthusia/staff/paper/staff/StaffModeManager.java'
          targets = {
              'restoreAndVerify',
              'completeRestoration',
              'retainRecoveryAfterRuntimeExit',
              'completeRuntimeExit',
              'removeRuntimeState',
          }
          found = set()
          for function in lizard.analyze_file(path).function_list:
              name = function.name.split('::')[-1]
              if name not in targets:
                  continue
              found.add(name)
              if function.cyclomatic_complexity > 8 or function.length > 50 or function.parameter_count > 8:
                  raise SystemExit(
                      f'{name} exceeds bounds: CCN={function.cyclomatic_complexity}, '
                      f'length={function.length}, params={function.parameter_count}'
                  )
          missing = targets - found
          if missing:
              raise SystemExit(f'missing StaffModeManager methods in Lizard scan: {sorted(missing)}')
          PY

      - name: Check PMD
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://github.com/pmd/pmd/releases/download/pmd_releases%2F6.55.0/pmd-bin-6.55.0.zip' \
            --output /tmp/pmd.zip
          unzip -q /tmp/pmd.zip -d /tmp
          /tmp/pmd-bin-6.55.0/bin/run.sh pmd \
            -d 'paper/src/main/java/net/enthusia/staff/paper/command/StaffWhoCommand.java,paper/src/main/java/net/enthusia/staff/paper/visibility/VanishManager.java,paper/src/main/java/net/enthusia/staff/paper/enforcement/PaperBanEnforcementListener.java,paper/src/main/java/net/enthusia/staff/paper/freeze/FreezeManager.java,paper/src/main/java/net/enthusia/staff/paper/PaperPresenceListener.java,paper/src/main/java/net/enthusia/staff/paper/staff/StaffModeManager.java,paper/src/main/java/net/enthusia/staff/paper/freeze/FreezeNoticeService.java,paper/src/main/java/net/enthusia/staff/paper/PaperRuntimeComponents.java,paper/src/main/java/net/enthusia/staff/paper/PaperCommandRegistrar.java,paper/src/main/java/net/enthusia/staff/paper/EnthusiaStaffPaperPlugin.java,paper/src/main/java/net/enthusia/staff/paper/command/FreezeCommand.java,paper/src/test/java/net/enthusia/staff/paper/command/StaffWhoCommandTest.java,paper/src/test/java/net/enthusia/staff/paper/enforcement/PaperBanEnforcementListenerTest.java,paper/src/test/java/net/enthusia/staff/paper/freeze/FreezeMovementAndCommandTest.java,paper/src/test/java/net/enthusia/staff/paper/PaperPresenceListenerTest.java,paper/src/test/java/net/enthusia/staff/paper/staff/StaffModeRestorationWiringTest.java,paper/src/test/java/net/enthusia/staff/paper/freeze/FreezeNoticeServiceTest.java,paper/src/test/java/net/enthusia/staff/paper/freeze/FreezeSchedulerBoundaryTest.java,paper/src/test/java/net/enthusia/staff/paper/command/FreezeCommandHierarchyTest.java' \
            -R ruleset.xml \
            -f text \
            -r /tmp/pmd-findings.txt
          cat /tmp/pmd-findings.txt

      - name: Run Paper tests and runtime build
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :paper:test runtimeJars --no-daemon --no-build-cache --no-configuration-cache --console=plain
          git diff --check

      - name: Publish validated repair
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/es_p12_review_repair.py scripts/es_p12_review_repair_v2.py .github/workflows/es-p12-review-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            paper/src/main/java/net/enthusia/staff/paper/command/StaffWhoCommand.java \
            paper/src/main/java/net/enthusia/staff/paper/visibility/VanishManager.java \
            paper/src/main/java/net/enthusia/staff/paper/enforcement/PaperBanEnforcementListener.java \
            paper/src/main/java/net/enthusia/staff/paper/freeze/FreezeManager.java \
            paper/src/main/java/net/enthusia/staff/paper/PaperPresenceListener.java \
            paper/src/main/java/net/enthusia/staff/paper/staff/StaffModeManager.java \
            paper/src/main/java/net/enthusia/staff/paper/freeze/FreezeNoticeService.java \
            paper/src/main/java/net/enthusia/staff/paper/PaperRuntimeComponents.java \
            paper/src/main/java/net/enthusia/staff/paper/PaperCommandRegistrar.java \
            paper/src/main/java/net/enthusia/staff/paper/EnthusiaStaffPaperPlugin.java \
            paper/src/main/java/net/enthusia/staff/paper/command/FreezeCommand.java \
            paper/src/test/java/net/enthusia/staff/paper/command/StaffWhoCommandTest.java \
            paper/src/test/java/net/enthusia/staff/paper/enforcement/PaperBanEnforcementListenerTest.java \
            paper/src/test/java/net/enthusia/staff/paper/freeze/FreezeMovementAndCommandTest.java \
            paper/src/test/java/net/enthusia/staff/paper/PaperPresenceListenerTest.java \
            paper/src/test/java/net/enthusia/staff/paper/staff/StaffModeRestorationWiringTest.java \
            paper/src/test/java/net/enthusia/staff/paper/freeze/FreezeNoticeServiceTest.java \
            paper/src/test/java/net/enthusia/staff/paper/freeze/FreezeSchedulerBoundaryTest.java \
            paper/src/test/java/net/enthusia/staff/paper/command/FreezeCommandHierarchyTest.java \
            scripts/es_p12_review_repair.py \
            scripts/es_p12_review_repair_v2.py \
            .github/workflows/es-p12-review-repair.yml
          git commit -m "ES-P12: repair review findings and freeze runtime gaps"
          git push origin HEAD:package/es-p12-staff-operational-hardening
