name: Staff Bot Configuration Cache

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "staff-bot/**"
      - "build.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/staff-bot-configuration-cache.yml"

permissions:
  contents: read

concurrency:
  group: staff-bot-configuration-cache-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify staff-bot configuration-cache compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Record checked-out SHA
        shell: bash
        run: |
          TESTED_SHA="$(git rev-parse HEAD)"
          test -n "${TESTED_SHA}"
          echo "TESTED_SHA=${TESTED_SHA}" >> "${GITHUB_ENV}"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: true

      - name: Verify configuration cache and reuse it
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x gradlew
          for run in 1 2; do
            ./gradlew :staff-bot:check \
              --no-daemon \
              --no-build-cache \
              --configuration-cache \
              --configuration-cache-problems=fail \
              --console=plain
          done
          test "${TESTED_SHA}" = "$(git rev-parse HEAD)"

      - name: Report Codacy PR issue details
        if: ${{ always() && github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error \
            "https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/repositories/EnthusiaStaff/pull-requests/${{ github.event.pull_request.number }}/issues" \
            | jq -r '.data[] | [
                .commitIssue.toolInfo.name,
                .commitIssue.patternInfo.id,
                .commitIssue.patternInfo.category,
                .commitIssue.patternInfo.severityLevel,
                .commitIssue.filePath,
                (.commitIssue.lineNumber | tostring),
                .commitIssue.message
              ] | @tsv'
