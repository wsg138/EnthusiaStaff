name: Fix final Paper validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/punishment-history-lifecycle
          fetch-depth: 0
      - name: Align metadata and expiration tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          metadata = Path('paper/src/main/resources/plugin.yml')
          text = metadata.read_text(encoding='utf-8')
          old = '''  history:
              description: View database-paginated punishment and moderation history
              usage: /history <player|uuid> [page]
          '''
          new = '''  history:
              description: View database-paginated punishment and moderation history
              usage: /history <player|uuid> [page]
              permission: enthusiastaff.history.view
          '''
          if text.count(old) != 1:
              raise SystemExit('expected one history command metadata block')
          metadata.write_text(text.replace(old, new), encoding='utf-8')

          integrity = Path('paper/src/test/java/net/enthusia/staff/paper/config/PluginMetadataIntegrityTest.java')
          text = integrity.read_text(encoding='utf-8')
          text = text.replace(
              'void onlyEstaffAndPlayerReportOmitAnOuterPermission()',
              'void onlySubcommandRoutedCommandsOmitAnOuterPermission()'
          )
          old = 'assertEquals(Set.of("estaff", "report"), withoutOuterPermission);'
          new = 'assertEquals(Set.of("estaff", "report", "case"), withoutOuterPermission);'
          if text.count(old) != 1:
              raise SystemExit('expected one outer-permission assertion')
          integrity.write_text(text.replace(old, new), encoding='utf-8')

          parser_test = Path('paper/src/test/java/net/enthusia/staff/paper/command/SanctionExpirationParserTest.java')
          text = parser_test.read_text(encoding='utf-8')
          old = '{"", "0m", "-1h", "later", "1month", "999999999w"}'
          new = '{"", "0m", "-1h", "later", "1month", "999999999w", "2200-01-01T00:00:00Z"}'
          if text.count(old) != 1:
              raise SystemExit('expected one invalid-expiration fixture list')
          parser_test.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/src/main/resources/plugin.yml paper/src/test/java/net/enthusia/staff/paper/config/PluginMetadataIntegrityTest.java paper/src/test/java/net/enthusia/staff/paper/command/SanctionExpirationParserTest.java
          git commit -m "Align final Paper validation expectations"
          git push origin HEAD:feature/punishment-history-lifecycle
