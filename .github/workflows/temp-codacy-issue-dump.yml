name: Temporary Codacy issue dump

on:
  push:
    branches: [feature/readable-network-verify]
    paths: [.github/workflows/temp-codacy-issue-dump.yml]

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch current PR issue metadata
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            'https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/repositories/EnthusiaStaff/pull-requests/257/issues?status=new&limit=100' \
            -o /tmp/issues.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/issues.json', encoding='utf-8'))
          items = data.get('data', data if isinstance(data, list) else [])
          print('CODACY_ISSUE_COUNT=' + str(len(items)))
          for index, item in enumerate(items, 1):
              ci = item.get('commitIssue') or item
              pattern = ci.get('patternInfo') or {}
              tool = pattern.get('toolInfo') or {}
              location = ci.get('location') or {}
              print(f'ISSUE {index}')
              print(' file=' + str(ci.get('filePath') or item.get('filePath')))
              print(' line=' + str(location.get('startLine') or ci.get('line') or item.get('line')))
              print(' pattern=' + str(pattern.get('id') or ci.get('patternId') or item.get('patternId')))
              print(' title=' + str(pattern.get('title') or ci.get('message') or item.get('message')))
              print(' level=' + str(pattern.get('level') or ci.get('level') or item.get('level')))
              print(' category=' + str(pattern.get('category') or ci.get('category') or item.get('category')))
              print(' tool=' + str(tool.get('name') or ci.get('tool') or item.get('tool')))
          PY
