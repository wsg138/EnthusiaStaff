name: D13 Codacy Diagnostic

on:
  push:
    branches:
      - package/es-d13-role-sync-replacement

permissions:
  contents: read

jobs:
  codacy-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query public Codacy PR issues
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.request

          url = "https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/repositories/EnthusiaStaff/pull-requests/178/issues?status=new"
          request = urllib.request.Request(url, headers={"Accept": "application/json"})
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          for index, issue in enumerate(payload.get("data", []), start=1):
              print("ISSUE", index)
              print(json.dumps(issue, indent=2, sort_keys=True))
          print("TOTAL", len(payload.get("data", [])))
          PY
