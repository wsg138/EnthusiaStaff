name: Punishment GUI isolated Paper protocol smoke

on:
  pull_request:
    paths:
      - "paper/**"
      - "validation/punishment-gui-smoke/**"
      - ".github/workflows/punishment-gui-paper-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gui-smoke:
    name: Disposable Paper /punish picker protocol probe
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.8.3
        env:
          MARIADB_ROOT_PASSWORD: gui-root-${{ github.run_id }}-${{ github.run_attempt }}
          MARIADB_DATABASE: enthusiastaff_gui_smoke
          MARIADB_USER: gui_smoke
          MARIADB_PASSWORD: gui-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      # Credentials are fixed CI-only values for a disposable container,
      # not secrets and never read from a user's live environment.
      ES_DATABASE_URL: jdbc:mariadb://127.0.0.1:3307/enthusiastaff_gui_smoke
      ES_DATABASE_USER: gui_smoke
      ES_DATABASE_PASSWORD: gui-${{ github.run_id }}-${{ github.run_attempt }}
      PAPER_SHA256: b1d8f6bfa1b6101fa8e947b53041cb3bdf5540e7b83b6547ca19ba7edefeb083
      # Official Modrinth v5.5.71 Bukkit release, SHA-1 pinned from release metadata.
      LUCKPERMS_SHA1: fc8bb9919fa77c670b7ed5c284bcb66770ea71fc
      MINEFLAYER_COMMIT: f9e7db4447afda7838f08aa13430ec768738c178
      PAPER_USER_AGENT: EnthusiaStaff-gui-protocol-smoke/1.0.0
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # pinned in existing state-reset proof

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build candidate and isolated probe
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x gradlew
          ./gradlew :paper:test :paper:shadowJar --no-daemon --no-build-cache --console=plain
          (cd validation/punishment-gui-smoke && mvn -B -q package)
          mkdir -p "$RUNNER_TEMP/gui/server/plugins" "$RUNNER_TEMP/gui/evidence"
          jar_path="$(find paper/build/libs -maxdepth 1 -type f -name 'EnthusiaStaff-Paper-*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$jar_path"
          cp "$jar_path" "$RUNNER_TEMP/gui/server/plugins/EnthusiaStaff-Paper.jar"
          cp validation/punishment-gui-smoke/target/punishment-gui-smoke-1.0.0.jar "$RUNNER_TEMP/gui/server/plugins/"
          # Real LuckPerms is required: target hierarchy must never be bypassed.
          curl --fail --location --retry 4 --retry-all-errors \
            "https://cdn.modrinth.com/data/Vebnzrzj/versions/b0mk8uS6/LuckPerms-Bukkit-5.5.71.jar" \
            -o "$RUNNER_TEMP/gui/server/plugins/LuckPerms.jar"
          echo "$LUCKPERMS_SHA1  $RUNNER_TEMP/gui/server/plugins/LuckPerms.jar" | sha1sum --check -
          sha256sum "$RUNNER_TEMP/gui/server/plugins/"*.jar | tee "$RUNNER_TEMP/gui/evidence/jar-sha256.txt"
          git rev-parse HEAD | tee "$RUNNER_TEMP/gui/evidence/source-sha.txt"

      - name: Fetch pinned Paper and protocol client
        shell: bash
        run: |
          set -Eeuo pipefail
          response="$(curl --fail --silent --show-error -H "User-Agent: $PAPER_USER_AGENT" \
            "https://fill.papermc.io/v3/projects/paper/versions/26.2/builds")"
          url="$(jq -r 'first(.[] | select(.id == 129)) | .downloads["server:default"].url' <<< "$response")"
          test -n "$url" && test "$url" != "null"
          curl --fail --location --retry 4 --retry-all-errors -H "User-Agent: $PAPER_USER_AGENT" \
            "$url" -o "$RUNNER_TEMP/gui/server/server.jar"
          echo "$PAPER_SHA256  $RUNNER_TEMP/gui/server/server.jar" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/gui/mineflayer"
          (cd "$RUNNER_TEMP/gui/mineflayer" && npm init -y >/dev/null && \
            npm install --no-audit --no-fund \
            "https://github.com/zkonikishi/Mineflayer/archive/$MINEFLAYER_COMMIT.tar.gz")

      - name: Verify actual Paper GUI holder and window packet on loopback
        shell: bash
        run: |
          set -Eeuo pipefail
          server="$RUNNER_TEMP/gui/server"
          evidence="$RUNNER_TEMP/gui/evidence"
          printf 'eula=true\n' > "$server/eula.txt"
          cat > "$server/server.properties" <<'EOF'
          server-ip=127.0.0.1
          server-port=25589
          online-mode=false
          enforce-secure-profile=false
          max-players=2
          spawn-protection=0
          view-distance=3
          simulation-distance=3
          enable-status=false
          enable-query=false
          level-type=minecraft:flat
          motd=disposable-gui-protocol-smoke
          EOF
          (cd "$server" && java -Denthusia.gui.smoke.isolated=true -Xms512M -Xmx2G \
            -jar server.jar nogui > "$evidence/server-console.log" 2>&1) &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 140); do
            if grep -q 'Done (' "$server/logs/latest.log" 2>/dev/null; then ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then tail -n 180 "$evidence/server-console.log" || true; exit 1; fi
          grep -F 'HARNESS_READY=true' "$server/punishment-gui-smoke.txt"
          ! grep -F 'Required database environment variables are missing' "$evidence/server-console.log"
          ! grep -F 'Freeze storage is unavailable' "$evidence/server-console.log"

          set +e
          NODE_PATH="$RUNNER_TEMP/gui/mineflayer/node_modules" timeout 80 \
            node validation/punishment-gui-smoke/client.js 25589 \
            | tee "$evidence/client.log"
          client_status=${PIPESTATUS[0]}
          set -e
          echo '===== GUI smoke helper evidence ====='
          cat "$server/punishment-gui-smoke.txt" || true
          echo '===== Relevant Paper runtime log ====='
          grep -Ei 'EnthusiaStaff|Punish|Permission|Authority|GuiSmoke|ERROR|WARN' \
            "$evidence/server-console.log" | tail -n 110 || true
          if [[ "$client_status" != 0 ]]; then
            echo "::error::GUI protocol client failed; server helper evidence printed above"
            exit "$client_status"
          fi

          grep -F 'OFF_DUTY_PICKER_BLOCKED=true' "$server/punishment-gui-smoke.txt"
          grep -F 'STAFF_COMMAND_ACCEPTED=true' "$server/punishment-gui-smoke.txt"
          grep -F 'PUNISH_COMMAND_ACCEPTED=true' "$server/punishment-gui-smoke.txt"
          grep -F 'PICKER_OPEN=true' "$server/punishment-gui-smoke.txt"
          grep -F 'GUI_PACKET_54_SLOTS=true' "$evidence/client.log"
          grep -F 'REFRESH_CLICK_OBSERVED=true' "$server/punishment-gui-smoke.txt"
          grep -F 'PICKER_REFRESH_OPEN=true' "$server/punishment-gui-smoke.txt"
          grep -F 'CLOSE_CLICK_OBSERVED=true' "$server/punishment-gui-smoke.txt"
          grep -F 'PICKER_CLOSED_AFTER_CONTROL=true' "$server/punishment-gui-smoke.txt"
          grep -F 'GUI_CLIENT_REFRESH_CLICK=true' "$evidence/client.log"
          grep -F 'GUI_CLIENT_REFRESHED_PICKER=true' "$evidence/client.log"
          grep -F 'GUI_CLIENT_CLOSE_CLICK=true' "$evidence/client.log"
          grep -F 'GUI_CLIENT_REFRESH_AND_CLOSE=true' "$evidence/client.log"
          grep -F 'GUI_DISPOSABLE_TARGET_SPAWN=true' "$evidence/client.log"
          grep -F 'DEDICATED_TARGET_ONLINE=true' "$server/punishment-gui-smoke.txt"
          grep -F 'TARGET_PICKER_REOPEN_HANDLED=true' "$server/punishment-gui-smoke.txt"
          grep -F 'GUI_CLIENT_TARGET_PICKER_REOPEN=true' "$evidence/client.log"
          grep -F 'TARGET_HEAD_CLICK_OBSERVED=true' "$server/punishment-gui-smoke.txt"
          grep -F 'GUI_CLIENT_TARGET_HEAD_CLICK=true' "$evidence/client.log"
          grep -F 'TARGET_CATEGORIES_OPEN=true' "$server/punishment-gui-smoke.txt"
          grep -F 'GUI_CLIENT_TARGET_CATEGORIES_OPEN=true' "$evidence/client.log"
          grep -F 'INVENTORY_OPEN|' "$server/punishment-gui-smoke.txt"
          ! grep -F 'FAIL=' "$server/punishment-gui-smoke.txt"
          ! grep -Eq 'NoSuchMethodError|NoSuchFieldError|ClassNotFoundException|LinkageError' "$evidence/server-console.log"
          cp "$server/punishment-gui-smoke.txt" "$evidence/server-proof.txt"
          echo 'GUI_PROTOCOL_SMOKE_PASS=true' | tee "$evidence/result.txt"

      - name: Preserve isolated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-paper-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gui/evidence/
            ${{ runner.temp }}/gui/server/logs/latest.log
            ${{ runner.temp }}/gui/server/punishment-gui-smoke.txt
          if-no-files-found: warn
          retention-days: 7
