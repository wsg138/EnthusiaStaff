name: ES-D16 Codacy Annotation Diagnostic

on:
  push:
    branches:
      - package/es-d16-moderation-read-bridge

permissions:
  contents: read
  checks: read

jobs:
  annotations:
    runs-on: ubuntu-latest
    steps:
      - name: Read exact Codacy annotations
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RUN_ID: '99898663640'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs/${CHECK_RUN_ID}/annotations?per_page=100" \
            | jq -r '.[] | [.path, (.start_line|tostring), (.end_line|tostring), .annotation_level, (.title // ""), .message] | @tsv'
