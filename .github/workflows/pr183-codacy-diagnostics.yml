name: PR183 Codacy diagnostics

on:
  push:
    branches:
      - "owner/staging-moderation-ui-preview"

permissions:
  contents: read

jobs:
  diagnose:
    name: Print current PR183 Codacy findings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Print current public Codacy PR issues
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            'https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/repositories/EnthusiaStaff/pull-requests/183/issues?limit=100' \
            -H 'Accept: application/json' \
            -o /tmp/codacy-pr-issues.json
          jq -r '
            .data[]
            | select(.deltaType == "Added")
            | [
                .commitIssue.filePath,
                (.commitIssue.lineNumber | tostring),
                .commitIssue.patternInfo.id,
                .commitIssue.patternInfo.level,
                .commitIssue.message,
                .commitIssue.lineText
              ]
            | @tsv
          ' /tmp/codacy-pr-issues.json
