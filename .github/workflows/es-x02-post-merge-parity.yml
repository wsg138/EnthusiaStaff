name: ES-X02 Post-Merge Parity Proof

on:
  push:
    branches:
      - status/es-x02-complete-20260813

permissions:
  contents: write

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact aggregate merge branch
        uses: actions/checkout@v4
        with:
          ref: status/es-x02-complete-20260813
          fetch-depth: 0

      - name: Check out exact standalone Currency main
        uses: actions/checkout@v4
        with:
          repository: wsg138/EnthusiaCurrency
          ref: b922c5af30860a6c205f9ee16b817349a7677cd0
          path: .es-x02-standalone
          persist-credentials: false

      - name: Run repository component parity tool
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse a3b6f2f7c1e9f6b7fe1667974aa0d050533605a9^{commit})" = 'a3b6f2f7c1e9f6b7fe1667974aa0d050533605a9'
          test "$(git -C .es-x02-standalone rev-parse HEAD)" = 'b922c5af30860a6c205f9ee16b817349a7677cd0'
          mkdir -p ai-agents/reports/package-handoffs
          python3 tools/component-sync/component_sync.py compare \
            components/enthusia-currency \
            .es-x02-standalone \
            --aggregate-sha a3b6f2f7c1e9f6b7fe1667974aa0d050533605a9 \
            --standalone-sha b922c5af30860a6c205f9ee16b817349a7677cd0 \
            > ai-agents/reports/package-handoffs/2026-08-13-es-x02-component-parity.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('ai-agents/reports/package-handoffs/2026-08-13-es-x02-component-parity.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          if not data.get('parity'):
              raise SystemExit('component_sync parity was false')
          for key in ('added', 'removed', 'modified'):
              if data.get(key):
                  raise SystemExit(f'component_sync reported {key}: {data[key]}')
          PY
          rm -rf .es-x02-standalone
          rm .github/workflows/es-x02-post-merge-parity.yml
          git diff --check

      - name: Commit parity evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs(es-x02): record post-merge component parity'
          git push origin HEAD:status/es-x02-complete-20260813
