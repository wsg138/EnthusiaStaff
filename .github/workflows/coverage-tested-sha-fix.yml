name: Prepare Coverage tested-SHA correction

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Correct tested-SHA diagnostics
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/fix-coverage.py
          python3 /tmp/fix-coverage.py

      - name: Upload corrected workflow
        uses: actions/upload-artifact@v7
        with:
          name: corrected-coverage-workflow-${{ github.event.pull_request.head.sha }}
          path: .github/workflows/coverage-measurement.yml
          if-no-files-found: error
          retention-days: 1
