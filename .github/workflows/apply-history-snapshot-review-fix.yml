name: Apply history snapshot review fix

on:
  push:
    branches:
      - feature/punishment-history-lifecycle
    paths:
      - .github/workflows/apply-history-snapshot-review-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/punishment-history-lifecycle
          fetch-depth: 0
      - name: Apply reviewed history snapshot fix
        shell: bash
        run: |
          python3 - <<'PY2'
          import base64, zlib
          script = zlib.decompress(base64.b64decode("")).decode('utf-8')
          exec(compile(script, 'apply_history_snapshot_fix.py', 'exec'))
          PY2
          git rm .github/workflows/apply-history-snapshot-review-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add persistence/src/main/java/net/enthusia/staff/persistence/JdbcModerationHistoryStore.java
          git commit -m "Keep history count and pages in one snapshot"
          git push origin HEAD:feature/punishment-history-lifecycle
