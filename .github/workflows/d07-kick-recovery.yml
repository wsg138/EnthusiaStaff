name: D07 kick recovery

on:
  push:
    branches:
      - "package/es-d07-discord-punishment-enforcement"

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == '[ES-D07] Stage kick recovery runner'
    name: Apply and validate D07 kick recovery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Apply kick recovery patch
        shell: bash
        run: |
          python3 .github/scripts/d07_kick_recovery.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path("staff-bot/src/test/java/net/enthusia/staff/discordbot/DiscordPunishmentWorkerTest.java")
          text = path.read_text(encoding="utf-8")
          old = "        FakeRepository repository = new FakeRepository(punishment(kick(), NOW));\n"
          new = """        FakeRepository repository = new FakeRepository(punishment(
                intent(DiscordConsequenceType.KICK, SanctionLength.instant(), Optional.empty()),
                NOW
        ));
"""
          if text.count(old) != 1:
              raise SystemExit("kick fixture patch did not match exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Run focused staff-bot tests
        shell: bash
        run: ./gradlew --no-daemon :staff-bot:test

      - name: Run repository PMD on changed Java
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://github.com/pmd/pmd/releases/download/pmd_releases%2F6.55.0/pmd-bin-6.55.0.zip' \
            --output /tmp/pmd.zip
          unzip -q /tmp/pmd.zip -d /tmp
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.java')
          input="$(IFS=,; echo "${files[*]}")"
          set +e
          /tmp/pmd-bin-6.55.0/bin/run.sh pmd \
            -d "${input}" \
            -R ruleset.xml \
            -f text \
            -r /tmp/pmd-findings.txt
          status=$?
          set -e
          cat /tmp/pmd-findings.txt
          exit "${status}"

      - name: Commit validated kick recovery and remove runner
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/d07-kick-recovery.yml
          rm .github/scripts/d07_kick_recovery.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(es-d07): make kick retries crash-safe'
          git push origin HEAD:package/es-d07-discord-punishment-enforcement
