name: PR370 Velocity Relay Diagnostic

on:
  push:
    branches:
      - diagnostic/370-velocity-relay

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run focused Velocity relay tests
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x gradlew
          ./gradlew :velocity:test             --tests net.enthusia.staff.velocity.VelocityChatBridgeRelayTest             --no-daemon             --no-build-cache             --no-configuration-cache             --console=plain
