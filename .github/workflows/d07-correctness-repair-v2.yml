name: D07 correctness repair v2

on:
  push:
    branches:
      - "package/es-d07-discord-punishment-enforcement"

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == '[ES-D07] Stage correctness repair runner v2'
    name: Apply and validate D07 correctness repairs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Apply exact D07 repairs
        shell: bash
        run: |
          python3 .github/scripts/d07_correctness_repair.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path("staff-bot/src/test/java/net/enthusia/staff/discordbot/JdaStaffModerationListenerTest.java")
          text = path.read_text(encoding="utf-8")
          old_import = "import net.dv8tion.jda.api.interactions.commands.build.CommandData;\n"
          new_import = old_import + "import net.dv8tion.jda.api.interactions.commands.build.SlashCommandData;\n"
          if text.count(old_import) != 1:
              raise SystemExit("listener test import patch did not match exactly once")
          text = text.replace(old_import, new_import, 1)
          old_decl = '        CommandData unrestrict = command(JdaStaffModerationListener.commands(true), "unrestrict");\n'
          new_decl = '        SlashCommandData unrestrict = (SlashCommandData) command(\n                JdaStaffModerationListener.commands(true), "unrestrict"\n        );\n'
          if text.count(old_decl) != 1:
              raise SystemExit("listener test declaration patch did not match exactly once")
          path.write_text(text.replace(old_decl, new_decl, 1), encoding="utf-8")
          PY

      - name: Run focused D07 staff-bot tests
        shell: bash
        run: ./gradlew --no-daemon :staff-bot:test

      - name: Run repository PMD on changed Java
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://github.com/pmd/pmd/releases/download/pmd_releases%2F6.55.0/pmd-bin-6.55.0.zip' \
            --output /tmp/pmd.zip
          unzip -q /tmp/pmd.zip -d /tmp
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.java')
          input="$(IFS=,; echo "${files[*]}")"
          /tmp/pmd-bin-6.55.0/bin/run.sh pmd \
            -d "${input}" \
            -R ruleset.xml \
            -f text \
            -r /tmp/pmd-findings.txt
          cat /tmp/pmd-findings.txt

      - name: Commit validated D07 repairs and remove temporary runners
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/d07-correctness-repair.yml
          rm .github/workflows/d07-correctness-repair-v2.yml
          rm .github/scripts/d07_correctness_repair.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(es-d07): close ownership and scope safety gaps'
          git push origin HEAD:package/es-d07-discord-punishment-enforcement
