name: SEN-M02 Temporary Run Lookup

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  lookup:
    if: ${{ github.head_ref == 'admin/sen-m02-run-lookup-20260823' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: List recent Pi Staging target runs
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/wsg138/EnthusiaStaff/actions/runs?event=pull_request_target&per_page=30' \
            | jq -c '.workflow_runs[] | select(.name == "Pi Staging") | {id,name,event,status,conclusion,run_number,run_attempt,head_branch,head_sha,created_at,updated_at,html_url}'
