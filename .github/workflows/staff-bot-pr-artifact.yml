name: Staff Bot PR Artifact

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "staff-bot/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/staff-bot-pr-artifact.yml"

permissions:
  contents: read

concurrency:
  group: staff-bot-pr-artifact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build exact staff-bot test JAR
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Record exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          TESTED_SHA="$(git rev-parse HEAD)"
          [[ "$TESTED_SHA" == "${{ github.event.pull_request.head.sha }}" ]]
          echo "TESTED_SHA=$TESTED_SHA" >> "$GITHUB_ENV"

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: true

      - name: Build and verify executable JAR
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x ./gradlew
          ./gradlew :staff-bot:clean :staff-bot:check :staff-bot:shadowJar \
            --no-daemon \
            --no-build-cache \
            --no-configuration-cache \
            --console=plain
          [[ "$TESTED_SHA" == "$(git rev-parse HEAD)" ]]

          mkdir -p pr-artifact
          mapfile -d '' jars < <(
            find staff-bot/build/libs -maxdepth 1 -type f \
              -name 'EnthusiaStaff-StaffBot-*.jar' \
              ! -name '*-sources.jar' -print0
          )
          if (( ${#jars[@]} != 1 )); then
            printf 'Expected exactly one staff-bot runtime JAR; found %d\n' "${#jars[@]}" >&2
            exit 1
          fi
          cp -- "${jars[0]}" pr-artifact/EnthusiaStaff-StaffBot.jar
          unzip -p pr-artifact/EnthusiaStaff-StaffBot.jar META-INF/MANIFEST.MF \
            | grep -F 'Main-Class: net.enthusia.staff.discordbot.StaffBotApplication' >/dev/null
          jar tf pr-artifact/EnthusiaStaff-StaffBot.jar \
            | grep -Fx 'net/dv8tion/jda/api/JDA.class' >/dev/null
          sha256sum pr-artifact/EnthusiaStaff-StaffBot.jar > pr-artifact/EnthusiaStaff-StaffBot.jar.sha256
          printf 'source_sha=%s\nenvironment=staging-test\npr=%s\n' \
            "$TESTED_SHA" "${{ github.event.pull_request.number }}" \
            > pr-artifact/source.txt

      - name: Upload exact-head test artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staff-bot-pr-${{ github.event.pull_request.number }}-${{ env.TESTED_SHA }}
          path: pr-artifact/
          if-no-files-found: error
          retention-days: 2
