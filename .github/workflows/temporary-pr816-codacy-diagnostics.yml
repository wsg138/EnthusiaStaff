# Temporary read-only Codacy evidence workflow. Remove before merge.
name: Temporary PR816 Codacy annotation evidence
on:
  pull_request:
    paths:
      - ".github/workflows/temporary-pr816-codacy-diagnostics.yml"
permissions:
  contents: read
  checks: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read exact existing Codacy findings
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/check-runs/131655754010/annotations?per_page=100" \
            -o /tmp/pr816_findings.json
          python3 - <<'PY'
          import json
          with open("/tmp/pr816_findings.json", encoding="utf-8") as f:
              findings = json.load(f)
          print("CODACY_ANNOTATIONS_COUNT=" + str(len(findings)))
          for item in findings:
              print(json.dumps({
                  "path": item.get("path"),
                  "line": item.get("start_line"),
                  "message": item.get("message"),
                  "level": item.get("annotation_level")
              }, ensure_ascii=False))
          PY
