name: D07 complexity repair v2

on:
  push:
    branches:
      - "package/es-d07-discord-punishment-enforcement"

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == '[ES-D07] Retry complexity repair without configuration cache'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Reapply exact staged complexity refactor
        shell: bash
        run: |
          set -euo pipefail
          sed -n "/python3 - <<'PY'/,/^          PY$/p" .github/workflows/d07-complexity-repair.yml \
            | tail -n +2 \
            | head -n -1 \
            | sed 's/^          //' > /tmp/d07-refactor.py
          test -s /tmp/d07-refactor.py
          python3 /tmp/d07-refactor.py

      - name: Run D07 module and MariaDB integration tests
        run: ./gradlew --no-daemon --no-configuration-cache :persistence:test :staff-bot:test :integration-tests:test

      - name: Require repository PMD on changed Java
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://github.com/pmd/pmd/releases/download/pmd_releases%2F6.55.0/pmd-bin-6.55.0.zip' \
            --output /tmp/pmd.zip
          unzip -q /tmp/pmd.zip -d /tmp
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.java')
          input="$(IFS=,; echo "${files[*]}")"
          /tmp/pmd-bin-6.55.0/bin/run.sh pmd -d "$input" -R ruleset.xml -f text -r /tmp/pmd.txt
          cat /tmp/pmd.txt

      - name: Require changed Java under package complexity limits
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet lizard
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.java')
          lizard -l java -C 8 -L 50 -w "${files[@]}"

      - name: Commit validated complexity repair and remove runners
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/d07-complexity-repair.yml .github/workflows/d07-complexity-repair-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(es-d07): reduce punishment enforcement complexity'
          git push origin HEAD:package/es-d07-discord-punishment-enforcement
