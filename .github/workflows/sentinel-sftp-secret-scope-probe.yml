name: Sentinel SFTP secret scope probe

on:
  pull_request:
    paths:
      - '.github/workflows/sentinel-sftp-secret-scope-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SENTINEL_SFTP_HOST: ${{ secrets.SENTINEL_SFTP_HOST }}
      SENTINEL_SFTP_PORT: ${{ secrets.SENTINEL_SFTP_PORT }}
      SENTINEL_SFTP_USER: ${{ secrets.SENTINEL_SFTP_USER }}
      SENTINEL_SFTP_PASSWORD: ${{ secrets.SENTINEL_SFTP_PASSWORD }}
    steps:
      - name: Check secret presence only
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=0
          for name in SENTINEL_SFTP_HOST SENTINEL_SFTP_PORT SENTINEL_SFTP_USER SENTINEL_SFTP_PASSWORD; do
            if [[ -n "${!name:-}" ]]; then
              printf '%s=present\n' "$name"
            else
              printf '%s=missing\n' "$name"
              missing=1
            fi
          done
          exit "$missing"
