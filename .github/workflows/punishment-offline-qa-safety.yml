name: Punishment offline QA safety

on:
  pull_request:
    paths:
      - "scripts/qa/punishment_offline_evidence.py"
      - "scripts/qa/punishment_candidate_verify.py"
      - "scripts/qa/test_punishment_offline_evidence.py"
      - "scripts/qa/test_punishment_candidate_verify.py"
      - ".github/workflows/punishment-offline-qa-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-offline-qa:
    name: Verify bounded XML and trusted-wrapper contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test offline evidence and candidate gating
        run: |
          python -m unittest discover -s scripts/qa -p 'test_punishment_offline_evidence.py' -v
          python -m unittest discover -s scripts/qa -p 'test_punishment_candidate_verify.py' -v
