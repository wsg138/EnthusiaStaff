name: Pi Staging Control Validation

on:
  pull_request:
    paths:
      - .github/workflows/pi-staging-check.yml
      - .github/workflows/pi-staging-command.yml
      - .github/workflows/pi-staging-supersede.yml
      - .github/workflows/pi-staging-control-validation.yml
      - scripts/staging/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/pi-staging-check.yml
      - .github/workflows/pi-staging-command.yml
      - .github/workflows/pi-staging-supersede.yml
      - .github/workflows/pi-staging-control-validation.yml
      - scripts/staging/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-plane:
    name: Test trusted staging control plane
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Validate Python and shell syntax
        run: |
          python3 -m py_compile \
            scripts/staging/pi_staging_control.py \
            scripts/staging/test_pi_staging_control.py \
            scripts/staging/supersede_pi_staging.py \
            scripts/staging/test_supersede_pi_staging.py \
            scripts/staging/test_pi_staging_command_permissions.py
          bash -n scripts/staging/build-enthusiastaff-bridge-artifact.sh
          bash -n scripts/staging/validate-enthusiastaff-source.sh

      - name: Validate GitHub Actions semantics
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" \
            .github/workflows/pi-staging-check.yml \
            .github/workflows/pi-staging-command.yml \
            .github/workflows/pi-staging-supersede.yml \
            .github/workflows/pi-staging-control-validation.yml

      - name: Run staging control-plane tests
        run: |
          python3 scripts/staging/test_pi_staging_control.py
          python3 scripts/staging/test_supersede_pi_staging.py
          python3 scripts/staging/test_pi_staging_command_permissions.py
