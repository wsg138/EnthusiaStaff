name: Pi Staging Control Validation

on:
  pull_request:
    paths:
      - .github/workflows/pi-staging-check.yml
      - .github/workflows/pi-staging-command.yml
      - .github/workflows/pi-staging-control-validation.yml
      - scripts/staging/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/pi-staging-check.yml
      - .github/workflows/pi-staging-command.yml
      - .github/workflows/pi-staging-control-validation.yml
      - scripts/staging/**
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  control-plane:
    name: Test trusted staging control plane
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Validate Python and shell syntax
        run: |
          python3 -m py_compile scripts/staging/pi_staging_control.py scripts/staging/test_pi_staging_control.py
          bash -n scripts/staging/build-enthusiastaff-bridge-artifact.sh
          bash -n scripts/staging/validate-enthusiastaff-source.sh

      - name: Validate GitHub Actions semantics
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" \
            .github/workflows/pi-staging-check.yml \
            .github/workflows/pi-staging-command.yml \
            .github/workflows/pi-staging-control-validation.yml

      - name: Run staging control-plane tests
        run: python3 scripts/staging/test_pi_staging_control.py

      - name: Print exact-head Codacy annotations
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          run_id=''
          for _ in $(seq 1 60); do
            response="$(curl --fail --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$TESTED_SHA/check-runs?check_name=Codacy%20Static%20Code%20Analysis&per_page=20")"
            run_id="$(jq -r '[.check_runs[] | select(.name == "Codacy Static Code Analysis" and .status == "completed")] | sort_by(.completed_at) | last | .id // empty' <<<"$response")"
            [[ "$run_id" =~ ^[1-9][0-9]*$ ]] && break
            sleep 3
          done
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]] || { echo 'No completed Codacy static run found'; exit 1; }
          echo "Codacy check run: $run_id"
          curl --fail --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/check-runs/$run_id/annotations?per_page=100" \
            | jq .
