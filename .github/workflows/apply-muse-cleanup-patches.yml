name: Apply Muse cleanup patches

on:
  push:
    branches:
      - fix/muse-test-run-remaining-staff

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/muse-test-run-remaining-staff
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Apply exact reviewed replacements
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'exact replacement source not found: {path}')
              if text.count(old) != 1:
                  raise SystemExit(f'exact replacement source not unique: {path}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'paper/src/main/java/net/enthusia/staff/paper/staff/StaffModeManager.java',
              '''    private void retainRecoveryAfterRuntimeExit(UUID playerId) {
                  recoveryGate.retry(playerId);
                  removeRuntimeState(playerId);
              }

              private void completeRuntimeExit(UUID playerId) {
                  removeRuntimeState(playerId);
                  recoveryGate.clear(playerId);
                  try {
                      exitListener.accept(playerId);
                  } catch (RuntimeException exception) {
                      plugin.getLogger().log(Level.WARNING, "Post-exit staff-mode cleanup callback failed", exception);
                  }
              }
''',
              '''    private void retainRecoveryAfterRuntimeExit(UUID playerId) {
                  recoveryGate.retry(playerId);
                  removeRuntimeState(playerId);
                  notifyRuntimeExit(playerId);
              }

              private void completeRuntimeExit(UUID playerId) {
                  removeRuntimeState(playerId);
                  recoveryGate.clear(playerId);
                  notifyRuntimeExit(playerId);
              }

              private void notifyRuntimeExit(UUID playerId) {
                  try {
                      exitListener.accept(playerId);
                  } catch (RuntimeException exception) {
                      plugin.getLogger().log(Level.WARNING, "Post-exit staff-mode cleanup callback failed", exception);
                  }
              }
'''
          )

          replace(
              'paper/src/test/java/net/enthusia/staff/paper/staff/StaffModeRestorationWiringTest.java',
              '''    @Test
              void failedClosureDoesNotInvokeVerifiedExitListener() throws IOException {
                  String retained = method("private void retainRecoveryAfterRuntimeExit", "private void completeRuntimeExit");
                  String completed = method("private void completeRuntimeExit", "private void removeRuntimeState");

                  assertTrue(retained.contains("recoveryGate.retry(playerId)"));
                  assertTrue(!retained.contains("exitListener.accept"));
                  assertTrue(completed.contains("recoveryGate.clear(playerId)"));
                  assertTrue(completed.contains("exitListener.accept(playerId)"));
              }
''',
              '''    @Test
              void failedClosureKeepsRecoveryFenceButStillRunsRuntimeExitCleanup() throws IOException {
                  String retained = method("private void retainRecoveryAfterRuntimeExit", "private void completeRuntimeExit");
                  String completed = method("private void completeRuntimeExit", "private void notifyRuntimeExit");
                  String notifier = method("private void notifyRuntimeExit", "private void removeRuntimeState");

                  assertTrue(retained.contains("recoveryGate.retry(playerId)"));
                  assertTrue(retained.contains("notifyRuntimeExit(playerId)"));
                  assertTrue(completed.contains("recoveryGate.clear(playerId)"));
                  assertTrue(completed.contains("notifyRuntimeExit(playerId)"));
                  assertTrue(notifier.contains("exitListener.accept(playerId)"));
              }
'''
          )

          replace(
              'paper/src/main/java/net/enthusia/staff/paper/command/PunishmentCommand.java',
              '''    private boolean openTargetOnlyGui(CommandSender sender, String route, String[] args) {
                  if (args.length != SINGLE_ARGUMENT_COUNT || !(sender instanceof Player player)) {
                      return false;
                  }
                  gui.open(player, args[0], route);
                  return true;
              }
''',
              '''    private boolean openTargetOnlyGui(CommandSender sender, String route, String[] args) {
                  if (CENTRAL_COMMAND.equals(route)
                          || args.length != SINGLE_ARGUMENT_COUNT
                          || !(sender instanceof Player player)) {
                      return false;
                  }
                  gui.open(player, args[0], route);
                  return true;
              }
'''
          )

          replace(
              'paper/src/main/java/net/enthusia/staff/paper/command/SanctionChangeCommand.java',
              '''        if (arguments.length == 1 && sender instanceof Player player) {
                  gui.open(player, arguments[0], route);
                  return true;
              }
''',
              '''        if (!central && arguments.length == 1 && sender instanceof Player player) {
                  gui.open(player, arguments[0], route);
                  return true;
              }
'''
          )

          replace(
              'paper/src/main/java/net/enthusia/staff/paper/command/ReportsCommand.java',
              '''    public List<String> onTabComplete(CommandSender sender, Command command, String alias, String[] arguments) {
                  if (arguments.length == SINGLE_ARGUMENT) {
                      return List.of("note", "cancel", "evidence", "open", "mine", "claimed", "review", "closed", "view",
                              "claim", "awaitreview", "close", "noviolation");
                  }
                  if (arguments.length == EVIDENCE_KIND_TAB_ARGUMENTS && arguments[0].equalsIgnoreCase("evidence")) {
                      return List.of("public", "private", "client");
                  }
                  return List.of();
              }
''',
              '''    public List<String> onTabComplete(CommandSender sender, Command command, String alias, String[] arguments) {
                  if (!sender.hasPermission(MANAGE_PERMISSION)) {
                      return List.of();
                  }
                  if (arguments.length == SINGLE_ARGUMENT) {
                      return List.of("note", "cancel", "evidence", "open", "mine", "claimed", "review", "closed", "view",
                              "claim", "awaitreview", "close", "noviolation");
                  }
                  if (arguments.length == EVIDENCE_KIND_TAB_ARGUMENTS && arguments[0].equalsIgnoreCase("evidence")) {
                      return sender.hasPermission(EVIDENCE_PERMISSION)
                              ? List.of("public", "private", "client")
                              : List.of();
                  }
                  return List.of();
              }
'''
          )
      - name: Remove temporary patch workflow and commit
        run: |
          git rm .github/workflows/apply-muse-cleanup-patches.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/src/main/java paper/src/test/java
          git commit -m "fix: close verified Muse Staff regressions"
          git push origin HEAD:fix/muse-test-run-remaining-staff
