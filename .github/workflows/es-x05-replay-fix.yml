name: ES-X05 replay fix

# Temporary branch-only workflow; removed before final validation and merge.
on:
  push:
    branches: [package/es-x05-state-publication]
    paths: [.github/workflows/es-x05-replay-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: package/es-x05-state-publication
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply asserted replay edits
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              file = Path(path)
              text = file.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrences, found {actual}")
              file.write_text(text.replace(old, new, count))

          workflow = 'persistence/src/main/java/net/enthusia/staff/persistence/JdbcWebsiteAppealWorkflowStore.java'
          replace(
              workflow,
              'rateLimiter.enforce(connection, accountId, idempotencyKey, now);',
              'rateLimiter.enforce(connection, accountId, punishmentId, idempotencyKey, now);'
          )
          replace(
              workflow,
              '''                    reviewer_rank = ?, decision_note = ?, decided_at = ?, updated_at = ?,
                    idempotency_key = CASE WHEN ? = 'APPROVE' THEN ? ELSE idempotency_key END
                WHERE appeal_id = ? AND revision = ?''',
              '''                    reviewer_rank = ?, decision_note = ?, decided_at = ?, updated_at = ?
                WHERE appeal_id = ? AND revision = ?'''
          )
          replace(
              workflow,
              '''            statement.setTimestamp(9, Timestamp.from(now));
            statement.setString(10, decision);
            statement.setString(11, idempotencyKey);
            statement.setBytes(12, UuidBytes.toBytes(existing.appealId()));
            statement.setLong(13, existing.revision());''',
              '''            statement.setTimestamp(9, Timestamp.from(now));
            statement.setBytes(10, UuidBytes.toBytes(existing.appealId()));
            statement.setLong(11, existing.revision());'''
          )

          endpoint = 'velocity/src/main/java/net/enthusia/staff/velocity/WebsiteAppealWorkflowEndpoint.java'
          replace(
              endpoint,
              'return accept(preparation, reviewer, note, idempotencyKey);',
              'return accept(preparation, reviewer, note);'
          )
          replace(
              endpoint,
              '''            Actor reviewer,
            String reason,
            String idempotencyKey
    ) {''',
              '''            Actor reviewer,
            String reason
    ) {'''
          )
          replace(
              endpoint,
              'headers.add("idempotency-key", idempotencyKey);',
              'headers.add("idempotency-key", "workflow:" + preparation.appeal().appealId());'
          )
          PY
      - name: Commit replay fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add persistence/src/main/java/net/enthusia/staff/persistence/JdbcWebsiteAppealWorkflowStore.java velocity/src/main/java/net/enthusia/staff/velocity/WebsiteAppealWorkflowEndpoint.java
          git commit -m "Fix ES-X05 replay key scoping"
          git push origin HEAD:package/es-x05-state-publication
