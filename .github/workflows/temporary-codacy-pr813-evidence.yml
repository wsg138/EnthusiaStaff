# Temporary read-only diagnostic; remove before any source merge.
name: Temporary PR813 Codacy annotation evidence
on:
  pull_request:
    paths:
      - ".github/workflows/temporary-codacy-pr813-evidence.yml"
permissions:
  contents: read
  checks: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read existing Codacy findings for PR813
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/check-runs/131268230119/annotations?per_page=100" \
            -o /tmp/pr813_codacy_annotations.json
          python3 - <<'PY'
          import json
          with open("/tmp/pr813_codacy_annotations.json", encoding="utf-8") as f:
              annotations = json.load(f)
          print("CODACY_ANNOTATIONS_COUNT=" + str(len(annotations)))
          for a in annotations:
              print(json.dumps({
                  "path": a.get("path"),
                  "line": a.get("start_line"),
                  "message": a.get("message"),
                  "level": a.get("annotation_level"),
              }, ensure_ascii=False))
          PY
