name: PR183 Ready Transition

on:
  push:
    branches:
      - "owner/staging-moderation-ui-preview"

permissions:
  contents: read
  pull-requests: write

jobs:
  ready:
    name: Mark exact validated PR183 ready
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_PARENT: 3c430d041b343f76f61c12591d33ccb0a7aa6060
      EXPECTED_PR: "183"
      EXPECTED_REF: owner/staging-moderation-ui-preview
    steps:
      - name: Verify exact binding and mark ready
        shell: bash
        run: |
          set -Eeuo pipefail
          parent="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq '.parents[0].sha')"
          test "${parent}" = "${EXPECTED_PARENT}"

          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${EXPECTED_PR}")"
          test "$(jq -r '.state' <<<"${pr}")" = 'open'
          test "$(jq -r '.draft' <<<"${pr}")" = 'true'
          test "$(jq -r '.head.repo.full_name' <<<"${pr}")" = "${GITHUB_REPOSITORY}"
          test "$(jq -r '.head.ref' <<<"${pr}")" = "${EXPECTED_REF}"
          test "$(jq -r '.head.sha' <<<"${pr}")" = "${GITHUB_SHA}"

          node_id="$(jq -r '.node_id' <<<"${pr}")"
          gh api graphql \
            -f query='mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{number isDraft}}}' \
            -f id="${node_id}" \
            --jq '.data.markPullRequestReadyForReview.pullRequest | select(.number == 183 and .isDraft == false)'
