# TEMPORARY read-only diagnostic workflow: remove this file before merge.
name: Temporary PR805 Codacy annotation evidence
on:
  pull_request:
    paths:
      - ".github/workflows/temporary-codacy-pr805-annotations.yml"
  workflow_dispatch:
permissions:
  contents: read
  checks: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect existing public PR805 check-run findings
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/check-runs/130926150698/annotations?per_page=100" \
            -o /tmp/pr805_codacy_annotations.json
          python3 - <<'PY'
          import json
          with open("/tmp/pr805_codacy_annotations.json", encoding="utf-8") as f:
              annotations = json.load(f)
          if not isinstance(annotations, list):
              raise SystemExit("Expected annotation list")
          print("CODACY_ANNOTATIONS_COUNT=" + str(len(annotations)))
          for a in annotations:
              print(json.dumps({
                  "path": a.get("path"),
                  "line": a.get("start_line"),
                  "title": a.get("title"),
                  "message": a.get("message"),
                  "level": a.get("annotation_level"),
              }, ensure_ascii=False))
          PY
