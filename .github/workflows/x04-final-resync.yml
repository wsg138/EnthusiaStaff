name: X04 final standalone resync

on:
  push:
    branches:
      - package/es-x04-commend-provider

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: package/es-x04-commend-provider
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: wsg138/EnthusiaCommend
          ref: 4af2727a12cb58019c160d80ce348ee7f412f85c
          path: .x04-commend-source
      - name: Synchronize exact standalone tree
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C .x04-commend-source rev-parse HEAD)" = '4af2727a12cb58019c160d80ce348ee7f412f85c'
          rsync -a --delete \
            --exclude '.git/' \
            --exclude 'COMPONENT-METADATA.md' \
            .x04-commend-source/ components/enthusia-commend/
          cp .x04-commend-source/src/main/java/org/enthusia/rep/api/*.java \
             integration-contracts/src/main/java/org/enthusia/rep/api/
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('components/enthusia-commend/COMPONENT-METADATA.md')
          text = path.read_text()
          text, count = re.subn(
              r'\| Last synchronized external SHA \| `[^`]+` \|',
              '| Last synchronized external SHA | `4af2727a12cb58019c160d80ce348ee7f412f85c` |',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('component metadata external SHA row not found')
          path.write_text(text)
          PY
          rm -rf .x04-commend-source
          if git diff --quiet; then exit 0; fi
          git config user.name 'P2wn'
          git config user.email 'racecarboy77@gmail.com'
          git add components/enthusia-commend integration-contracts/src/main/java/org/enthusia/rep/api
          git commit -m 'ES-X04: resync final Commend static cleanup'
          git push origin HEAD:package/es-x04-commend-provider
