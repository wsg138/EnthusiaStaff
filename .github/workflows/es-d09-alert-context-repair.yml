name: ES-D09 evasion alert context diagnostic

on:
  push:
    branches:
      - diagnostic/es-d09-authority-repair-20260915
    paths:
      - .github/diagnostics/es-d09-alert-context-repair.py
      - .github/diagnostics/es-d09-alert-context-fix.py
      - .github/workflows/es-d09-alert-context-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out diagnostic tooling
        uses: actions/checkout@v6
        with:
          ref: diagnostic/es-d09-authority-repair-20260915
          path: tooling

      - name: Check out validated authority candidate
        uses: actions/checkout@v6
        with:
          ref: candidate/es-d09-authority-repair-20260915
          fetch-depth: 0
          path: product

      - name: Require exact authority candidate
        working-directory: product
        run: test "$(git rev-parse HEAD)" = "944601da771651ac2132949a9a5be19e9e9d3ff8"

      - name: Apply evasion alert context repair
        run: |
          python tooling/.github/diagnostics/es-d09-alert-context-repair.py product
          python tooling/.github/diagnostics/es-d09-alert-context-fix.py product

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile affected runtime and tests
        working-directory: product
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache \
            :domain:compileJava \
            :persistence:compileJava \
            :staff-bot:compileJava \
            :staff-bot:compileTestJava \
            :paper:compileJava \
            :integration-tests:compileTestJava \
            --console=plain

      - name: Run focused alert tests
        working-directory: product
        run: |
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache \
            :staff-bot:test \
            --tests net.enthusia.staff.discordbot.DiscordInvestigationWorkerTest \
            --tests net.enthusia.staff.discordbot.DiscordInvestigationAlertControlsTest \
            --tests net.enthusia.staff.discordbot.JdaDiscordInvestigationAlertSinkTest \
            :integration-tests:test \
            --tests net.enthusia.staff.integration.DiscordInvestigationPersistenceIntegrationTest \
            --console=plain

      - name: Require clean patch formatting
        working-directory: product
        run: git diff --check

      - name: Commit validated candidate
        working-directory: product
        run: |
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            domain/src/main/java/net/enthusia/staff/domain/investigation/EvasionAlert.java \
            domain/src/main/java/net/enthusia/staff/domain/ports/DiscordInvestigationStore.java \
            integration-tests/src/test/java/net/enthusia/staff/integration/DiscordInvestigationPersistenceIntegrationTest.java \
            persistence/src/main/java/net/enthusia/staff/persistence/JdbcDiscordEvasionAlertStore.java \
            persistence/src/main/java/net/enthusia/staff/persistence/JdbcDiscordInvestigationSource.java \
            persistence/src/main/resources/db/migration/V22__discord_investigation_state.sql \
            staff-bot/src/main/java/net/enthusia/staff/discordbot/DiscordInvestigationAlertControls.java \
            staff-bot/src/main/java/net/enthusia/staff/discordbot/DiscordInvestigationCommandController.java \
            staff-bot/src/main/java/net/enthusia/staff/discordbot/DiscordInvestigationService.java \
            staff-bot/src/main/java/net/enthusia/staff/discordbot/DiscordInvestigationWorker.java \
            staff-bot/src/main/java/net/enthusia/staff/discordbot/JdaDiscordInvestigationAlertSink.java \
            staff-bot/src/main/java/net/enthusia/staff/discordbot/JdaStaffModerationListener.java \
            staff-bot/src/test/java/net/enthusia/staff/discordbot/DiscordInvestigationAlertControlsTest.java \
            staff-bot/src/test/java/net/enthusia/staff/discordbot/DiscordInvestigationWorkerTest.java \
            staff-bot/src/test/java/net/enthusia/staff/discordbot/JdaDiscordInvestigationAlertSinkTest.java
          git diff --quiet
          git diff --cached --check
          git commit -m "[ES-D09] Enrich linked-alt investigation alerts"
          git push origin HEAD:candidate/es-d09-authority-repair-20260915
