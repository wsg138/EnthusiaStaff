name: ES-D16 Runtime Repair

on:
  push:
    branches: [package/es-d16-moderation-read-bridge]
    paths: [".github/workflows/es-d16-runtime-repair.yml"]

permissions:
  contents: read

jobs:
  codacy-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Capture sanitized current Codacy findings
        shell: bash
        run: |
          set -Eeuo pipefail
          endpoint='https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/repositories/EnthusiaStaff/pull-requests/187/issues'
          response=''
          for attempt in $(seq 1 24); do
            candidate="$(curl --fail-with-body --silent --show-error "$endpoint" || true)"
            if [[ -n "$candidate" ]] && printf '%s' "$candidate" | jq -e '.data | type == "array"' >/dev/null 2>&1; then
              response="$candidate"
              break
            fi
            sleep 5
          done
          [[ -n "$response" ]]
          printf '%s' "$response" | jq '{
            count: (.data | length),
            issues: [.data[] | {
              filePath: .commitIssue.filePath,
              lineNumber: .commitIssue.lineNumber,
              message: .commitIssue.message,
              category: .commitIssue.category,
              level: .commitIssue.level,
              patternInfo: .commitIssue.patternInfo,
              toolInfo: .commitIssue.toolInfo
            }]
          }' | tee codacy-current.json

      - name: Upload sanitized Codacy diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: es-d16-codacy-current
          path: codacy-current.json
          if-no-files-found: error
          retention-days: 1
