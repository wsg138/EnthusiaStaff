name: ES-D16 Runtime Repair

on:
  push:
    branches: [package/es-d16-moderation-read-bridge]
    paths: [".github/workflows/es-d16-runtime-repair.yml"]

permissions:
  contents: read

jobs:
  validate-final-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: package/es-d16-moderation-read-bridge
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Apply final authorization and staging cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          import re
          from pathlib import Path

          reader_path = Path('staff-bot/src/main/java/net/enthusia/staff/discordbot/ModerationDiscordMessageReader.java')
          reader = reader_path.read_text(encoding='utf-8')
          old_filter = '.filter(channel -> context.actorMember().hasPermission(channel, Permission.VIEW_CHANNEL))'
          if reader.count(old_filter) != 1:
              raise SystemExit(f'visible channel filter: expected one match, found {reader.count(old_filter)}')
          reader = reader.replace(old_filter, '.filter(channel -> hasReadAccess(context, channel))')
          old_check = 'if (channel == null || !context.actorMember().hasPermission(channel, Permission.VIEW_CHANNEL)) {'
          if reader.count(old_check) != 1:
              raise SystemExit(f'visible channel check: expected one match, found {reader.count(old_check)}')
          reader = reader.replace(old_check, 'if (channel == null || !hasReadAccess(context, channel)) {')
          marker = '    private static ModerationReadApiModel.ChannelDto channelDto(TextChannel channel) {'
          helper = '''    static boolean hasReadPermissions(boolean canView, boolean canReadHistory) {
              return canView && canReadHistory;
          }

          private static boolean hasReadAccess(ModerationReadContext context, TextChannel channel) {
              return hasReadPermissions(
                      context.actorMember().hasPermission(channel, Permission.VIEW_CHANNEL),
                      context.actorMember().hasPermission(channel, Permission.MESSAGE_HISTORY));
          }

          '''
          if reader.count(marker) != 1:
              raise SystemExit('channel DTO marker is ambiguous')
          reader_path.write_text(reader.replace(marker, helper + marker), encoding='utf-8')

          test_path = Path('staff-bot/src/test/java/net/enthusia/staff/discordbot/ModerationDiscordMessageReaderTest.java')
          if test_path.exists():
              raise SystemExit('message reader test already exists unexpectedly')
          test_path.write_text('''package net.enthusia.staff.discordbot;

          import static org.junit.jupiter.api.Assertions.assertFalse;
          import static org.junit.jupiter.api.Assertions.assertTrue;

          import org.junit.jupiter.api.Test;

          class ModerationDiscordMessageReaderTest {
              @Test
              void messageReadsRequireChannelViewAndMessageHistory() {
                  assertFalse(ModerationDiscordMessageReader.hasReadPermissions(false, false));
                  assertFalse(ModerationDiscordMessageReader.hasReadPermissions(false, true));
                  assertFalse(ModerationDiscordMessageReader.hasReadPermissions(true, false));
                  assertTrue(ModerationDiscordMessageReader.hasReadPermissions(true, true));
              }
          }
          ''', encoding='utf-8')

          deploy_path = Path('.github/workflows/moderation-web-staging-deploy.yml')
          deploy = deploy_path.read_text(encoding='utf-8')
          old_body = "          body = f'v1|staging|{nonce}|846729778400460871|1410303324745371709|discord:846729778400460871|{now}|{now + 120}'"
          new_body = "          test_actor_id = str(10**17 + secrets.randbelow(9 * 10**17))\n          body = f'v1|staging|{nonce}|{test_actor_id}|1410303324745371709|discord:{test_actor_id}|{now}|{now + 120}'"
          if deploy.count(old_body) != 1:
              raise SystemExit(f'synthetic actor replacement: expected one match, found {deploy.count(old_body)}')
          deploy = deploy.replace(old_body, new_body)
          pattern = r'\n      - name: Record sanitized Codacy issue metadata\n.*?(?=\n      - name: Require fixed private tunnel provisioning)'
          deploy, count = re.subn(pattern, '', deploy, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Codacy diagnostic removal: expected one match, found {count}')
          deploy_path.write_text(deploy, encoding='utf-8')
          PY

      - name: Replace backend proxy with low-complexity fail-closed implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > moderation-web/src/backend.js <<'EOF'
          'use strict';

          const textEncoder = new TextEncoder();
          const DEFAULT_LIMIT = 25;
          const MAX_FILTER_TEXT = 200;
          const MAX_LIMIT = 50;
          const READ_API_ORIGIN = 'https://moderation-read-staging.enthusia.info';
          const MESSAGE_FILTER_KEYS = new Set(['channel', 'before', 'after', 'author', 'text', 'date', 'limit']);

          export async function proxyModerationRead(env, session, endpoint, browserInput = {}) {
            const keyHex = readSigningKey(env);
            if (!keyHex) return unavailable();
            const path = endpointPath(endpoint);
            const body = JSON.stringify(readRequest(session, endpoint, browserInput));
            const timestamp = String(Math.floor(Date.now() / 1000));
            const nonce = randomToken(24);
            try {
              const signature = await signRequest(keyHex, 'POST', path, body, timestamp, nonce);
              const response = await fetch(new URL(path, READ_API_ORIGIN), {
                method: 'POST',
                redirect: 'error',
                headers: {
                  'Content-Type': 'application/json; charset=utf-8',
                  Accept: 'application/json',
                  'X-Enthusia-Read-Timestamp': timestamp,
                  'X-Enthusia-Read-Nonce': nonce,
                  'X-Enthusia-Read-Signature': signature
                },
                body
              });
              return await sanitizedBackendResponse(response);
            } catch {
              return unavailable();
            }
          }

          export function browserMessageQuery(input) {
            requireFilterObject(input);
            requireFilterKeys(input);
            const query = {};
            addSnowflakeFilter(query, 'channelId', input.channel, 'channel');
            addSnowflakeFilter(query, 'beforeMessageId', input.before, 'before');
            addSnowflakeFilter(query, 'afterMessageId', input.after, 'after');
            addSnowflakeFilter(query, 'authorId', input.author, 'author');
            addTextFilter(query, input.text);
            addDateFilter(query, input.date);
            query.limit = input.limit === undefined ? DEFAULT_LIMIT : boundedLimit(input.limit);
            requireCompatibleCursors(query);
            return query;
          }

          export function readRequest(session, endpoint, browserInput = {}) {
            const request = {actorId: session.actorId, guildId: session.guildId, targetKey: session.targetKey, messages: null};
            if (endpoint === 'messages') request.messages = browserMessageQuery(browserInput);
            return request;
          }

          function requireFilterObject(input) {
            if (!input || typeof input !== 'object' || Array.isArray(input)) throw new Error('invalid message filters');
          }

          function requireFilterKeys(input) {
            for (const key of Object.keys(input)) {
              if (!MESSAGE_FILTER_KEYS.has(key)) throw new Error('invalid message filter');
            }
          }

          function addSnowflakeFilter(query, targetKey, value, label) {
            const parsed = snowflakeFilter(value, label);
            if (parsed !== null) query[targetKey] = parsed;
          }

          function addTextFilter(query, value) {
            if (value === undefined) return;
            if (typeof value !== 'string' || value.length > MAX_FILTER_TEXT) throw new Error('invalid message text filter');
            query.text = value;
          }

          function addDateFilter(query, value) {
            if (value === undefined) return;
            if (!validDateFilter(value)) throw new Error('invalid date filter');
            query.date = value;
          }

          function requireCompatibleCursors(query) {
            if (query.beforeMessageId && query.afterMessageId) throw new Error('conflicting cursors');
          }

          function readSigningKey(env) {
            const keyHex = typeof env.READ_API_SIGNING_KEY_HEX === 'string' ? env.READ_API_SIGNING_KEY_HEX : '';
            return /^[0-9a-fA-F]{64}$/.test(keyHex) ? keyHex : null;
          }

          function snowflakeFilter(value, label) {
            if (value === undefined || value === null) return null;
            if (typeof value !== 'string') throw new Error(`invalid ${label} filter`);
            if (!validSnowflakeText(value)) throw new Error(`invalid ${label} filter`);
            return value;
          }

          function validSnowflakeText(value) {
            if (value.length < 1 || value.length > 20 || value[0] === '0') return false;
            return asciiDigits(value);
          }

          function validDateFilter(value) {
            if (typeof value !== 'string' || value.length !== 10) return false;
            if (value[4] !== '-' || value[7] !== '-') return false;
            return asciiDigits(value.slice(0, 4) + value.slice(5, 7) + value.slice(8, 10));
          }

          function asciiDigits(value) {
            for (const character of value) {
              if (character < '0' || character > '9') return false;
            }
            return true;
          }

          function boundedLimit(raw) {
            const text = typeof raw === 'number' ? String(raw) : raw;
            if (typeof text !== 'string' || text.length < 1 || text.length > 2) throw new Error('invalid limit');
            if (text[0] === '0' || !asciiDigits(text)) throw new Error('invalid limit');
            const value = Number(text);
            if (!Number.isInteger(value) || value > MAX_LIMIT) throw new Error('invalid limit');
            return value;
          }

          function endpointPath(endpoint) {
            if (endpoint === 'bootstrap') return '/v1/moderation/bootstrap';
            if (endpoint === 'messages') return '/v1/moderation/messages';
            throw new Error('invalid read endpoint');
          }

          async function signRequest(keyHex, method, path, body, timestamp, nonce) {
            const digest = await crypto.subtle.digest('SHA-256', textEncoder.encode(body));
            const canonical = `v1\n${method}\n${path}\n${timestamp}\n${nonce}\n${hex(new Uint8Array(digest))}`;
            const key = await crypto.subtle.importKey(
              'raw', bytesFromHex(keyHex), {name: 'HMAC', hash: 'SHA-256'}, false, ['sign']);
            const signature = await crypto.subtle.sign('HMAC', key, textEncoder.encode(canonical));
            return base64Url(new Uint8Array(signature));
          }

          async function sanitizedBackendResponse(response) {
            const contentType = response.headers.get('Content-Type') || '';
            if (!contentType.toLowerCase().startsWith('application/json')) return unavailable();
            const body = await response.arrayBuffer();
            if (body.byteLength > 1_048_576) return unavailable();
            return new Response(body, {
              status: response.status,
              headers: {'Content-Type': 'application/json; charset=utf-8', 'Cache-Control': 'private, no-store'}
            });
          }

          function unavailable() {
            return new Response(JSON.stringify({code: 'source_unavailable', message: 'Moderation data is temporarily unavailable.'}), {
              status: 503,
              headers: {'Content-Type': 'application/json; charset=utf-8', 'Cache-Control': 'private, no-store'}
            });
          }

          function randomToken(bytes) {
            const value = new Uint8Array(bytes);
            crypto.getRandomValues(value);
            return base64Url(value);
          }

          function bytesFromHex(value) {
            const bytes = new Uint8Array(value.length / 2);
            for (let index = 0; index < bytes.length; index += 1) {
              bytes[index] = Number.parseInt(value.slice(index * 2, index * 2 + 2), 16);
            }
            return bytes;
          }

          function hex(bytes) {
            return [...bytes].map((value) => value.toString(16).padStart(2, '0')).join('');
          }

          function base64Url(bytes) {
            let binary = '';
            for (const byte of bytes) binary += String.fromCharCode(byte);
            return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
          }
          EOF

          cat > moderation-web/test/backend.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { browserMessageQuery, proxyModerationRead, readRequest } from '../src/backend.js';

          function readContext() {
            return {
              env: {READ_API_SIGNING_KEY_HEX: '11'.repeat(32), READ_API_ORIGIN: 'https://attacker.example'},
              session: {
                actorId: '846729778400460871', guildId: '1410303324745371709',
                targetKey: 'discord:1049827163345127424'
              }
            };
          }

          test('message query allowlists bounded filters', () => {
            const filters = {channel:'1541286004298752091', before:'1541300000000000001', author:'1049827163345127424', date:'2026-08-31', text:'hello', limit:'50'};
            assert.deepEqual(browserMessageQuery(filters), {
              channelId: '1541286004298752091', beforeMessageId: '1541300000000000001',
              authorId: '1049827163345127424', date: '2026-08-31', text: 'hello', limit: 50
            });
          });

          test('message query rejects retargeting-shaped and unbounded inputs', () => {
            for (const filters of [
              {channel:'0'}, {before:'1', after:'2'}, {author:'abc'}, {date:'August-31'},
              {limit:'51'}, {limit:'01'}, {text:'x'.repeat(201)}, {target:'discord:999'}, {actor:'999'}, {guild:'999'}
            ]) assert.throws(() => browserMessageQuery(filters));
          });

          test('read request binds actor guild and target only from server session', () => {
            const {session} = readContext();
            assert.deepEqual(readRequest(session, 'messages', {channel:'1541286004298752091'}), {
              actorId: session.actorId, guildId: session.guildId, targetKey: session.targetKey,
              messages: {channelId: '1541286004298752091', limit: 25}
            });
          });

          test('private read egress is pinned and rejects redirects', async () => {
            const originalFetch = globalThis.fetch;
            let requestedUrl = null;
            let requestedOptions = null;
            globalThis.fetch = async (input, options) => {
              requestedUrl = String(input);
              requestedOptions = options;
              return new Response('{}', {headers: {'Content-Type': 'application/json'}});
            };
            try {
              const {env, session} = readContext();
              await proxyModerationRead(env, session, 'bootstrap');
              assert.equal(requestedUrl, 'https://moderation-read-staging.enthusia.info/v1/moderation/bootstrap');
              assert.equal(requestedOptions.redirect, 'error');
            } finally {
              globalThis.fetch = originalFetch;
            }
          });

          test('private backend outage is reported truthfully as unavailable', async () => {
            const originalFetch = globalThis.fetch;
            globalThis.fetch = async () => { throw new Error('network unavailable'); };
            try {
              const {env, session} = readContext();
              const response = await proxyModerationRead(env, session, 'bootstrap');
              assert.equal(response.status, 503);
              assert.deepEqual(await response.json(), {
                code: 'source_unavailable', message: 'Moderation data is temporarily unavailable.'
              });
            } finally {
              globalThis.fetch = originalFetch;
            }
          });
          EOF
          git diff --check

      - name: Validate moderation web
        working-directory: moderation-web
        run: |
          npm ci --ignore-scripts
          npm run check

      - name: Run clean Java 21 gate
        run: ./gradlew --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks clean test check runtimeJars

      - name: Upload validated final candidate payload
        uses: actions/upload-artifact@v4
        with:
          name: es-d16-final-candidate-payload
          path: |
            .github/workflows/moderation-web-staging-deploy.yml
            moderation-web/src/backend.js
            moderation-web/test/backend.test.mjs
            staff-bot/src/main/java/net/enthusia/staff/discordbot/ModerationDiscordMessageReader.java
            staff-bot/src/test/java/net/enthusia/staff/discordbot/ModerationDiscordMessageReaderTest.java
          if-no-files-found: error
          retention-days: 1
