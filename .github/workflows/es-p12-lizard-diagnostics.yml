name: ES-P12 complexity repair

on:
  push:
    branches:
      - package/es-p12-staff-operational-hardening

permissions:
  contents: write

jobs:
  repair:
    name: Validate and publish constructor complexity repair
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Apply repair
        run: python3 .github/scripts/es_p12_complexity_repair.py

      - name: Install Lizard
        run: python3 -m pip install --disable-pip-version-check lizard==1.23.0

      - name: Verify constructor complexity
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.java')
          set +e
          lizard -C 8 -L 50 -a 8 -w "${files[@]}" > /tmp/lizard.txt 2>&1
          set -e
          cat /tmp/lizard.txt
          ! grep -q 'PunishmentCommand::PunishmentCommand' /tmp/lizard.txt
          ! grep -q 'PunishmentGuiController::PunishmentGuiController' /tmp/lizard.txt

      - name: Verify PMD
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://github.com/pmd/pmd/releases/download/pmd_releases%2F6.55.0/pmd-bin-6.55.0.zip' \
            --output /tmp/pmd.zip
          unzip -q /tmp/pmd.zip -d /tmp
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.java')
          input="$(IFS=,; echo "${files[*]}")"
          /tmp/pmd-bin-6.55.0/bin/run.sh pmd \
            -d "${input}" \
            -R ruleset.xml \
            -f text \
            -r /tmp/pmd-findings.txt
          cat /tmp/pmd-findings.txt

      - name: Run focused tests
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :paper:test \
            --no-daemon \
            --no-build-cache \
            --no-configuration-cache \
            --console=plain

      - name: Publish validated repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/es-p12-lizard-diagnostics.yml
          rm .github/scripts/es_p12_complexity_repair.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ES-P12: resolve Codacy constructor complexity"
          git push origin HEAD:package/es-p12-staff-operational-hardening
