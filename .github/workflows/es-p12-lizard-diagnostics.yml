name: ES-P12 Codacy diagnostics

on:
  push:
    branches:
      - "package/es-p12-staff-operational-hardening"

permissions:
  contents: read

jobs:
  codacy:
    if: github.event.head_commit.message == '[ES-P12] Query Codacy remaining'
    name: Query public Codacy PR issues
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query public Codacy PR issues
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.request

          url = "https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/repositories/EnthusiaStaff/pull-requests/246/issues?status=new"
          request = urllib.request.Request(url, headers={"Accept": "application/json"})
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          for entry in payload.get("data", []):
              issue = entry.get("commitIssue") or {}
              pattern = issue.get("patternInfo") or {}
              print(json.dumps({
                  "file": issue.get("filePath"),
                  "line": issue.get("lineNumber"),
                  "pattern": pattern.get("id"),
                  "level": pattern.get("level"),
                  "message": issue.get("message"),
              }, sort_keys=True))
          print("TOTAL", len(payload.get("data", [])))
          PY
