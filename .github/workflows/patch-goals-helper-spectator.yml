name: Apply Helper and spectator goals update

on:
  push:
    branches:
      - section/helper-rank-authority
    paths:
      - scripts/patch-goals-helper-spectator.py
      - .github/workflows/patch-goals-helper-spectator.yml

permissions:
  contents: write

jobs:
  patch-goals:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Apply guarded specification changes
        run: python3 scripts/patch-goals-helper-spectator.py

      - name: Commit updated authoritative goals
        run: |
          if git diff --quiet -- ENTHUSIASTAFF-GOALS.md; then
            echo "No goals change was produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ENTHUSIASTAFF-GOALS.md
          git commit -m "Document Helper and spectator tab policy"
          git push origin "HEAD:${GITHUB_REF_NAME}"
