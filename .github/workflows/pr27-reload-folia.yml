name: Validate Folia-safe reload dispatch

on:
  push:
    branches:
      - automation/pr27-reload-folia

permissions:
  contents: write

concurrency:
  group: pr27-reload-folia
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact helper head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply final scheduler and test fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/finish-reload-folia.py
          git rm .github/workflows/pr27-reload-folia.yml
          git rm scripts/finish-reload-folia.py
          git diff --check
          git add -A
          git commit --no-verify -m "Dispatch reload through Folia-safe schedulers"
          git push origin HEAD:refs/heads/automation/pr27-reload-folia-validated --force

      - name: Build exact patched source
        shell: bash
        run: |
          set -euo pipefail
          set +e
          chmod +x gradlew
          ./gradlew clean build jacocoAggregateReport runtimeJars \
            --no-daemon \
            --no-build-cache \
            --no-configuration-cache \
            --console=plain 2>&1 | tee /tmp/build.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if test "$STATUS" -ne 0; then
            mkdir -p .reload-analysis
            printf 'phase=build-failed\nsource=%s\n' "$(git rev-parse HEAD)" > .reload-analysis/state.txt
            tail -n 1400 /tmp/build.log > .reload-analysis/build-failure.txt
            git add .reload-analysis
            git commit --no-verify -m "Record Folia reload build failure"
            git push origin HEAD:refs/heads/automation/pr27-reload-folia-validated --force
          fi
          exit "$STATUS"
