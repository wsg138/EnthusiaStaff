name: Apply reviewed blocker fixes

on:
  push:
    branches:
      - section/punishment-request-notifications-recovery

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-reviewed-blocker-fixes]')
    name: Apply exact reviewed patch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out helper commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Apply patch and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "7346a102f3716ecc805a85d40d1ebb36f5a70be6"
          gzip -dc .github/review-fixes.patch.gz > /tmp/review-fixes.patch
          git apply --check /tmp/review-fixes.patch
          git apply --index /tmp/review-fixes.patch
          git rm .github/review-fixes.patch.gz
          git rm .github/workflows/apply-reviewed-blocker-fixes.yml
          git rm .github/workflows/export-final-review-tree.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Resolve major review and security findings"
          git push origin HEAD:section/punishment-request-notifications-recovery
          git push origin --delete does-not-use-temp || true
