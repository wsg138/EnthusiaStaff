name: Finalize PR27 quality

on:
  push:
    branches:
      - section/punishment-request-notifications-recovery

permissions:
  contents: write

concurrency:
  group: pr27-final-quality
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply and validate final quality cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/clean-pr27-codacy-security.py
          git rm .github/workflows/pr27-final-quality.yml
          git rm scripts/clean-pr27-codacy-security.py
          git diff --check
          chmod +x gradlew
          ./gradlew clean build jacocoAggregateReport runtimeJars \
            --no-daemon \
            --no-build-cache \
            --no-configuration-cache \
            --console=plain
          git add -A
          git commit --no-verify -m 'Resolve PR27 security analysis findings precisely'
          git push origin HEAD:refs/heads/section/punishment-request-notifications-recovery
