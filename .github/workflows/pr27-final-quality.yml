name: Finalize PR27 quality and cleanup branches

on:
  push:
    branches:
      - section/punishment-request-notifications-recovery

permissions:
  contents: write

concurrency:
  group: pr27-final-quality
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply and validate final quality cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/clean-pr27-codacy-security.py
          git rm .github/workflows/pr27-final-quality.yml
          git rm scripts/clean-pr27-codacy-security.py
          git diff --check
          chmod +x gradlew
          ./gradlew clean build jacocoAggregateReport runtimeJars \
            --no-daemon \
            --no-build-cache \
            --no-configuration-cache \
            --console=plain
          git add -A
          git commit --no-verify -m 'Resolve PR27 security analysis findings precisely'
          git push origin HEAD:refs/heads/section/punishment-request-notifications-recovery

          stale_branches=(
            automation/pr27-codacy-attention
            automation/pr27-codacy-auth-check
            automation/pr27-codacy-auth-result
            automation/pr27-codacy-cleanup
            automation/pr27-codacy-current
            automation/pr27-codacy-current-result
            automation/pr27-codacy-export
            automation/pr27-codacy-export-result
            automation/pr27-codacy-summary
            automation/pr27-codacy-warning-groups
            automation/pr27-controller-race-fix
            automation/pr27-controller-race-validated
            automation/pr27-current-main-candidate
            automation/pr27-folia-fix
            automation/pr27-high-fixes
            automation/pr27-main-integration
            automation/pr27-main-integration-v2
            automation/pr27-main-integration-v3
            automation/pr27-reload-folia
            automation/pr27-reload-folia-validated
          )
          for branch in "${stale_branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
