name: Merge current main into validated PR27 candidate

on:
  push:
    branches:
      - automation/pr27-high-fixes

permissions:
  contents: write

concurrency:
  group: pr27-merge-current-main
  cancel-in-progress: true

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Merge current main and publish observable result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main:refs/remotes/origin/main
          SOURCE_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          TARGET='automation/pr27-current-main-candidate'
          git checkout -B "$TARGET" "$SOURCE_SHA"
          set +e
          git merge --no-commit --no-ff refs/remotes/origin/main
          STATUS=$?
          set -e
          if test "$STATUS" -ne 0; then
            mkdir -p .merge-analysis
            printf 'phase=conflict\nsource=%s\nmain=%s\n' "$SOURCE_SHA" "$MAIN_SHA" > .merge-analysis/state.txt
            git diff --name-only --diff-filter=U > .merge-analysis/conflicts.txt
            git status --short > .merge-analysis/status.txt
            while IFS= read -r path; do
              test -n "$path" || continue
              git checkout --conflict=merge -- "$path" || true
              git add -- "$path" || true
            done < .merge-analysis/conflicts.txt
            git add -A
            git commit --no-verify -m 'Record current-main conflict for PR27 candidate'
            git push --force origin HEAD:refs/heads/$TARGET
            exit 1
          fi
          git rm .github/workflows/pr27-merge-current-main.yml
          git rm --ignore-unmatch scripts/.main-merge-trigger
          git add -A
          git commit --no-verify -m 'Merge current main into PR27 candidate'
          git push --force origin HEAD:refs/heads/$TARGET
      - name: Build merged candidate
        shell: bash
        run: |
          set -euo pipefail
          set +e
          chmod +x gradlew
          ./gradlew clean build jacocoAggregateReport runtimeJars \
            --no-daemon \
            --no-build-cache \
            --no-configuration-cache \
            --console=plain 2>&1 | tee /tmp/build.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if test "$STATUS" -ne 0; then
            mkdir -p .merge-analysis
            printf 'phase=build-failed\nsource=%s\n' "$(git rev-parse HEAD)" > .merge-analysis/state.txt
            tail -n 1400 /tmp/build.log > .merge-analysis/build-failure.txt
            git add .merge-analysis
            git commit --no-verify -m 'Record current-main candidate build failure'
            git push --force origin HEAD:refs/heads/automation/pr27-current-main-candidate
          fi
          exit "$STATUS"
