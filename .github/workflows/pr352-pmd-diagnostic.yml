name: PR352 PMD Diagnostic

on:
  push:
    branches:
      - feature/unrestricted-staff-profile

permissions:
  contents: read

jobs:
  pmd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run repository PMD rules directly
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/pmd/pmd/releases/download/pmd_releases%2F6.55.0/pmd-bin-6.55.0.zip" \
            -o /tmp/pmd.zip
          unzip -q /tmp/pmd.zip -d /tmp
          set +e
          /tmp/pmd-bin-6.55.0/bin/run.sh pmd \
            -d domain/src/main/java,domain/src/test/java,persistence/src/main/java,persistence/src/test/java,paper/src/main/java,paper/src/test/java,velocity/src/main/java,velocity/src/test/java,integration-tests/src/test/java \
            -R ruleset.xml \
            -f text \
            -r /tmp/pmd.txt
          pmd_status=$?
          set -e
          cat /tmp/pmd.txt
          if [ "$pmd_status" -ne 0 ] && [ "$pmd_status" -ne 4 ]; then
            echo "PMD failed to complete successfully (exit $pmd_status)" >&2
            exit "$pmd_status"
          fi
