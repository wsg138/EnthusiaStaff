name: PR 186 Finalization Helper

on:
  push:
    branches:
      - owner/staging-web-moderation-console
    paths:
      - ".github/workflows/pr186-finalize-helper.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  finalize-helper:
    name: Inspect Codacy and retry PR admission
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inspect public Codacy findings
        shell: bash
        run: |
          set -Eeuo pipefail
          url='https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/repositories/EnthusiaStaff/pull-requests/186/issues?limit=100'
          curl --fail --silent --show-error "$url" -H 'Accept: application/json' -o /tmp/codacy.json
          echo 'ADDED FINDINGS'
          jq -r '
            [.data[] | select(.deltaType == "Added") | {
              pattern: .commitIssue.patternInfo.id,
              level: .commitIssue.patternInfo.level,
              file: .commitIssue.filePath,
              message: .commitIssue.message,
              line: .commitIssue.line
            }]
            | sort_by(.pattern, .file, .line)
            | .[]
            | [.pattern, .level, .file, (.line|tostring), (.message // "")]
            | @tsv
          ' /tmp/codacy.json
          echo 'TOTAL'
          jq '[.data[] | select(.deltaType == "Added")] | length' /tmp/codacy.json

      - name: Mark PR 186 ready for review
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          gh pr ready 186 --repo "$GITHUB_REPOSITORY"
