name: ES-D16 PMD Diagnostics

on:
  push:
    branches:
      - package/es-d16-moderation-read-bridge
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pmd:
    name: Report repository PMD findings
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Run PMD 6.55.0 on changed Java
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://github.com/pmd/pmd/releases/download/pmd_releases%2F6.55.0/pmd-bin-6.55.0.zip' \
            --output /tmp/pmd.zip
          unzip -q /tmp/pmd.zip -d /tmp
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.java')
          if [[ ${#files[@]} -eq 0 ]]; then
            echo 'No changed Java files.'
            exit 0
          fi
          input="$(IFS=,; echo "${files[*]}")"
          set +e
          /tmp/pmd-bin-6.55.0/bin/run.sh pmd \
            -d "${input}" \
            -R ruleset.xml \
            -f text \
            -r /tmp/pmd-findings.txt
          status=$?
          set -e
          cat /tmp/pmd-findings.txt
          echo "pmd_exit_status=${status}"
          exit 0
