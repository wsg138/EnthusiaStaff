name: ES-D13 Codacy Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

jobs:
  report:
    if: github.event.pull_request.number == 178
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report high ErrorProne findings for this branch
        if: env.CODACY_PROJECT_TOKEN != ''
        shell: bash
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          endpoint = (
              "https://app.codacy.com/api/v3/analysis/organizations/gh/wsg138/"
              "repositories/EnthusiaStaff/issues/search?limit=100"
          )
          body = json.dumps({
              "branchName": os.environ["BRANCH_NAME"],
              "levels": ["High"],
              "categories": ["ErrorProne"],
          }).encode("utf-8")
          request = urllib.request.Request(
              endpoint,
              data=body,
              headers={
                  "Content-Type": "application/json",
                  "project-token": os.environ["CODACY_PROJECT_TOKEN"],
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)

          issues = payload.get("data", [])
          print(f"matching_issues={len(issues)}")
          for issue in issues:
              pattern = issue.get("patternInfo") or {}
              safe = {
                  "resultDataId": issue.get("resultDataId"),
                  "patternId": pattern.get("id"),
                  "patternTitle": pattern.get("title"),
                  "severity": pattern.get("severityLevel"),
                  "category": pattern.get("category"),
                  "message": issue.get("message"),
                  "filePath": issue.get("filePath"),
                  "lineNumber": issue.get("lineNumber"),
                  "lineText": issue.get("lineText"),
                  "falsePositiveProbability": issue.get("falsePositiveProbability"),
                  "falsePositiveThreshold": issue.get("falsePositiveThreshold"),
                  "falsePositiveReason": issue.get("falsePositiveReason"),
              }
              print(json.dumps(safe, sort_keys=True))
          PY

      - name: Fail if Codacy token is unavailable
        if: env.CODACY_PROJECT_TOKEN == ''
        run: exit 1
