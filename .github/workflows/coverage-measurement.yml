name: Coverage Measurement

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.java"
      - "**/*.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/coverage-measurement.yml"

permissions:
  contents: read

concurrency:
  group: coverage-measurement-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: Measure aggregate coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate aggregate JaCoCo report
        run: |
          chmod +x gradlew
          ./gradlew clean jacocoAggregateReport \
            --no-daemon \
            --no-build-cache \
            --no-configuration-cache \
            --console=plain

      - name: Summarize coverage
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path("build/reports/jacoco/aggregate/jacoco.xml")
          if not report.is_file():
              raise SystemExit(f"Missing JaCoCo XML report: {report}")

          root = ET.parse(report).getroot()
          counters = {
              counter.attrib["type"]: {
                  "missed": int(counter.attrib["missed"]),
                  "covered": int(counter.attrib["covered"]),
              }
              for counter in root.findall("counter")
          }

          def percentage(counter_type: str) -> float:
              counter = counters[counter_type]
              total = counter["missed"] + counter["covered"]
              if total == 0:
                  raise SystemExit(f"JaCoCo reported zero {counter_type.lower()} items")
              return counter["covered"] * 100.0 / total

          summary = {
              "line": percentage("LINE"),
              "branch": percentage("BRANCH"),
              "instruction": percentage("INSTRUCTION"),
          }

          output = report.parent / "summary.json"
          output.write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")

          lines = [
              "## Aggregate JaCoCo coverage",
              "",
              "This workflow measures coverage only. It does not upload data to Codacy.",
              "",
              "| Counter | Coverage |",
              "| --- | ---: |",
              f"| Lines | {summary['line']:.2f}% |",
              f"| Branches | {summary['branch']:.2f}% |",
              f"| Instructions | {summary['instruction']:.2f}% |",
          ]
          text = "\n".join(lines) + "\n"
          print(text)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary_file:
              summary_file.write(text)
          PY

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: aggregate-jacoco-report
          path: build/reports/jacoco/aggregate
          if-no-files-found: error
          retention-days: 14
