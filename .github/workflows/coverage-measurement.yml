name: Coverage

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

jobs:
  coverage:
    name: Test and report aggregate coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate aggregate JaCoCo report
        run: |
          chmod +x gradlew
          ./gradlew clean jacocoAggregateReport \
            --no-daemon \
            --no-build-cache \
            --no-configuration-cache \
            --console=plain

      - name: Summarize coverage
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path("build/reports/jacoco/aggregate/jacoco.xml")
          if not report.is_file():
              raise SystemExit(f"Missing JaCoCo XML report: {report}")

          root = ET.parse(report).getroot()
          counters = {
              counter.attrib["type"]: {
                  "missed": int(counter.attrib["missed"]),
                  "covered": int(counter.attrib["covered"]),
              }
              for counter in root.findall("counter")
          }

          def percentage(counter_type: str) -> float:
              counter = counters[counter_type]
              total = counter["missed"] + counter["covered"]
              if total == 0:
                  raise SystemExit(f"JaCoCo reported zero {counter_type.lower()} items")
              return counter["covered"] * 100.0 / total

          summary = {
              "line": percentage("LINE"),
              "branch": percentage("BRANCH"),
              "instruction": percentage("INSTRUCTION"),
          }

          output = report.parent / "summary.json"
          output.write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")

          lines = [
              "## Aggregate JaCoCo coverage",
              "",
              "| Counter | Coverage |",
              "| --- | ---: |",
              f"| Lines | {summary['line']:.2f}% |",
              f"| Branches | {summary['branch']:.2f}% |",
              f"| Instructions | {summary['instruction']:.2f}% |",
          ]
          text = "\n".join(lines) + "\n"
          print(text)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary_file:
              summary_file.write(text)
          PY

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v7
        with:
          name: aggregate-jacoco-report
          path: build/reports/jacoco/aggregate
          if-no-files-found: error
          retention-days: 14

      - name: Diagnose current Codacy PR issues
        if: github.event_name == 'pull_request'
        env:
          CODACY_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          number = os.environ["CODACY_PR_NUMBER"]
          url = (
              "https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/"
              f"repositories/EnthusiaStaff/pull-requests/{number}/issues"
          )
          with urllib.request.urlopen(url, timeout=30) as response:
              payload = json.load(response)

          for issue in payload.get("data", []):
              details = issue.get("commitIssue", {})
              pattern = details.get("patternInfo", {})
              print(json.dumps({
                  "id": pattern.get("id"),
                  "title": pattern.get("title"),
                  "category": pattern.get("category"),
                  "severity": pattern.get("severityLevel") or pattern.get("level"),
                  "file": details.get("filePath"),
                  "line": details.get("lineNumber"),
                  "message": details.get("message"),
              }, sort_keys=True))
          PY

      - name: Upload coverage to Codacy
        if: env.CODACY_PROJECT_TOKEN != ''
        uses: codacy/codacy-coverage-reporter-action@v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: build/reports/jacoco/aggregate/jacoco.xml
          language: Java

      - name: Note missing Codacy secret
        if: env.CODACY_PROJECT_TOKEN == ''
        run: |
          echo "::notice::Coverage was measured but not uploaded because CODACY_PROJECT_TOKEN is not configured."
