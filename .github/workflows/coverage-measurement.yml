name: Coverage

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "ai-agents/**"
      - "reports/**"
      - "**/*.md"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "ai-agents/**"
      - "reports/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

jobs:
  coverage:
    name: Build, test, and report aggregate coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Record checked-out SHA
        shell: bash
        run: |
          TESTED_SHA="$(git rev-parse HEAD)"
          test -n "${TESTED_SHA}"
          echo "TESTED_SHA=${TESTED_SHA}" >> "${GITHUB_ENV}"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Build runtime jars and generate aggregate JaCoCo report
        run: |
          chmod +x gradlew
          ./gradlew clean build jacocoAggregateReport runtimeJars \
            --no-daemon \
            --no-build-cache \
            --no-configuration-cache \
            --console=plain

      - name: Inspect runtime jars
        run: |
          test "${TESTED_SHA}" = "$(git rev-parse HEAD)"
          mkdir -p build/reports/runtime-jars
          printf '%s\n' "${TESTED_SHA}" > build/reports/runtime-jars/tested-sha.txt
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import zipfile

          modules = {
              "Paper": (Path("paper/build/libs"), "EnthusiaStaff-Paper-"),
              "Velocity": (Path("velocity/build/libs"), "EnthusiaStaff-Velocity-"),
          }
          contract_root = Path("integration-contracts/src/main/java")
          contract_stems = {
              source.relative_to(contract_root).with_suffix("").as_posix()
              for source in contract_root.rglob("*.java")
          }
          if not contract_stems:
              raise SystemExit(
                  "No provider API Java types found under integration-contracts/src/main/java"
              )

          report_lines = ["Runtime jar inspection", "======================", ""]
          summary_lines = [
              "## Runtime jar inspection",
              "",
              f"Provider API source types checked: **{len(contract_stems)}**",
              "",
              "| Runtime | Size | SHA-256 | Entries | Provider API leaks |",
              "| --- | ---: | --- | ---: | ---: |",
          ]

          for runtime, (directory, prefix) in modules.items():
              jars = sorted(
                  path for path in directory.glob(f"{prefix}*.jar")
                  if not path.name.endswith("-sources.jar")
              )
              if len(jars) != 1:
                  raise SystemExit(
                      f"Expected exactly one {runtime} runtime jar, found: "
                      + ", ".join(path.name for path in jars)
                  )
              jar = jars[0]
              digest = hashlib.sha256(jar.read_bytes()).hexdigest()
              with zipfile.ZipFile(jar) as archive:
                  entries = set(archive.namelist())
                  bad_entry = archive.testzip()
              if bad_entry is not None:
                  raise SystemExit(f"Corrupt entry in {jar}: {bad_entry}")

              leaked = sorted(
                  entry
                  for entry in entries
                  for stem in contract_stems
                  if entry == f"{stem}.class" or entry.startswith(f"{stem}$")
              )
              if leaked:
                  raise SystemExit(
                      f"Provider API classes leaked into {runtime} runtime jar: "
                      + ", ".join(leaked)
                  )

              size = jar.stat().st_size
              report_lines.extend([
                  f"{runtime}: {jar}",
                  f"  size: {size} bytes",
                  f"  sha256: {digest}",
                  f"  entries: {len(entries)}",
                  f"  provider API source types checked: {len(contract_stems)}",
                  "  provider API leaks: 0",
                  "",
              ])
              summary_lines.append(
                  f"| {runtime} | {size:,} bytes | `{digest}` | {len(entries):,} | 0 |"
              )

          report = Path("build/reports/runtime-jars/inspection.txt")
          report.parent.mkdir(parents=True, exist_ok=True)
          report.write_text("\n".join(report_lines), encoding="utf-8")
          summary = "\n".join(summary_lines) + "\n"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary_file:
              summary_file.write(summary)
          PY

      - name: Summarize coverage
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path("build/reports/jacoco/aggregate/jacoco.xml")
          if not report.is_file():
              raise SystemExit(f"Missing JaCoCo XML report: {report}")

          root = ET.parse(report).getroot()
          counters = {
              counter.attrib["type"]: {
                  "missed": int(counter.attrib["missed"]),
                  "covered": int(counter.attrib["covered"]),
              }
              for counter in root.findall("counter")
          }

          def percentage(counter_type: str) -> float:
              counter = counters[counter_type]
              total = counter["missed"] + counter["covered"]
              if total == 0:
                  raise SystemExit(f"JaCoCo reported zero {counter_type.lower()} items")
              return counter["covered"] * 100.0 / total

          summary = {
              "line": percentage("LINE"),
              "branch": percentage("BRANCH"),
              "instruction": percentage("INSTRUCTION"),
          }

          output = report.parent / "summary.json"
          output.write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")

          lines = [
              "## Aggregate JaCoCo coverage",
              "",
              "| Counter | Coverage |",
              "| --- | ---: |",
              f"| Lines | {summary['line']:.2f}% |",
              f"| Branches | {summary['branch']:.2f}% |",
              f"| Instructions | {summary['instruction']:.2f}% |",
          ]
          text = "\n".join(lines) + "\n"
          print(text)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary_file:
              summary_file.write(text)
          PY

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v7
        with:
          name: java-21-validation
          path: |
            build/reports/jacoco/aggregate
            build/reports/runtime-jars
            paper/build/libs/EnthusiaStaff-Paper-*.jar
            !paper/build/libs/*-sources.jar
            velocity/build/libs/EnthusiaStaff-Velocity-*.jar
            !velocity/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage to Codacy
        if: env.CODACY_PROJECT_TOKEN != ''
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: build/reports/jacoco/aggregate/jacoco.xml
          language: Java

      - name: Note missing Codacy secret
        if: env.CODACY_PROJECT_TOKEN == ''
        run: |
          echo "::notice::Coverage was measured but not uploaded because CODACY_PROJECT_TOKEN is not configured."

      - name: Summarize failed Java tests
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          output = Path("build/reports/ci-failure/failure-summary.md")
          output.parent.mkdir(parents=True, exist_ok=True)
          xml_reports = sorted(Path(".").glob("**/build/test-results/test/*.xml"))
          failures = []
          parse_errors = []

          for report in xml_reports:
              try:
                  root = ET.parse(report).getroot()
              except (ET.ParseError, OSError) as exc:
                  parse_errors.append((report, str(exc)))
                  continue

              for case in root.iter("testcase"):
                  problem = case.find("failure")
                  if problem is None:
                      problem = case.find("error")
                  if problem is None:
                      continue

                  message = (problem.attrib.get("message") or "Test failed").strip()
                  details = (problem.text or "").strip()
                  failures.append({
                      "report": report.as_posix(),
                      "class": case.attrib.get("classname", "unknown"),
                      "name": case.attrib.get("name", "unknown"),
                      "message": message,
                      "details": details,
                  })

          lines = [
              "# Java validation failure",
              "",
              f"- Tested commit: `{os.environ.get('TESTED_SHA', 'unknown')}`",
              f"- JUnit XML reports found: **{len(xml_reports)}**",
              f"- Failed/error test cases found: **{len(failures)}**",
              "",
          ]

          if failures:
              lines.extend(["## Failed tests", ""])
              for index, failure in enumerate(failures, start=1):
                  lines.extend([
                      f"### {index}. `{failure['class']}.{failure['name']}`",
                      "",
                      f"- Report: `{failure['report']}`",
                      f"- Reason: {failure['message']}",
                  ])
                  if failure["details"]:
                      detail_lines = failure["details"].splitlines()[:80]
                      lines.extend(["", "```text", *detail_lines, "```"])
                  lines.append("")
          else:
              lines.extend([
                  "No failed JUnit test case was found in the generated XML. The failure may be compilation, packaging, runtime-JAR inspection, or workflow infrastructure; inspect the attached reports and Actions log.",
                  "",
              ])

          if parse_errors:
              lines.extend(["## Report parsing warnings", ""])
              for report, error in parse_errors:
                  lines.append(f"- `{report}`: {error}")
              lines.append("")

          text = "\n".join(lines) + "\n"
          output.write_text(text, encoding="utf-8")
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(text)
          PY

      - name: Upload failed Java test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: java-validation-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/ci-failure
            **/build/test-results/test
            **/build/reports/tests/test
            **/build/reports/problems
          if-no-files-found: error
          retention-days: 30
