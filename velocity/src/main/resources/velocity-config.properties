# Secrets are read from environment variables and never stored here.
storage.jdbc-url-environment=ES_DATABASE_URL
storage.username-environment=ES_DATABASE_USER
storage.password-environment=ES_DATABASE_PASSWORD
storage.maximum-pool-size=8
storage.connection-timeout-millis=5000
enforcement.fail-closed-while-active=true
appeals.url=https://enthusia.net/appeals
server.id=VELOCITY
# This restricted bridge must stay loopback-bound behind an authenticated tunnel or same-host relay.
website-api.enabled=false
website-api.bind-address=127.0.0.1
website-api.port=28766
website-api.bearer-token-environment=ES_WEBSITE_API_BEARER_TOKEN
website-api.hmac-secret-environment=ES_WEBSITE_API_HMAC_SECRET
website-api.code-key-version=1
website-api.code-secret-environment=ES_PUNISHMENT_CODE_KEY_V1
website-api.timestamp-skew-seconds=300
website-api.maximum-body-bytes=65536
website-api.worker-threads=4
website-api.queue-capacity=128
channel.enabled=false
channel.bind-address=127.0.0.1
channel.port=28765
channel.proxy-id=VELOCITY
channel.proxy-secret-environment=ES_CHANNEL_VELOCITY_SECRET
# Add one entry per required backend before enabling the channel.
channel.backend.HUB.secret-environment=ES_CHANNEL_HUB_SECRET
channel.backend.SMP.secret-environment=ES_CHANNEL_SMP_SECRET
# Raw network addresses never leave process memory. Equality and recoverability use separate versioned keys.
network-identity.enabled=false
network-identity.hmac-key-version=1
network-identity.hmac-secret-environment=ES_IDENTITY_HMAC_KEY_V1
network-identity.encryption-key-version=1
network-identity.encryption-secret-environment=ES_IDENTITY_ENCRYPTION_KEY_V1
# Four independent staff-only webhook secrets. Delivery is durable and disabled until explicitly enabled.
discord.enabled=false
discord.punishments.webhook-environment=ES_DISCORD_PUNISHMENTS_WEBHOOK
discord.reports.webhook-environment=ES_DISCORD_REPORTS_WEBHOOK
discord.logs-staffmode.webhook-environment=ES_DISCORD_STAFFMODE_WEBHOOK
discord.alerts.webhook-environment=ES_DISCORD_ALERTS_WEBHOOK
discord.maximum-attempts=12
discord.failure-threshold=5
discord.circuit-open-seconds=300
discord.request-timeout-millis=5000
litebans.jdbc-url-environment=ES_LITEBANS_DATABASE_URL
litebans.username-environment=ES_LITEBANS_DATABASE_USER
litebans.password-environment=ES_LITEBANS_DATABASE_PASSWORD
litebans.maximum-pool-size=2
litebans.connection-timeout-millis=5000
litebans.table-prefix=litebans_
litebans.batch-size=1000
